<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body style="margin:0;background:#000">
<video id="v" controls autoplay muted playsinline style="width:100%;height:100vh"></video>
<script>
// Sửa LIVE khi đã có link vCDN, LOOP giữ nguyên
const LIVE = "https://LINK-LIVE-CUA-VCDN/index.m3u8";
const LOOP = "https://raw.githubusercontent.com/ankbuitv/mytv/refs/heads/main/output.m3u8";

const video = document.getElementById("v");
let hls = null;
let mode = null;

function play(url, kind) {
  if (hls) hls.destroy();
  mode = kind;
  hls = new Hls({ lowLatencyMode: true });
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  hls.on(Hls.Events.ERROR, (e, data) => {
    if (!data.fatal) return;
    if (kind === "live") play(LOOP, "loop");
    else setTimeout(() => play(LOOP, "loop"), 5000);
  });
}

// Loop VOD hết thì phát lại từ đầu
video.addEventListener("ended", () => {
  if (mode === "loop") {
    video.currentTime = 0;
    video.play();
  }
});

// Khi đang phát loop, cứ 15 giây kiểm tra live có lên chưa
async function checkLive() {
  if (mode !== "loop") return;
  try {
    const res = await fetch(LIVE, { cache: "no-store" });
    if (res.ok) play(LIVE, "live");
  } catch (err) {
    // chưa có live hoặc bị chặn CORS, tiếp tục phát loop
  }
}

if (Hls.isSupported()) {
  play(LOOP, "loop");
  setInterval(checkLive, 15000);
} else {
  video.src = LOOP; // Safari trên iPhone đọc HLS được
}
</script>
</body>
</html>
