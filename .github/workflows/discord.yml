name: ThgAdu v5.2 - Lavalink YouTube Music

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: thgadu-bot
  cancel-in-progress: false

jobs:
  thgadu:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    env:
      TOKEN: ${{ secrets.TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_API_URL: ${{ secrets.OLLAMA_API_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AUTO_CHANNEL_ID: ${{ secrets.AUTO_CHANNEL_ID }}
      SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      LAVALINK_PASSWORD: thgadu-local-lavalink

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Lavalink
        shell: bash
        run: |
          set -e

          mkdir -p lavalink

          curl -fL --retry 3 \
            https://github.com/lavalink-devs/Lavalink/releases/latest/download/Lavalink.jar \
            -o lavalink/Lavalink.jar

          echo "✅ Lavalink downloaded"

          java -version
          node --version

      - name: Configure Lavalink
        shell: bash
        run: |
          cat > lavalink/application.yml <<'EOF'
          server:
            address: 127.0.0.1
            port: 2333

          lavalink:
            server:
              password: "thgadu-local-lavalink"

              sources:
                youtube: false
                soundcloud: true
                bandcamp: true
                twitch: false
                vimeo: false
                nico: false
                http: true
                local: false

              filters:
                volume: true
                equalizer: true

              bufferDurationMs: 400
              frameBufferDurationMs: 5000
              opusEncodingQuality: 10
              resamplingQuality: LOW
              trackStuckThresholdMs: 10000
              useSeekGhosting: true
              playerUpdateInterval: 5

            plugins:
              - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
                snapshot: false

          plugins:
            youtube:
              enabled: true

              allowSearch: true
              allowDirectVideoIds: true
              allowDirectPlaylistIds: true

              clients:
                - MUSIC
                - ANDROID_VR
                - WEB

          logging:
            level:
              root: INFO
              lavalink: INFO
              dev.lavalink.youtube: DEBUG
              com.sedmelluq.discord.lavaplayer: INFO

          metrics:
            prometheus:
              enabled: false
          EOF

          echo "✅ YouTube plugin configured: 1.18.2"

      - name: Start Lavalink
        shell: bash
        run: |
          set -e

          cd lavalink

          nohup java -jar Lavalink.jar \
            > ../lavalink.log 2>&1 &

          echo $! > ../lavalink.pid

          cd ..

          READY=0

          for i in $(seq 1 120); do
            STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              -H "Authorization: thgadu-local-lavalink" \
              http://127.0.0.1:2333/v4/info || true)

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            if ! kill -0 "$(cat lavalink.pid)" 2>/dev/null; then
              echo "❌ Lavalink exited"
              break
            fi

            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "❌ Lavalink startup failed"
            tail -n 150 lavalink.log
            exit 1
          fi

          echo "✅ Lavalink ready"

          curl -fsS \
            -H "Authorization: thgadu-local-lavalink" \
            http://127.0.0.1:2333/v4/info \
            | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print("Lavalink version:",d.get("version",{}))
          print("Plugins:",d.get("plugins",[]))
          print("Sources:",d.get("sourceManagers",[]))
          '

      - name: Test YouTube Music
        shell: bash
        run: |
          echo "===== YOUTUBE MUSIC SEARCH ====="

          curl -sS -G \
            -H "Authorization: thgadu-local-lavalink" \
            --data-urlencode "identifier=ytmsearch:Imagine Dragons Radioactive" \
            http://127.0.0.1:2333/v4/loadtracks \
            -o ytm-test.json

          python3 - <<'PY'
          import json

          try:
              with open("ytm-test.json") as f:
                  d=json.load(f)

              print("Load type:",d.get("loadType"))

              tracks=d.get("data",[])

              if isinstance(tracks,list):
                  print("Results:",len(tracks))
                  for t in tracks[:3]:
                      info=t.get("info",{})
                      print("-",info.get("title"),"|",info.get("sourceName"))

              elif d.get("loadType")=="error":
                  print("Error:",json.dumps(tracks,ensure_ascii=False)[:2000])

          except Exception as e:
              print("Test failed:",repr(e))
          PY

          echo "===== YOUTUBE SEARCH ====="

          curl -sS -G \
            -H "Authorization: thgadu-local-lavalink" \
            --data-urlencode "identifier=ytsearch:Imagine Dragons Radioactive" \
            http://127.0.0.1:2333/v4/loadtracks \
            -o yt-test.json

          python3 - <<'PY'
          import json

          with open("yt-test.json") as f:
              d=json.load(f)

          print("Load type:",d.get("loadType"))

          tracks=d.get("data",[])

          if isinstance(tracks,list):
              print("Results:",len(tracks))
          else:
              print(str(tracks)[:1000])
          PY

          echo "⚠️ Search success does not guarantee playback."

      - name: Generate package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "thgadu",
            "version": "5.2.0",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "node index.js"
            },
            "dependencies": {
              "axios": "^1.8.4",
              "discord.js": "^14.19.3",
              "shoukaku": "^4.1.1"
            }
          }
          EOF

          npm install --no-audit --no-fund

      - name: Generate ThgAdu
        shell: bash
        run: |
          cat > index.js <<'EOF'
          'use strict';

          const axios = require('axios');
          const util = require('node:util');

          const {
            Client,
            GatewayIntentBits,
            Events,
            ActivityType
          } = require('discord.js');

          const {
            Shoukaku,
            Connectors
          } = require('shoukaku');

          // =====================================================
          // CONFIG
          // =====================================================

          const PREFIX = 'd.';

          const RANDOM_CHANCE = 0.20;
          const AUTO_INTERVAL = 2 * 60 * 60 * 1000;

          const MAX_QUEUE = 100;

          const CONFIG = {
            token: process.env.TOKEN,

            aiKey: process.env.OLLAMA_API_KEY,

            aiURL:
              process.env.OLLAMA_API_URL ||
              'https://ollama.com/api/chat',

            aiModel:
              process.env.AI_MODEL ||
              'gemma4:31b',

            systemPrompt:
              process.env.SYSTEM_PROMPT ||
              'Bạn là ThgAdu, một bot Discord vui tính, thân thiện. Trả lời tự nhiên bằng tiếng Việt.',

            firecrawlKey:
              process.env.FIRECRAWL_API_KEY,

            supabaseURL:
              process.env.SUPABASE_URL,

            supabaseKey:
              process.env.SUPABASE_SERVICE_ROLE_KEY,

            autoChannel:
              process.env.AUTO_CHANNEL_ID
          };

          // =====================================================
          // LOGGING
          // =====================================================

          function inspect(value) {
            return util.inspect(value, {
              depth: 8,
              colors: false,
              maxStringLength: 10000
            });
          }

          function logError(label, error) {
            console.error(
              '\n❌ ' + label + '\n' +
              inspect(error)
            );
          }

          process.on('unhandledRejection', error => {
            logError('UNHANDLED REJECTION', error);
          });

          process.on('uncaughtException', error => {
            logError('UNCAUGHT EXCEPTION', error);
          });

          // =====================================================
          // DISCORD
          // =====================================================

          const client = new Client({
            intents: [
              GatewayIntentBits.Guilds,
              GatewayIntentBits.GuildMessages,
              GatewayIntentBits.MessageContent,
              GatewayIntentBits.GuildVoiceStates
            ]
          });

          // =====================================================
          // LAVALINK
          // =====================================================

          const shoukaku = new Shoukaku(
            new Connectors.DiscordJS(client),
            [
              {
                name: 'local',
                url: '127.0.0.1:2333',
                auth: 'thgadu-local-lavalink',
                secure: false
              }
            ],
            {
              moveOnDisconnect: false,
              resume: false,
              reconnectTries: 5,
              reconnectInterval: 5000,
              restTimeout: 30000
            }
          );

          shoukaku.on('ready', name => {
            console.log(
              '✅ Lavalink connected:',
              name
            );
          });

          shoukaku.on('error', (name, error) => {
            logError(
              'LAVALINK NODE ' + name,
              error
            );
          });

          shoukaku.on('close', (name, code, reason) => {
            console.error(
              'Lavalink closed:',
              inspect({name,code,reason})
            );
          });

          shoukaku.on('disconnect', name => {
            console.error(
              'Lavalink disconnected:',
              name
            );
          });

          // =====================================================
          // MUSIC STATE
          // =====================================================

          const musicStates = new Map();

          function getState(guildId) {
            if (!musicStates.has(guildId)) {
              musicStates.set(guildId, {
                player: null,
                queue: [],
                current: null,
                starting: false,
                stopped: false,
                volume: 100,
                textChannel: null,
                failedTracks: 0,
                playTimer: null
              });
            }

            return musicStates.get(guildId);
          }

          function title(track) {
            return (
              track?.info?.title ||
              track?.title ||
              'Unknown'
            );
          }

          function uri(track) {
            return (
              track?.info?.uri ||
              track?.uri ||
              ''
            );
          }

          function normalizeTrack(track) {
            return {
              encoded:
                track?.encoded ||
                track?.track ||
                '',
              info: track?.info || {},
              pluginInfo: track?.pluginInfo || {}
            };
          }

          function getNode() {
            const node = shoukaku.getIdealNode();

            if (!node) {
              throw new Error(
                'Lavalink chưa sẵn sàng.'
              );
            }

            return node;
          }

          async function sendSafe(channel, content) {
            if (!channel) return;

            try {
              await channel.send(
                String(content).slice(0, 1900)
              );
            } catch (error) {
              logError('SEND MESSAGE', error);
            }
          }

          // =====================================================
          // YOUTUBE + YOUTUBE MUSIC RESOLVER
          // =====================================================

          function cleanYouTubeURL(input) {
            try {
              const url = new URL(input);

              const host = url.hostname.toLowerCase();

              if (
                host === 'youtu.be' ||
                host === 'www.youtu.be'
              ) {
                const id = url.pathname
                  .split('/')
                  .filter(Boolean)[0];

                if (id) {
                  return (
                    'https://www.youtube.com/watch?v=' +
                    encodeURIComponent(id)
                  );
                }
              }

              const youtubeHosts = [
                'youtube.com',
                'www.youtube.com',
                'm.youtube.com',
                'music.youtube.com'
              ];

              if (youtubeHosts.includes(host)) {
                if (url.pathname === '/watch') {
                  const id =
                    url.searchParams.get('v');

                  if (id) {
                    return (
                      'https://www.youtube.com/watch?v=' +
                      encodeURIComponent(id)
                    );
                  }
                }

                if (url.pathname.startsWith('/shorts/')) {
                  const id = url.pathname
                    .split('/')[2];

                  if (id) {
                    return (
                      'https://www.youtube.com/watch?v=' +
                      encodeURIComponent(id)
                    );
                  }
                }
              }

              return input;
            } catch {
              return input;
            }
          }

          function parseResult(result) {
            if (!result) return [];

            const type = String(
              result.loadType || ''
            ).toLowerCase();

            if (
              type === 'error' ||
              type === 'load_failed'
            ) {
              logError(
                'LAVALINK LOAD ERROR',
                result.data || result
              );

              return [];
            }

            let tracks = [];

            if (
              type === 'search' ||
              type === 'search_result'
            ) {
              tracks = Array.isArray(result.data)
                ? result.data.slice(0, 1)
                : (result.tracks || []).slice(0, 1);
            } else if (
              type === 'track' ||
              type === 'track_loaded'
            ) {
              tracks = [
                result.data || result.track
              ];
            } else if (
              type === 'playlist' ||
              type === 'playlist_loaded'
            ) {
              tracks =
                result.data?.tracks ||
                result.tracks ||
                [];
            } else if (Array.isArray(result.data)) {
              tracks = result.data.slice(0, 1);
            }

            return tracks
              .filter(Boolean)
              .map(normalizeTrack)
              .filter(t => t.encoded);
          }

          async function resolveIdentifier(identifier) {
            const node = getNode();

            console.log(
              '🔎 Resolving:',
              identifier
            );

            const result = await node.rest.resolve(
              identifier
            );

            console.log(
              'Load type:',
              result?.loadType
            );

            return parseResult(result);
          }

          async function resolveTracks(
            query,
            mode = 'auto'
          ) {
            query = String(query || '').trim();

            if (!query) return [];

            const isURL = /^https?:\/\//i.test(query);

            if (isURL) {
              return resolveIdentifier(
                cleanYouTubeURL(query)
              );
            }

            const sources =
              mode === 'youtube'
                ? ['ytsearch:']
                : mode === 'music'
                  ? ['ytmsearch:']
                  : ['ytmsearch:', 'ytsearch:'];

            for (const prefix of sources) {
              try {
                const tracks =
                  await resolveIdentifier(
                    prefix + query
                  );

                if (tracks.length) {
                  console.log(
                    '✅ Search source:',
                    prefix
                  );

                  console.log(
                    '✅ Found:',
                    title(tracks[0])
                  );

                  return tracks;
                }
              } catch (error) {
                logError(
                  'SEARCH FAILED ' + prefix,
                  error
                );
              }
            }

            return [];
          }

          // =====================================================
          // VOICE
          // =====================================================

          async function connectVoice(message) {
            const channel =
              message.member?.voice?.channel;

            if (!channel) {
              throw new Error(
                'Bro vào voice channel trước.'
              );
            }

            const state = getState(
              message.guild.id
            );

            if (state.player) {
              if (
                state.player.voiceChannelId !==
                channel.id
              ) {
                throw new Error(
                  'Bot đang ở voice khác. Dùng d.leave trước.'
                );
              }

              return state.player;
            }

            console.log(
              '🔊 Connecting voice:',
              channel.id
            );

            const player =
              await shoukaku.joinVoiceChannel({
                guildId: message.guild.id,
                channelId: channel.id,
                shardId:
                  message.guild.shardId || 0,
                deaf: true,
                mute: false
              });

            state.player = player;
            state.stopped = false;
            state.textChannel = message.channel;

            setupPlayerEvents(
              message.guild.id,
              player
            );

            console.log(
              '✅ Discord voice connected'
            );

            return player;
          }

          // =====================================================
          // PLAYER EVENTS
          // =====================================================

          function clearPlayTimer(state) {
            if (state.playTimer) {
              clearTimeout(state.playTimer);
              state.playTimer = null;
            }
          }

          function setupPlayerEvents(guildId, player) {
            const state = getState(guildId);

            player.on('start', data => {
              console.log(
                '▶️ TrackStartEvent:',
                data?.track?.info?.title
              );

              state.starting = false;

              // TrackStartEvent chỉ xác nhận Lavalink
              // bắt đầu xử lý track, chưa chứng minh
              // audio đã được gửi thành công.
            });

            player.on('end', async data => {
              const reason = String(
                data?.reason || ''
              ).toLowerCase();

              console.log(
                '⏹️ TrackEndEvent:',
                reason
              );

              clearPlayTimer(state);

              state.current = null;
              state.starting = false;

              if (reason === 'replaced') {
                return;
              }

              if (state.stopped) {
                return;
              }

              if (reason === 'loadfailed') {
                state.failedTracks++;

                if (state.failedTracks >= 3) {
                  state.stopped = true;
                  state.queue = [];

                  await sendSafe(
                    state.textChannel,
                    '❌ 3 bài liên tiếp không phát được. ' +
                    'Đã dừng hàng chờ để tránh spam lỗi.'
                  );

                  return;
                }
              } else {
                state.failedTracks = 0;
              }

              await playNext(guildId);
            });

            player.on('exception', async data => {
              const exception =
                data?.exception || data;

              logError(
                'TRACK EXCEPTION',
                exception
              );

              const cause =
                exception?.cause ||
                exception?.message ||
                'Unknown';

              await sendSafe(
                state.textChannel,
                '❌ Không phát được bài: **' +
                title(state.current) +
                '**\nNguyên nhân: `' +
                String(cause).slice(0, 700) +
                '`'
              );

              // Không gọi playNext ở đây:
              // Lavalink thường gửi TrackEndEvent
              // sau TrackExceptionEvent.
            });

            player.on('stuck', async data => {
              logError(
                'TRACK STUCK',
                data
              );

              try {
                await player.stopTrack();
              } catch (error) {
                logError(
                  'STOP STUCK TRACK',
                  error
                );
              }
            });

            player.on('closed', data => {
              logError(
                'VOICE CONNECTION CLOSED',
                data
              );

              clearPlayTimer(state);

              state.player = null;
              state.current = null;
              state.starting = false;
              state.stopped = true;
            });
          }

          // =====================================================
          // PLAYBACK
          // =====================================================

          async function playNext(guildId) {
            const state = getState(guildId);

            if (
              !state.player ||
              state.starting ||
              state.current ||
              state.stopped
            ) {
              return;
            }

            const track = state.queue.shift();

            if (!track) {
              console.log(
                '🎵 Queue finished:',
                guildId
              );

              return;
            }

            state.current = track;
            state.starting = true;

            console.log(
              '🎵 PLAY:',
              title(track)
            );

            console.log(
              'Source:',
              track.info?.sourceName
            );

            console.log(
              'URL:',
              uri(track)
            );

            try {
              await state.player.playTrack({
                track: {
                  encoded: track.encoded
                }
              });

              console.log(
                '✅ Lavalink accepted play command'
              );

              // Chỉ báo rằng lệnh đã được chấp nhận.
              // TrackStartEvent không đảm bảo có âm thanh.
              //
              // Nếu không xuất hiện sự kiện kết thúc,
              // kiểm tra trạng thái player sau 15 giây.

              clearPlayTimer(state);

              state.playTimer = setTimeout(
                async () => {
                  if (
                    state.current !== track ||
                    state.stopped
                  ) {
                    return;
                  }

                  try {
                    const position =
                      state.player?.position ?? 0;

                    console.log(
                      '🎧 Playback check:',
                      inspect({
                        title: title(track),
                        position,
                        connected:
                          state.player?.connection?.state
                      })
                    );

                    if (position > 0) {
                      await sendSafe(
                        state.textChannel,
                        '🎶 Đang phát: **' +
                        title(track) +
                        '**'
                      );
                    } else {
                      console.warn(
                        '⚠️ Playback position is 0'
                      );
                    }
                  } catch (error) {
                    logError(
                      'PLAYBACK CHECK',
                      error
                    );
                  }
                },
                15000
              );

            } catch (error) {
              clearPlayTimer(state);

              state.current = null;
              state.starting = false;

              logError(
                'PLAY COMMAND FAILED',
                error
              );

              await sendSafe(
                state.textChannel,
                '❌ Không thể bắt đầu bài **' +
                title(track) +
                '**.'
              );

              await playNext(guildId);
            }
          }

          async function enqueue(
            message,
            query,
            mode = 'auto',
            silent = false
          ) {
            const tracks =
              await resolveTracks(
                query,
                mode
              );

            if (!tracks.length) {
              return message.reply(
                '❌ Không tìm thấy bài nhạc.'
              );
            }

            await connectVoice(message);

            const state = getState(
              message.guild.id
            );

            state.stopped = false;
            state.textChannel = message.channel;

            const available =
              MAX_QUEUE - state.queue.length;

            const selected = tracks.slice(
              0,
              Math.max(0, available)
            );

            if (!selected.length) {
              return message.reply(
                '❌ Hàng chờ đã đầy.'
              );
            }

            state.queue.push(...selected);

            if (!silent) {
              await message.reply(
                selected.length === 1
                  ? '➕ Đã thêm: **' +
                    title(selected[0]) +
                    '**'
                  : '➕ Đã thêm ' +
                    selected.length +
                    ' bài vào hàng chờ.'
              );
            }

            if (
              !state.current &&
              !state.starting
            ) {
              await playNext(
                message.guild.id
              );
            }
          }

          // =====================================================
          // SUPABASE
          // =====================================================

          function hasSupabase() {
            return Boolean(
              CONFIG.supabaseURL &&
              CONFIG.supabaseKey
            );
          }

          async function supabase(
            method,
            table,
            params = {},
            data = null
          ) {
            if (!hasSupabase()) {
              throw new Error(
                'Supabase chưa được cấu hình.'
              );
            }

            const base =
              CONFIG.supabaseURL.replace(
                /\/$/,
                ''
              );

            const response = await axios({
              method,
              url:
                base +
                '/rest/v1/' +
                table,
              params,
              data,
              headers: {
                apikey: CONFIG.supabaseKey,
                Authorization:
                  'Bearer ' + CONFIG.supabaseKey,
                'Content-Type':
                  'application/json',
                Prefer:
                  'return=representation'
              },
              timeout: 20000
            });

            return response.data;
          }

          async function getMemories(
            userId,
            guildId
          ) {
            if (!hasSupabase()) return [];

            try {
              return await supabase(
                'GET',
                'bot_memories',
                {
                  user_id: 'eq.' + userId,
                  guild_id: 'eq.' + guildId,
                  select:
                    'id,content,created_at',
                  order:
                    'created_at.desc',
                  limit: 20
                }
              );
            } catch (error) {
              logError(
                'GET MEMORIES',
                error
              );

              return [];
            }
          }

          // =====================================================
          // OLLAMA CLOUD AI
          // =====================================================

          const histories = new Map();

          async function askAI(
            message,
            question
          ) {
            if (!CONFIG.aiKey) {
              return (
                '❌ Chưa cấu hình ' +
                'OLLAMA_API_KEY.'
              );
            }

            const key =
              message.guild.id +
              ':' +
              message.author.id;

            const history =
              histories.get(key) || [];

            const memories =
              await getMemories(
                message.author.id,
                message.guild.id
              );

            const memoryText = memories
              .map(m => '- ' + m.content)
              .join('\n');

            const system = [
              CONFIG.systemPrompt,
              memoryText
                ? 'Thông tin đã ghi nhớ:\n' +
                  memoryText
                : ''
            ].join('\n\n');

            const messages = [
              {
                role: 'system',
                content: system
              },
              ...history,
              {
                role: 'user',
                content: question
              }
            ];

            try {
              const response =
                await axios.post(
                  CONFIG.aiURL,
                  {
                    model: CONFIG.aiModel,
                    messages,
                    stream: false
                  },
                  {
                    headers: {
                      Authorization:
                        'Bearer ' +
                        CONFIG.aiKey,
                      'Content-Type':
                        'application/json'
                    },
                    timeout: 120000
                  }
                );

              const answer =
                response.data?.message?.content ||
                response.data?.choices?.[0]?.message?.content ||
                'Mình chưa có câu trả lời.';

              history.push(
                {
                  role: 'user',
                  content: question
                },
                {
                  role: 'assistant',
                  content: answer
                }
              );

              histories.set(
                key,
                history.slice(-12)
              );

              return answer;

            } catch (error) {
              logError(
                'OLLAMA ERROR',
                error.response?.data || error
              );

              return (
                '❌ AI đang gặp lỗi. ' +
                'Kiểm tra GitHub Actions.'
              );
            }
          }

          async function replyLong(
            message,
            text
          ) {
            const content = String(
              text || ''
            );

            for (
              let i = 0;
              i < Math.min(
                content.length,
                1900 * 8
              );
              i += 1900
            ) {
              await message.reply({
                content:
                  content.slice(
                    i,
                    i + 1900
                  ),
                allowedMentions: {
                  repliedUser: false
                }
              });
            }
          }

          // =====================================================
          // FIRECRAWL
          // =====================================================

          async function firecrawl(
            endpoint,
            payload
          ) {
            if (!CONFIG.firecrawlKey) {
              throw new Error(
                'Chưa cấu hình FIRECRAWL_API_KEY.'
              );
            }

            const response =
              await axios.post(
                'https://api.firecrawl.dev/v2/' +
                endpoint,
                payload,
                {
                  headers: {
                    Authorization:
                      'Bearer ' +
                      CONFIG.firecrawlKey
                  },
                  timeout: 60000
                }
              );

            return response.data;
          }

          // =====================================================
          // FAVORITES
          // =====================================================

          async function favoritesCommand(
            message,
            args
          ) {
            const guildId =
              message.guild.id;

            const userId =
              message.author.id;

            if (
              !args ||
              args.toLowerCase() === 'list'
            ) {
              const rows = await supabase(
                'GET',
                'bot_favorites',
                {
                  user_id: 'eq.' + userId,
                  guild_id: 'eq.' + guildId,
                  select: 'title,url',
                  order: 'created_at.desc',
                  limit: 30
                }
              );

              if (!rows.length) {
                return message.reply(
                  '⭐ Favorites đang trống.'
                );
              }

              return replyLong(
                message,
                '⭐ **Favorites**\n' +
                rows.map(
                  (r, i) =>
                    `${i + 1}. ${r.title}`
                ).join('\n')
              );
            }

            const tracks =
              await resolveTracks(args);

            if (!tracks.length) {
              return message.reply(
                '❌ Không tìm thấy bài.'
              );
            }

            const track = tracks[0];

            await supabase(
              'POST',
              'bot_favorites',
              {},
              {
                user_id: userId,
                guild_id: guildId,
                title: title(track),
                url: uri(track)
              }
            );

            return message.reply(
              '⭐ Đã lưu: **' +
              title(track) +
              '**'
            );
          }

          // =====================================================
          // PLAYLISTS
          // =====================================================

          async function playlistCommand(
            message,
            args
          ) {
            const userId =
              message.author.id;

            const guildId =
              message.guild.id;

            const input =
              String(args || '').trim();

            if (
              !input ||
              input.toLowerCase() === 'list'
            ) {
              const rows = await supabase(
                'GET',
                'bot_playlists',
                {
                  user_id: 'eq.' + userId,
                  guild_id: 'eq.' + guildId,
                  select: 'name',
                  limit: 1000
                }
              );

              const names = [
                ...new Set(
                  rows.map(r => r.name)
                )
              ];

              return message.reply(
                names.length
                  ? '📂 **Playlists**\n' +
                    names.map(
                      n => '• ' + n
                    ).join('\n').slice(0, 1800)
                  : '📂 Chưa có playlist.'
              );
            }

            const space =
              input.indexOf(' ');

            const action = (
              space === -1
                ? input
                : input.slice(0, space)
            ).toLowerCase();

            const rest = (
              space === -1
                ? ''
                : input.slice(space + 1)
            ).trim();

            if (action === 'add') {
              const separator =
                rest.indexOf('|');

              if (separator === -1) {
                return message.reply(
                  'Dùng: `d.pl add Tên playlist | Tên bài`'
                );
              }

              const name = rest
                .slice(0, separator)
                .trim();

              const query = rest
                .slice(separator + 1)
                .trim();

              if (!name || !query) {
                return message.reply(
                  '❌ Thiếu tên playlist hoặc bài.'
                );
              }

              const tracks =
                await resolveTracks(
                  query
                );

              if (!tracks.length) {
                return message.reply(
                  '❌ Không tìm thấy bài.'
                );
              }

              const track = tracks[0];

              await supabase(
                'POST',
                'bot_playlists',
                {},
                {
                  user_id: userId,
                  guild_id: guildId,
                  name,
                  title: title(track),
                  url: uri(track)
                }
              );

              return message.reply(
                '✅ Đã thêm **' +
                title(track) +
                '** vào **' +
                name +
                '**.'
              );
            }

            if (
              action === 'show' ||
              action === 'play'
            ) {
              if (!rest) {
                return message.reply(
                  '❌ Thiếu tên playlist.'
                );
              }

              const rows = await supabase(
                'GET',
                'bot_playlists',
                {
                  user_id: 'eq.' + userId,
                  guild_id: 'eq.' + guildId,
                  name: 'eq.' + rest,
                  select: 'title,url',
                  order: 'created_at.asc',
                  limit: 100
                }
              );

              if (!rows.length) {
                return message.reply(
                  '❌ Playlist không tồn tại hoặc trống.'
                );
              }

              if (action === 'show') {
                return replyLong(
                  message,
                  '📂 **' + rest + '**\n' +
                  rows.map(
                    (r, i) =>
                      `${i + 1}. ${r.title}`
                  ).join('\n')
                );
              }

              await connectVoice(message);

              const state = getState(
                message.guild.id
              );

              state.stopped = false;
              state.textChannel =
                message.channel;

              let added = 0;

              for (const row of rows) {
                if (
                  state.queue.length >=
                  MAX_QUEUE
                ) {
                  break;
                }

                try {
                  const tracks =
                    await resolveTracks(
                      row.url || row.title
                    );

                  if (tracks.length) {
                    state.queue.push(
                      tracks[0]
                    );

                    added++;
                  }
                } catch (error) {
                  logError(
                    'PLAYLIST RESOLVE',
                    error
                  );
                }
              }

              await message.reply(
                '📂 Đã thêm ' +
                added +
                ' bài từ **' +
                rest +
                '**.'
              );

              if (
                !state.current &&
                !state.starting
              ) {
                await playNext(
                  message.guild.id
                );
              }

              return;
            }

            return message.reply(
              '📂 Lệnh playlist:\n' +
              '`d.pl list`\n' +
              '`d.pl show <tên>`\n' +
              '`d.pl add <tên> | <bài>`\n' +
              '`d.pl play <tên>`'
            );
          }

          // =====================================================
          // MUSIC COMMANDS
          // =====================================================

          const MUSIC_COMMANDS = new Set([
            'join',
            'play',
            'p',
            'ytm',
            'youtube',
            'yt',
            'pause',
            'resume',
            'skip',
            's',
            'stop',
            'leave',
            'out',
            'volume',
            'v',
            'now',
            'np',
            'queue',
            'q',
            'fv',
            'pl'
          ]);

          async function musicCommand(
            message,
            command,
            args
          ) {
            const state = getState(
              message.guild.id
            );

            try {
              switch (command) {
                case 'join': {
                  await connectVoice(message);

                  return message.reply(
                    '🔊 Đã vào voice.'
                  );
                }

                case 'play':
                case 'p': {
                  if (!args) {
                    return message.reply(
                      'Dùng: `d.play <bài hát hoặc URL>`'
                    );
                  }

                  return enqueue(
                    message,
                    args,
                    'auto'
                  );
                }

                case 'ytm': {
                  if (!args) {
                    return message.reply(
                      'Dùng: `d.ytm <tên bài>`'
                    );
                  }

                  return enqueue(
                    message,
                    args,
                    'music'
                  );
                }

                case 'youtube':
                case 'yt': {
                  if (!args) {
                    return message.reply(
                      'Dùng: `d.yt <tên bài>`'
                    );
                  }

                  return enqueue(
                    message,
                    args,
                    'youtube'
                  );
                }

                case 'pause': {
                  if (!state.player) {
                    return message.reply(
                      '❌ Chưa có player.'
                    );
                  }

                  await state.player.setPaused(
                    true
                  );

                  return message.reply(
                    '⏸️ Đã tạm dừng.'
                  );
                }

                case 'resume': {
                  if (!state.player) {
                    return message.reply(
                      '❌ Chưa có player.'
                    );
                  }

                  await state.player.setPaused(
                    false
                  );

                  return message.reply(
                    '▶️ Tiếp tục phát.'
                  );
                }

                case 'skip':
                case 's': {
                  if (!state.player) {
                    return message.reply(
                      '❌ Chưa có nhạc.'
                    );
                  }

                  if (!state.current) {
                    return message.reply(
                      '❌ Không có bài đang phát.'
                    );
                  }

                  await state.player.stopTrack();

                  return message.reply(
                    '⏭️ Đã skip.'
                  );
                }

                case 'stop': {
                  state.stopped = true;
                  state.queue = [];
                  state.current = null;
                  state.starting = false;
                  state.failedTracks = 0;

                  clearPlayTimer(state);

                  if (state.player) {
                    await state.player.stopTrack();
                  }

                  return message.reply(
                    '⏹️ Đã dừng và xóa queue.'
                  );
                }

                case 'leave':
                case 'out': {
                  state.stopped = true;
                  state.queue = [];
                  state.current = null;
                  state.starting = false;
                  state.failedTracks = 0;

                  clearPlayTimer(state);

                  if (state.player) {
                    await shoukaku.leaveVoiceChannel(
                      message.guild.id
                    );
                  }

                  state.player = null;

                  return message.reply(
                    '👋 Đã rời voice.'
                  );
                }

                case 'volume':
                case 'v': {
                  const volume =
                    Number(args);

                  if (
                    !args ||
                    !Number.isFinite(volume) ||
                    volume < 0 ||
                    volume > 200
                  ) {
                    return message.reply(
                      'Dùng: `d.volume 0-200`'
                    );
                  }

                  state.volume = volume;

                  if (state.player) {
                    await state.player.setGlobalVolume(
                      volume
                    );
                  }

                  return message.reply(
                    '🔊 Volume: ' +
                    volume +
                    '%'
                  );
                }

                case 'now':
                case 'np': {
                  return message.reply(
                    state.current
                      ? '🎵 Hiện tại: **' +
                        title(state.current) +
                        '**'
                      : '🎵 Không có bài đang phát.'
                  );
                }

                case 'queue':
                case 'q': {
                  const lines = state.queue
                    .slice(0, 20)
                    .map(
                      (track, i) =>
                        `${i + 1}. ${title(track)}`
                    );

                  return message.reply(
                    '🎶 **Queue**\n' +
                    (
                      state.current
                        ? 'Hiện tại: **' +
                          title(state.current) +
                          '**\n'
                        : ''
                    ) +
                    (
                      lines.length
                        ? lines.join('\n')
                        : 'Queue trống.'
                    )
                  );
                }

                case 'fv': {
                  return favoritesCommand(
                    message,
                    args
                  );
                }

                case 'pl': {
                  return playlistCommand(
                    message,
                    args
                  );
                }
              }

            } catch (error) {
              logError(
                'MUSIC COMMAND ' + command,
                error
              );

              return message.reply(
                '❌ Music lỗi: ' +
                String(
                  error.message || error
                ).slice(0, 1200)
              );
            }
          }

          // =====================================================
          // AI COMMANDS
          // =====================================================

          async function aiCommand(
            message,
            command,
            args
          ) {
            try {
              switch (command) {
                case 'search': {
                  if (!args) {
                    return message.reply(
                      'Dùng: `d.search <từ khóa>`'
                    );
                  }

                  const data =
                    await firecrawl(
                      'search',
                      {
                        query: args,
                        limit: 5
                      }
                    );

                  const results = (
                    data.data || []
                  ).map(
                    (r, i) =>
                      `${i + 1}. **${r.title || 'Result'}**\n` +
                      `${r.url || ''}\n` +
                      `${String(r.description || '').slice(0, 250)}`
                  );

                  return replyLong(
                    message,
                    results.join('\n\n') ||
                    'Không tìm thấy kết quả.'
                  );
                }

                case 'read': {
                  if (
                    !/^https?:\/\//i.test(args)
                  ) {
                    return message.reply(
                      'Dùng: `d.read <URL>`'
                    );
                  }

                  const data =
                    await firecrawl(
                      'scrape',
                      {
                        url: args,
                        formats: [
                          'markdown'
                        ]
                      }
                    );

                  const markdown =
                    data.data?.markdown ||
                    data.markdown ||
                    '';

                  if (!markdown) {
                    return message.reply(
                      '❌ Không đọc được trang.'
                    );
                  }

                  const summary =
                    await askAI(
                      message,
                      'Tóm tắt nội dung:\n\n' +
                      markdown.slice(
                        0,
                        14000
                      )
                    );

                  return replyLong(
                    message,
                    summary
                  );
                }

                case 'remember': {
                  if (!args) {
                    return message.reply(
                      'Dùng: `d.remember <thông tin>`'
                    );
                  }

                  await supabase(
                    'POST',
                    'bot_memories',
                    {},
                    {
                      user_id:
                        message.author.id,
                      guild_id:
                        message.guild.id,
                      content: args
                    }
                  );

                  return message.reply(
                    '🧠 Đã ghi nhớ!'
                  );
                }

                case 'memory': {
                  const rows =
                    await getMemories(
                      message.author.id,
                      message.guild.id
                    );

                  return replyLong(
                    message,
                    rows.length
                      ? '🧠 **Bộ nhớ**\n' +
                        rows.map(
                          (r, i) =>
                            `${i + 1}. ${r.content}`
                        ).join('\n')
                      : '🧠 Chưa lưu gì.'
                  );
                }

                case 'forget': {
                  await supabase(
                    'DELETE',
                    'bot_memories',
                    {
                      user_id:
                        'eq.' +
                        message.author.id,
                      guild_id:
                        'eq.' +
                        message.guild.id
                    }
                  );

                  return message.reply(
                    '🗑️ Đã xóa bộ nhớ.'
                  );
                }

                default: {
                  const question = [
                    command,
                    args
                  ].filter(Boolean).join(' ');

                  const answer =
                    await askAI(
                      message,
                      question
                    );

                  return replyLong(
                    message,
                    answer
                  );
                }
              }
            } catch (error) {
              logError(
                'AI COMMAND ' + command,
                error
              );

              return message.reply(
                '❌ Lỗi: ' +
                String(
                  error.message || error
                ).slice(0, 1000)
              );
            }
          }

          // =====================================================
          // MESSAGE ROUTER
          // =====================================================

          const KEYWORDS = [
            'thgadu',
            'thg adu',
            'đú à',
            'du a'
          ];

          client.on(
            Events.MessageCreate,
            async message => {
              if (
                message.author.bot ||
                !message.guild
              ) {
                return;
              }

              try {
                const content =
                  message.content.trim();

                if (
                  content.startsWith(PREFIX)
                ) {
                  const body = content
                    .slice(
                      PREFIX.length
                    )
                    .trim();

                  if (!body) {
                    return message.reply(
                      '👀 Bro gọi ThgAdu à?'
                    );
                  }

                  const space =
                    body.indexOf(' ');

                  const command = (
                    space === -1
                      ? body
                      : body.slice(
                          0,
                          space
                        )
                  ).toLowerCase();

                  const args = (
                    space === -1
                      ? ''
                      : body.slice(
                          space + 1
                        )
                  ).trim();

                  if (
                    MUSIC_COMMANDS.has(
                      command
                    )
                  ) {
                    await musicCommand(
                      message,
                      command,
                      args
                    );

                    return;
                  }

                  await aiCommand(
                    message,
                    command,
                    args
                  );

                  return;
                }

                const mentioned =
                  message.mentions.has(
                    client.user.id
                  );

                let repliedToBot = false;

                if (
                  message.reference?.messageId
                ) {
                  try {
                    const reference =
                      await message.channel.messages.fetch(
                        message.reference.messageId
                      );

                    repliedToBot =
                      reference.author.id ===
                      client.user.id;
                  } catch {
                    // Ignore missing message.
                  }
                }

                const lower =
                  content.toLowerCase();

                const keyword =
                  KEYWORDS.some(
                    word =>
                      lower.includes(
                        word
                      )
                  );

                const random =
                  Math.random() <
                  RANDOM_CHANCE;

                if (
                  !mentioned &&
                  !repliedToBot &&
                  !keyword &&
                  !random
                ) {
                  return;
                }

                const question = content
                  .replace(
                    /<@!?\d+>/g,
                    ''
                  )
                  .trim();

                if (!question) return;

                const answer =
                  await askAI(
                    message,
                    question
                  );

                await replyLong(
                  message,
                  answer
                );

              } catch (error) {
                logError(
                  'MESSAGE HANDLER',
                  error
                );
              }
            }
          );

          // =====================================================
          // AUTO CHAT
          // =====================================================

          async function autoChat() {
            if (!CONFIG.autoChannel) {
              return;
            }

            try {
              const channel =
                await client.channels.fetch(
                  CONFIG.autoChannel
                );

              if (
                !channel ||
                !channel.isTextBased()
              ) {
                return;
              }

              await channel.send(
                'Có ai ở đây không? 👀'
              );

              console.log(
                '✅ Auto-chat sent'
              );

            } catch (error) {
              logError(
                'AUTO CHAT',
                error
              );
            }
          }

          // =====================================================
          // READY
          // =====================================================

          client.once(
            Events.ClientReady,
            readyClient => {
              console.log(
                '✅ ThgAdu online:',
                readyClient.user.tag
              );

              readyClient.user.setPresence({
                status: 'idle',
                activities: [
                  {
                    name:
                      'drama trong server 🍿',
                    type:
                      ActivityType.Watching
                  }
                ]
              });

              console.log(
                '🎵 Music: Lavalink'
              );

              console.log(
                '🎵 YouTube plugin: 1.18.2'
              );

              console.log(
                '🎵 Search: YouTube Music + YouTube'
              );

              console.log(
                '🤖 Random replies: 20%'
              );

              console.log(
                '⏰ Auto-chat: 2 hours'
              );

              setInterval(
                autoChat,
                AUTO_INTERVAL
              );
            }
          );

          if (!CONFIG.token) {
            console.error(
              '❌ Missing TOKEN'
            );

            process.exit(1);
          }

          client.login(
            CONFIG.token
          );
          EOF

          node --check index.js

          echo "✅ ThgAdu v5.2 generated"

      - name: Run ThgAdu
        shell: bash
        run: |
          set -o pipefail

          echo "================================"
          echo "🚀 THGADU V5.2"
          echo "================================"

          echo "YouTube Plugin: 1.18.2"
          echo "YouTube Music: Enabled"
          echo "YouTube Search: Enabled"

          echo ""
          echo "===== LAVALINK STARTUP LOG ====="

          tail -n 50 lavalink.log || true

          echo ""
          echo "===== LIVE LAVALINK LOG ====="

          tail -n 0 -F lavalink.log \
            | sed -u 's/^/[LAVALINK] /' &

          LOG_PID=$!

          cleanup() {
            echo ""
            echo "===== FINAL LAVALINK LOG ====="

            tail -n 150 lavalink.log || true

            kill "$LOG_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo ""
          echo "===== BOT ====="

          npm start

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thgadu-v5-2-debug
          path: |
            lavalink.log
            ytm-test.json
            yt-test.json
          retention-days: 3
          if-no-files-found: ignore
