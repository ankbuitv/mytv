          // =====================================================
          // RESPONSE HELPERS
          // =====================================================

          async function replyChunks(interaction, text, ephemeral = false) {
            const content = String(text || 'Không có nội dung.');

            const chunks = [];

            for (let i = 0; i < Math.min(content.length, 12000); i += 1900) {
              chunks.push(content.slice(i, i + 1900));
            }

            const options = {
              content: chunks[0] || 'Không có nội dung.',
              allowedMentions: { parse: [] }
            };

            if (interaction.deferred || interaction.replied) {
              await interaction.editReply(options);
            } else {
              await interaction.reply({
                ...options,
                ephemeral
              });
            }

            for (const chunk of chunks.slice(1)) {
              await interaction.followUp({
                content: chunk,
                ephemeral,
                allowedMentions: { parse: [] }
              });
            }
          }

          function checkCooldown(interaction, seconds = 4) {
            const key = `${interaction.guildId}:${interaction.user.id}`;
            const now = Date.now();
            const previous = cooldowns.get(key) || 0;

            if (now - previous < seconds * 1000) {
              return false;
            }

            cooldowns.set(key, now);
            return true;
          }

          function requireAdmin(interaction) {
            if (!interaction.memberPermissions?.has(PermissionFlagsBits.ManageGuild)) {
              throw new Error('Bro cần quyền Manage Server.');
            }
          }

          // =====================================================
          // COMMAND HANDLER
          // =====================================================

          async function handleCommand(interaction) {
            const name = interaction.commandName;
            const sub = interaction.options.getSubcommand(false);

            if (!interaction.guildId) {
              return interaction.reply({
                content: 'Lệnh này chỉ dùng trong server.',
                ephemeral: true
              });
            }

            if (!checkCooldown(interaction)) {
              return interaction.reply({
                content: 'Bro chậm lại chút nhé, chờ vài giây rồi thử lại.',
                ephemeral: true
              });
            }

            const privateCommands = new Set([
              'memory',
              'nhac',
              'note',
              'reset',
              'admin',
              'report',
              'status'
            ]);

            await interaction.deferReply({
              ephemeral: privateCommands.has(name)
            });

            const guildId = interaction.guildId;
            const userId = interaction.user.id;

            switch (name) {
              case 'help': {
                return replyChunks(
                  interaction,
                  [
                    '**🤖 AI:** `/chat`, `/reset`, `/tomtat`, `/dich`, `/vietlai`, `/brainstorm`',
                    '**🌐 Web:** `/search`, `/tim-code`, `/doc`, `/tldr`',
                    '**🧠 Cá nhân:** `/memory`, `/nhac`, `/note`',
                    '**📻 Radio:** `/radio play`, `/radio stop`, `/radio status`',
                    '**🎲 Vui:** `/roll`, `/coinflip`, `/8ball`, `/random`, `/poll`, `/countdown`',
                    '**💰 Tiền ảo:** `/balance`, `/daily`, `/work`, `/transfer`, `/leaderboard`',
                    '**🛠️ Khác:** `/ping`, `/status`, `/server`, `/user`, `/report`, `/admin`',
                    '',
                    '⚠️ `/chat` có ngữ cảnh và `/tomtat` gửi nội dung tin nhắn tới dịch vụ AI.',
                    'Tiền ảo chỉ để giải trí, không có giá trị tiền thật.'
                  ].join('\n')
                );
              }

              case 'chat': {
                const question = interaction.options.getString('noidung', true);
                const useContext = interaction.options.getBoolean('ngucanh') || false;

                const context = useContext
                  ? await getChannelContext(interaction.channel, 15)
                  : '';

                const answer = await askAI({
                  guildId,
                  userId,
                  question,
                  context
                });

                return replyChunks(interaction, answer);
              }

              case 'reset': {
                histories.delete(guildId + ':' + userId);

                return replyChunks(
                  interaction,
                  '✅ Đã xóa lịch sử chat tạm. Bộ nhớ lưu trong Supabase không bị xóa.',
                  true
                );
              }

              case 'tomtat': {
                const limit = interaction.options.getInteger('soluong') || 20;
                const context = await getChannelContext(interaction.channel, limit);

                if (!context) {
                  return replyChunks(interaction, 'Không có tin nhắn văn bản để tóm tắt.');
                }

                const answer = await askAI({
                  guildId,
                  userId,
                  question:
                    'Tóm tắt cuộc hội thoại sau bằng tiếng Việt, nêu các ý chính và việc cần làm nếu có.',
                  context,
                  useHistory: false,
                  useMemory: false
                });

                return replyChunks(interaction, answer);
              }

              case 'dich':
              case 'vietlai':
              case 'brainstorm': {
                let question;

                if (name === 'dich') {
                  const text = interaction.options.getString('noidung', true);
                  const language =
                    interaction.options.getString('ngonngu') || 'tiếng Việt';

                  question = `Dịch sang ${language}:\n${text}`;
                } else if (name === 'vietlai') {
                  question =
                    'Viết lại văn bản sau tự nhiên, rõ ràng hơn:\n' +
                    interaction.options.getString('noidung', true);
                } else {
                  question =
                    'Hãy brainstorm các ý tưởng thực tế cho chủ đề:\n' +
                    interaction.options.getString('chude', true);
                }

                const answer = await askAI({
                  guildId,
                  userId,
                  question,
                  useHistory: false
                });

                return replyChunks(interaction, answer);
              }

              case 'search':
              case 'tim-code': {
                const query = interaction.options.getString('truyvan', true);

                const answer = await searchWithSources(
                  interaction,
                  query,
                  name === 'tim-code'
                );

                return replyChunks(interaction, answer);
              }

              case 'doc':
              case 'tldr': {
                const url = interaction.options.getString('url', true);

                if (!validHttpURL(url)) {
                  throw new Error('URL phải bắt đầu bằng http:// hoặc https://.');
                }

                const data = await firecrawl('scrape', {
                  url,
                  formats: ['markdown']
                });

                const markdown = data?.data?.markdown || data?.markdown || '';

                if (!markdown) {
                  throw new Error('Không đọc được nội dung trang.');
                }

                const answer = await askAI({
                  guildId,
                  userId,
                  question:
                    name === 'tldr'
                      ? 'Tóm tắt trang này thật ngắn, tối đa 5 ý.'
                      : 'Tóm tắt trang này, nêu các ý chính.',
                  context: markdown.slice(0, 12000),
                  useHistory: false,
                  useMemory: false
                });

                return replyChunks(
                  interaction,
                  answer + '\n\nNguồn: ' + url
                );
              }

              case 'memory': {
                if (sub === 'add') {
                  await db('POST', 'bot_memories', {}, {
                    guild_id: guildId,
                    user_id: userId,
                    content: interaction.options.getString('noidung', true)
                  });

                  return replyChunks(interaction, '🧠 Đã lưu bộ nhớ.', true);
                }

                if (sub === 'list') {
                  const rows = await getMemories(userId, guildId);

                  const text = rows.length
                    ? rows.map(row => `ID ${row.id}: ${row.content}`).join('\n')
                    : 'Chưa có bộ nhớ.';

                  return replyChunks(interaction, '🧠 **Bộ nhớ:**\n' + text, true);
                }

                if (sub === 'delete') {
                  const id = interaction.options.getInteger('id', true);

                  const rows = await db('DELETE', 'bot_memories', {
                    id: 'eq.' + id,
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId
                  });

                  return replyChunks(
                    interaction,
                    rows.length ? '🗑️ Đã xóa.' : 'Không tìm thấy mục đó.',
                    true
                  );
                }

                if (sub === 'clear') {
                  await db('DELETE', 'bot_memories', {
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId
                  });

                  return replyChunks(interaction, '🗑️ Đã xóa toàn bộ bộ nhớ.', true);
                }

                break;
              }

              case 'nhac': {
                if (sub === 'add') {
                  const duration = parseDuration(
                    interaction.options.getString('sau', true)
                  );

                  if (!duration) {
                    throw new Error('Dùng dạng 30m, 2h hoặc 1d; từ 10 giây đến 365 ngày.');
                  }

                  const due = new Date(Date.now() + duration);

                  const rows = await db('POST', 'bot_reminders', {}, {
                    guild_id: guildId,
                    user_id: userId,
                    channel_id: interaction.channelId,
                    content: interaction.options.getString('noidung', true),
                    due_at: due.toISOString()
                  });

                  return replyChunks(
                    interaction,
                    `⏰ Đã tạo lời nhắc ID ${rows[0]?.id}. Đến hạn <t:${Math.floor(due.getTime() / 1000)}:R>.`,
                    true
                  );
                }

                if (sub === 'list') {
                  const rows = await db('GET', 'bot_reminders', {
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId,
                    select: 'id,content,due_at',
                    order: 'due_at.asc',
                    limit: 30
                  });

                  const text = rows.length
                    ? rows.map(row =>
                        `ID ${row.id}: ${row.content} — <t:${Math.floor(new Date(row.due_at).getTime() / 1000)}:R>`
                      ).join('\n')
                    : 'Không có lời nhắc đang chờ.';

                  return replyChunks(interaction, text, true);
                }

                if (sub === 'delete') {
                  const id = interaction.options.getInteger('id', true);

                  const rows = await db('DELETE', 'bot_reminders', {
                    id: 'eq.' + id,
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId
                  });

                  return replyChunks(
                    interaction,
                    rows.length ? '🗑️ Đã xóa lời nhắc.' : 'Không tìm thấy lời nhắc.',
                    true
                  );
                }

                break;
              }

              case 'note': {
                if (sub === 'add') {
                  const rows = await db('POST', 'bot_notes', {}, {
                    guild_id: guildId,
                    user_id: userId,
                    content: interaction.options.getString('noidung', true)
                  });

                  return replyChunks(
                    interaction,
                    `📝 Đã lưu ghi chú ID ${rows[0]?.id}.`,
                    true
                  );
                }

                if (sub === 'list') {
                  const rows = await db('GET', 'bot_notes', {
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId,
                    select: 'id,content',
                    order: 'created_at.desc',
                    limit: 30
                  });

                  return replyChunks(
                    interaction,
                    rows.length
                      ? rows.map(row => `ID ${row.id}: ${row.content}`).join('\n')
                      : 'Chưa có ghi chú.',
                    true
                  );
                }

                if (sub === 'delete') {
                  const id = interaction.options.getInteger('id', true);

                  const rows = await db('DELETE', 'bot_notes', {
                    id: 'eq.' + id,
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId
                  });

                  return replyChunks(
                    interaction,
                    rows.length ? '🗑️ Đã xóa ghi chú.' : 'Không tìm thấy ghi chú.',
                    true
                  );
                }

                if (sub === 'share') {
                  const id = interaction.options.getInteger('id', true);

                  const rows = await db('GET', 'bot_notes', {
                    id: 'eq.' + id,
                    guild_id: 'eq.' + guildId,
                    user_id: 'eq.' + userId,
                    select: 'content',
                    limit: 1
                  });

                  if (!rows.length) {
                    throw new Error('Không tìm thấy ghi chú.');
                  }

                  await interaction.channel.send({
                    content: `📝 **Ghi chú được chia sẻ bởi ${interaction.user.username}:**\n${rows[0].content}`,
                    allowedMentions: { parse: [] }
                  });

                  return replyChunks(interaction, '✅ Đã chia sẻ ghi chú.', true);
                }

                break;
              }

              case 'poll': {
                const question = interaction.options.getString('cauhoi', true);

                const options = interaction.options.getString('luachon', true)
                  .split('|')
                  .map(item => item.trim())
                  .filter(Boolean)
                  .slice(0, 5);

                if (options.length < 2) {
                  throw new Error('Cần từ 2 lựa chọn trở lên, ngăn cách bằng dấu |.');
                }

                const emojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣'];

                const text = [
                  '📊 **' + question + '**',
                  ...options.map((item, index) => `${emojis[index]} ${item}`)
                ].join('\n');

                await interaction.editReply({
                  content: text,
                  allowedMentions: { parse: [] }
                });

                const message = await interaction.fetchReply();

                for (let i = 0; i < options.length; i++) {
                  await message.react(emojis[i]);
                }

                return;
              }

              case 'countdown': {
                const value = interaction.options.getString('thoigian', true);

                if (!/(Z|[+-]\d{2}:\d{2})$/i.test(value)) {
                  throw new Error('Hãy ghi rõ múi giờ, ví dụ 2026-12-31T20:00:00+07:00.');
                }

                const time = new Date(value);

                if (Number.isNaN(time.getTime())) {
                  throw new Error('Thời gian không hợp lệ.');
                }

                const event =
                  interaction.options.getString('sukien') || 'Sự kiện';

                const timestamp = Math.floor(time.getTime() / 1000);

                return replyChunks(
                  interaction,
                  `⏳ **${event}**: <t:${timestamp}:F> — <t:${timestamp}:R>`
                );
              }

              case 'radio': {
                if (sub === 'status') {
                  const state = radioStates.get(guildId);

                  return replyChunks(
                    interaction,
                    state
                      ? `📻 Đài ${state.station}: ${state.playing ? 'đang phát' : 'đang kết nối'}.`
                      : '📻 Server chưa phát radio.'
                  );
                }

                if (sub === 'stop') {
                  requireSameVoice(interaction);
                  stopRadio(guildId);

                  return replyChunks(
                    interaction,
                    '📻 Đã dừng radio và rời voice.'
                  );
                }

                if (sub === 'play') {
                  const station = interaction.options.getInteger('dai', true);

                  await startRadio(interaction, station);

                  return replyChunks(
                    interaction,
                    `📻 Đang kết nối radio đài số **${station}**. ` +
                    'Nếu stream lỗi hoặc hết hạn, bot có thể tự dừng.'
                  );
                }

                break;
              }

              case 'roll': {
                const input =
                  interaction.options.getString('xucxac') || '1d6';

                const match = input.toLowerCase().match(/^(\d{1,2})d(\d{1,4})$/);

                if (!match) {
                  throw new Error('Dùng dạng 1d6 hoặc 2d20.');
                }

                const count = Number(match[1]);
                const sides = Number(match[2]);

                if (count < 1 || count > 20 || sides < 2 || sides > 1000) {
                  throw new Error('Tối đa 20 viên, mỗi viên từ 2 đến 1000 mặt.');
                }

                const rolls = Array.from(
                  { length: count },
                  () => Math.floor(Math.random() * sides) + 1
                );

                const sum = rolls.reduce((a, b) => a + b, 0);

                return replyChunks(
                  interaction,
                  `🎲 ${input}: **${rolls.join(', ')}** — Tổng: **${sum}**`
                );
              }

              case 'coinflip':
                return replyChunks(
                  interaction,
                  Math.random() < 0.5 ? '🪙 Mặt ngửa!' : '🪙 Mặt sấp!'
                );

              case '8ball': {
                const answers = [
                  'Chắc chắn rồi!',
                  'Khả năng cao là có.',
                  'Có vẻ ổn đấy.',
                  'Chưa rõ, hỏi lại sau nhé.',
                  'Mình nghĩ là không.',
                  'Khó lắm bro ơi.',
                  'Vũ trụ bảo: cứ thử đi!'
                ];

                const answer = answers[Math.floor(Math.random() * answers.length)];

                return replyChunks(interaction, '🎱 ' + answer);
              }

              case 'random': {
                const min = interaction.options.getInteger('min', true);
                const max = interaction.options.getInteger('max', true);

                if (min > max) {
                  throw new Error('Min phải nhỏ hơn hoặc bằng max.');
                }

                const value =
                  Math.floor(Math.random() * (max - min + 1)) + min;

                return replyChunks(interaction, `🎲 Kết quả: **${value}**`);
              }

              case 'balance': {
                const rows = await db('GET', 'bot_economy', {
                  guild_id: 'eq.' + guildId,
                  user_id: 'eq.' + userId,
                  select: 'balance',
                  limit: 1
                });

                return replyChunks(
                  interaction,
                  `💰 Số dư: **${rows[0]?.balance || 0}** xu.`
                );
              }

              case 'daily':
              case 'work': {
                const result = await rpc('bot_economy_reward', {
                  p_guild: guildId,
                  p_user: userId,
                  p_kind: name
                });

                if (!result?.ok) {
                  const time = result?.next_at
                    ? ` Thử lại <t:${Math.floor(new Date(result.next_at).getTime() / 1000)}:R>.`
                    : '';

                  return replyChunks(interaction, '⏳ Chưa hết cooldown.' + time);
                }

                return replyChunks(
                  interaction,
                  `💰 Nhận **${result.amount}** xu. Số dư: **${result.balance}** xu.`
                );
              }

              case 'transfer': {
                const target = interaction.options.getUser('nguoi', true);
                const amount = interaction.options.getInteger('sotien', true);

                if (target.bot || target.id === userId) {
                  throw new Error('Không thể chuyển cho bot hoặc chính mình.');
                }

                const result = await rpc('bot_economy_transfer', {
                  p_guild: guildId,
                  p_from: userId,
                  p_to: target.id,
                  p_amount: amount
                });

                if (!result?.ok) {
                  throw new Error('Số dư không đủ hoặc giao dịch không hợp lệ.');
                }

                return replyChunks(
                  interaction,
                  `💸 Đã chuyển **${amount}** xu cho **${target.username}**.`
                );
              }

              case 'leaderboard': {
                const rows = await db('GET', 'bot_economy', {
                  guild_id: 'eq.' + guildId,
                  select: 'user_id,balance',
                  order: 'balance.desc',
                  limit: 10
                });

                return replyChunks(
                  interaction,
                  rows.length
                    ? '🏆 **Leaderboard**\n' +
                      rows.map((row, i) =>
                        `${i + 1}. <@${row.user_id}> — ${row.balance} xu`
                      ).join('\n')
                    : 'Chưa có dữ liệu.'
                );
              }

              case 'ping':
                return replyChunks(
                  interaction,
                  `🏓 Pong! WebSocket: ${Math.round(client.ws.ping)}ms.`
                );

              case 'status': {
                let dbStatus = 'Chưa cấu hình';

                if (CONFIG.supabaseURL && CONFIG.supabaseKey) {
                  try {
                    await db('GET', 'bot_settings', {
                      select: 'guild_id',
                      limit: 1
                    });

                    dbStatus = 'Kết nối được';
                  } catch {
                    dbStatus = 'Lỗi kết nối hoặc schema';
                  }
                }

                return replyChunks(
                  interaction,
                  [
                    `Discord: online`,
                    `Supabase: ${dbStatus}`,
                    `AI: ${CONFIG.aiKey ? 'Đã cấu hình key, chưa kiểm tra API' : 'Chưa cấu hình'}`,
                    `Firecrawl: ${CONFIG.firecrawlKey ? 'Đã cấu hình key, chưa kiểm tra API' : 'Chưa cấu hình'}`,
                    `Radio server này: ${radioStates.has(guildId) ? 'Đang kết nối/phát' : 'Không phát'}`
                  ].join('\n'),
                  true
                );
              }

              case 'server':
                return replyChunks(
                  interaction,
                  [
                    `🏠 **${interaction.guild.name}**`,
                    `ID: ${guildId}`,
                    `Thành viên: ${interaction.guild.memberCount}`,
                    `Tạo lúc: <t:${Math.floor(interaction.guild.createdTimestamp / 1000)}:F>`
                  ].join('\n')
                );

              case 'user': {
                const target =
                  interaction.options.getUser('nguoi') || interaction.user;

                return replyChunks(
                  interaction,
                  [
                    `👤 **${target.username}**`,
                    `ID: ${target.id}`,
                    `Bot: ${target.bot ? 'Có' : 'Không'}`,
                    `Tạo tài khoản: <t:${Math.floor(target.createdTimestamp / 1000)}:F>`
                  ].join('\n')
                );
              }

              case 'report': {
                const settings = await getSettings(guildId);

                if (!settings.report_channel_id) {
                  throw new Error('Admin chưa cấu hình kênh report.');
                }

                const channel = await client.channels.fetch(
                  settings.report_channel_id
                );

                if (
                  !channel?.isTextBased() ||
                  !channel.send ||
                  channel.guildId !== guildId
                ) {
                  throw new Error('Kênh report không hợp lệ.');
                }

                await channel.send({
                  content:
                    `📨 **Report từ ${interaction.user.username}** ` +
                    `(ID: ${userId})\n` +
                    interaction.options.getString('noidung', true),
                  allowedMentions: { parse: [] }
                });

                return replyChunks(interaction, '✅ Đã gửi report cho admin.', true);
              }

              case 'admin': {
                requireAdmin(interaction);

                if (sub === 'config') {
                  const settings = await getSettings(guildId);

                  return replyChunks(
                    interaction,
                    [
                      `Random reply: ${settings.random_reply ? 'Bật' : 'Tắt'}`,
                      `Kênh report: ${settings.report_channel_id ? '<#' + settings.report_channel_id + '>' : 'Chưa đặt'}`
                    ].join('\n'),
                    true
                  );
                }

                if (sub === 'random-reply') {
                  const enabled = interaction.options.getBoolean('bat', true);

                  await saveSettings(guildId, {
                    random_reply: enabled
                  });

                  return replyChunks(
                    interaction,
                    `✅ Random reply: ${enabled ? 'bật' : 'tắt'}.`,
                    true
                  );
                }

                if (sub === 'report-channel') {
                  const channel = interaction.options.getChannel('kenh', true);

                  await saveSettings(guildId, {
                    report_channel_id: channel.id
                  });

                  return replyChunks(
                    interaction,
                    `✅ Đã đặt kênh report: <#${channel.id}>.`,
                    true
                  );
                }

                if (sub === 'economy-add') {
                  const target = interaction.options.getUser('nguoi', true);
                  const amount = interaction.options.getInteger('sotien', true);

                  const result = await rpc('bot_economy_admin', {
                    p_guild: guildId,
                    p_user: target.id,
                    p_amount: amount
                  });

                  if (!result?.ok) {
                    throw new Error('Không thể trừ quá số dư.');
                  }

                  return replyChunks(
                    interaction,
                    `✅ Số dư của ${target.username}: ${result.balance} xu.`,
                    true
                  );
                }

                if (sub === 'clear') {
                  if (!interaction.memberPermissions.has(PermissionFlagsBits.ManageMessages)) {
                    throw new Error('Bro cần quyền Manage Messages.');
                  }

                  if (!interaction.options.getBoolean('xacnhan', true)) {
                    throw new Error('Chọn xacnhan: true để thực hiện.');
                  }

                  if (!interaction.channel?.bulkDelete) {
                    throw new Error('Kênh này không hỗ trợ bulk delete.');
                  }

                  const count = interaction.options.getInteger('soluong', true);

                  const deleted = await interaction.channel.bulkDelete(count, true);

                  return replyChunks(
                    interaction,
                    `🧹 Đã xóa ${deleted.size} tin nhắn. Discord không bulk-delete tin quá 14 ngày.`,
                    true
                  );
                }

                break;
              }
            }

            throw new Error('Lệnh chưa được hỗ trợ.');
          }

          // =====================================================
          // INTERACTION EVENTS
          // =====================================================

          client.on(Events.InteractionCreate, async interaction => {
            if (!interaction.isChatInputCommand()) return;

            try {
              await handleCommand(interaction);
            } catch (error) {
              safeError('COMMAND ' + interaction.commandName, error);

              const message =
                '❌ Có lỗi khi xử lý lệnh. ' +
                (
                  error?.response
                    ? 'Kiểm tra cấu hình dịch vụ và log Actions.'
                    : String(error?.message || 'Lỗi không xác định.').slice(0, 500)
                );

              try {
                if (interaction.deferred || interaction.replied) {
                  await interaction.editReply({
                    content: message,
                    allowedMentions: { parse: [] }
                  });
                } else {
                  await interaction.reply({
                    content: message,
                    ephemeral: true,
                    allowedMentions: { parse: [] }
                  });
                }
              } catch (replyError) {
                safeError('ERROR REPLY', replyError);
              }
            }
          });

          // =====================================================
          // OPTIONAL RANDOM REPLY
          // =====================================================

          client.on(Events.MessageCreate, async message => {
            if (
              message.author.bot ||
              !message.guild ||
              !message.content
            ) {
              return;
            }

            if (!CONFIG.aiKey || !CONFIG.supabaseURL || !CONFIG.supabaseKey) {
              return;
            }

            // Chỉ kiểm tra DB khi random đã trúng.
            if (Math.random() >= 0.05) return;

            const key = `random:${message.guild.id}:${message.author.id}`;
            const now = Date.now();

            if (now - (cooldowns.get(key) || 0) < 60000) return;

            try {
              const settings = await getSettings(message.guild.id);

              if (!settings.random_reply) return;

              cooldowns.set(key, now);

              const answer = await askAI({
                guildId: message.guild.id,
                userId: message.author.id,
                question: message.content,
                useHistory: false
              });

              await message.reply({
                content: answer.slice(0, 1900),
                allowedMentions: {
                  parse: [],
                  repliedUser: false
                }
              });
            } catch (error) {
              safeError('RANDOM REPLY', error);
            }
          });

          // =====================================================
          // STARTUP
          // =====================================================

          client.once(Events.ClientReady, async readyClient => {
            console.log('✅ Online:', readyClient.user.tag);

            updatePresence();

            try {
              const rest = new REST({ version: '10' }).setToken(CONFIG.token);

              if (CONFIG.testGuildId) {
                await rest.put(
                  Routes.applicationGuildCommands(
                    readyClient.user.id,
                    CONFIG.testGuildId
                  ),
                  { body: commands }
                );

                console.log(
                  `✅ Registered ${commands.length} guild commands`
                );
              } else {
                await rest.put(
                  Routes.applicationCommands(readyClient.user.id),
                  { body: commands }
                );

                console.log(
                  `✅ Registered ${commands.length} global commands`
                );
              }
            } catch (error) {
              safeError('REGISTER COMMANDS', error);
            }

            await checkReminders();
            setInterval(checkReminders, 15000);
          });

          if (!CONFIG.token) {
            console.error('❌ Missing TOKEN');
            process.exit(1);
          }

          client.login(CONFIG.token).catch(error => {
            safeError('DISCORD LOGIN', error);
            process.exit(1);
          });
          EOF

          node --check index.js

      - name: Run bot
        run: npm start
