- name: Run Restream Service
  run: |
    # ... (giữ nguyên phần trên) ...

    while true; do
      echo "🎬 Decrypting DRM & Re-encoding Stream..."
      
      rm -f /dev/shm/hls/axn/*.ts /dev/shm/hls/axn/*.m3u8
      
      cat << 'MASTER_EOF' > /dev/shm/hls/axn/master.m3u8
    #EXTM3U
    #EXT-X-VERSION:3
    #EXT-X-STREAM-INF:BANDWIDTH=1500000,RESOLUTION=1280x720
    index.m3u8
    MASTER_EOF

      # FIX: Đồng bộ keyframe + GOP + segment duration
      ffmpeg -y -hide_banner -loglevel warning -stats \
        -user_agent "$USER_AGENT" \
        -headers "Referer: https://mytvnet.vn/" \
        -cenc_decryption_key "$CLEARKEY" \
        -i "$STREAM_MPD" \
        -map 0:v:0 -map 0:a:0 \
        -vf "scale=1280:720,fps=25" \
        -c:v libx264 -preset veryfast -tune zerolatency \
        -g 50 -keyint_min 50 -sc_threshold 0 \
        -b:v 1500k -maxrate 2000k -bufsize 4000k \
        -c:a aac -b:a 128k -ar 48000 -ac 2 \
        -max_muxing_queue_size 2048 \
        -f hls \
        -hls_time 2 \
        -hls_list_size 10 \
        -hls_flags delete_segments+omit_endlist+independent_segments \
        -hls_segment_type mpegts \
        -hls_segment_filename "/dev/shm/hls/axn/seg_%05d.ts" \
        /dev/shm/hls/axn/index.m3u8 || true

      echo "⚠️ Stream reconnecting in 3 seconds..."
      sleep 3
    done
