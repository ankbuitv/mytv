name: CHRTV AXN Restream (Fixed Sync - Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Configure Nginx For HLS
        run: |
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls
          sudo tee /tmp/nginx.conf > /dev/null << 'EOF'
          worker_processes auto;
          events { worker_connections 2048; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65s;
              server {
                  listen 5000;
                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate";
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                  }
              }
          }
          EOF
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Restream & Fixed Port Tunnel
        run: |
          # ====================================================
          # 🔑 THÔNG SỐ CỐ ĐỊNH
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT=18080
          # ====================================================

          mkdir -p /dev/shm/hls/axn
          rm -rf /dev/shm/hls/axn/*

          printf "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:BANDWIDTH=2000000\nindex.m3u8\n" > /dev/shm/hls/axn/master.m3u8

          echo "► Đang kết nối Bore tới cổng $TARGET_PORT..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $TARGET_PORT >> bore.log 2>&1
              echo "⚠ Bore ngắt kết nối, đang thử nối lại..."
              sleep 3
            done
          ) &
          sleep 5

          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo -e "\n► Đã cập nhật DuckDNS ($BORE_IP) cho domain ${DUCKDNS_DOMAIN}.duckdns.org"
          else
            echo "❌ Không lấy được IP của bore.pub!"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${TARGET_PORT}"

          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "👉 STREAM URL : ${PUBLIC_URL}/hls/axn/master.m3u8"
          echo "===================================================="

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # ====================================================
          # 🎬 FFMPEG - GIỮ NGUYÊN QUAN HỆ THỜI GIAN VIDEO/AUDIO
          # (copyts + start_at_zero => fix triệt để lệch tiếng/hình)
          # ====================================================
          while true; do
            echo "► Đang chạy FFmpeg (Sync Fixed Mode)..."
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "$USER_AGENT" \
              -analyzeduration 10000000 -probesize 10000000 \
              -fflags +discardcorrupt \
              -thread_queue_size 8192 \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_on_network_error 1 \
              -reconnect_on_http_error 404,408,429,500,502,503,504 \
              -reconnect_delay_max 5 \
              -rw_timeout 15000000 \
              -cenc_decryption_key "$CLEARKEY" \
              -copyts -start_at_zero \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -c:v libx264 -preset veryfast -tune zerolatency \
                -profile:v main -level 4.0 \
                -b:v 2500k -maxrate 3000k -bufsize 5000k \
                -g 50 -keyint_min 50 -sc_threshold 0 \
                -force_key_frames "expr:gte(t,n_forced*2)" \
                -r 25 \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -af "aresample=async=1:min_hard_comp=0.100000:first_pts=0" \
              -fps_mode cfr \
              -max_muxing_queue_size 1024 \
              -muxdelay 0 -muxpreload 0 \
              -f hls \
              -hls_time 2 \
              -hls_list_size 20 \
              -hls_delete_threshold 10 \
              -hls_flags delete_segments+omit_endlist+temp_file+independent_segments \
              -hls_segment_type mpegts \
              -hls_segment_filename "/dev/shm/hls/axn/seg%06d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠ FFmpeg ngắt kết nối. Đang khởi động lại sau 3 giây..."
            sleep 3
          done
