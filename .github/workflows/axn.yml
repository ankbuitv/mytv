name: axn-hls-restream

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: 'DASH/CENC MPD URL'
        required: true
      clearkey_hex:
        description: 'ClearKey (Dạng KEY Hex 32 ký tự hoặc KID:KEY)'
        required: true

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare HLS output directory
        run: |
          mkdir -p /dev/shm/hls/axn
          chmod 755 /dev/shm/hls/axn

      - name: Start resilient FFmpeg loop
        env:
          MPD_URL: ${{ github.event.inputs.mpd_url }}
          CLEARKEY_INPUT: ${{ github.event.inputs.clearkey_hex }}
        shell: bash
        run: |
          set -euo pipefail

          HLS_DIR="/dev/shm/hls/axn"
          mkdir -p "$HLS_DIR"

          # Tách tự động lấy phần KEY đằng sau nếu người dùng nhập dạng KID:KEY
          if [[ "$CLEARKEY_INPUT" == *":"* ]]; then
            DEC_KEY=$(echo "$CLEARKEY_INPUT" | awk -F':' '{print $NF}')
          else
            DEC_KEY="$CLEARKEY_INPUT"
          fi

          while true; do
            echo "[axn] Starting FFmpeg Engine at $(date -u +%FT%TZ)"
            rm -f "$HLS_DIR"/index.m3u8 "$HLS_DIR"/*.ts

            ffmpeg -hide_banner -loglevel warning -stats \
              -fflags +genpts+discardcorrupt+igndts \
              -err_detect ignore_err \
              -reorder_queue_size 1024 \
              -flags +low_delay \
              -analyzeduration 10M -probesize 10M \
              -cenc_decryption_key "$DEC_KEY" \
              -i "$MPD_URL" \
              -map 0:v:0? -map 0:a:0? \
              -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -profile:v main -level 4.0 \
              -b:v 2500k -maxrate 2500k -bufsize 5000k \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -vf "fps=25,setpts=PTS-STARTPTS" \
              -af "aresample=async=1000:min_hard_comp=0.100000:first_pts=0,asetpts=PTS-STARTPTS" \
              -g 50 -keyint_min 50 -force_key_frames "expr:gte(t,n_forced*2)" -sc_threshold 0 \
              -hls_time 2 -hls_list_size 10 -hls_delete_threshold 3 \
              -hls_segment_filename "$HLS_DIR/seg_%05d.ts" \
              -hls_flags delete_segments+omit_endlist+discont_start+append_list \
              -f hls "$HLS_DIR/index.m3u8" || true

            echo "[axn] FFmpeg exited/reconnecting. Retrying in 3 seconds..."
            sleep 3
          done
