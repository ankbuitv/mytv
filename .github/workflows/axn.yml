name: AXN Fast Remux → HLS

on:
  workflow_dispatch:

jobs:
  remux:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install FFmpeg + Bore
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

          curl -fsSL \
            https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz

          sudo install -m 755 bore /usr/local/bin/bore

      - name: Prepare HLS
        run: |
          sudo mkdir -p /dev/shm/hls
          sudo chmod 777 /dev/shm/hls

      - name: Start HLS server
        run: |
          cd /dev/shm/hls

          python3 -m http.server 5000 \
            > /tmp/http.log 2>&1 &

          bore local 5000 --to bore.pub --port 30117 \
            > /tmp/bore.log 2>&1 &

          sleep 5

          echo "===== Bore ====="
          cat /tmp/bore.log

      - name: Fast Remux
        INPUT_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
        run: |
          set -e

          rm -rf /dev/shm/hls/*

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -user_agent "Dalvik/2.1.0" \
            -rw_timeout 15000000 \
            -fflags +genpts+discardcorrupt \
            -i "$INPUT_MPD" \
            -map 0:v:0? \
            -map 0:a:0? \
            -c copy \
            -f hls \
            -hls_time 2 \
            -hls_list_size 6 \
            -hls_flags delete_segments+append_list+omit_endlist \
            -hls_segment_type mpegts \
            /dev/shm/hls/index.m3u8
