name: AXN DASH ClearKey HLS Proxy - Bore 30117

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"
      PUBLIC_BASE_URL: "http://bore.pub:30117"
      HLS_DIR: "/tmp/axn-hls"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg
          ffmpeg -version | head -n 1

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Create AXN HLS Proxy Server Script
        shell: bash
        run: |
          cat << 'EOF' > /tmp/server.js
          const fs = require('fs');
          const http = require('http');
          const path = require('path');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL;
          const CLEARKEY_KEY = process.env.CLEARKEY_KEY;
          const USER_AGENT = process.env.USER_AGENT;
          const REFERER = process.env.REFERER;
          const PUBLIC_BASE_URL = (process.env.PUBLIC_BASE_URL || 'http://bore.pub:30117').replace(/\/$/, '');
          const HLS_DIR = process.env.HLS_DIR || '/tmp/axn-hls';
          const PLAYLIST = path.join(HLS_DIR, 'stream.m3u8');
          const SEGMENT_PATTERN = path.join(HLS_DIR, 'segment_%05d.ts');
          const IDLE_STOP_MS = 90_000;

          let ffmpeg = null;
          let idleTimer = null;
          let lastRequestAt = Date.now();

          process.on('uncaughtException', (err) => console.error('[uncaughtException]', err));
          process.on('unhandledRejection', (err) => console.error('[unhandledRejection]', err));

          function resetHlsDir() {
            fs.rmSync(HLS_DIR, { recursive: true, force: true });
            fs.mkdirSync(HLS_DIR, { recursive: true });
          }

          function ffmpegArgs() {
            const customHeaders = `Referer: ${REFERER}\r\nOrigin: https://mytvnet.vn\r\n`;
            return [
              '-hide_banner', '-loglevel', 'warning',
              '-user_agent', USER_AGENT,
              '-headers', customHeaders,
              '-cenc_decryption_key', CLEARKEY_KEY,
              '-fflags', '+genpts+discardcorrupt+nobuffer',
              '-i', MPD_URL,
              '-map', '0:v:0?', '-map', '0:a:0?',
              '-c:v', 'copy',
              '-bsf:v', 'h264_mp4toannexb,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',
              '-c:a', 'copy',
              '-bsf:a', 'setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',
              '-max_muxing_queue_size', '4096',
              '-muxdelay', '0.3',
              '-muxpreload', '0.3',
              '-avoid_negative_ts', 'make_zero',
              '-fps_mode', 'passthrough',
              '-f', 'hls',
              '-hls_time', '2',
              '-hls_list_size', '8',
              '-hls_flags', 'delete_segments+append_list+omit_endlist+independent_segments+program_date_time',
              '-hls_delete_threshold', '4',
              '-hls_segment_type', 'mpegts',
              '-hls_segment_filename', SEGMENT_PATTERN,
              PLAYLIST
            ];
          }

          function startFFmpeg() {
            if (ffmpeg && !ffmpeg.killed) return;
            resetHlsDir();
            console.log('[FFmpeg] Starting AXN DASH ClearKey -> HLS worker');
            ffmpeg = spawn('ffmpeg', ffmpegArgs(), { stdio: ['ignore', 'ignore', 'pipe'] });
            ffmpeg.stderr.on('data', (data) => console.error('[FFmpeg]', data.toString().trim()));
            ffmpeg.on('exit', (code, signal) => {
              console.warn(`[FFmpeg] exited code=${code} signal=${signal}`);
              ffmpeg = null;
              if (Date.now() - lastRequestAt < IDLE_STOP_MS) setTimeout(startFFmpeg, 1500);
            });
          }

          function scheduleIdleStop() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
              if (ffmpeg && Date.now() - lastRequestAt >= IDLE_STOP_MS) {
                console.log('[FFmpeg] No HLS clients recently. Stopping worker.');
                ffmpeg.kill('SIGKILL');
              }
            }, IDLE_STOP_MS + 1000);
          }

          function send(res, status, headers, body) {
            res.writeHead(status, headers);
            res.end(body);
          }

          function contentType(filePath) {
            if (filePath.endsWith('.m3u8')) return 'application/vnd.apple.mpegurl';
            if (filePath.endsWith('.ts')) return 'video/mp2t';
            return 'application/octet-stream';
          }

          const server = http.createServer((req, res) => {
            if (req.method !== 'GET' && req.method !== 'HEAD') return send(res, 405, {}, 'Method Not Allowed');
            req.socket?.setNoDelay(true);
            req.socket?.on('error', (err) => console.warn('[Socket]', err.message));
            res.on('error', (err) => console.warn('[Response]', err.message));

            lastRequestAt = Date.now();
            scheduleIdleStop();
            startFFmpeg();

            const urlPath = req.url === '/' ? '/stream.m3u8' : decodeURIComponent(req.url.split('?')[0]);
            const safeName = path.basename(urlPath);
            const filePath = path.join(HLS_DIR, safeName);

            if (!['stream.m3u8', ...fs.readdirSync(HLS_DIR).filter((name) => /^segment_\d+\.ts$/.test(name))].includes(safeName)) {
              return send(res, 404, { 'Access-Control-Allow-Origin': '*' }, 'Not Found');
            }

            if (!fs.existsSync(filePath)) {
              return send(res, 503, {
                'Content-Type': 'text/plain; charset=utf-8',
                'Cache-Control': 'no-store',
                'Access-Control-Allow-Origin': '*',
                'Retry-After': '2'
              }, `HLS is warming up. Open ${PUBLIC_BASE_URL}/stream.m3u8 again in a few seconds.\n`);
            }

            const headers = {
              'Content-Type': contentType(filePath),
              'Cache-Control': filePath.endsWith('.m3u8') ? 'no-cache, no-store, must-revalidate' : 'public, max-age=20',
              'Access-Control-Allow-Origin': '*',
              'X-Accel-Buffering': 'no'
            };
            if (req.method === 'HEAD') return send(res, 200, headers, '');
            fs.createReadStream(filePath).on('error', () => send(res, 404, headers, 'Not Found')).pipe(res.writeHead(200, headers));
          });

          server.keepAliveTimeout = 0;
          server.headersTimeout = 0;
          server.timeout = 0;
          server.listen(5000, '0.0.0.0', () => {
            console.log(`🚀 AXN HLS proxy ready locally. Public URL: ${PUBLIC_BASE_URL}/stream.m3u8`);
          });
          EOF

      - name: Start Public Bore Tunnel and HLS Proxy
        shell: bash
        run: |
          set -euo pipefail

          nohup node /tmp/server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 2

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..20}; do
            sleep 1
            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -eq 0 ]; then
            echo "❌ ERROR: Bore tunnel failed to publish port 30117."
            cat /tmp/bore.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ LINK STREAM HLS PUBLIC READY:"
          echo "👉 http://bore.pub:30117/stream.m3u8"
          echo "=================================================="

          while true; do
            if ! kill -0 "$(cat /tmp/proxy.pid)" 2>/dev/null; then
              echo "Proxy process died!"
              cat /tmp/proxy.log
              exit 1
            fi
            if ! kill -0 "$(cat /tmp/bore.pid)" 2>/dev/null; then
              echo "Bore process died!"
              cat /tmp/bore.log
              exit 1
            fi
            sleep 10
          done
