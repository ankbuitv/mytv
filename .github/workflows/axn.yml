name: Ultimate DASH Zero-PTS Proxy - Bore 30117

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          
          # Tải FFmpeg 6.x static build (bắt buộc để có setts BSF)
          echo "Installing FFmpeg 6.x static..."
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-6.*-amd64-static/ffmpeg /usr/local/bin/ffmpeg
          sudo cp /tmp/ffmpeg-6.*-amd64-static/ffprobe /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version | head -n 1

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs

          # Cài đặt Bore Tunnel
          echo "Installing Bore..."
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Create Production Proxy Server Script
        shell: bash
        run: |
          cat << 'EOF' > /tmp/server.js
          const http = require('http');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL || "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd";
          const CLEARKEY_KEY = process.env.CLEARKEY_KEY || "6f1c09c035eab36323d60d1454db3d20";
          const USER_AGENT = process.env.USER_AGENT || "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36";
          const REFERER = process.env.REFERER || "https://mytvnet.vn/";

          const CHANNELS = new Map();

          function buildFFmpegArgs(mpdUrl, key) {
            const customHeaders = `Referer: ${REFERER}\r\nOrigin: https://mytvnet.vn\r\n`;
            return [
              '-hide_banner', '-loglevel', 'warning',
              '-user_agent', USER_AGENT,
              '-headers', customHeaders,
              '-cenc_decryption_key', key,
              '-fflags', '+genpts+discardcorrupt+nobuffer',
              '-i', mpdUrl,
              '-map', '0:v:0?', '-map', '0:a:0?',
              
              '-c:v', 'copy',
              '-bsf:v', 'h264_mp4toannexb,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',
              '-c:a', 'copy',
              '-bsf:a', 'setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',
              
              '-max_muxing_queue_size', '4096',
              '-max_interleave_delta', '0',
              '-muxdelay', '0', '-muxpreload', '0', '-max_delay', '0',
              '-avoid_negative_ts', 'make_zero',
              '-fps_mode', 'passthrough',
              '-f', 'mpegts',
              '-mpegts_flags', '+resend_headers+pat_pmt_at_frames+initial_discontinuity',
              '-mpegts_copyts', '0',
              '-pcr_period', '20',
              '-pat_period', '0.1',
              '-pmt_period', '0.1',
              'pipe:1'
            ];
          }

          function spawnFFmpegProcess(id, entry) {
            console.log(`[FFmpeg] Spawning process for channel: ${id}`);
            const proc = spawn('ffmpeg', buildFFmpegArgs(MPD_URL, CLEARKEY_KEY), {
              stdio: ['ignore', 'pipe', 'pipe']
            });

            entry.proc = proc;

            proc.stderr.on('data', (d) => console.error(`[FFmpeg Log]`, d.toString().trim()));

            proc.stdout.on('data', (chunk) => {
              const slowClients = [];
              
              for (const res of entry.clients) {
                const ok = res.write(chunk);
                if (!ok) {
                  slowClients.push(res);
                }
              }

              // Xử lý client chậm SAU KHI đã loop xong để tránh mutate Set trong lúc Iterate
              for (const res of slowClients) {
                console.warn(`[Proxy] Client network slow, destroying socket.`);
                res.socket.destroy();
                entry.clients.delete(res);
              }
            });

            proc.on('exit', (code, signal) => {
              console.warn(`[FFmpeg] Exited code=${code}, signal=${signal}`);
              // Nếu vẫn còn client và không phải bị kill thủ công, restart FFmpeg
              if (entry.clients.size > 0 && !entry.manualKill) {
                console.log(`[FFmpeg] Auto-restarting in 1.5s...`);
                setTimeout(() => spawnFFmpegProcess(id, entry), 1500);
              } else {
                CHANNELS.delete(id);
              }
            });

            return proc;
          }

          function getOrCreateChannel(id) {
            if (CHANNELS.has(id)) return CHANNELS.get(id);
            
            const entry = {
              proc: null,
              clients: new Set(),
              manualKill: false
            };
            
            spawnFFmpegProcess(id, entry);
            CHANNELS.set(id, entry);
            return entry;
          }

          const server = http.createServer((req, res) => {
            console.log(`[Client Connected] ${req.url}`);

            res.writeHead(200, {
              'Content-Type': 'video/mp2t',
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Connection': 'close', // Bắt buộc cho Live Stream
              'Access-Control-Allow-Origin': '*',
              'X-Accel-Buffering': 'no'
            });

            if (req.socket) {
              req.socket.setNoDelay(true);
            }

            // Join thẳng vào live edge, không dùng Ring Buffer
            const channelEntry = getOrCreateChannel('axn');
            channelEntry.clients.add(res);

            req.on('close', () => {
              console.log(`[Client Disconnected]`);
              channelEntry.clients.delete(res);
              if (channelEntry.clients.size === 0) {
                console.log(`[FFmpeg] No active clients. Stopping process...`);
                channelEntry.manualKill = true;
                if (channelEntry.proc) channelEntry.proc.kill('SIGKILL');
                CHANNELS.delete('axn');
              }
            });
          });

          server.keepAliveTimeout = 0;
          server.headersTimeout = 0;
          server.timeout = 0;

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 Ultimate Restream Proxy running on port 5000');
          });
          EOF

      - name: Start Services & Health Check
        shell: bash
        run: |
          set -euo pipefail

          nohup node /tmp/server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 2

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..20}; do
            sleep 1
            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -eq 0 ]; then
            echo "❌ ERROR: Bore tunnel failed to connect."
            cat /tmp/bore.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ LINK STREAM MPEG-TS ĐÃ SẴN SÀNG:"
          echo "👉 http://bore.pub:30117/stream.ts"
          echo "=================================================="

          while true; do
            if ! kill -0 $(cat /tmp/proxy.pid) 2>/dev/null; then 
              echo "Proxy process died!"
              cat /tmp/proxy.log
              exit 1
            fi
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then 
              echo "Bore process died!"
              cat /tmp/bore.log
              exit 1
            fi
            sleep 10
          done
