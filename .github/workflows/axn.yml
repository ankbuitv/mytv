name: HLS Restream ABR - AXN HD (SSHX Debug)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://shtvgo-prod.gcdn.co/bpk-tv/AXNHD/output/manifest.mpd"
      CLEARKEY_KEY: "4db68809e6795408417128abbb32dba0"
      USER_AGENT: "VLC/3.0.20 LibVLC/3.0.20"
      REFERER: "https://www.starhubtvplus.com/"
      BORE_PORT: "30123"
      HLS_DIR: "/dev/shm/hls/axnhd"
      PROXY_SG: "http://139.162.11.41:3128"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg net-tools

          # Tải Bore Tunnel
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          # Tạo thư mục tạm RAM Disk
          mkdir -p "${HLS_DIR}/1080p" "${HLS_DIR}/720p"

      - name: Start SSHX Web Terminal (Live Debug)
        shell: bash
        run: |
          echo "=================================================="
          echo "🚀 Đang khởi tạo SSHX Session..."
          echo "=================================================="
          # Cài đặt và khởi chạy sshx trong background
          curl -sSf https://sshx.io/get | sh
          nohup sshx > /tmp/sshx.log 2>&1 &
          
          # Đợi sshx lấy URL kết nối
          sleep 3
          echo "👉 TRUY CẬP TERMINAL TRỰC TIẾP TẠI LINK NÀY:"
          cat /tmp/sshx.log | grep -o 'https://sshx.io/s/[^ ]*' || cat /tmp/sshx.log
          echo "=================================================="

      - name: Create HLS Server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/axnhd';

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');
            res.setHeader('Access-Control-Expose-Headers', '*');
            res.setHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
            res.setHeader('Connection', 'keep-alive');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let fileName = req.url.split('?')[0].replace('/', '');
            if (!fileName || fileName === '') fileName = 'index.m3u8';

            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            const lowerName = fileName.toLowerCase();
            if (lowerName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (lowerName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            const stream = fs.createReadStream(filePath);
            stream.pipe(res);
            stream.on('error', () => {
              if (!res.headersSent) res.writeHead(500);
              res.end();
            });
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 HLS Server running on port 5000...');
          });
          EOF

      - name: Start Services & FFmpeg ABR Stream Copy
        shell: bash
        run: |
          # 1. Khởi chạy HTTP Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # 2. Khởi chạy FFmpeg kéo luồng qua Proxy Singapore
          start_ffmpeg() {
            echo "🎬 [FFmpeg Engine] Đang kết nối AXN HD qua Proxy Singapore (${PROXY_SG})..."
            CUSTOM_HEADERS="Referer: ${REFERER}"$'\r\n'

            nohup ffmpeg -hide_banner -loglevel warning \
              -http_proxy "$PROXY_SG" \
              -user_agent "$USER_AGENT" \
              -headers "$CUSTOM_HEADERS" \
              -reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 \
              -reconnect_on_http_error 403,429,500,502,503,504 \
              -reconnect_delay_max 5 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -fflags +genpts+discardcorrupt+igndts \
              -i "$MPD_URL" \
              -map 0:v:3 -map 0:a:0 \
              -map 0:v:2 -map 0:a:0 \
              -c:v:0 copy -bsf:v:0 h264_mp4toannexb \
              -c:v:1 copy -bsf:v:1 h264_mp4toannexb \
              -c:a:0 aac -b:a:0 128k -ar 44100 -ac 2 \
              -c:a:1 aac -b:a:1 96k -ar 44100 -ac 2 \
              -f hls \
              -hls_time 2 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments \
              -master_pl_name index.m3u8 \
              -var_stream_map "v:0,a:0,name:1080p v:1,a:1,name:720p" \
              -hls_segment_filename "${HLS_DIR}/%v/segment_%03d.ts" \
              "${HLS_DIR}/%v/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &

            echo $! > /tmp/ffmpeg.pid
          }

          start_ffmpeg

          # 3. Khởi tạo Bore Tunnel
          start_bore() {
            echo "🌐 Đang mở kết nối Bore Tunnel tại port ${BORE_PORT}..."
            rm -f /tmp/bore.log
            nohup bore local 5000 --to bore.pub --port "${BORE_PORT}" > /tmp/bore.log 2>&1 &
            echo $! > /tmp/bore.pid
          }

          start_bore

          echo "=================================================="
          echo "👉 MASTER ABR STREAM URL: http://bore.pub:${BORE_PORT}/index.m3u8"
          echo "=================================================="

          echo "⏳ Đang kiểm tra khởi tạo HLS Stream..."
          STREAM_READY=0
          for i in {1..60}; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              STREAM_READY=1
              echo "✅ HLS ABR Stream Sẵn Sàng!"
              break
            fi

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "❌ FFmpeg bị sập! Chi tiết log:"
              echo "---------------- FFMPEG LOG ----------------"
              cat /tmp/ffmpeg.log || true
              echo "--------------------------------------------"
              exit 1
            fi

            sleep 1
          done

          if [ "$STREAM_READY" -ne 1 ]; then
            echo "❌ Không tạo được file index.m3u8 sau 60s. Log FFmpeg:"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

          # 4. Vòng lặp giám sát
          START_TIME=$(date +%s)
          LIMIT_SECONDS=21540  # 5 giờ 59 phút

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            if [ "$ELAPSED" -ge "$LIMIT_SECONDS" ]; then
              echo "⏰ Hết ca làm việc (5h59m)..."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] FFmpeg ngắt kết nối! Khởi chạy lại..."
              start_ffmpeg
              sleep 5
            fi

            if ! kill -0 "$(cat /tmp/bore.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] Bore Tunnel bị rớt! Kết nối lại..."
              start_bore
              sleep 5
            fi

            find "${HLS_DIR}" -type f -name 'segment_*.ts' -mmin +5 -delete 2>/dev/null || true
            sleep 10
          done
