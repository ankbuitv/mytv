name: CHRTV AXN Restream (Fixed Cloudflare Domain Engine)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl tar
          # Cài cloudflared chính chủ
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure Nginx for Real HLS
        run: |
          sudo rm -rf /dev/shm/hls/axn
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm/hls/axn;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      
                      types {
                          application/vnd.apple.mpegurl m3u8;
                          video/mp2t ts;
                      }
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream & Cloudflare Fixed Tunnel
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          CLEARKEY: ${{ secrets.CLEARKEY }}
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
        run: |
          # 1. Kích hoạt Cloudflare Fixed Tunnel bằng Token
          echo "🚀 Connecting Fixed Cloudflare Tunnel..."
          cloudflared tunnel --no-autoupdate run --token "${CF_TUNNEL_TOKEN}" > /dev/null 2>&1 &
          sleep 3

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 2. FFmpeg HLS Pass-through (-c copy) -> CPU ~0%, Live continuous
          while true; do
            echo "🚀 Starting FFmpeg Zero-CPU HLS Stream..."
            DEC_KEY="$(echo "${CLEARKEY}" | awk -F':' '{print $NF}')"

            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -cenc_decryption_key "${DEC_KEY}" \
              -fflags +genpts+discardcorrupt+igndts \
              -rw_timeout 10000000 \
              -probesize 10000000 -analyzeduration 10000000 \
              -i "${STREAM_MPD}" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy \
              -c:a copy \
              -f hls \
              -hls_time 3 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments \
              -hls_segment_filename "/dev/shm/hls/axn/seg%05d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠️ FFmpeg restarted in 2s..."
            sleep 2
          done
