name: CHRTV AXN Restream (Nginx M3U8 + Auto Cloudflare DNS)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar jq
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/bore

      - name: Configure Nginx & Create Static M3U8
        run: |
          sudo rm -rf /dev/shm/stream
          sudo mkdir -p /dev/shm/stream
          sudo chmod -R 777 /dev/shm/stream

          # 1. Tạo file index.m3u8 cố định trỏ vào axn.ts
          cat << 'EOF' | sudo tee /dev/shm/stream/index.m3u8 > /dev/null
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-TARGETDURATION:10
          #EXT-X-MEDIA-SEQUENCE:0
          #EXTINF:10.0,
          axn.ts
          EOF

          # 2. Cấu hình Nginx
          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm/stream;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      
                      types {
                          application/vnd.apple.mpegurl m3u8;
                          video/mp2t ts;
                      }
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream & Auto Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
          CLEARKEY: ${{ secrets.CLEARKEY }}
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT: "18080"
        run: |
          # 1. Bật Bore Tunnel nối cổng 5000 ra Target Port
          (while true; do bore local 5000 --to bore.pub --port "${TARGET_PORT}" >> /tmp/bore.log 2>&1; sleep 2; done) &
          sleep 3

          # 2. TỰ ĐỘNG CẬP NHẬT CLOUDFLARE DNS (MÂY XÁM - DNS ONLY ĐỂ KHÔNG BỊ BÓP PORT 18080)
          echo "🌐 Updating Cloudflare DNS for ${CF_SUBDOMAIN}..."
          
          # Tìm Record ID hiện tại trên Cloudflare
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_SUBDOMAIN}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')

          if [ "$RECORD_ID" != "null" ] && [ -n "$RECORD_ID" ]; then
            # Cập nhật CNAME Record trỏ về bore.pub (proxied: false để dùng port 18080 thoải mái)
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"bore.pub\",\"ttl\":120,\"proxied\":false}" > /dev/null
            echo "✅ Cloudflare DNS updated successfully!"
          else
            # Nếu chưa có thì tạo mới
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"bore.pub\",\"ttl\":120,\"proxied\":false}" > /dev/null
            echo "✅ Created new Cloudflare DNS Record!"
          fi

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 3. Chạy FFmpeg Direct Copy
          while true; do
            echo "🚀 Starting Direct MPEG-TS Stream to RAM..."
            
            DEC_KEY="$(echo "${CLEARKEY}" | awk -F':' '{print $NF}')"

            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -cenc_decryption_key "${DEC_KEY}" \
              -fflags +genpts+discardcorrupt+igndts \
              -rw_timeout 10000000 \
              -probesize 10000000 -analyzeduration 10000000 \
              -i "${STREAM_MPD}" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy \
              -c:a copy \
              -f mpegts \
              "/dev/shm/stream/axn.ts" || true

            echo "⚠️ FFmpeg restarted in 2s..."
            sleep 2
          done
