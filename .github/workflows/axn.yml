name: CHRTV AXN Restream (N_m3u8DL-RE Pipe)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & N_m3u8DL-RE
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar wget grep
          # Tải tự động N_m3u8DL-RE bản Linux mới nhất từ Github API (tránh lỗi 404)
          curl -s https://api.github.com/repos/nilaoda/N_m3u8DL-RE/releases/latest \
          | grep "browser_download_url.*linux-x64.*tar.gz" \
          | head -n 1 \
          | cut -d '"' -f 4 \
          | wget -qi -
          tar -xzf N_m3u8DL-RE_Beta_linux-x64*.tar.gz
          find . -name "N_m3u8DL-RE" -type f -exec sudo cp {} /usr/local/bin/ \;
          sudo chmod +x /usr/local/bin/N_m3u8DL-RE
          
          # Tải Bore Tunnel & SSHX
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Configure Nginx For HLS
        run: |
          mkdir -p /dev/shm/hls/axn
          cat << 'EOF' | sudo tee /tmp/nginx.conf
          worker_processes auto;
          events { worker_connections 2048; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65s;
              keepalive_requests 10000;
              server {
                  listen 5000;
                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate";
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                      add_header Access-Control-Allow-Headers *;
                  }
              }
          }
          EOF
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Tunnel & Restream Service
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080
          
          sshx > sshx.log 2>&1 &
          sleep 2
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)
          
          (
          while true; do
            bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
            sleep 3
          done
          ) &
          sleep 5
          
          echo "Đang lấy IP của bore.pub..."
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "IP bore.pub: $BORE_IP - Đang cập nhật DuckDNS..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          else
            echo "Lỗi mạng, không lấy được IP bore.pub!"
          fi
          
          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"
          cat << M3U_EOF > /dev/shm/playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="AXN.vn" tvg-name="AXN HD" group-title="VN Live", AXN HD (N_m3u8DL-RE)
          ${PUBLIC_URL}/hls/axn/master.m3u8
          M3U_EOF
          
          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "🔑 SSHX URL : ${SSHX_URL}"
          echo "👉 STREAM URL : ${PUBLIC_URL}/hls/axn/master.m3u8"
          echo "===================================================="
          
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          CLEARKEY_KID="9d29f87efdec3c9fab368f724a62ad0e"
          CLEARKEY_KEY="6f1c09c035eab36323d60d1454db3d20"
          
          while true; do
            mkdir -p /dev/shm/hls/axn
            rm -f /dev/shm/hls/axn/*.ts /dev/shm/hls/axn/*.m3u8
            cat << 'MASTER_EOF' > /dev/shm/hls/axn/master.m3u8
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=2000000
          index.m3u8
          MASTER_EOF
          
          # Tạo pipe (đường ống) để N_m3u8DL-RE xuất dữ liệu thẳng sang FFmpeg
          rm -f stream.pipe
          mkfifo stream.pipe
          
          # 1. Chạy N_m3u8DL-RE ngầm, giải mã DRM và xuất MPEG-TS ra stream.pipe
          N_m3u8DL-RE "$STREAM_MPD" \
          --live-pipe-mux \
          --live-real-time-merge \
          --live-keep-segments false \
          --tmp-dir /dev/shm \
          -sv best -sa best \
          --key "${CLEARKEY_KID}:${CLEARKEY_KEY}" > stream.pipe 2>nre.log &
          NRE_PID=$!
          
          # Đợi 5 giây cho N_m3u8DL-RE tải được một chút dữ liệu
          sleep 5
          
          # 2. FFmpeg đọc từ stream.pipe. Copy Video, Re-encode Audio để fix DTS lỗi
          ffmpeg -y -hide_banner -loglevel error -stats -re \
          -fflags +genpts+discardcorrupt+igndts \
          -thread_queue_size 1024 \
          -i stream.pipe \
          -c:v copy \
          -c:a aac -b:a 128k -ar 48000 -ac 2 \
          -af "aresample=async=1000:first_pts=0" \
          -muxdelay 0 -muxpreload 0 \
          -f hls \
          -hls_time 4 \
          -hls_list_size 6 \
          -hls_flags delete_segments+omit_endlist+independent_segments+temp_file \
          -hls_segment_type mpegts \
          -hls_segment_filename "/dev/shm/hls/axn/seg_%03d.ts" \
          -start_number 1 \
          /dev/shm/hls/axn/index.m3u8 || true
          
          # Dọn dẹp nếu FFmpeg bị văng
          kill $NRE_PID || true
          rm -f stream.pipe
          
          echo "⚠ Reconnecting in 5s..."
          sleep 5
          done
