name: AXN DASH ClearKey -> HLS (Bore 30117) - High Performance

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""
      clearkey_key:
        description: "Override ClearKey hex key (optional)"
        required: false
        default: ""
      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""
      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "${{ secrets.CLEARKEY_KEY }}"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Resolve runtime env from workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          MPD_EFFECTIVE="${{ github.event.inputs.mpd_url }}"
          KEY_EFFECTIVE="${{ github.event.inputs.clearkey_key }}"
          UA_EFFECTIVE="${{ github.event.inputs.user_agent }}"
          REF_EFFECTIVE="${{ github.event.inputs.referer }}"

          if [ -z "${MPD_EFFECTIVE}" ]; then MPD_EFFECTIVE="${MPD_URL}"; fi
          if [ -z "${KEY_EFFECTIVE}" ]; then KEY_EFFECTIVE="${CLEARKEY_KEY}"; fi
          if [ -z "${UA_EFFECTIVE}" ]; then UA_EFFECTIVE="${USER_AGENT}"; fi
          if [ -z "${REF_EFFECTIVE}" ]; then REF_EFFECTIVE="${REFERER}"; fi

          if [ -z "${MPD_EFFECTIVE}" ] || [ -z "${KEY_EFFECTIVE}" ]; then
            echo "❌ MPD URL hoặc ClearKey bị rỗng"
            exit 1
          fi

          {
            echo "MPD_URL=${MPD_EFFECTIVE}"
            echo "CLEARKEY_KEY=${KEY_EFFECTIVE}"
            echo "USER_AGENT=${UA_EFFECTIVE}"
            echo "REFERER=${REF_EFFECTIVE}"
          } >> "$GITHUB_ENV"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates nodejs ffmpeg jq

      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Create Node HLS proxy server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL;
          const CLEARKEY_KEY = process.env.CLEARKEY_KEY;
          const USER_AGENT = process.env.USER_AGENT || 'Mozilla/5.0';
          const REFERER = process.env.REFERER || 'https://mytvnet.vn/';

          // Tối ưu I/O: Lưu HLS trực tiếp vào RAM Disk
          const HLS_DIR = '/dev/shm/hls';
          const PLAYLIST_FILE = path.join(HLS_DIR, 'stream.m3u8');
          const SEGMENT_PATTERN = path.join(HLS_DIR, 'segment_%05d.ts');
          const FFMPEG_LOG = '/tmp/ffmpeg.log';

          const LISTEN_HOST = '0.0.0.0';
          const LISTEN_PORT = 5000;
          const RESTART_DELAY_MS = 1500;

          let ffmpegProc = null;
          let restarting = false;

          function log(...args) {
            console.log(new Date().toISOString(), ...args);
          }

          function noCacheHeaders() {
            return {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0',
              'Access-Control-Allow-Origin': '*',
            };
          }

          function cleanHlsState() {
            fs.mkdirSync(HLS_DIR, { recursive: true });
            try {
              const names = fs.readdirSync(HLS_DIR);
              for (const name of names) {
                fs.rmSync(path.join(HLS_DIR, name), { force: true });
              }
            } catch {}
          }

          function buildFfmpegArgs() {
            const headers = `Referer: ${REFERER}\r\nOrigin: https://mytvnet.vn\r\n`;

            return [
              '-hide_banner',
              '-loglevel', 'warning',

              // Reconnect tối ưu
              '-reconnect', '1',
              '-reconnect_streamed', '1',
              '-reconnect_on_network_error', '1',
              '-reconnect_delay_max', '2',

              '-user_agent', USER_AGENT,
              '-headers', headers,
              '-cenc_decryption_key', CLEARKEY_KEY,

              // Sửa lỗi Timestamp hỏng từ luồng gốc
              '-fflags', '+genpts+discardcorrupt+igndts',
              '-i', MPD_URL,

              // 1. VIDEO: Copy nguyên bản, không tốn CPU
              '-c:v', 'copy',

              // 2. AUDIO: Transcode nhẹ sang AAC & Ép đồng bộ từng ms với Video
              '-c:a', 'aac',
              '-b:a', '128k',
              '-ac', '2',
              '-af', 'aresample=async=1000',

              // 3. HLS OUTPUT (Segment 4s để chứa đủ Keyframe)
              '-f', 'hls',
              '-hls_time', '4',
              '-hls_list_size', '5',
              '-hls_flags', 'delete_segments+omit_endlist+independent_segments',
              '-hls_segment_filename', SEGMENT_PATTERN,
              PLAYLIST_FILE
            ];
          }

          function startFfmpeg() {
            if (ffmpegProc) return;
            cleanHlsState();

            const args = buildFfmpegArgs();
            log('[FFmpeg] Đang khởi chạy với chế độ Sync Timestamp...');

            ffmpegProc = spawn('ffmpeg', args, { stdio: ['ignore', 'ignore', 'pipe'] });

            ffmpegProc.stderr.on('data', (chunk) => {
              try { fs.appendFileSync(FFMPEG_LOG, chunk.toString()); } catch {}
            });

            ffmpegProc.on('exit', (code, signal) => {
              log(`[FFmpeg] Exited code=${code}`);
              ffmpegProc = null;
              scheduleRestart();
            });
          }

          function stopFfmpeg() {
            if (!ffmpegProc) return;
            try { ffmpegProc.kill('SIGKILL'); } catch {}
            ffmpegProc = null;
          }

          function scheduleRestart() {
            if (restarting) return;
            restarting = true;
            setTimeout(() => {
              restarting = false;
              if (!ffmpegProc) startFfmpeg();
            }, RESTART_DELAY_MS);
          }

          function serveFile(res, absPath, mimeType) {
            fs.stat(absPath, (err, st) => {
              if (err || !st.isFile() || st.size <= 0) {
                res.writeHead(404, noCacheHeaders());
                res.end('Not found');
                return;
              }

              res.writeHead(200, {
                'Content-Type': mimeType,
                'Content-Length': st.size,
                ...noCacheHeaders(),
              });

              fs.createReadStream(absPath).pipe(res);
            });
          }

          const server = http.createServer((req, res) => {
            const url = new URL(req.url, 'http://localhost');
            const pathname = url.pathname;

            if (pathname === '/healthz') {
              const ok = fs.existsSync(PLAYLIST_FILE);
              res.writeHead(ok ? 200 : 530, noCacheHeaders());
              res.end(JSON.stringify({ ok }));
              return;
            }

            if (pathname === '/stream.m3u8') {
              serveFile(res, PLAYLIST_FILE, 'application/vnd.apple.mpegurl');
              return;
            }

            if (/^\/segment_\d+\.ts$/.test(pathname)) {
              serveFile(res, path.join(HLS_DIR, path.basename(pathname)), 'video/mp2t');
              return;
            }

            res.writeHead(404, noCacheHeaders());
            res.end('Not found');
          });

          startFfmpeg();

          server.listen(LISTEN_PORT, LISTEN_HOST, () => {
            log(`HLS Server: http://${LISTEN_HOST}:${LISTEN_PORT}/stream.m3u8`);
          });
          EOF

      - name: Start proxy and validate local HLS readiness
        shell: bash
        run: |
          set -euo pipefail
          nohup node /tmp/hls_server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 3

          READY=0
          for i in {1..60}; do
            if test -s /dev/shm/hls/stream.m3u8; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ HLS không sẵn sàng"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

      - name: Start Bore and keep stream alive
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid
          sleep 3

          echo "=================================================="
          echo "HLS STREAM READY (Tối ưu Sync Video + RAM Disk)"
          echo "http://bore.pub:30117/stream.m3u8"
          echo "=================================================="

          while true; do
            if ! kill -0 "$(cat /tmp/proxy.pid)" 2>/dev/null; then
              echo "❌ Node proxy process died"
              exit 1
            fi
            sleep 10
          done
