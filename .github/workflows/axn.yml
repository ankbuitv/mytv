name: CHRTV AXN Restream (Cloudflare Tunnel + Zero-CPU HLS)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl tar
          # Cài đặt Cloudflare Tunnel (cloudflared) chính chủ
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure Nginx for Real HLS
        run: |
          sudo rm -rf /dev/shm/hls/axn
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm/hls/axn;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      
                      types {
                          application/vnd.apple.mpegurl m3u8;
                          video/mp2t ts;
                      }
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream & Cloudflare Tunnel Engine
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
          CLEARKEY: ${{ secrets.CLEARKEY }}
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
        run: |
          # 1. Bật Cloudflare Quick Tunnel forward cổng 5000 của Nginx
          echo "🚀 Starting Cloudflare Tunnel..."
          cloudflared tunnel --url http://localhost:5000 > /tmp/tunnel.log 2>&1 &
          sleep 8

          # Tách lấy URL Tunnel HTTPS công cộng do Cloudflare cấp
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)
          echo "🔗 Cloudflare Public Tunnel URL: ${TUNNEL_URL}"

          # 2. Cập nhật CNAME Cloudflare Domain (Mây cam Proxied) trỏ vào Quick Tunnel
          if [ -n "${TUNNEL_URL}" ]; then
            TUNNEL_HOST=$(echo "${TUNNEL_URL}" | sed 's/https:\/\///')
            echo "🌐 Updating Cloudflare CNAME Record for ${CF_SUBDOMAIN} -> ${TUNNEL_HOST}..."
            
            RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_SUBDOMAIN}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | jq -r '.result[0].id')

            if [ "$RECORD_ID" != "null" ] && [ -n "$RECORD_ID" ]; then
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":120,\"proxied\":true}" > /dev/null
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":120,\"proxied\":true}" > /dev/null
            fi
            echo "✅ DNS updated successfully!"
          fi

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 3. Chạy FFmpeg Pass-Through HLS (-c copy) -> Cực mát CPU, phát Live chuẩn 100%
          while true; do
            echo "🚀 Starting FFmpeg Zero-CPU HLS Stream..."
            DEC_KEY="$(echo "${CLEARKEY}" | awk -F':' '{print $NF}')"

            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -cenc_decryption_key "${DEC_KEY}" \
              -fflags +genpts+discardcorrupt+igndts \
              -rw_timeout 10000000 \
              -probesize 10000000 -analyzeduration 10000000 \
              -i "${STREAM_MPD}" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy \
              -c:a copy \
              -f hls \
              -hls_time 3 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments \
              -hls_segment_filename "/dev/shm/hls/axn/seg%05d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠️ FFmpeg restarted in 2s..."
            sleep 2
          done
