name: IPTV Restream Server - AXN HD (Direct MPEG-TS Stream)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl dnsutils
          pip install --no-cache-dir flask flask-cors gunicorn

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Generate Direct Stream Web Server (Flask)
        run: |
          cat << 'EOF' > app.py
          import subprocess
          from flask import Flask, Response, make_response, send_from_directory
          from flask_cors import CORS

          app = Flask(__name__)
          CORS(app, resources={r"/*": {"origins": "*"}})

          CLEARKEY = "6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD = "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"

          @app.route("/")
          def index():
              return "IPTV Direct MPEG-TS Restream Server Running!", 200

          @app.route("/playlist.m3u")
          def playlist():
              response = make_response(send_from_directory(".", "playlist.m3u"))
              response.headers["Content-Type"] = "audio/x-mpegurl"
              response.headers["Access-Control-Allow-Origin"] = "*"
              return response

          @app.route("/live.ts")
          def live_stream():
              def generate():
                  ffmpeg_cmd = [
                      "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                      "-reconnect", "1", "-reconnect_at_eof", "1", "-reconnect_streamed", "1", "-reconnect_delay_max", "3",
                      "-user_agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "-headers", "Referer: https://mytvnet.vn/\r\n",
                      "-fflags", "+genpts+discardcorrupt+nobuffer",
                      "-cenc_decryption_key", CLEARKEY,
                      "-i", STREAM_MPD,
                      "-map", "0:v:0", "-map", "0:a:0",
                      "-c:v", "libx264", "-preset", "ultrafast", "-tune", "zerolatency",
                      "-b:v", "2500k", "-maxrate", "3000k", "-bufsize", "6000k",
                      "-r", "25", "-g", "25",
                      "-c:a", "aac", "-b:a", "128k", "-ar", "48000", "-ac", "2",
                      "-f", "mpegts", "pipe:1"
                  ]
                  proc = subprocess.Popen(ffmpeg_cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, bufsize=1024*1024)
                  try:
                      while True:
                          data = proc.stdout.read(64 * 1024)
                          if not data:
                              break
                          yield data
                  finally:
                      proc.kill()

              response = Response(generate(), mimetype="video/MP2T")
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              return response

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          EOF

      - name: Generate Main Stream Script
        run: |
          cat << 'EOF' > start_stream.sh
          #!/bin/bash

          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 3
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)

          echo "🌐 Starting Bore Tunnel on Port ${BORE_PORT}..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
              sleep 3
            done
          ) &
          sleep 4

          # Update IP for DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}" > /dev/null
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # Create Playlist M3U (Trỏ thẳng vào luồng MPEG-TS Direct)
          cat << M3U_EOF > playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="AXN.vn" tvg-name="AXN HD" group-title="VN Live", AXN HD (Direct Stream)
          ${PUBLIC_URL}/live.ts
          M3U_EOF

          echo "===================================================="
          echo "🌐 CHRTV DIRECT MPEG-TS SERVER IS ONLINE!"
          echo "🔑 SSHX TERMINAL URL : ${SSHX_URL}"
          echo "👉 PLAYLIST URL      : ${PUBLIC_URL}/playlist.m3u"
          echo "👉 DIRECT STREAM URL : ${PUBLIC_URL}/live.ts"
          echo "===================================================="

          echo "🚀 Starting Web Server (Gunicorn Multi-Worker)..."
          gunicorn -w 4 --threads 8 --timeout 0 --keep-alive 65 -b 0.0.0.0:5000 app:app
          EOF
          chmod +x start_stream.sh

      - name: Execute Streamer
        run: ./start_stream.sh
