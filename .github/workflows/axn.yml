name: AXN DASH ClearKey -> HLS (Bore 30117)

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""

      clearkey_key:
        description: "Override ClearKey key (optional)"
        required: false
        default: ""

      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""

      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: ${{ secrets.CLEARKEY_KEY }}
      USER_AGENT: "Dalvik/2.1.0"
      REFERER: "https://mytvnet.vn/"

    steps:

      # ==========================================================
      # Resolve configuration
      # ==========================================================
      - name: Resolve runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          MPD_EFFECTIVE="${{ github.event.inputs.mpd_url }}"
          KEY_EFFECTIVE="${{ github.event.inputs.clearkey_key }}"
          UA_EFFECTIVE="${{ github.event.inputs.user_agent }}"
          REF_EFFECTIVE="${{ github.event.inputs.referer }}"

          if [[ -z "$MPD_EFFECTIVE" ]]; then
            MPD_EFFECTIVE="$MPD_URL"
          fi

          if [[ -z "$KEY_EFFECTIVE" ]]; then
            KEY_EFFECTIVE="${CLEARKEY_KEY:-}"
          fi

          if [[ -z "$UA_EFFECTIVE" ]]; then
            UA_EFFECTIVE="$USER_AGENT"
          fi

          if [[ -z "$REF_EFFECTIVE" ]]; then
            REF_EFFECTIVE="$REFERER"
          fi

          if [[ -z "$MPD_EFFECTIVE" ]]; then
            echo "ERROR: MPD_URL is empty"
            exit 1
          fi

          if [[ -z "$KEY_EFFECTIVE" ]]; then
            echo "ERROR: CLEARKEY_KEY is empty"
            exit 1
          fi

          {
            echo "MPD_URL=$MPD_EFFECTIVE"
            echo "CLEARKEY_KEY=$KEY_EFFECTIVE"
            echo "USER_AGENT=$UA_EFFECTIVE"
            echo "REFERER=$REF_EFFECTIVE"
          } >> "$GITHUB_ENV"

          echo "MPD configured"
          echo "User-Agent configured"
          echo "Referer configured"
          echo "ClearKey configured"

      # ==========================================================
      # Dependencies
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            curl \
            ca-certificates \
            ffmpeg \
            jq \
            nginx \
            dnsutils

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 3

          echo "===== FFprobe ====="
          ffprobe -version | head -n 3

          echo "===== FFmpeg ClearKey support ====="
          ffmpeg -hide_banner -h full 2>&1 \
            | grep -E "cenc_decryption_key|cenc_decryption_keys" || true

          echo "===== Nginx ====="
          nginx -v

      # ==========================================================
      # Install Bore
      # ==========================================================
      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/bore.tar.gz

          tar -xzf /tmp/bore.tar.gz -C /tmp

          sudo install -m 755 /tmp/bore /usr/local/bin/bore

          bore --version

          rm -f /tmp/bore.tar.gz /tmp/bore

      # ==========================================================
      # RAM HLS
      # ==========================================================
      - name: Prepare RAM HLS
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /dev/shm/hls

          sudo mkdir -p \
            /dev/shm/hls/axn

          sudo chmod -R 777 /dev/shm/hls

          echo "===== HLS directory ====="
          ls -lah /dev/shm/hls
          ls -lah /dev/shm/hls/axn

      # ==========================================================
      # Nginx
      #
      # IMPORTANT:
      # root MUST be /dev/shm/hls
      # because playlist is /dev/shm/hls/axn/index.m3u8
      # ==========================================================
      - name: Configure nginx
        shell: bash
        run: |
          set -euo pipefail

          sudo tee /etc/nginx/nginx.conf > /dev/null <<'NGINX'
          worker_processes auto;

          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;

              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;

              keepalive_timeout 10;

              access_log off;
              error_log /dev/null crit;

              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }

              server {
                  listen 5000 default_server;
                  server_name _;

                  # FIX:
                  # /axn/index.m3u8
                  # -> /dev/shm/hls/axn/index.m3u8
                  root /dev/shm/hls;

                  location / {
                      try_files $uri =404;

                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                      add_header Access-Control-Allow-Headers "*" always;

                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      add_header Pragma "no-cache" always;
                      add_header Expires "0" always;
                  }

                  location = /healthz {
                      default_type application/json;
                      return 200 '{"ok":true}';
                  }
              }
          }
          NGINX

          sudo nginx -t

          sudo systemctl restart nginx

          curl -fsS \
            http://127.0.0.1:5000/healthz

          echo
          echo "Nginx OK"

      # ==========================================================
      # FFmpeg supervisor
      # ==========================================================
      - name: Create FFmpeg supervisor
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/restream-supervisor.sh <<'EOF'
          #!/usr/bin/env bash

          set -u

          HLS_DIR="/dev/shm/hls/axn"
          PLAYLIST="${HLS_DIR}/index.m3u8"
          SEGMENT_PATTERN="${HLS_DIR}/seg%09d.ts"

          FFMPEG_LOG="/tmp/ffmpeg.log"
          SUPERVISOR_LOG="/tmp/supervisor.log"

          MPD_URL="${MPD_URL:?MPD_URL missing}"
          CLEARKEY_KEY="${CLEARKEY_KEY:?CLEARKEY_KEY missing}"

          USER_AGENT="${USER_AGENT:-Dalvik/2.1.0}"
          REFERER="${REFERER:-https://mytvnet.vn/}"

          FFMPEG_PID=""

          log() {
              echo "$(date -Is) $*" | tee -a "$SUPERVISOR_LOG"
          }

          get_origin() {
              printf '%s\n' "$REFERER" |
                  sed -E 's#^(https?://[^/]+).*#\1#'
          }

          stop_ffmpeg() {
              if [[ -n "${FFMPEG_PID}" ]] &&
                 kill -0 "${FFMPEG_PID}" 2>/dev/null; then

                  kill -TERM "${FFMPEG_PID}" 2>/dev/null || true

                  for _ in {1..20}; do
                      if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                          break
                      fi

                      sleep 0.25
                  done

                  kill -KILL "${FFMPEG_PID}" 2>/dev/null || true
              fi

              FFMPEG_PID=""
          }

          cleanup_hls() {
              rm -f \
                  "${HLS_DIR}"/*.m3u8 \
                  "${HLS_DIR}"/*.ts \
                  "${HLS_DIR}"/*.tmp \
                  2>/dev/null || true
          }

          start_ffmpeg() {
              cleanup_hls

              : > "$FFMPEG_LOG"

              local origin
              origin="$(get_origin)"

              log "[FFmpeg] starting"

              ffmpeg \
                  -hide_banner \
                  -loglevel warning \
                  -nostdin \
                  -stats \
                  \
                  -reconnect 1 \
                  -reconnect_streamed 1 \
                  -reconnect_on_network_error 1 \
                  -reconnect_delay_max 3 \
                  -rw_timeout 15000000 \
                  \
                  -user_agent "${USER_AGENT}" \
                  -headers "Referer: ${REFERER}\r\nOrigin: ${origin}\r\n" \
                  \
                  -cenc_decryption_key "${CLEARKEY_KEY}" \
                  \
                  -fflags +genpts+discardcorrupt \
                  -err_detect ignore_err \
                  \
                  -i "${MPD_URL}" \
                  \
                  -map 0:v:0? \
                  -map 0:a:0? \
                  \
                  -c:v libx264 \
                  -preset veryfast \
                  -tune zerolatency \
                  -profile:v main \
                  -level 4.0 \
                  -pix_fmt yuv420p \
                  \
                  -r 25 \
                  \
                  -b:v 1800k \
                  -maxrate 2200k \
                  -bufsize 4400k \
                  \
                  -g 50 \
                  -keyint_min 50 \
                  -sc_threshold 0 \
                  \
                  -c:a aac \
                  -b:a 128k \
                  -ar 48000 \
                  -ac 2 \
                  -af "aresample=async=1000:first_pts=0" \
                  \
                  -max_muxing_queue_size 4096 \
                  -avoid_negative_ts make_zero \
                  \
                  -f hls \
                  -hls_time 2 \
                  -hls_list_size 8 \
                  -hls_delete_threshold 3 \
                  \
                  -hls_flags \
                  delete_segments+independent_segments+omit_endlist+temp_file+program_date_time \
                  \
                  -hls_segment_type mpegts \
                  -hls_segment_filename "${SEGMENT_PATTERN}" \
                  \
                  "${PLAYLIST}" \
                  >"$FFMPEG_LOG" 2>&1 &

              FFMPEG_PID=$!

              log "[FFmpeg] pid=${FFMPEG_PID}"
          }

          trap 'stop_ffmpeg; exit 0' TERM INT EXIT

          while true; do

              start_ffmpeg

              while kill -0 "${FFMPEG_PID}" 2>/dev/null; do
                  sleep 5

                  if [[ -f "$PLAYLIST" ]]; then
                      now="$(date +%s)"
                      mtime="$(stat -c %Y "$PLAYLIST" 2>/dev/null || echo 0)"
                      age=$((now - mtime))

                      if (( age > 15 )); then
                          log "[Watchdog] playlist stale: ${age}s"
                          stop_ffmpeg
                          break
                      fi
                  fi
              done

              log "[Supervisor] FFmpeg stopped"

              tail -n 50 "$FFMPEG_LOG" || true

              sleep 2
          done
          EOF

          chmod +x /tmp/restream-supervisor.sh

      # ==========================================================
      # Start FFmpeg
      # ==========================================================
      - name: Start restream
        shell: bash
        run: |
          set -euo pipefail

          nohup /tmp/restream-supervisor.sh \
            >/tmp/restream-supervisor-stdout.log 2>&1 &

          echo $! >/tmp/restream-supervisor.pid

          echo "Supervisor PID: $(cat /tmp/restream-supervisor.pid)"

      # ==========================================================
      # REAL readiness check
      # ==========================================================
      - name: Wait for HLS readiness
        shell: bash
        run: |
          set -euo pipefail

          URL="http://127.0.0.1:5000/axn/index.m3u8"

          READY=0

          for i in {1..180}; do
              sleep 1

              if [[ ! -f /dev/shm/hls/axn/index.m3u8 ]]; then
                  continue
              fi

              if ! curl -fsS \
                  --max-time 5 \
                  "$URL" \
                  -o /tmp/live.m3u8; then
                  continue
              fi

              if ! grep -q '^#EXTM3U' /tmp/live.m3u8; then
                  continue
              fi

              if ! grep -q '^#EXTINF:' /tmp/live.m3u8; then
                  continue
              fi

              if ! grep -Eq '^seg[0-9]+\.ts$' /tmp/live.m3u8; then
                  echo "Playlist exists but no segment yet"
                  cat /tmp/live.m3u8
                  continue
              fi

              SEGMENT_NAME="$(
                  grep -E '^seg[0-9]+\.ts$' /tmp/live.m3u8 |
                  tail -n 1
              )"

              if [[ -z "$SEGMENT_NAME" ]]; then
                  continue
              fi

              if curl -fsS \
                  --max-time 10 \
                  "http://127.0.0.1:5000/axn/${SEGMENT_NAME}" \
                  -o /tmp/segment_sample.ts; then

                  if [[ -s /tmp/segment_sample.ts ]]; then
                      READY=1
                      break
                  fi
              fi
          done

          if [[ "$READY" -ne 1 ]]; then
              echo
              echo "ERROR: HLS playlist not ready"

              echo
              echo "===== FILESYSTEM ====="
              find /dev/shm/hls -maxdepth 2 -type f -printf '%p %s bytes\n' \
                  2>/dev/null || true

              echo
              echo "===== PLAYLIST ====="
              cat /dev/shm/hls/axn/index.m3u8 \
                  2>/dev/null || true

              echo
              echo "===== HTTP ====="
              curl -v \
                  --max-time 10 \
                  http://127.0.0.1:5000/axn/index.m3u8 \
                  2>&1 || true

              echo
              echo "===== SUPERVISOR ====="
              tail -n 200 \
                  /tmp/restream-supervisor-stdout.log \
                  2>/dev/null || true

              echo
              echo "===== FFMPEG ====="
              tail -n 300 \
                  /tmp/ffmpeg.log \
                  2>/dev/null || true

              exit 1
          fi

          echo
          echo "=========================================="
          echo "HLS READY"
          echo "=========================================="

          cat /tmp/live.m3u8

          echo
          echo "Segment:"
          echo "$SEGMENT_NAME"

          echo
          echo "Segment size:"
          stat -c '%s bytes' /tmp/segment_sample.ts

      # ==========================================================
      # Validate output
      # ==========================================================
      - name: Validate HLS output
        shell: bash
        run: |
          set -euo pipefail

          ffprobe \
            -hide_banner \
            -v warning \
            -i "http://127.0.0.1:5000/axn/index.m3u8" \
            -show_streams \
            -show_format \
            >/tmp/ffprobe_streams.txt \
            2>/tmp/ffprobe_warn.txt

          echo "===== FFPROBE ====="
          cat /tmp/ffprobe_streams.txt

          echo
          echo "===== WARNINGS ====="
          cat /tmp/ffprobe_warn.txt || true

          grep -qi 'codec_name=h264' /tmp/ffprobe_streams.txt
          grep -qi 'width=1920' /tmp/ffprobe_streams.txt
          grep -qi 'height=1080' /tmp/ffprobe_streams.txt
          grep -qi 'codec_name=aac' /tmp/ffprobe_streams.txt
          grep -qi 'sample_rate=48000' /tmp/ffprobe_streams.txt
          grep -qi 'channels=2' /tmp/ffprobe_streams.txt

          echo
          echo "=========================================="
          echo "H264 1920x1080 + AAC 48k stereo OK"
          echo "=========================================="

      # ==========================================================
      # Bore
      # ==========================================================
      - name: Start Bore tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 \
              --to bore.pub \
              --port 30117 \
              >/tmp/bore.log 2>&1 &

          echo $! >/tmp/bore.pid

          PORT_BOUND=0

          for i in {1..30}; do
              sleep 1

              if grep -q \
                  'listening at bore.pub:30117' \
                  /tmp/bore.log; then

                  PORT_BOUND=1
                  break
              fi
          done

          if [[ "$PORT_BOUND" -ne 1 ]]; then
              echo "ERROR: Bore tunnel failed"
              cat /tmp/bore.log || true
              exit 1
          fi

          echo
          echo "=================================================="
          echo "HLS STREAM READY"
          echo "=================================================="
          echo
          echo "http://bore.pub:30117/axn/index.m3u8"
          echo
          echo "=================================================="
          echo "Local:"
          echo "http://127.0.0.1:5000/axn/index.m3u8"
          echo "=================================================="

          while true; do

              if ! kill -0 \
                  "$(cat /tmp/restream-supervisor.pid)" \
                  2>/dev/null; then

                  echo "ERROR: Restream supervisor died"
                  tail -n 200 \
                      /tmp/restream-supervisor-stdout.log || true

                  exit 1
              fi

              if ! kill -0 \
                  "$(cat /tmp/bore.pid)" \
                  2>/dev/null; then

                  echo "ERROR: Bore process died"
                  cat /tmp/bore.log || true

                  exit 1
              fi

              if ! curl -fsS \
                  --max-time 5 \
                  http://127.0.0.1:5000/healthz \
                  >/dev/null; then

                  echo "ERROR: nginx health failed"
                  exit 1
              fi

              if ! curl -fsS \
                  --max-time 5 \
                  http://127.0.0.1:5000/axn/index.m3u8 \
                  >/tmp/health_live.m3u8; then

                  echo "ERROR: HLS playlist unavailable"
                  tail -n 100 /tmp/ffmpeg.log || true
                  exit 1
              fi

              if ! grep -q '^#EXTINF:' \
                  /tmp/health_live.m3u8; then

                  echo "ERROR: playlist has no segments"
                  exit 1
              fi

              echo
              echo "----- STATUS -----"

              stat \
                  -c 'playlist=%n age=%Y size=%s' \
                  /dev/shm/hls/axn/index.m3u8 \
                  2>/dev/null || true

              echo "FFmpeg: alive"
              echo "Supervisor: alive"
              echo "Bore: alive"

              sleep 15
          done
