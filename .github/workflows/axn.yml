name: Ultimate DASH Zero-PTS Proxy - Bore 30117

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl nodejs

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Create Proxy Server (Reset Audio & Video PTS to 0)
        shell: bash
        run: |
          cat << 'EOF' > /tmp/server.js
          const http = require('http');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL;
          const KEY = process.env.CLEARKEY_KEY;
          const UA = process.env.USER_AGENT;
          const REF = process.env.REFERER;

          const server = http.createServer((req, res) => {
            console.log(`[${new Date().toISOString()}] Client connected: ${req.url}`);

            res.writeHead(200, {
              'Content-Type': 'video/mp2t',
              'Connection': 'keep-alive',
              'Access-Control-Allow-Origin': '*'
            });

            const customHeaders = `Referer: ${REF}\r\nOrigin: https://mytvnet.vn\r\n`;

            const ffmpegArgs = [
              '-hide_banner',
              '-loglevel', 'error',
              '-user_agent', UA,
              '-headers', customHeaders,
              '-cenc_decryption_key', KEY,
              '-i', MPD_URL,
              '-map', '0:v:0?',
              '-map', '0:a:0?',
              // 1. Giữ nguyên Video codec (0% CPU), ép PTS Video bắt đầu từ 0
              '-c:v', 'copy',
              '-bsf:v', 'h264_mp4toannexb,setts=pts=PTS-STARTPTS:dts=DTS-STARTPTS',
              // 2. Re-encode nhẹ Audio & ép PTS Audio bắt đầu từ 0 (Triệt hạ hoàn toàn lỗi lệch 8.9s)
              '-c:a', 'aac',
              '-b:a', '128k',
              '-ar', '48000',
              '-ac', '2',
              '-af', 'asetpts=PTS-STARTPTS,aresample=async=1000:min_hard_comp=0.100000',
              // 3. Đóng gói MPEG-TS mượt mà
              '-muxdelay', '0',
              '-muxpreload', '0',
              '-f', 'mpegts',
              'pipe:1'
            ];

            const ffmpeg = spawn('ffmpeg', ffmpegArgs);

            ffmpeg.stdout.pipe(res);

            ffmpeg.stderr.on('data', (data) => {
              console.error(`FFmpeg Log: ${data}`);
            });

            req.on('close', () => {
              console.log('Client disconnect -> Killing FFmpeg...');
              ffmpeg.kill('SIGKILL');
            });
          });

          server.keepAliveTimeout = 60000;
          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 Server running on port 5000');
          });
          EOF

      - name: Start Services
        shell: bash
        run: |
          set -euo pipefail
          
          nohup node /tmp/server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 2

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..20}; do
            sleep 1
            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -eq 0 ]; then
            echo "❌ ERROR: Bore failed."
            cat /tmp/bore.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ LINK TEST CHUẨN XEM TRÊN VLC KHOÔNG CÒN MẤT TIẾNG:"
          echo "👉 http://bore.pub:30117/stream.ts"
          echo "=================================================="

          while true; do
            if ! kill -0 $(cat /tmp/proxy.pid) 2>/dev/null; then exit 1; fi
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then exit 1; fi
            sleep 10
          done
