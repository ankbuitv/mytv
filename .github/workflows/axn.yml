name: CHRTV AXN Restream (Nginx Direct MPEG-TS Engine)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl tar
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/bore

      - name: Configure Nginx for Direct MPEG-TS
        run: |
          sudo rm -rf /dev/shm/stream
          sudo mkdir -p /dev/shm/stream
          sudo chmod -R 777 /dev/shm/stream

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm/stream;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      
                      # Tối ưu cho luồng MPEG-TS
                      types {
                          video/mp2t ts;
                      }
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream Engine
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
          CLEARKEY: ${{ secrets.CLEARKEY }}
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT: "18080"
        run: |
          # Bật Bore Tunnel nối cổng 5000 của Nginx
          (while true; do bore local 5000 --to bore.pub --port "${TARGET_PORT}" >> /tmp/bore.log 2>&1; sleep 2; done) &
          sleep 3

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          while true; do
            echo "🚀 Starting Direct MPEG-TS Stream to File..."
            
            # Tách lấy đúng 32 ký tự Key đằng sau dấu :
            DEC_KEY="$(echo "${CLEARKEY}" | awk -F':' '{print $NF}')"

            # FFmpeg cởi mã hóa CENC -> Copy Stream -> Ghi đè liên tục ra /dev/shm/stream/axn.ts
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -cenc_decryption_key "${DEC_KEY}" \
              -fflags +genpts+discardcorrupt+igndts \
              -rw_timeout 10000000 \
              -probesize 10000000 -analyzeduration 10000000 \
              -i "${STREAM_MPD}" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy \
              -c:a copy \
              -f mpegts \
              "/dev/shm/stream/axn.ts" || true

            echo "⚠️ FFmpeg restarted in 2s..."
            sleep 2
          done
