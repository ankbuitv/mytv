name: CHRTV AXN Restream (Friend's FFmpeg Engine)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/bore

      - name: Configure nginx for HLS
        run: |
          sudo rm -rf /dev/shm/hls/axn
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 2048;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Cache-Control "no-cache";
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start restream with Friend's Config
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
          AUTHORIZED_KEY: ${{ secrets.CLEARKEY }}
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT: "18080"
        run: |
          rm -rf /dev/shm/hls/axn/*
          mkdir -p /dev/shm/hls/axn

          cat > /dev/shm/hls/axn/master.m3u8 << 'EOF'
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=2200000
          index.m3u8
          EOF

          (while true; do bore local 5000 --to bore.pub --port "${TARGET_PORT}" >> /tmp/bore.log 2>&1; sleep 2; done) &
          sleep 3

          echo "Restream Link: http://${CF_SUBDOMAIN}:${TARGET_PORT}/hls/axn/master.m3u8"

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 🚀 ĐÂY LÀ LỆNH FFMPEG THEO Ý BẠN BRO:
          while true; do
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "$USER_AGENT" \
              -fflags +genpts+discardcorrupt \
              -err_detect ignore_err \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -rw_timeout 10000000 \
              -cenc_decryption_key "$AUTHORIZED_KEY" \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -c:v libx264 \
              -preset veryfast \
              -tune zerolatency \
              -profile:v main \
              -level 4.0 \
              -pix_fmt yuv420p \
              -b:v 1800k -maxrate 2200k -bufsize 4400k \
              -g 50 -keyint_min 50 -sc_threshold 0 \
              -c:a aac \
              -ar 48000 \
              -ac 2 \
              -b:a 128k \
              -af "aresample=async=1000:first_pts=0" \
              -max_muxing_queue_size 4096 \
              -avoid_negative_ts make_zero \
              -f hls \
              -hls_time 3 \
              -hls_list_size 8 \
              -hls_delete_threshold 4 \
              -hls_flags delete_segments+omit_endlist+independent_segments+program_date_time \
              -hls_start_number_source epoch \
              -hls_segment_filename "/dev/shm/hls/axn/seg%06d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "FFmpeg restart in 2s..."
            sleep 2
          done
