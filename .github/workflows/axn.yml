name: CHRTV AXN Restream Final Fix
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Configure Nginx For HLS
        run: |
          mkdir -p /dev/shm/hls/axn
          cat << 'EOF' | sudo tee /tmp/nginx.conf
          worker_processes auto;
          events { worker_connections 2048; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65s;
              keepalive_requests 10000;
              server {
                  listen 5000;
                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate";
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                      add_header Access-Control-Allow-Headers *;
                  }
              }
          }
          EOF
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Tunnel & Restream Service
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080
          
          sshx > sshx.log 2>&1 &
          sleep 2
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)
          
          (
          while true; do
            bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
            sleep 3
          done
          ) &
          sleep 5
          
          echo "Đang lấy IP của bore.pub..."
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "IP bore.pub: $BORE_IP - Đang cập nhật DuckDNS..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          else
            echo "Lỗi mạng, không lấy được IP bore.pub!"
          fi
          
          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"
          cat << M3U_EOF > /dev/shm/playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="AXN.vn" tvg-name="AXN HD" group-title="VN Live", AXN HD (Final Fixed)
          ${PUBLIC_URL}/hls/axn/master.m3u8
          M3U_EOF
          
          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "🔑 SSHX URL : ${SSHX_URL}"
          echo "👉 STREAM URL : ${PUBLIC_URL}/hls/axn/master.m3u8"
          echo "👉 PLAYLIST URL : ${PUBLIC_URL}/playlist.m3u"
          echo "===================================================="
          
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36"
          
          while true; do
            mkdir -p /dev/shm/hls/axn
            rm -f /dev/shm/hls/axn/*.ts /dev/shm/hls/axn/*.m3u8
            cat << 'MASTER_EOF' > /dev/shm/hls/axn/master.m3u8
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=1200000,RESOLUTION=1280x720
          index.m3u8
          MASTER_EOF
          
          # 🎯 MAGIC FIX: Dùng Wallclock Timestamp, bỏ -re, bỏ copyts
          ffmpeg -y -hide_banner -loglevel error -stats \
          -rw_timeout 10000000 \
          -err_detect ignore_err \
          -fflags +genpts+discardcorrupt+igndts \
          -use_wallclock_as_timestamps 1 \
          -user_agent "$USER_AGENT" \
          -headers "Referer: https://mytvnet.vn/" \
          -cenc_decryption_key "$CLEARKEY" \
          -i "$STREAM_MPD" \
          -map 0:v:0 -map 0:a:0 \
          -vf "scale=1280:720" \
          -af "aresample=async=1000" \
          -c:v libx264 -preset veryfast -tune zerolatency \
          -profile:v baseline -level 3.0 -pix_fmt yuv420p \
          -g 50 -keyint_min 50 -sc_threshold 0 \
          -b:v 1000k -maxrate 1200k -bufsize 2000k \
          -c:a aac -b:a 128k -ar 48000 -ac 2 \
          -avoid_negative_ts make_zero \
          -muxdelay 0 -muxpreload 0 \
          -max_muxing_queue_size 2048 \
          -f hls \
          -hls_time 2 \
          -hls_list_size 6 \
          -hls_flags delete_segments+omit_endlist+independent_segments \
          -hls_segment_type mpegts \
          -hls_segment_filename "/dev/shm/hls/axn/seg_%03d.ts" \
          -start_number 1 \
          /dev/shm/hls/axn/index.m3u8 || true
          
          echo "⚠ Reconnecting in 3s..."
          sleep 3
          done
