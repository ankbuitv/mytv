name: CHRTV AXN Restream (Fix Realtime Sync & No Dup)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Optimize Nginx for Realtime HLS Streaming
        run: |
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 2048;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 15;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
                      add_header Pragma "no-cache";
                      add_header Expires 0;
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream & Dynamic DNS Update
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
        run: |
          # ====================================================
          # 🔑 THÔNG SỐ CỐ ĐỊNH
          # ====================================================
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT=18080
          # ====================================================

          rm -rf /dev/shm/hls/axn/*
          mkdir -p /dev/shm/hls/axn
          
          printf "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:BANDWIDTH=2000000\nindex.m3u8\n" > /dev/shm/hls/axn/master.m3u8

          # 1. Chạy Bore Tunnel giữ kết nối
          echo "► Đang kết nối Bore Tunnel..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $TARGET_PORT >> /tmp/bore.log 2>&1
              echo "⚠ Bore ngắt kết nối! Đang thử nối lại..."
              sleep 2
            done
          ) &
          sleep 3

          # 2. Cập nhật IP lên Cloudflare DNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ] && [ -n "$CF_API_TOKEN" ]; then
            echo "► Cập nhật IP $BORE_IP cho Cloudflare DNS..."
            RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_SUBDOMAIN}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4)

            if [ -n "$RECORD_ID" ]; then
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"${BORE_IP}\",\"ttl\":120,\"proxied\":false}"
            fi
            echo "✅ DNS Updated successfully!"
          fi

          echo "===================================================="
          echo "🌐 CHRTV RESTREAM IS READY!"
          echo "👉 URL: http://${CF_SUBDOMAIN}/hls/axn/master.m3u8"
          echo "===================================================="

          # 3. FFmpeg Engine Chuẩn Realtime & Zero Sync Delay
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          while true; do
            echo "► Đang chạy FFmpeg Restream (Realtime Stream - Perfect AV Sync)..."
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "$USER_AGENT" \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -rw_timeout 10000000 \
              -cenc_decryption_key "$CLEARKEY" \
              -re \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -profile:v baseline \
              -b:v 1800k -maxrate 2200k -bufsize 3600k \
              -g 50 -keyint_min 50 -sc_threshold 0 \
              -c:a aac \
              -af "aresample=async=1000" \
              -ar 48000 \
              -ac 2 \
              -b:a 128k \
              -avoid_negative_ts make_zero \
              -f hls \
              -hls_time 4 \
              -hls_list_size 5 \
              -hls_delete_threshold 2 \
              -hls_flags delete_segments+omit_endlist+discont_start+independent_segments \
              -hls_segment_filename "/dev/shm/hls/axn/seg%06d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠ FFmpeg tạm dừng/lỗi. Khởi động lại luồng sau 2s..."
            sleep 2
          done
