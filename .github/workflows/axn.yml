name: AXN DASH ClearKey -> HLS (Bore 30117)

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""
      clearkey_key:
        description: "Override ClearKey hex key (optional)"
        required: false
        default: ""
      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""
      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      # Keep the existing owner-provided key handling; use a GitHub secret here.
      CLEARKEY_KEY: "${{ secrets.CLEARKEY_KEY }}"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Resolve runtime env from workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          MPD_EFFECTIVE="${{ github.event.inputs.mpd_url }}"
          KEY_EFFECTIVE="${{ github.event.inputs.clearkey_key }}"
          UA_EFFECTIVE="${{ github.event.inputs.user_agent }}"
          REF_EFFECTIVE="${{ github.event.inputs.referer }}"

          if [ -z "${MPD_EFFECTIVE}" ]; then MPD_EFFECTIVE="${MPD_URL}"; fi
          if [ -z "${KEY_EFFECTIVE}" ]; then KEY_EFFECTIVE="${CLEARKEY_KEY}"; fi
          if [ -z "${UA_EFFECTIVE}" ]; then UA_EFFECTIVE="${USER_AGENT}"; fi
          if [ -z "${REF_EFFECTIVE}" ]; then REF_EFFECTIVE="${REFERER}"; fi

          if [ -z "${MPD_EFFECTIVE}" ] || [ -z "${KEY_EFFECTIVE}" ]; then
            echo "❌ MPD URL hoặc ClearKey bị rỗng"
            exit 1
          fi

          {
            echo "MPD_URL=${MPD_EFFECTIVE}"
            echo "CLEARKEY_KEY=${KEY_EFFECTIVE}"
            echo "USER_AGENT=${UA_EFFECTIVE}"
            echo "REFERER=${REF_EFFECTIVE}"
          } >> "$GITHUB_ENV"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates nodejs ffmpeg jq
          node -v
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          bore --version
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Detect supported HLS flags for this ffmpeg build
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -hide_banner -h muxer=hls > /tmp/hls_muxer_help.txt 2>&1
          if grep -q 'temp_file' /tmp/hls_muxer_help.txt; then
            echo 'HLS_FLAGS=delete_segments+independent_segments+omit_endlist+temp_file' >> "$GITHUB_ENV"
          else
            echo 'HLS_FLAGS=delete_segments+independent_segments+omit_endlist' >> "$GITHUB_ENV"
          fi

      - name: Create Node HLS proxy server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL;
          const CLEARKEY_KEY = process.env.CLEARKEY_KEY;
          const USER_AGENT = process.env.USER_AGENT || 'Mozilla/5.0';
          const REFERER = process.env.REFERER || 'https://mytvnet.vn/';
          const HLS_FLAGS =
            process.env.HLS_FLAGS ||
            'delete_segments+independent_segments+omit_endlist+temp_file';

          const HLS_DIR = '/tmp/hls';
          const PLAYLIST_FILE = path.join(HLS_DIR, 'stream.m3u8');
          const SEGMENT_PATTERN = path.join(HLS_DIR, 'segment_%05d.ts');
          const FFMPEG_LOG = '/tmp/ffmpeg.log';

          const LISTEN_HOST = '0.0.0.0';
          const LISTEN_PORT = 5000;
          const RESTART_DELAY_MS = 1500;

          let ffmpegProc = null;
          let restarting = false;
          let restartCount = 0;
          let ffmpegStartedAt = 0;

          function log(...args) {
            console.log(new Date().toISOString(), ...args);
          }

          function noCacheHeaders() {
            return {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0',
              'Access-Control-Allow-Origin': '*',
            };
          }

          function safeOrigin(referer) {
            try {
              return new URL(referer).origin;
            } catch {
              return 'https://mytvnet.vn';
            }
          }

          function cleanHlsState() {
            fs.mkdirSync(HLS_DIR, { recursive: true });
            const names = fs.readdirSync(HLS_DIR);
            for (const name of names) {
              if (/\.m3u8$/.test(name) || /\.ts$/.test(name) || /\.tmp$/.test(name)) {
                try {
                  fs.rmSync(path.join(HLS_DIR, name), { force: true });
                } catch {}
              }
            }
          }

          function buildFfmpegArgs() {
            const headers =
              `Referer: ${REFERER}\r\n` +
              `Origin: ${safeOrigin(REFERER)}\r\n`;

            return [
              '-hide_banner',
              '-loglevel', 'warning',
              '-stats',

              // Network resilience
              '-reconnect', '1',
              '-reconnect_streamed', '1',
              '-reconnect_on_network_error', '1',
              '-reconnect_delay_max', '2',
              '-rw_timeout', '10000000',

              '-user_agent', USER_AGENT,
              '-headers', headers,

              // Existing owner-provided decryption configuration.
              '-cenc_decryption_key', CLEARKEY_KEY,

              // Input timestamp/corruption handling.
              '-fflags', '+genpts+discardcorrupt',
              '-err_detect', 'ignore_err',

              '-i', MPD_URL,

              '-map', '0:v:0?',
              '-map', '0:a:0?',

              // Video: transcode to a stable H.264 live stream.
              '-c:v', 'libx264',
              '-preset', 'veryfast',
              '-tune', 'zerolatency',
              '-profile:v', 'main',
              '-level', '4.0',
              '-pix_fmt', 'yuv420p',

              // 1080p live bitrate target.
              '-b:v', '2500k',
              '-maxrate', '3000k',
              '-bufsize', '6000k',

              // Source is expected to be 25 fps.
              '-r', '25',

              // 2-second HLS segments => 50-frame GOP.
              '-g', '50',
              '-keyint_min', '50',
              '-sc_threshold', '0',

              // Audio: keep the working AAC path.
              '-c:a', 'aac',
              '-b:a', '128k',
              '-ar', '48000',
              '-ac', '2',
              '-af', 'aresample=async=1:first_pts=0',

              '-max_muxing_queue_size', '4096',
              '-avoid_negative_ts', 'make_zero',

              // HLS
              '-f', 'hls',
              '-hls_time', '2',
              '-hls_list_size', '6',
              '-hls_delete_threshold', '2',
              '-hls_flags', HLS_FLAGS,
              '-hls_segment_type', 'mpegts',
              '-hls_start_number_source', 'epoch',
              '-hls_segment_filename', SEGMENT_PATTERN,
              PLAYLIST_FILE,
            ];
          }

          function startFfmpeg() {
            if (ffmpegProc) return;

            cleanHlsState();

            try {
              fs.writeFileSync(FFMPEG_LOG, '');
            } catch {}

            const args = buildFfmpegArgs();
            log('[FFmpeg] starting HLS producer with video transcode');

            const proc = spawn('ffmpeg', args, {
              stdio: ['ignore', 'ignore', 'pipe'],
            });

            ffmpegProc = proc;
            ffmpegStartedAt = Date.now();

            proc.stderr.on('data', (chunk) => {
              try {
                fs.appendFileSync(FFMPEG_LOG, chunk.toString());
              } catch {}
            });

            proc.on('exit', (code, signal) => {
              log(`[FFmpeg] exited code=${code} signal=${signal}`);
              ffmpegProc = null;
              restartCount += 1;
              scheduleRestart();
            });

            proc.on('error', (err) => {
              log('[FFmpeg] process error:', err.message);
            });
          }

          function stopFfmpeg() {
            if (!ffmpegProc) return;
            try {
              ffmpegProc.kill('SIGKILL');
            } catch {}
            ffmpegProc = null;
          }

          function scheduleRestart() {
            if (restarting) return;

            restarting = true;
            setTimeout(() => {
              restarting = false;
              if (!ffmpegProc) {
                startFfmpeg();
              }
            }, RESTART_DELAY_MS);
          }

          function countSegments() {
            try {
              return fs
                .readdirSync(HLS_DIR)
                .filter((n) => /^segment_\d+\.ts$/.test(n))
                .length;
            } catch {
              return 0;
            }
          }

          function playlistInfo() {
            try {
              const st = fs.statSync(PLAYLIST_FILE);
              if (!st.isFile() || st.size <= 0) {
                return { exists: false, ageMs: -1, size: 0 };
              }

              return {
                exists: true,
                ageMs: Date.now() - st.mtimeMs,
                size: st.size,
              };
            } catch {
              return { exists: false, ageMs: -1, size: 0 };
            }
          }

          function health() {
            const p = playlistInfo();
            const segments = countSegments();
            const ffmpegRunning = !!ffmpegProc;
            const playlistFresh =
              p.exists && p.ageMs >= 0 && p.ageMs < 20000;

            const ok = ffmpegRunning && playlistFresh && segments > 0;

            return {
              ok,
              ffmpegRunning,
              playlistExists: p.exists,
              playlistAgeMs: p.ageMs,
              segments,
              ffmpegRestarts: restartCount,
              ffmpegUptimeMs: ffmpegRunning
                ? Date.now() - ffmpegStartedAt
                : 0,
            };
          }

          function serveFile(res, absPath, mimeType) {
            fs.stat(absPath, (err, st) => {
              if (err || !st.isFile() || st.size <= 0) {
                res.writeHead(404, {
                  'Content-Type': 'text/plain',
                  ...noCacheHeaders(),
                });
                res.end('Not found');
                return;
              }

              res.writeHead(200, {
                'Content-Type': mimeType,
                'Content-Length': st.size,
                ...noCacheHeaders(),
              });

              const rs = fs.createReadStream(absPath);

              rs.on('error', () => {
                if (!res.headersSent) {
                  res.writeHead(500, {
                    'Content-Type': 'text/plain',
                    ...noCacheHeaders(),
                  });
                }
                res.end('Read error');
              });

              rs.pipe(res);
            });
          }

          function requestHandler(req, res) {
            if (req.method !== 'GET') {
              res.writeHead(405, {
                'Content-Type': 'text/plain',
                ...noCacheHeaders(),
              });
              res.end('Method Not Allowed');
              return;
            }

            const url = new URL(req.url, 'http://localhost');
            const pathname = decodeURIComponent(url.pathname);

            if (pathname === '/healthz') {
              const payload = health();

              res.writeHead(payload.ok ? 200 : 503, {
                'Content-Type': 'application/json',
                ...noCacheHeaders(),
              });

              res.end(JSON.stringify(payload));
              return;
            }

            if (pathname === '/stream.m3u8') {
              serveFile(
                res,
                PLAYLIST_FILE,
                'application/vnd.apple.mpegurl'
              );
              return;
            }

            if (/^\/segment_\d+\.ts$/.test(pathname)) {
              const filePath = path.join(
                HLS_DIR,
                path.basename(pathname)
              );

              serveFile(res, filePath, 'video/mp2t');
              return;
            }

            if (pathname === '/') {
              res.writeHead(200, {
                'Content-Type': 'text/plain',
                ...noCacheHeaders(),
              });
              res.end('Use /stream.m3u8');
              return;
            }

            res.writeHead(404, {
              'Content-Type': 'text/plain',
              ...noCacheHeaders(),
            });
            res.end('Not found');
          }

          process.on('uncaughtException', (err) => {
            log('[uncaughtException]', err.stack || err.message);
          });

          process.on('unhandledRejection', (reason) => {
            log('[unhandledRejection]', reason);
          });

          process.on('SIGTERM', () => {
            log('SIGTERM received, shutdown');
            stopFfmpeg();
            process.exit(0);
          });

          process.on('SIGINT', () => {
            log('SIGINT received, shutdown');
            stopFfmpeg();
            process.exit(0);
          });

          // Allow the external video-stall watchdog to restart only FFmpeg.
          // Node and the Bore-facing HTTP server stay alive.
          process.on('SIGUSR2', () => {
            log('[Watchdog] restarting FFmpeg only');
            stopFfmpeg();

            setTimeout(() => {
              if (!ffmpegProc) {
                startFfmpeg();
              }
            }, 500);
          });

          startFfmpeg();

          setInterval(() => {
            const h = health();
            log(
              `[Stats] ok=${h.ok} ffmpeg=${h.ffmpegRunning} ` +
              `playlist=${h.playlistExists} ageMs=${h.playlistAgeMs} ` +
              `segments=${h.segments} restarts=${h.ffmpegRestarts}`
            );
          }, 30000).unref();

          const server = http.createServer(requestHandler);
          server.keepAliveTimeout = 65000;
          server.headersTimeout = 66000;
          server.requestTimeout = 0;
          server.timeout = 0;

          server.listen(LISTEN_PORT, LISTEN_HOST, () => {
            log(
              `HLS server listening: ` +
              `http://${LISTEN_HOST}:${LISTEN_PORT}/stream.m3u8`
            );
          });
          EOF

      - name: Start proxy and validate local HLS readiness
        shell: bash
        run: |
          set -euo pipefail

          nohup node /tmp/hls_server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 2

          HEALTH_UP=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/healthz \
              > /tmp/health_boot.json 2>/dev/null; then
              HEALTH_UP=1
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_UP" -ne 1 ]; then
            echo "❌ /healthz không phản hồi"
            tail -n 200 /tmp/proxy.log || true
            exit 1
          fi

          READY=0
          for i in {1..120}; do
            sleep 1

            if test -s /tmp/hls/stream.m3u8; then
              if curl -fsS http://127.0.0.1:5000/stream.m3u8 \
                > /tmp/live.m3u8; then

                if grep -q '^#EXTM3U' /tmp/live.m3u8 \
                  && grep -q '^#EXT-X-TARGETDURATION' /tmp/live.m3u8 \
                  && grep -q '^#EXTINF:' /tmp/live.m3u8 \
                  && grep -Eq '^segment_[0-9]+\.ts$' /tmp/live.m3u8; then
                  READY=1
                  break
                fi
              fi
            fi
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ HLS playlist không sẵn sàng trong thời gian chờ"
            ls -la /tmp/hls || true
            echo "----- proxy log tail -----"
            tail -n 300 /tmp/proxy.log || true
            echo "----- ffmpeg log tail -----"
            tail -n 300 /tmp/ffmpeg.log || true
            exit 1
          fi

          SEGMENT_NAME="$(grep -E '^segment_[0-9]+\.ts$' /tmp/live.m3u8 | tail -n 1)"

          if [ -z "$SEGMENT_NAME" ]; then
            echo "❌ Playlist chưa có segment"
            cat /tmp/live.m3u8
            exit 1
          fi

          curl -fsS \
            "http://127.0.0.1:5000/${SEGMENT_NAME}" \
            -o /tmp/segment_sample.ts

          test -s /tmp/segment_sample.ts

          FIRST_TS="$(
            find /tmp/hls -maxdepth 1 -type f \
              -name 'segment_*.ts' | head -n 1 || true
          )"

          if [ -z "$FIRST_TS" ]; then
            echo "❌ Không tìm thấy file segment_*.ts"
            exit 1
          fi

          test -s "$FIRST_TS"

      - name: Local ffprobe validation
        shell: bash
        run: |
          set -euo pipefail

          ffprobe -hide_banner -v warning \
            -i http://127.0.0.1:5000/stream.m3u8 \
            -show_streams -show_format \
            > /tmp/ffprobe_streams.txt \
            2> /tmp/ffprobe_warn.txt || {
              echo "❌ ffprobe không đọc được HLS playlist local"
              cat /tmp/ffprobe_warn.txt || true
              exit 1
            }

          grep -qi 'codec_name=h264' /tmp/ffprobe_streams.txt
          grep -qi 'width=1920' /tmp/ffprobe_streams.txt
          grep -qi 'height=1080' /tmp/ffprobe_streams.txt
          grep -qi 'r_frame_rate=25/1' /tmp/ffprobe_streams.txt

          grep -qi 'codec_name=aac' /tmp/ffprobe_streams.txt
          grep -qi 'sample_rate=48000' /tmp/ffprobe_streams.txt
          grep -qi 'channels=2' /tmp/ffprobe_streams.txt

          if grep -qi 'DTS discontinuity' /tmp/ffprobe_warn.txt; then
            echo "⚠️ Phát hiện DTS discontinuity từ ffprobe."
            echo "Thu thập mẫu packet để phân tích thêm..."

            timeout 30s ffprobe \
              -hide_banner \
              -v warning \
              -i http://127.0.0.1:5000/stream.m3u8 \
              -show_packets \
              -show_entries \
              packet=stream_index,pts_time,dts_time,duration_time,flags \
              -of csv=p=0 \
              > /tmp/packets.csv \
              2> /tmp/ffprobe_packets_warn.txt || true

            echo "----- ffprobe warnings -----"
            cat /tmp/ffprobe_warn.txt || true

            echo "----- packet sample head -----"
            head -n 80 /tmp/packets.csv || true
          fi

      - name: Start Bore and keep stream alive
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 --to bore.pub --port 30117 \
            > /tmp/bore.log 2>&1 &

          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..30}; do
            sleep 1

            if grep -q 'listening at bore.pub:30117' /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -ne 1 ]; then
            echo "❌ Bore tunnel failed"
            cat /tmp/bore.log || true
            tail -n 200 /tmp/proxy.log || true
            tail -n 200 /tmp/ffmpeg.log || true
            exit 1
          fi

          curl -fsS \
            http://127.0.0.1:5000/stream.m3u8 \
            > /tmp/final_live.m3u8

          grep -q '^#EXTM3U' /tmp/final_live.m3u8
          grep -q '^#EXT-X-TARGETDURATION' /tmp/final_live.m3u8
          grep -q '^#EXTINF:' /tmp/final_live.m3u8
          grep -Eq '^segment_[0-9]+\.ts$' /tmp/final_live.m3u8

          echo "=================================================="
          echo "HLS STREAM READY"
          echo "=================================================="
          echo "http://bore.pub:30117/stream.m3u8"
          echo "=================================================="
          echo "Local debug: http://127.0.0.1:5000/stream.m3u8"

          WARN_CURSOR=0
          LAST_VIDEO_SIZE=0
          STALL_COUNT=0

          while true; do
            if ! kill -0 "$(cat /tmp/proxy.pid)" 2>/dev/null; then
              echo "❌ Node proxy process died"
              tail -n 200 /tmp/proxy.log || true
              tail -n 200 /tmp/ffmpeg.log || true
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/bore.pid)" 2>/dev/null; then
              echo "❌ Bore process died"
              tail -n 200 /tmp/bore.log || true
              exit 1
            fi

            if ! curl -fsS \
              http://127.0.0.1:5000/healthz \
              > /tmp/health_live.json; then
              echo "❌ Health check request failed"
              tail -n 200 /tmp/proxy.log || true
              tail -n 200 /tmp/ffmpeg.log || true
              exit 1
            fi

            if ! jq -e '.ok == true' /tmp/health_live.json >/dev/null 2>&1; then
              echo "❌ Health check reports not ok"
              cat /tmp/health_live.json || true
              tail -n 200 /tmp/proxy.log || true
              tail -n 200 /tmp/ffmpeg.log || true
              exit 1
            fi

            # Video-stall watchdog:
            # compare the newest HLS video segment size over time.
            NEWEST_TS="$(
              find /tmp/hls -maxdepth 1 -type f \
                -name 'segment_*.ts' -printf '%T@ %s %p\n' \
                2>/dev/null | sort -n | tail -n 1 || true
            )"

            if [ -n "$NEWEST_TS" ]; then
              VIDEO_SIZE="$(echo "$NEWEST_TS" | awk '{print $2}')"

              if [ "$VIDEO_SIZE" -gt 0 ] && [ "$VIDEO_SIZE" -eq "$LAST_VIDEO_SIZE" ]; then
                STALL_COUNT=$((STALL_COUNT + 1))
              else
                STALL_COUNT=0
              fi

              LAST_VIDEO_SIZE="$VIDEO_SIZE"
            fi

            # Print only new warning/error-like lines from ffmpeg log.
            if [ -f /tmp/ffmpeg.log ]; then
              TOTAL_LINES="$(wc -l < /tmp/ffmpeg.log || echo 0)"

              if [ "$TOTAL_LINES" -gt "$WARN_CURSOR" ]; then
                sed -n "$((WARN_CURSOR + 1)),${TOTAL_LINES}p" /tmp/ffmpeg.log \
                  | grep -Ei \
                    'error|fail|invalid|discontinuity|non-monoton|corrupt|timed out|speed=' \
                  | tail -n 40 || true

                WARN_CURSOR="$TOTAL_LINES"
              fi
            fi

            if [ "$STALL_COUNT" -ge 3 ]; then
              echo "⚠️ HLS segment size has not advanced for several checks."
              echo "----- health -----"
              cat /tmp/health_live.json || true
              echo "----- ffmpeg tail -----"
              tail -n 120 /tmp/ffmpeg.log || true
              echo "----- restarting FFmpeg -----"

              if kill -0 "$(cat /tmp/proxy.pid)" 2>/dev/null; then
                # Restart only FFmpeg; keep Node and Bore alive.
                kill -USR2 "$(cat /tmp/proxy.pid)" 2>/dev/null || true
              fi

              STALL_COUNT=0
              LAST_VIDEO_SIZE=0
            fi

            sleep 10
          done
