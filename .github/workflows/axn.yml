name: Fast HLS Remux - Bore 30117

on:
  workflow_dispatch:

jobs:
  remux:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KID: "9d29f87efdec3c9fab368f724a62ad0e"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      REFERER: ""

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Installing System Packages..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

          echo "📦 Installing Bore v0.5.0..."
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: System Diagnostics & DRM Validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🔍 SYSTEM DIAGNOSTICS"
          echo "=========================================="
          
          if [ -n "${MPD_URL:-}" ] && [ "${MPD_URL}" != "YOUR_AUTHORIZED_MPD_URL" ]; then
            echo "MPD configured: yes"
          else
            echo "MPD configured: no"
            echo "❌ ERROR: MPD_URL is empty or set to default template value!"
            exit 1
          fi

          echo "Bore port: 30117"
          echo "HLS directory: /dev/shm/hls"
          echo -n "FFmpeg version: "
          ffmpeg -version | head -n 1
          echo -n "Bore version: "
          bore --version

          if [ -n "${CLEARKEY_KID:-}" ] && [ "${CLEARKEY_KID}" != "YOUR_KID" ]; then
            echo "DRM ClearKey configured: yes"
            if ! ffmpeg -decryption_key 00000000000000000000000000000000 -h demuxer=dash >/dev/null 2>&1; then
              echo "⚠️ WARNING: Current FFmpeg build may lack explicit CENC/ClearKey demuxer flags."
              echo "Checking basic DASH support..."
              ffmpeg -h demuxer=dash >/dev/null 2>&1 || { echo "❌ ERROR: FFmpeg missing DASH support!"; exit 1; }
            fi
          else
            echo "DRM ClearKey configured: no (unencrypted source)"
          fi
          echo "=========================================="

      - name: Prepare HLS Directory
        shell: bash
        run: |
          set -euo pipefail

          echo "📁 Cleaning and preparing Shared Memory Directory..."
          sudo rm -rf /dev/shm/hls
          mkdir -p /dev/shm/hls
          chmod 755 /dev/shm/hls

      - name: Start Background HTTP Server
        shell: bash
        run: |
          set -euo pipefail

          cd /dev/shm/hls
          echo "🌐 Starting HTTP server on 0.0.0.0:5000..."

          nohup python3 -m http.server 5000 --bind 0.0.0.0 > /tmp/http.log 2>&1 &
          HTTP_PID=$!
          echo "$HTTP_PID" > /tmp/http.pid

          sleep 1

          if ! kill -0 "$HTTP_PID" 2>/dev/null; then
            echo "❌ HTTP Server failed to start!"
            cat /tmp/http.log
            exit 1
          fi

          echo "✅ HTTP Server running with PID: $HTTP_PID"

      - name: Start Bore Tunnel & Validate Port
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Tunneling local 5000 to bore.pub:30117..."

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          echo "$BORE_PID" > /tmp/bore.pid

          echo "⏳ Waiting for Bore port confirmation..."
          PORT_BOUND=0

          for i in {1..20}; do
            sleep 1

            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "❌ Bore process exited prematurely!"
              cat /tmp/bore.log
              exit 1
            fi
          done

          if [ "$PORT_BOUND" -eq 1 ]; then
            echo "=================================================="
            echo "✅ BORE TUNNEL ESTABLISHED SUCCESSFULLY"
            echo "🔗 Endpoint: http://bore.pub:30117/index.m3u8"
            echo "=================================================="
          else
            echo "❌ ERROR: Bore failed to acquire port 30117 (Port might be in use)."
            echo "--- Bore Log Output ---"
            cat /tmp/bore.log
            exit 1
          fi

      - name: Run Fast Remux Loop
        shell: bash
        run: |
          set -euo pipefail

          HLS_DIR="/dev/shm/hls"

          FFMPEG_ARGS=(
            -hide_banner
            -loglevel warning
            -stats
            -rw_timeout 15000000
          )

          if [ -n "${USER_AGENT:-}" ]; then
            FFMPEG_ARGS+=(-user_agent "${USER_AGENT}")
          fi

          if [ -n "${REFERER:-}" ]; then
            FFMPEG_ARGS+=(-headers "Referer: ${REFERER}"$'\r\n')
          fi

          if [ -n "${CLEARKEY_KEY:-}" ] && [ "${CLEARKEY_KEY}" != "YOUR_KEY" ]; then
            FFMPEG_ARGS+=(-decryption_key "${CLEARKEY_KEY}")
          fi

          FFMPEG_ARGS+=(
            -fflags +genpts+discardcorrupt
            -i "${MPD_URL}"
            -map 0:v:0?
            -map 0:a:0?
            -c copy
            -f hls
            -hls_time 2
            -hls_list_size 6
            -hls_flags delete_segments+omit_endlist+append_list
            -hls_segment_type mpegts
            -hls_allow_cache 0
            "${HLS_DIR}/index.m3u8"
          )

          echo "🔥 Starting FFmpeg Fast-Remux Engine..."

          RETRY_COUNT=0
          MAX_RETRIES=100

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Ensure background processes are still alive before running ffmpeg iteration
            if ! kill -0 $(cat /tmp/http.pid) 2>/dev/null; then
              echo "❌ Fatal: HTTP Server died during stream!"
              cat /tmp/http.log
              exit 1
            fi

            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then
              echo "❌ Fatal: Bore Tunnel died during stream!"
              cat /tmp/bore.log
              exit 1
            fi

            ffmpeg "${FFMPEG_ARGS[@]}" || FFMPEG_EXIT_CODE=$?

            echo "⚠️ FFmpeg disconnected or exited with code: ${FFMPEG_EXIT_CODE:-0}."
            echo "🔄 Attempting reconnection in 3 seconds... (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 3
          done

          echo "❌ Max retries reached. Stream terminated."
          exit 1

      - name: Post-Run Diagnostics (On Failure/Cancellation)
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "📊 POST-RUN DIAGNOSTICS & LOGS"
          echo "=========================================="
          
          echo "--- HTTP Server Log ---"
          cat /tmp/http.log 2>/dev/null || echo "No HTTP log found."

          echo -e "\n--- Bore Tunnel Log ---"
          cat /tmp/bore.log 2>/dev/null || echo "No Bore log found."

          echo -e "\n--- HLS Directory Content ---"
          ls -la /dev/shm/hls 2>/dev/null || echo "HLS dir empty."

          echo -e "\n--- Active Playlist State ---"
          cat /dev/shm/hls/index.m3u8 2>/dev/null || echo "Playlist not created."
