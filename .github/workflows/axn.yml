name: AXN DASH ClearKey -> HLS (Bore 30117)

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""
        type: string

      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""
        type: string

      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""
        type: string

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"

      # GitHub Actions Secret:
      # CLEARKEY_KEY = 32 hexadecimal characters
      # IMPORTANT: this is KEY ONLY, NOT KID:KEY
      CLEARKEY_KEY: ${{ secrets.CLEARKEY_KEY }}

      USER_AGENT: "Dalvik/2.1.0"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Resolve runtime environment
        shell: bash
        env:
          INPUT_MPD: ${{ github.event.inputs.mpd_url }}
          INPUT_UA: ${{ github.event.inputs.user_agent }}
          INPUT_REFERER: ${{ github.event.inputs.referer }}
        run: |
          set -euo pipefail

          EFFECTIVE_MPD="${INPUT_MPD:-}"
          EFFECTIVE_UA="${INPUT_UA:-}"
          EFFECTIVE_REFERER="${INPUT_REFERER:-}"

          if [[ -z "$EFFECTIVE_MPD" ]]; then
            EFFECTIVE_MPD="$MPD_URL"
          fi

          if [[ -z "$EFFECTIVE_UA" ]]; then
            EFFECTIVE_UA="$USER_AGENT"
          fi

          if [[ -z "$EFFECTIVE_REFERER" ]]; then
            EFFECTIVE_REFERER="$REFERER"
          fi

          if [[ -z "${CLEARKEY_KEY:-}" ]]; then
            echo "ERROR: CLEARKEY_KEY is empty."
            exit 1
          fi

          if ! [[ "$CLEARKEY_KEY" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "ERROR: CLEARKEY_KEY must contain exactly 32 hexadecimal characters."
            exit 1
          fi

          {
            echo "MPD_URL=$EFFECTIVE_MPD"
            echo "USER_AGENT=$EFFECTIVE_UA"
            echo "REFERER=$EFFECTIVE_REFERER"
          } >> "$GITHUB_ENV"

          echo "MPD: $EFFECTIVE_MPD"
          echo "User-Agent: configured"
          echo "Referer: configured"
          echo "ClearKey: configured"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            nginx \
            curl \
            ca-certificates \
            jq \
            dnsutils \
            bc

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 3

          echo
          echo "===== FFprobe ====="
          ffprobe -version | head -n 2

          echo
          echo "===== CPU ====="
          lscpu | grep -E \
            'Model name|CPU\(s\)|Thread|Core|MHz' || true

          echo
          echo "===== MEMORY ====="
          free -h

      - name: Verify FFmpeg ClearKey support
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking CENC options..."

          if ! ffmpeg -hide_banner -h full 2>&1 \
            | grep -q -- "-cenc_decryption_key"; then

            echo "ERROR: This FFmpeg build does not expose -cenc_decryption_key."
            echo
            ffmpeg -hide_banner -h full 2>&1 \
              | grep -i -E "cenc|decryption|decrypt|key" || true

            exit 1
          fi

          echo "OK: -cenc_decryption_key is available."

      - name: Test AXN DASH input and ClearKey
        shell: bash
        run: |
          set -euo pipefail

          rm -f /tmp/axn-test.mp4

          echo "Testing DASH input + ClearKey + decoding..."

          timeout 45s ffmpeg \
            -hide_banner \
            -nostdin \
            -loglevel info \
            -user_agent "$USER_AGENT" \
            -headers "Referer: $REFERER"$'\r\n' \
            -cenc_decryption_key "$CLEARKEY_KEY" \
            -fflags +genpts+discardcorrupt \
            -err_detect ignore_err \
            -i "$MPD_URL" \
            -map 0:v:0 \
            -map 0:a:0 \
            -t 10 \
            -f null -

          echo "ClearKey/DASH test completed."

      - name: Benchmark H264 encoder on GitHub Runner
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating synthetic 1080p benchmark source..."

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "testsrc2=size=1920x1080:rate=25" \
            -t 10 \
            -pix_fmt yuv420p \
            /tmp/benchmark-input.mp4

          echo
          echo "===== libx264 benchmark ====="

          for PRESET in ultrafast superfast veryfast; do
            echo
            echo "----------------------------------------"
            echo "Preset: $PRESET"
            echo "----------------------------------------"

            ffmpeg \
              -hide_banner \
              -benchmark \
              -i /tmp/benchmark-input.mp4 \
              -an \
              -c:v libx264 \
              -preset "$PRESET" \
              -pix_fmt yuv420p \
              -r 25 \
              -t 10 \
              -f null - \
              2>&1 | grep -E \
                "frame=|speed=|bench:|encoded" || true
          done

      - name: Prepare RAM HLS storage
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /dev/shm/hls

          sudo mkdir -p /dev/shm/hls/axn

          sudo chmod -R 777 /dev/shm/hls

          df -h /dev/shm

      - name: Configure nginx
        shell: bash
        run: |
          set -euo pipefail

          sudo tee /etc/nginx/nginx.conf > /dev/null <<'NGINX'
          worker_processes auto;

          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;

              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;

              keepalive_timeout 15;

              access_log off;
              error_log /dev/null crit;

              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm;

                      try_files $uri =404;

                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                      add_header Access-Control-Allow-Headers "*" always;

                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      add_header Pragma "no-cache" always;
                      add_header Expires "0" always;
                  }

                  location = /healthz {
                      default_type application/json;

                      return 200 '{"ok":true}';
                  }
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl restart nginx

      - name: Create FFmpeg restream supervisor
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/restream-supervisor.sh <<'EOF'
          #!/usr/bin/env bash

          set -u

          HLS_DIR="/dev/shm/hls/axn"
          PLAYLIST="${HLS_DIR}/index.m3u8"
          SEGMENT_PATTERN="${HLS_DIR}/seg%06d.ts"

          FFMPEG_LOG="/tmp/ffmpeg.log"
          SUPERVISOR_LOG="/tmp/supervisor.log"

          MPD_URL="${MPD_URL:?}"
          CLEARKEY_KEY="${CLEARKEY_KEY:?}"

          USER_AGENT="${USER_AGENT:-Dalvik/2.1.0}"
          REFERER="${REFERER:-https://mytvnet.vn/}"

          FFMPEG_PID=""
          RESTARTS=0

          log() {
              echo "$(date -Is) $*" | tee -a "$SUPERVISOR_LOG"
          }

          safe_origin() {
              printf '%s' "$REFERER" \
                | sed -E 's#^(https?://[^/]+).*#\1#'
          }

          stop_ffmpeg() {
              if [[ -n "${FFMPEG_PID}" ]] &&
                 kill -0 "${FFMPEG_PID}" 2>/dev/null; then

                  kill -TERM "${FFMPEG_PID}" 2>/dev/null || true

                  for _ in {1..20}; do
                      if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                          break
                      fi

                      sleep 0.2
                  done

                  kill -KILL "${FFMPEG_PID}" 2>/dev/null || true
              fi

              FFMPEG_PID=""
          }

          cleanup_hls() {
              rm -f \
                "${HLS_DIR}"/*.m3u8 \
                "${HLS_DIR}"/*.ts \
                "${HLS_DIR}"/*.tmp
          }

          start_ffmpeg() {
              cleanup_hls

              : > "$FFMPEG_LOG"

              local origin
              origin="$(safe_origin)"

              log "[FFmpeg] starting"

              ffmpeg \
                -hide_banner \
                -loglevel warning \
                -nostdin \
                -stats \
                \
                -reconnect 1 \
                -reconnect_streamed 1 \
                -reconnect_on_network_error 1 \
                -reconnect_delay_max 3 \
                -rw_timeout 10000000 \
                \
                -user_agent "$USER_AGENT" \
                -headers "Referer: ${REFERER}"$'\r\n'"Origin: ${origin}"$'\r\n' \
                \
                -cenc_decryption_key "$CLEARKEY_KEY" \
                \
                -fflags +genpts+discardcorrupt \
                -err_detect ignore_err \
                \
                -i "$MPD_URL" \
                \
                -map 0:v:0? \
                -map 0:a:0? \
                \
                -c:v libx264 \
                -preset veryfast \
                -tune zerolatency \
                -profile:v main \
                -level 4.0 \
                -pix_fmt yuv420p \
                \
                -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2" \
                \
                -r 25 \
                \
                -b:v 2500k \
                -maxrate 3000k \
                -bufsize 6000k \
                \
                -g 50 \
                -keyint_min 50 \
                -sc_threshold 0 \
                \
                -c:a aac \
                -b:a 128k \
                -ar 48000 \
                -ac 2 \
                -af "aresample=async=1000:first_pts=0" \
                \
                -max_muxing_queue_size 4096 \
                -avoid_negative_ts make_zero \
                \
                -f hls \
                -hls_time 2 \
                -hls_list_size 8 \
                -hls_delete_threshold 3 \
                \
                -hls_flags delete_segments+independent_segments+omit_endlist+temp_file+program_date_time \
                \
                -hls_segment_type mpegts \
                -hls_start_number_source epoch \
                \
                -hls_segment_filename "$SEGMENT_PATTERN" \
                "$PLAYLIST" \
                > "$FFMPEG_LOG" 2>&1 &

              FFMPEG_PID=$!

              log "[FFmpeg] pid=$FFMPEG_PID"
          }

          trap 'stop_ffmpeg; exit 0' TERM INT EXIT

          while true; do

              start_ffmpeg

              while kill -0 "$FFMPEG_PID" 2>/dev/null; do

                  sleep 5

                  if [[ -s "$PLAYLIST" ]]; then

                      now="$(date +%s)"

                      mtime="$(
                          stat -c %Y "$PLAYLIST" 2>/dev/null || echo 0
                      )"

                      age=$((now - mtime))

                      if [[ "$age" -gt 15 ]]; then

                          log "[Watchdog] playlist stale (${age}s)"

                          stop_ffmpeg

                          break
                      fi

                  else

                      if [[ ! -d "/proc/$FFMPEG_PID" ]]; then
                          break
                      fi

                      start_time="$(
                          stat -c %Y "/proc/$FFMPEG_PID" 2>/dev/null || date +%s
                      )"

                      age=$(( $(date +%s) - start_time ))

                      if [[ "$age" -gt 30 ]]; then

                          log "[Watchdog] no playlist after ${age}s"

                          stop_ffmpeg

                          break
                      fi
                  fi
              done

              RESTARTS=$((RESTARTS + 1))

              log "[Supervisor] restart count=$RESTARTS"

              tail -n 60 "$FFMPEG_LOG" || true

              sleep 2
          done
          EOF

          chmod +x /tmp/restream-supervisor.sh

      - name: Start restream
        shell: bash
        run: |
          set -euo pipefail

          nohup /tmp/restream-supervisor.sh \
            > /tmp/restream-supervisor-stdout.log 2>&1 &

          echo $! > /tmp/restream-supervisor.pid

      - name: Wait for HLS readiness
        shell: bash
        run: |
          set -euo pipefail

          READY=0

          for i in {1..120}; do

              sleep 1

              if curl -fsS \
                "http://127.0.0.1:5000/axn/index.m3u8" \
                > /tmp/live.m3u8 2>/dev/null; then

                  if grep -q '^#EXTM3U' /tmp/live.m3u8 \
                    && grep -q '^#EXT-X-TARGETDURATION' /tmp/live.m3u8 \
                    && grep -q '^#EXTINF:' /tmp/live.m3u8 \
                    && grep -Eq '^seg[0-9]+\.ts$' /tmp/live.m3u8; then

                      READY=1
                      break
                  fi
              fi
          done

          if [[ "$READY" -ne 1 ]]; then

              echo "ERROR: HLS playlist not ready."

              echo "===== PLAYLIST ====="
              cat /tmp/live.m3u8 2>/dev/null || true

              echo "===== SUPERVISOR ====="
              tail -n 200 \
                /tmp/restream-supervisor-stdout.log || true

              echo "===== FFMPEG ====="
              tail -n 200 /tmp/ffmpeg.log || true

              exit 1
          fi

          echo "HLS playlist is ready."

          SEGMENT_NAME="$(
            grep -E '^seg[0-9]+\.ts$' /tmp/live.m3u8 \
            | tail -n 1
          )"

          if [[ -z "$SEGMENT_NAME" ]]; then
              echo "ERROR: no segment found."
              exit 1
          fi

          curl -fsS \
            "http://127.0.0.1:5000/axn/$SEGMENT_NAME" \
            -o /tmp/segment_sample.ts

          test -s /tmp/segment_sample.ts

          echo "Segment OK: $SEGMENT_NAME"

      - name: Validate HLS output
        shell: bash
        run: |
          set -euo pipefail

          ffprobe \
            -hide_banner \
            -v warning \
            -i "http://127.0.0.1:5000/axn/index.m3u8" \
            -show_streams \
            -show_format \
            > /tmp/ffprobe_streams.txt \
            2> /tmp/ffprobe_warn.txt

          echo "===== FFPROBE ====="
          cat /tmp/ffprobe_streams.txt

          grep -qi 'codec_name=h264' /tmp/ffprobe_streams.txt
          grep -qi 'width=1920' /tmp/ffprobe_streams.txt
          grep -qi 'height=1080' /tmp/ffprobe_streams.txt
          grep -qi 'r_frame_rate=25/1' /tmp/ffprobe_streams.txt

          grep -qi 'codec_name=aac' /tmp/ffprobe_streams.txt
          grep -qi 'sample_rate=48000' /tmp/ffprobe_streams.txt
          grep -qi 'channels=2' /tmp/ffprobe_streams.txt

          echo
          echo "=========================================="
          echo "HLS OUTPUT VALID"
          echo "H264 1920x1080 25fps"
          echo "AAC 48000Hz stereo"
          echo "=========================================="

      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/bore.tar.gz

          tar -xzf /tmp/bore.tar.gz -C /tmp

          sudo install \
            -m 755 \
            /tmp/bore \
            /usr/local/bin/bore

          bore --version

          rm -f \
            /tmp/bore.tar.gz \
            /tmp/bore

      - name: Start Bore and keep stream alive
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 \
            --to bore.pub \
            --port 30117 \
            > /tmp/bore.log 2>&1 &

          echo $! > /tmp/bore.pid

          PORT_BOUND=0

          for i in {1..30}; do

              sleep 1

              if grep -q \
                'listening at bore.pub:30117' \
                /tmp/bore.log; then

                  PORT_BOUND=1
                  break
              fi
          done

          if [[ "$PORT_BOUND" -ne 1 ]]; then

              echo "ERROR: Bore tunnel failed."

              cat /tmp/bore.log || true

              exit 1
          fi

          echo
          echo "=========================================="
          echo "AXN HLS STREAM READY"
          echo "=========================================="
          echo "http://bore.pub:30117/axn/index.m3u8"
          echo
          echo "Local:"
          echo "http://127.0.0.1:5000/axn/index.m3u8"
          echo "=========================================="

          while true; do

              if ! kill -0 \
                "$(cat /tmp/restream-supervisor.pid)" \
                2>/dev/null; then

                  echo "ERROR: supervisor died."

                  tail -n 200 \
                    /tmp/restream-supervisor-stdout.log || true

                  exit 1
              fi

              if ! kill -0 \
                "$(cat /tmp/bore.pid)" \
                2>/dev/null; then

                  echo "ERROR: Bore died."

                  cat /tmp/bore.log || true

                  exit 1
              fi

              if ! curl -fsS \
                "http://127.0.0.1:5000/healthz" \
                > /dev/null; then

                  echo "ERROR: nginx health check failed."

                  exit 1
              fi

              if ! curl -fsS \
                "http://127.0.0.1:5000/axn/index.m3u8" \
                > /tmp/health_live.m3u8; then

                  echo "ERROR: HLS playlist unavailable."

                  tail -n 100 /tmp/ffmpeg.log || true

                  exit 1
              fi

              if ! grep -q '^#EXTINF:' \
                /tmp/health_live.m3u8; then

                  echo "ERROR: playlist has no segments."

                  exit 1
              fi

              echo "----- status -----"

              stat \
                -c 'playlist_mtime=%y size=%s' \
                /dev/shm/hls/axn/index.m3u8 \
                2>/dev/null || true

              echo "Bore: alive"
              echo "Supervisor: alive"

              sleep 15
          done
