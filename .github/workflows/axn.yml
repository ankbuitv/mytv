name: CHRTV AXN Restream (Fixed Auto-Clean DNS + Bore)

on:
  workflow_dispatch:

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl tar jq
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/bore

      - name: Configure Nginx for High Performance HLS
        run: |
          sudo rm -rf /dev/shm/hls/axn
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

          cat << 'EOF' | sudo tee /etc/nginx/nginx.conf > /dev/null
          worker_processes auto;
          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;

              access_log off;
              error_log /dev/null crit;

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm/hls/axn;
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      
                      types {
                          application/vnd.apple.mpegurl m3u8;
                          video/mp2t ts;
                      }
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start Restream Engine & Auto Update DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
          CLEARKEY: ${{ secrets.CLEARKEY }}
          TARGET_PORT: "14211"
          STREAM_MPD: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
        run: |
          # 1. Bật Bore Tunnel đẩy cổng Nginx 5000 ra ngoài 14211
          echo "🚀 Starting Bore Tunnel on port ${TARGET_PORT}..."
          (while true; do bore local 5000 --to bore.pub --port "${TARGET_PORT}" >> /tmp/bore.log 2>&1; sleep 2; done) &
          sleep 5

          echo "--- 📋 BORE LOG CHECK ---"
          cat /tmp/bore.log | tail -n 10
          echo "------------------------"

          # 2. Xóa sạch record cũ nếu có để tránh xung đột A vs CNAME
          echo "🌐 Cleaning existing records & updating Cloudflare DNS..."
          
          FULL_DOMAIN="${CF_SUBDOMAIN}.ankb.qzz.io"
          
          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${FULL_DOMAIN}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')

          if [ "$RECORD_ID" != "null" ] && [ -n "$RECORD_ID" ]; then
            echo "🗑️ Deleting existing record ID: ${RECORD_ID}..."
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" > /dev/null
          fi

          # 3. Tạo mới CNAME trỏ về bore.pub (Mây Xám - DNS Only)
          echo "✨ Creating fresh CNAME -> bore.pub..."
          CREATE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"CNAME\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"bore.pub\",\"ttl\":120,\"proxied\":false}")

          echo "✅ Cloudflare Response: $(echo $CREATE_RES | jq -r '.success')"

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 4. Chạy FFmpeg Engine - Khô máu tài nguyên, ép FPS & Khóa A/V Sync tuyệt đối
          while true; do
            echo "🔥 Starting ULTRA-ROBUST FFmpeg Stream Engine..."
            
            # Tự động dọn dẹp các segment HLS cũ trong RAM ảo trước khi dựng lại
            rm -rf /dev/shm/hls/axn/*
            
            DEC_KEY="$(echo "${CLEARKEY}" | awk -F':' '{print $NF}')"

            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -cenc_decryption_key "${DEC_KEY}" \
              -err_detect ignore_err \
              -probesize 100M -analyzeduration 100M \
              -fflags +genpts+discardcorrupt+igndts \
              -rw_timeout 10000000 \
              -i "${STREAM_MPD}" \
              -vf "fps=25,setpts=PTS-STARTPTS" \
              -af "aresample=async=1000:min_hard_comp=0.100000:first_pts=0,asetpts=PTS-STARTPTS" \
              -c:v libx264 -preset veryfast -profile:v high -level 4.1 -tune zerolatency \
              -threads 0 \
              -crf 23 -maxrate 3000k -bufsize 6000k \
              -g 50 -keyint_min 50 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -map 0:v:0 -map 0:a:0 \
              -f hls \
              -hls_time 2 \
              -hls_list_size 12 \
              -hls_flags delete_segments+omit_endlist+independent_segments+cgop \
              -hls_segment_filename "/dev/shm/hls/axn/seg%05d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠️ FFmpeg dropped or restarted. Re-initializing in 2s..."
            sleep 2
          done
