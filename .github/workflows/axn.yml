name: Ultimate DASH Zero-PTS Proxy - Bore 30117

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""
      clearkey_key:
        description: "Override ClearKey hex key (optional)"
        required: false
        default: ""
      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""
      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Resolve runtime env from workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          MPD_EFFECTIVE="${{ github.event.inputs.mpd_url }}"
          KEY_EFFECTIVE="${{ github.event.inputs.clearkey_key }}"
          UA_EFFECTIVE="${{ github.event.inputs.user_agent }}"
          REF_EFFECTIVE="${{ github.event.inputs.referer }}"

          if [ -z "${MPD_EFFECTIVE}" ]; then MPD_EFFECTIVE="${MPD_URL}"; fi
          if [ -z "${KEY_EFFECTIVE}" ]; then KEY_EFFECTIVE="${CLEARKEY_KEY}"; fi
          if [ -z "${UA_EFFECTIVE}" ]; then UA_EFFECTIVE="${USER_AGENT}"; fi
          if [ -z "${REF_EFFECTIVE}" ]; then REF_EFFECTIVE="${REFERER}"; fi

          if [ -z "${MPD_EFFECTIVE}" ] || [ -z "${KEY_EFFECTIVE}" ]; then
            echo "❌ MPD URL hoặc ClearKey bị rỗng."
            exit 1
          fi

          {
            echo "MPD_URL=${MPD_EFFECTIVE}"
            echo "CLEARKEY_KEY=${KEY_EFFECTIVE}"
            echo "USER_AGENT=${UA_EFFECTIVE}"
            echo "REFERER=${REF_EFFECTIVE}"
          } >> "$GITHUB_ENV"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates nodejs ffmpeg
          node -v
          ffmpeg -version | head -n 1

      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          bore --version
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Create proxy server script (single-process multi-client)
        shell: bash
        run: |
          cat << 'EOF' > /tmp/server.js
          const http = require('http');
          const { spawn } = require('child_process');

          const MPD_URL = process.env.MPD_URL;
          const CLEARKEY_KEY = process.env.CLEARKEY_KEY;
          const USER_AGENT = process.env.USER_AGENT || 'Mozilla/5.0';
          const REFERER = process.env.REFERER || 'https://mytvnet.vn/';

          const LISTEN_HOST = '0.0.0.0';
          const LISTEN_PORT = 5000;
          const STREAM_PATH = '/stream.ts';
          const HEALTH_PATH = '/healthz';

          const RING_BUFFER_MAX = 6 * 1024 * 1024;
          const MAX_BACKPRESSURE_BYTES = 8 * 1024 * 1024;
          const FFMPEG_RESTART_DELAY_MS = 1500;

          const channel = {
            id: 'axn',
            proc: null,
            clients: new Set(),
            ring: [],
            ringSize: 0,
            manualKill: false,
            bytesOut: 0,
            startedAt: 0,
          };

          function log(...args) {
            console.log(new Date().toISOString(), ...args);
          }

          function buildFFmpegArgs() {
            const origin = (() => {
              try { return new URL(REFERER).origin; } catch { return 'https://mytvnet.vn'; }
            })();

            const customHeaders = `Referer: ${REFERER}\r\nOrigin: ${origin}\r\n`;

            return [
              '-hide_banner', '-loglevel', 'warning',

              '-reconnect', '1',
              '-reconnect_streamed', '1',
              '-reconnect_on_network_error', '1',
              '-reconnect_delay_max', '2',

              '-user_agent', USER_AGENT,
              '-headers', customHeaders,
              '-cenc_decryption_key', CLEARKEY_KEY,
              '-fflags', '+genpts+discardcorrupt+nobuffer',
              '-i', MPD_URL,

              '-map', '0:v:0?',
              '-map', '0:a:0?',

              '-c:v', 'copy',
              '-bsf:v', 'h264_mp4toannexb,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',

              '-c:a', 'copy',
              '-bsf:a', 'setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS',

              '-max_muxing_queue_size', '4096',
              '-muxdelay', '0.3',
              '-muxpreload', '0.3',
              '-avoid_negative_ts', 'make_zero',
              '-fps_mode', 'passthrough',

              '-f', 'mpegts',
              '-mpegts_flags', '+resend_headers+pat_pmt_at_frames+initial_discontinuity',
              '-mpegts_copyts', '0',
              '-pcr_period', '20',
              '-pat_period', '0.1',
              '-pmt_period', '0.1',
              'pipe:1',
            ];
          }

          function stopFFmpeg(force = false) {
            if (!channel.proc) return;
            channel.manualKill = true;
            const p = channel.proc;
            channel.proc = null;
            try {
              p.kill(force ? 'SIGKILL' : 'SIGTERM');
            } catch (e) {
              log('[FFmpeg] kill error:', e.message);
            }
          }

          function startFFmpeg() {
            if (channel.proc) return channel.proc;

            channel.manualKill = false;
            channel.startedAt = Date.now();
            log(`[FFmpeg] Starting for ${channel.id}`);

            const proc = spawn('ffmpeg', buildFFmpegArgs(), {
              stdio: ['ignore', 'pipe', 'pipe'],
            });

            channel.proc = proc;

            proc.stderr.on('data', (d) => {
              const msg = d.toString().trim();
              if (msg) log('[FFmpeg]', msg);
            });

            proc.stdout.on('data', (chunk) => {
              channel.ring.push(chunk);
              channel.ringSize += chunk.length;
              channel.bytesOut += chunk.length;

              while (channel.ringSize > RING_BUFFER_MAX) {
                const old = channel.ring.shift();
                if (old) channel.ringSize -= old.length;
              }

              for (const res of channel.clients) {
                if (res.writableEnded || res.destroyed) {
                  channel.clients.delete(res);
                  continue;
                }

                res.write(chunk);

                const pending = res.socket?.writableLength || 0;
                if (pending > MAX_BACKPRESSURE_BYTES) {
                  log(`[Proxy] Disconnect slow client, pending=${pending}`);
                  res.destroy();
                  channel.clients.delete(res);
                }
              }
            });

            proc.on('exit', (code, signal) => {
              const wasManual = channel.manualKill;
              channel.proc = null;
              log(`[FFmpeg] Exit code=${code} signal=${signal} manual=${wasManual}`);

              if (!wasManual && channel.clients.size > 0) {
                setTimeout(() => {
                  if (channel.clients.size > 0 && !channel.proc) startFFmpeg();
                }, FFMPEG_RESTART_DELAY_MS);
              }
            });

            proc.on('error', (err) => {
              log('[FFmpeg] process error:', err.message);
            });

            return proc;
          }

          function addClient(req, res) {
            res.on('error', (err) => log('[Client res error]', err.message));
            req.on('error', (err) => log('[Client req error]', err.message));
            req.socket?.on('error', (err) => log('[Client socket error]', err.message));
            req.socket?.setNoDelay(true);

            res.writeHead(200, {
              'Content-Type': 'video/mp2t',
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0',
              'Access-Control-Allow-Origin': '*',
              'X-Accel-Buffering': 'no',
            });

            for (const chunk of channel.ring) {
              if (res.writableEnded || res.destroyed) break;
              res.write(chunk);
            }

            channel.clients.add(res);
            log(`[Client] Connected. active=${channel.clients.size}`);

            if (!channel.proc) startFFmpeg();

            const onClose = () => {
              channel.clients.delete(res);
              log(`[Client] Disconnected. active=${channel.clients.size}`);
              if (channel.clients.size === 0) {
                log('[FFmpeg] No clients left, stopping process');
                stopFFmpeg(true);
              }
            };

            req.on('close', onClose);
            res.on('close', onClose);
          }

          const server = http.createServer((req, res) => {
            if (req.method !== 'GET') {
              res.writeHead(405, { 'Content-Type': 'text/plain' });
              res.end('Method Not Allowed');
              return;
            }

            if (req.url === HEALTH_PATH) {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({
                ok: true,
                ffmpegRunning: !!channel.proc,
                clients: channel.clients.size,
                ringBytes: channel.ringSize,
                totalOutBytes: channel.bytesOut,
              }));
              return;
            }

            if (req.url === '/favicon.ico') {
              res.writeHead(404).end();
              return;
            }

            if (req.url !== STREAM_PATH) {
              res.writeHead(404, { 'Content-Type': 'text/plain' });
              res.end('Use /stream.ts');
              return;
            }

            addClient(req, res);
          });

          server.keepAliveTimeout = 0;
          server.headersTimeout = 0;
          server.timeout = 0;
          server.requestTimeout = 0;

          setInterval(() => {
            log(`[Stats] ffmpeg=${channel.proc ? 'up' : 'down'} clients=${channel.clients.size} ring=${channel.ringSize} bytesOut=${channel.bytesOut}`);
          }, 30000).unref();

          process.on('uncaughtException', (err) => {
            log('[uncaughtException]', err.stack || err.message);
          });

          process.on('unhandledRejection', (reason) => {
            log('[unhandledRejection]', reason);
          });

          process.on('SIGTERM', () => {
            log('SIGTERM received, shutting down');
            stopFFmpeg(true);
            server.close(() => process.exit(0));
          });

          process.on('SIGINT', () => {
            log('SIGINT received, shutting down');
            stopFFmpeg(true);
            server.close(() => process.exit(0));
          });

          server.listen(LISTEN_PORT, LISTEN_HOST, () => {
            log(`🚀 Ultimate DASH Zero-PTS Proxy listening on http://${LISTEN_HOST}:${LISTEN_PORT}${STREAM_PATH}`);
          });
          EOF

      - name: Start proxy + bore and monitor
        shell: bash
        run: |
          set -euo pipefail

          nohup node /tmp/server.js > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 2

          curl -fsS http://127.0.0.1:5000/healthz >/dev/null

          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..30}; do
            sleep 1
            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -eq 0 ]; then
            echo "❌ ERROR: Bore tunnel failed to connect"
            cat /tmp/bore.log
            cat /tmp/proxy.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ LINK STREAM MPEG-TS PRODUCTION READY"
          echo "👉 http://bore.pub:30117/stream.ts"
          echo "(Tip: dùng VLC/Tivimate với URL .ts trực tiếp)"
          echo "=================================================="

          # Keep job alive and monitor both processes.
          while true; do
            if ! kill -0 "$(cat /tmp/proxy.pid)" 2>/dev/null; then
              echo "❌ Proxy process died"
              tail -n 200 /tmp/proxy.log || true
              exit 1
            fi

            if ! kill -0 "$(cat /tmp/bore.pid)" 2>/dev/null; then
              echo "❌ Bore process died"
              tail -n 200 /tmp/bore.log || true
              exit 1
            fi

            sleep 10
          done
