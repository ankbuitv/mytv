name: The Perfect HLS Remux - Bore 30117

on:
  workflow_dispatch:

jobs:
  remux:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Install dependencies & High-Performance Web Server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl lighttpd

          # Cài đặt Bore Tunnel
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Prepare HLS Ramdisk (Chạy trên RAM siêu tốc)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /dev/shm/hls
          mkdir -p /dev/shm/hls
          chmod 777 /dev/shm/hls

      - name: Configure and Start Lighttpd Web Server
        shell: bash
        run: |
          set -euo pipefail
          cat << 'EOF' > /tmp/lighttpd.conf
          server.document-root = "/dev/shm/hls"
          server.port = 5000
          server.bind = "0.0.0.0"
          mimetype.assign = (
            ".m3u8" => "application/vnd.apple.mpegurl",
            ".m4s"  => "video/iso.segment",
            ".mp4"  => "video/mp4"
          )
          EOF
          lighttpd -f /tmp/lighttpd.conf
          echo "✅ Lighttpd Web Server running on port 5000"

      - name: Start Bore Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          sleep 3
          if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
            echo "✅ BORE TUNNEL ESTABLISHED: http://bore.pub:30117/index.m3u8"
          else
            echo "❌ BORE FAILED. Log:"
            cat /tmp/bore.log
            exit 1
          fi

      - name: Start FFmpeg Remux (fMP4 - Giải quyết triệt để lỗi Sync)
        shell: bash
        run: |
          set -euo pipefail
          
          echo "🔥 Bắt đầu kéo luồng với định dạng fMP4 (Cam kết không rớt Audio)..."
          
          # Vòng lặp giữ FFmpeg sống mãi
          while true; do
            ffmpeg -hide_banner -loglevel warning -stats \
              -user_agent "${USER_AGENT}" \
              -headers "Referer: ${REFERER}"$'\r\n'"Origin: https://mytvnet.vn"$'\r\n' \
              -cenc_decryption_key "${CLEARKEY_KEY}" \
              -i "${MPD_URL}" \
              -map 0:v:0? -map 0:a:0? \
              -c:v copy -c:a copy \
              -f hls \
              -hls_time 4 \
              -hls_list_size 12 \
              -hls_flags delete_segments+temp_file \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename "init.mp4" \
              -hls_segment_filename "/dev/shm/hls/seg_%d.m4s" \
              "/dev/shm/hls/index.m3u8" || true
              
            echo "⚠️ Luồng bị gián đoạn. FFmpeg đang tự động khởi động lại sau 3s..."
            sleep 3
          done
