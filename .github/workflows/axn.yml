name: CHRTV AXN Restream (Fix 308 Redirect & Smooth Stream)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Configure Nginx For HLS
        run: |
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls
          printf 'worker_processes auto;\nevents { worker_connections 2048; }\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout 65s;\n    server {\n        listen 5000 default_server;\n        server_name _;\n        location / {\n            root /dev/shm;\n            add_header Cache-Control "no-cache, no-store, must-revalidate";\n            add_header Access-Control-Allow-Origin *;\n            add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";\n        }\n    }\n}\n' | sudo tee /tmp/nginx.conf > /dev/null
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Restream & Dynamic DNS Update
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
        run: |
          # ====================================================
          # 🔑 THÔNG SỐ CỐ ĐỊNH
          # ====================================================
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT=18080
          # ====================================================

          # Tạo thư mục RAM & Master Playlist
          mkdir -p /dev/shm/hls/axn
          rm -rf /dev/shm/hls/axn/*
          
          printf "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:BANDWIDTH=2000000\nindex.m3u8\n" > /dev/shm/hls/axn/master.m3u8

          # 1. Khóa cố định PORT qua Bore
          echo "► Đang kết nối Bore tới cổng $TARGET_PORT..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $TARGET_PORT >> bore.log 2>&1
              echo "⚠ Bore ngắt kết nối, đang thử nối lại..."
              sleep 3
            done
          ) &
          sleep 5

          # 2. Lấy IP Bore và Cập nhật thẳng vào DNS Cloudflare
          BORE_IP=$(dig +short bore.pub | tail -n1)
          
          if [ -n "$BORE_IP" ] && [ -n "$CF_API_TOKEN" ]; then
            echo "► Đang cập nhật IP $BORE_IP lên Cloudflare Domain..."
            
            RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CF_SUBDOMAIN}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4)

            if [ -n "$RECORD_ID" ]; then
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${RECORD_ID}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"${BORE_IP}\",\"ttl\":120,\"proxied\":false}"
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"${CF_SUBDOMAIN}\",\"content\":\"${BORE_IP}\",\"ttl\":120,\"proxied\":false}"
            fi
            echo "✅ Cập nhật DNS Cloudflare thành công!"
          fi

          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "👉 STREAM PATH : /hls/axn/master.m3u8"
          echo "===================================================="

          # 3. Vòng lặp FFmpeg (Pass-Through Copy mượt mà, không bị dup frame)
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          while true; do
            echo "► Đang chạy FFmpeg Restream..."
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -user_agent "$USER_AGENT" \
              -fflags +genpts+discardcorrupt \
              -reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 \
              -reconnect_on_http_error 404,408,429,5xx \
              -rw_timeout 10000000 \
              -cenc_decryption_key "$CLEARKEY" \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy \
              -c:a copy \
              -avoid_negative_ts make_zero \
              -f hls \
              -hls_time 4 \
              -hls_list_size 10 \
              -hls_delete_threshold 5 \
              -hls_flags delete_segments+omit_endlist+temp_file \
              -hls_segment_filename "/dev/shm/hls/axn/seg%06d.ts" \
              "/dev/shm/hls/axn/index.m3u8" || true

            echo "⚠ FFmpeg ngắt kết nối. Đang khởi động lại sau 3 giây..."
            sleep 3
          done
