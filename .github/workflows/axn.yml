name: AXN DASH ClearKey -> HLS (Bore 30117)

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""
      clearkey_key:
        description: "Override ClearKey hex key (optional)"
        required: false
        default: ""
      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""
      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KEY: ${{ secrets.CLEARKEY_KEY }}
      USER_AGENT: "Dalvik/2.1.0"
      REFERER: "https://mytvnet.vn/"

    steps:

      # ============================================================
      # Resolve runtime configuration
      # ============================================================
      - name: Resolve runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          MPD_EFFECTIVE="${{ github.event.inputs.mpd_url }}"
          KEY_EFFECTIVE="${{ github.event.inputs.clearkey_key }}"
          UA_EFFECTIVE="${{ github.event.inputs.user_agent }}"
          REF_EFFECTIVE="${{ github.event.inputs.referer }}"

          [[ -n "$MPD_EFFECTIVE" ]] || MPD_EFFECTIVE="$MPD_URL"
          [[ -n "$KEY_EFFECTIVE" ]] || KEY_EFFECTIVE="${CLEARKEY_KEY:-}"
          [[ -n "$UA_EFFECTIVE" ]] || UA_EFFECTIVE="$USER_AGENT"
          [[ -n "$REF_EFFECTIVE" ]] || REF_EFFECTIVE="$REFERER"

          if [[ -z "$MPD_EFFECTIVE" ]]; then
            echo "ERROR: MPD URL is empty"
            exit 1
          fi

          if [[ -z "$KEY_EFFECTIVE" ]]; then
            echo "ERROR: CLEARKEY_KEY is empty"
            exit 1
          fi

          # Basic validation: ClearKey is a 32-byte AES key represented
          # as 64 hexadecimal characters.
          if ! [[ "$KEY_EFFECTIVE" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "ERROR: CLEARKEY_KEY must be exactly 32 hexadecimal characters"
            exit 1
          fi

          {
            echo "MPD_URL=$MPD_EFFECTIVE"
            echo "CLEARKEY_KEY=$KEY_EFFECTIVE"
            echo "USER_AGENT=$UA_EFFECTIVE"
            echo "REFERER=$REF_EFFECTIVE"
          } >> "$GITHUB_ENV"

          echo "MPD configured"
          echo "ClearKey configured"
          echo "User-Agent: $UA_EFFECTIVE"
          echo "Referer: $REF_EFFECTIVE"

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            ca-certificates \
            nginx \
            jq \
            dnsutils

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 5

          echo "===== FFprobe ====="
          ffprobe -version | head -n 2

          echo "===== Nginx ====="
          nginx -v

      # ============================================================
      # Verify FFmpeg ClearKey support
      # ============================================================
      - name: Verify FFmpeg CENC support
        shell: bash
        run: |
          set -euo pipefail

          if ! ffmpeg -hide_banner -h full 2>&1 \
              | grep -q "cenc_decryption_key"; then
            echo "ERROR: Installed FFmpeg does not expose cenc_decryption_key"
            exit 1
          fi

          if ! ffmpeg -hide_banner -h full 2>&1 \
              | grep -q "cenc_decryption_keys"; then
            echo "WARNING: cenc_decryption_keys is unavailable"
          fi

          echo "CENC ClearKey support detected."

      # ============================================================
      # Test MPD + ClearKey BEFORE starting HLS
      # ============================================================
      - name: Test AXN DASH input
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing MPD..."

          timeout 30 ffmpeg \
            -hide_banner \
            -loglevel warning \
            -nostdin \
            -user_agent "$USER_AGENT" \
            -headers "Referer: $REFERER"$'\r\n' \
            -cenc_decryption_key "$CLEARKEY_KEY" \
            -i "$MPD_URL" \
            -map 0:v:0 \
            -map 0:a:0 \
            -t 5 \
            -f null \
            - \
            2>&1 | tee /tmp/mpd-test.log

          echo "AXN DASH input test passed."

      # ============================================================
      # RAM HLS directory
      # ============================================================
      - name: Prepare RAM HLS storage
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /dev/shm/hls
          sudo mkdir -p /dev/shm/hls/axn
          sudo chmod -R 777 /dev/shm/hls

      # ============================================================
      # Nginx
      # ============================================================
      - name: Configure nginx
        shell: bash
        run: |
          set -euo pipefail

          sudo tee /etc/nginx/nginx.conf > /dev/null <<'NGINX'
          worker_processes auto;

          pid /run/nginx.pid;

          events {
              worker_connections 2048;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;

              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;

              keepalive_timeout 10;

              access_log off;
              error_log /dev/null crit;

              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm;

                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                      add_header Access-Control-Allow-Headers "*" always;

                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      add_header Pragma "no-cache" always;
                      add_header Expires "0" always;

                      try_files $uri =404;
                  }

                  location = /healthz {
                      default_type application/json;
                      return 200 '{"ok":true}';
                  }
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl restart nginx

      # ============================================================
      # FFmpeg supervisor
      # ============================================================
      - name: Create FFmpeg supervisor
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/restream-supervisor.sh <<'EOF'
          #!/usr/bin/env bash

          set -u

          HLS_DIR="/dev/shm/hls/axn"
          PLAYLIST="$HLS_DIR/index.m3u8"
          SEGMENT_PATTERN="$HLS_DIR/seg%06d.ts"

          FFMPEG_LOG="/tmp/ffmpeg.log"
          SUPERVISOR_LOG="/tmp/supervisor.log"

          MPD_URL="${MPD_URL:?}"
          CLEARKEY_KEY="${CLEARKEY_KEY:?}"

          USER_AGENT="${USER_AGENT:-Dalvik/2.1.0}"
          REFERER="${REFERER:-https://mytvnet.vn/}"

          FFMPEG_PID=""
          RESTARTS=0

          log() {
              echo "$(date -Is) $*" | tee -a "$SUPERVISOR_LOG"
          }

          get_origin() {
              printf '%s\n' "$REFERER" \
                  | sed -E 's#^(https?://[^/]+).*#\1#'
          }

          stop_ffmpeg() {
              if [[ -n "${FFMPEG_PID}" ]] &&
                 kill -0 "${FFMPEG_PID}" 2>/dev/null; then

                  kill -TERM "$FFMPEG_PID" 2>/dev/null || true

                  for _ in {1..20}; do
                      if ! kill -0 "$FFMPEG_PID" 2>/dev/null; then
                          break
                      fi
                      sleep 0.25
                  done

                  kill -KILL "$FFMPEG_PID" 2>/dev/null || true
              fi

              FFMPEG_PID=""
          }

          cleanup_hls() {
              rm -f \
                  "$HLS_DIR"/*.m3u8 \
                  "$HLS_DIR"/*.ts \
                  "$HLS_DIR"/*.tmp
          }

          start_ffmpeg() {

              cleanup_hls

              : > "$FFMPEG_LOG"

              local origin
              origin="$(get_origin)"

              log "[FFmpeg] starting AXN DASH -> HLS"

              ffmpeg \
                  -hide_banner \
                  -loglevel warning \
                  -nostdin \
                  -stats \
                  \
                  -user_agent "$USER_AGENT" \
                  -headers "Referer: $REFERER"$'\r\n'"Origin: $origin"$'\r\n' \
                  \
                  -cenc_decryption_key "$CLEARKEY_KEY" \
                  \
                  -i "$MPD_URL" \
                  \
                  -map 0:v:0 \
                  -map 0:a:0 \
                  \
                  -c:v libx264 \
                  -preset veryfast \
                  -tune zerolatency \
                  -profile:v main \
                  -level 4.0 \
                  -pix_fmt yuv420p \
                  \
                  -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2" \
                  \
                  -fps_mode passthrough \
                  \
                  -b:v 1800k \
                  -maxrate 2200k \
                  -bufsize 4400k \
                  \
                  -g 50 \
                  -keyint_min 50 \
                  -sc_threshold 0 \
                  \
                  -c:a aac \
                  -b:a 128k \
                  -ar 48000 \
                  -ac 2 \
                  \
                  -af "aresample=async=1:first_pts=0" \
                  \
                  -max_muxing_queue_size 4096 \
                  \
                  -avoid_negative_ts disabled \
                  \
                  -f hls \
                  -hls_time 2 \
                  -hls_list_size 6 \
                  -hls_delete_threshold 2 \
                  \
                  -hls_flags \
                  delete_segments+independent_segments+omit_endlist+temp_file+program_date_time \
                  \
                  -hls_segment_type mpegts \
                  \
                  -hls_start_number_source epoch \
                  \
                  -hls_segment_filename "$SEGMENT_PATTERN" \
                  \
                  "$PLAYLIST" \
                  > "$FFMPEG_LOG" 2>&1 &

              FFMPEG_PID=$!

              log "[FFmpeg] pid=$FFMPEG_PID"
          }

          trap 'stop_ffmpeg; exit 0' TERM INT EXIT

          while true; do

              start_ffmpeg

              while kill -0 "$FFMPEG_PID" 2>/dev/null; do

                  sleep 5

                  # ------------------------------------------------
                  # Playlist watchdog
                  # ------------------------------------------------
                  if [[ -f "$PLAYLIST" ]]; then

                      now=$(date +%s)
                      mtime=$(stat -c %Y "$PLAYLIST" 2>/dev/null || echo 0)
                      age=$((now - mtime))

                      if (( age > 15 )); then
                          log "[Watchdog] playlist stale: ${age}s"
                          stop_ffmpeg
                          break
                      fi
                  fi

                  # ------------------------------------------------
                  # Excessive timestamp duplication watchdog
                  # ------------------------------------------------
                  if grep -q "More than 1000 frames duplicated" "$FFMPEG_LOG" 2>/dev/null; then
                      log "[Watchdog] excessive frame duplication detected"
                      stop_ffmpeg
                      break
                  fi

                  # ------------------------------------------------
                  # Fatal FFmpeg errors
                  # ------------------------------------------------
                  if grep -Eq \
                      "Error opening input|Invalid argument|Conversion failed|Could not write header" \
                      "$FFMPEG_LOG" 2>/dev/null; then

                      log "[Watchdog] fatal FFmpeg error detected"
                      tail -n 80 "$FFMPEG_LOG" || true

                      stop_ffmpeg
                      break
                  fi
              done

              RESTARTS=$((RESTARTS + 1))

              log "[Supervisor] FFmpeg stopped; restart=$RESTARTS"

              tail -n 80 "$FFMPEG_LOG" || true

              sleep 2
          done
          EOF

          chmod +x /tmp/restream-supervisor.sh

      # ============================================================
      # Start supervisor
      # ============================================================
      - name: Start restream
        shell: bash
        run: |
          set -euo pipefail

          nohup /tmp/restream-supervisor.sh \
              >/tmp/restream-supervisor-stdout.log 2>&1 &

          echo $! >/tmp/restream-supervisor.pid

      # ============================================================
      # Wait for REAL HLS output
      # ============================================================
      - name: Wait for HLS readiness
        shell: bash
        run: |
          set -euo pipefail

          READY=0

          for i in {1..180}; do

              sleep 1

              if curl -fsS \
                  --max-time 5 \
                  http://127.0.0.1:5000/axn/index.m3u8 \
                  >/tmp/live.m3u8 2>/dev/null; then

                  if grep -q '^#EXTM3U' /tmp/live.m3u8 \
                    && grep -q '^#EXTINF:' /tmp/live.m3u8 \
                    && grep -q '^#EXT-X-TARGETDURATION:' /tmp/live.m3u8; then

                      READY=1
                      break
                  fi
              fi

              if (( i % 15 == 0 )); then
                  echo "Waiting for HLS... ${i}s"
              fi
          done

          if [[ "$READY" != "1" ]]; then

              echo "ERROR: HLS playlist not ready."

              echo
              echo "===== PLAYLIST ====="
              cat /tmp/live.m3u8 2>/dev/null || true

              echo
              echo "===== SUPERVISOR ====="
              tail -n 200 /tmp/restream-supervisor-stdout.log || true

              echo
              echo "===== FFMPEG ====="
              tail -n 200 /tmp/ffmpeg.log || true

              echo
              echo "===== FILES ====="
              find /dev/shm/hls/axn -maxdepth 1 -type f -printf '%f %s bytes\n' \
                  2>/dev/null || true

              exit 1
          fi

          echo "HLS playlist is ready."

          cat /tmp/live.m3u8

      # ============================================================
      # Validate output
      # ============================================================
      - name: Validate HLS output
        shell: bash
        run: |
          set -euo pipefail

          ffprobe \
              -hide_banner \
              -v warning \
              -i http://127.0.0.1:5000/axn/index.m3u8 \
              -show_streams \
              -show_format \
              >/tmp/ffprobe.txt \
              2>/tmp/ffprobe-error.txt

          echo "===== STREAM INFO ====="
          cat /tmp/ffprobe.txt

          grep -q 'codec_name=h264' /tmp/ffprobe.txt
          grep -q 'width=1920' /tmp/ffprobe.txt
          grep -q 'height=1080' /tmp/ffprobe.txt
          grep -q 'codec_name=aac' /tmp/ffprobe.txt
          grep -q 'sample_rate=48000' /tmp/ffprobe.txt
          grep -q 'channels=2' /tmp/ffprobe.txt

          echo "HLS output validation passed."

      # ============================================================
      # Bore
      # ============================================================
      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/bore.tar.gz

          tar -xzf /tmp/bore.tar.gz -C /tmp

          sudo install -m 755 /tmp/bore /usr/local/bin/bore

          bore --version

      - name: Start Bore and keep stream alive
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 \
              --to bore.pub \
              --port 30117 \
              >/tmp/bore.log 2>&1 &

          BORE_PID=$!
          echo "$BORE_PID" >/tmp/bore.pid

          for i in {1..30}; do

              sleep 1

              if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
                  break
              fi

              if ! kill -0 "$BORE_PID" 2>/dev/null; then
                  echo "ERROR: Bore died."
                  cat /tmp/bore.log || true
                  exit 1
              fi

          done

          if ! grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              echo "ERROR: Bore tunnel failed."
              cat /tmp/bore.log || true
              exit 1
          fi

          echo
          echo "=============================================="
          echo "AXN HLS STREAM READY"
          echo "=============================================="
          echo
          echo "http://bore.pub:30117/axn/index.m3u8"
          echo
          echo "=============================================="
          echo

          while true; do

              if ! kill -0 "$BORE_PID" 2>/dev/null; then
                  echo "ERROR: Bore stopped."
                  cat /tmp/bore.log || true
                  exit 1
              fi

              if [[ ! -f /dev/shm/hls/axn/index.m3u8 ]]; then
                  echo "ERROR: HLS playlist disappeared."
                  exit 1
              fi

              if ! curl -fsS \
                  --max-time 10 \
                  http://127.0.0.1:5000/healthz \
                  >/dev/null; then

                  echo "ERROR: nginx health check failed."
                  exit 1
              fi

              if ! curl -fsS \
                  --max-time 10 \
                  http://127.0.0.1:5000/axn/index.m3u8 \
                  >/tmp/health_live.m3u8; then

                  echo "ERROR: HLS playlist unavailable."
                  tail -n 100 /tmp/ffmpeg.log || true
                  exit 1
              fi

              if ! grep -q '^#EXTINF:' /tmp/health_live.m3u8; then
                  echo "ERROR: HLS playlist contains no segments."
                  exit 1
              fi

              echo "[$(date -Is)] AXN alive"

              sleep 15
          done
