name: CHRTV AXN Restream (Sync Fixed)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Configure Nginx For HLS
        run: |
          mkdir -p /dev/shm/hls/axn
          cat << 'EOF' | sudo tee /tmp/nginx.conf
          worker_processes auto;
          events { worker_connections 2048; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65s;
              server {
                  listen 5000;
                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate";
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                  }
              }
          }
          EOF
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Restream & Fixed Port Tunnel
        run: |
          # ====================================================
          # 🔑 THÔNG SỐ CỐ ĐỊNH
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          TARGET_PORT=18080
          # ====================================================

          # 1. Khóa cố định PORT 18080 qua Bore
          echo "► Đang kết nối Bore tới cổng $TARGET_PORT..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $TARGET_PORT >> bore.log 2>&1
              echo "⚠ Bore ngắt kết nối, đang thử nối lại..."
              sleep 3
            done
          ) &
          sleep 5

          # 2. Cập nhật IP bore.pub lên DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo -e "\n► Đã cập nhật DuckDNS ($BORE_IP) cho domain ${DUCKDNS_DOMAIN}.duckdns.org"
          else
            echo "❌ Không lấy được IP của bore.pub!"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${TARGET_PORT}"
          
          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "👉 STREAM URL : ${PUBLIC_URL}/hls/axn/master.m3u8"
          echo "===================================================="

          # 3. Vòng lặp FFmpeg duy trì Stream & Fix Sync tuyệt đối
          while true; do
            mkdir -p /dev/shm/hls/axn
            rm -f /dev/shm/hls/axn/*.ts /dev/shm/hls/axn/*.m3u8
            
            cat << MASTER_EOF > /dev/shm/hls/axn/master.m3u8
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=2000000
          index.m3u8
          MASTER_EOF

            # 🎯 Cấu hình chống lệch hình/tiếng tuyệt đối:
            # -fps=25 + -g 50 + -hls_time 2 (mỗi segment đúng 2 giây và luôn bắt đầu bằng Keyframe)
            # -avoid_negative_ts make_zero + -af aresample=async=1000:first_pts=0 (chuẩn hóa PTS)
            ffmpeg -y -hide_banner -loglevel warning -stats \
              -fflags +genpts+discardcorrupt \
              -reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 \
              -reconnect_on_http_error 404,408,429,5xx \
              -rw_timeout 10000000 \
              -cenc_decryption_key "$CLEARKEY" \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -vf "scale=-2:720,fps=25" \
              -c:v libx264 -preset ultrafast -tune zerolatency -crf 26 \
              -g 50 -keyint_min 50 -sc_threshold 0 \
              -avoid_negative_ts make_zero \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -af "aresample=async=1000:first_pts=0" \
              -bsf:a aac_adtstoasc \
              -f hls \
              -hls_time 2 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist \
              -hls_segment_filename "/dev/shm/hls/axn/seg_%06d.ts" \
              /dev/shm/hls/axn/index.m3u8 || true

            echo "⚠ FFmpeg rớt kết nối. Đang tự động kết nối lại sau 5s..."
            sleep 5
          done
