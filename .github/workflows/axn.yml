name: Fast HLS Remux - Bore 30117

on:
  workflow_dispatch:

jobs:
  remux:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_KID: "9d29f87efdec3c9fab368f724a62ad0e"
      CLEARKEY_KEY: "6f1c09c035eab36323d60d1454db3d20"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://mytvnet.vn/"

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Diagnostics & DRM Setup
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "🔍 SYSTEM DIAGNOSTICS"
          echo "=========================================="
          echo "MPD configured: yes"
          echo "Bore port: 30117"
          echo "HLS directory: /dev/shm/hls"
          echo -n "FFmpeg version: "
          ffmpeg -version | head -n 1
          echo -n "Bore version: "
          bore --version

          if [ -n "${CLEARKEY_KEY:-}" ] && [ "${CLEARKEY_KEY}" != "YOUR_KEY" ]; then
            echo "ClearKey Key configured: YES"
          else
            echo "ClearKey Key configured: NO (Using unencrypted or default stream)"
          fi
          echo "=========================================="

      - name: Prepare HLS Directory
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /dev/shm/hls
          mkdir -p /dev/shm/hls
          chmod 755 /dev/shm/hls

      - name: Start Background HTTP Server
        shell: bash
        run: |
          set -euo pipefail
          cd /dev/shm/hls
          nohup python3 -m http.server 5000 --bind 0.0.0.0 > /tmp/http.log 2>&1 &
          HTTP_PID=$!
          echo "$HTTP_PID" > /tmp/http.pid
          sleep 1

          if ! kill -0 "$HTTP_PID" 2>/dev/null; then
            echo "❌ HTTP Server failed to start!"
            cat /tmp/http.log
            exit 1
          fi
          echo "✅ HTTP Server running with PID: $HTTP_PID"

      - name: Start Bore Tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup bore local 5000 --to bore.pub --port 30117 > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          echo "$BORE_PID" > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..20}; do
            sleep 1
            if grep -q "listening at bore.pub:30117" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "❌ Bore process died!"
              cat /tmp/bore.log
              exit 1
            fi
          done

          if [ "$PORT_BOUND" -eq 1 ]; then
            echo "=================================================="
            echo "✅ BORE TUNNEL ESTABLISHED"
            echo "🔗 Endpoint: http://bore.pub:30117/index.m3u8"
            echo "=================================================="
          else
            echo "❌ ERROR: Port 30117 occupied or failed."
            cat /tmp/bore.log
            exit 1
          fi

      - name: Verify CDN Access & Run FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          HLS_DIR="/dev/shm/hls"

          echo "📡 Verifying CDN connection from GitHub Runner IP..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "${USER_AGENT}" -e "${REFERER}" "${MPD_URL}")
          echo "HTTP Response Status Code: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -eq 404 ] || [ "$HTTP_CODE" -eq 403 ]; then
            echo "❌ CDN returned HTTP ${HTTP_CODE}!"
            echo "⚠️ Nguyên nhân: CDN MyTVNet chặn IP của GitHub Actions Runner (Geo-blocking VN) hoặc yêu cầu Token."
            echo "👉 Hãy đảm bảo bạn điền đúng CLEARKEY_KEY và kiểm tra nếu link MPD cần kèm Token (ví dụ ?token=...)"
          fi

          # Xây dựng mảng biến FFmpeg
          HEADERS="Referer: ${REFERER}"$'\r\n'"Origin: https://mytvnet.vn"$'\r\n'

          FFMPEG_ARGS=(
            -hide_banner
            -loglevel warning
            -stats
            -user_agent "${USER_AGENT}"
            -headers "${HEADERS}"
            -rw_timeout 15000000
          )

          # Thêm decryption_key nếu được cấu hình
          if [ -n "${CLEARKEY_KEY:-}" ] && [ "${CLEARKEY_KEY}" != "YOUR_KEY" ]; then
            FFMPEG_ARGS+=(-decryption_key "${CLEARKEY_KEY}")
          fi

          FFMPEG_ARGS+=(
            -fflags +genpts+discardcorrupt
            -i "${MPD_URL}"
            -map 0:v:0?
            -map 0:a:0?
            -c copy
            -f hls
            -hls_time 2
            -hls_list_size 6
            -hls_flags delete_segments+omit_endlist+append_list
            -hls_segment_type mpegts
            -hls_allow_cache 0
            "${HLS_DIR}/index.m3u8"
          )

          echo "🔥 Starting FFmpeg fast remux loop..."
          RETRY=0
          while [ $RETRY -lt 20 ]; do
            ffmpeg "${FFMPEG_ARGS[@]}" || EXIT_CODE=$?
            echo "⚠️ FFmpeg exited with code ${EXIT_CODE:-0}. Retrying in 3s... (Attempt $((RETRY+1))/20)"
            RETRY=$((RETRY+1))
            sleep 3
          done

      - name: Debug Diagnostics
        if: always()
        shell: bash
        run: |
          echo "--- HTTP Log ---"
          cat /tmp/http.log 2>/dev/null || true
          echo "--- Bore Log ---"
          cat /tmp/bore.log 2>/dev/null || true
          echo "--- HLS Files ---"
          ls -la /dev/shm/hls 2>/dev/null || true
