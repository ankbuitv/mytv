name: AXN DASH ClearKey -> HLS (Bore 30117)

on:
  workflow_dispatch:
    inputs:
      mpd_url:
        description: "Override MPD URL (optional)"
        required: false
        default: ""

      clearkey_key:
        description: "Override ClearKey hex key (optional)"
        required: false
        default: ""

      user_agent:
        description: "Override User-Agent (optional)"
        required: false
        default: ""

      referer:
        description: "Override Referer (optional)"
        required: false
        default: ""

jobs:
  hls_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEFAULT_MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
      CLEARKEY_SECRET: ${{ secrets.CLEARKEY_KEY }}
      DEFAULT_USER_AGENT: "Dalvik/2.1.0"
      DEFAULT_REFERER: "https://mytvnet.vn/"

    steps:

      # ============================================================
      # Resolve configuration
      # ============================================================

      - name: Resolve runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          MPD_INPUT='${{ github.event.inputs.mpd_url }}'
          KEY_INPUT='${{ github.event.inputs.clearkey_key }}'
          UA_INPUT='${{ github.event.inputs.user_agent }}'
          REF_INPUT='${{ github.event.inputs.referer }}'

          MPD="${MPD_INPUT:-$DEFAULT_MPD_URL}"
          KEY="${KEY_INPUT:-$CLEARKEY_SECRET}"
          UA="${UA_INPUT:-$DEFAULT_USER_AGENT}"
          REF="${REF_INPUT:-$DEFAULT_REFERER}"

          if [[ -z "$MPD" ]]; then
            echo "ERROR: MPD URL is empty"
            exit 1
          fi

          if [[ -z "$KEY" ]]; then
            echo "ERROR: CLEARKEY_KEY is empty"
            exit 1
          fi

          # Normalize key.
          KEY="${KEY#0x}"
          KEY="${KEY#0X}"
          KEY="${KEY//:/}"

          if ! [[ "$KEY" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "ERROR: CLEARKEY_KEY must be exactly 32 hex characters"
            exit 1
          fi

          {
            echo "MPD_URL=$MPD"
            echo "CLEARKEY_KEY=$KEY"
            echo "USER_AGENT=$UA"
            echo "REFERER=$REF"
          } >> "$GITHUB_ENV"

          echo "Configuration resolved."
          echo "MPD: $MPD"
          echo "ClearKey: [32 hex characters]"
          echo "User-Agent: $UA"
          echo "Referer: $REF"


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            ca-certificates \
            nginx \
            jq \
            dnsutils

          echo "===== FFmpeg ====="
          ffmpeg -version | head -n 3

          echo "===== FFmpeg CENC ====="
          ffmpeg -hide_banner -h full 2>&1 \
            | grep -E "cenc_decryption_key|cenc_decryption_keys" || true

          echo "===== Nginx ====="
          nginx -v


      # ============================================================
      # Bore
      # ============================================================

      - name: Install Bore
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/bore.tar.gz

          tar -xzf /tmp/bore.tar.gz -C /tmp

          sudo install \
            -m 755 \
            /tmp/bore \
            /usr/local/bin/bore

          bore --version

          rm -f \
            /tmp/bore.tar.gz \
            /tmp/bore


      # ============================================================
      # RAM HLS
      # ============================================================

      - name: Prepare HLS storage
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /dev/shm/hls

          sudo mkdir -p \
            /dev/shm/hls/axn

          sudo chmod -R 777 /dev/shm/hls

          df -h /dev/shm


      # ============================================================
      # Nginx
      # ============================================================

      - name: Configure nginx
        shell: bash
        run: |
          set -euo pipefail

          sudo tee /etc/nginx/nginx.conf > /dev/null <<'NGINX'
          worker_processes auto;

          pid /run/nginx.pid;

          events {
              worker_connections 4096;
              multi_accept on;
          }

          http {
              include /etc/nginx/mime.types;

              default_type application/octet-stream;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;

              keepalive_timeout 10;

              access_log off;
              error_log /dev/null crit;

              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }

              server {
                  listen 5000 default_server;
                  server_name _;

                  location / {
                      root /dev/shm;

                      try_files $uri =404;

                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                      add_header Access-Control-Allow-Headers "*" always;

                      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
                      add_header Pragma "no-cache" always;
                      add_header Expires "0" always;
                  }

                  location = /healthz {
                      default_type application/json;
                      return 200 '{"ok":true}';
                  }
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl restart nginx


      # ============================================================
      # FFmpeg supervisor
      # ============================================================

      - name: Create FFmpeg supervisor
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/restream-supervisor.sh <<'EOF'
          #!/usr/bin/env bash

          set -u

          HLS_DIR="/dev/shm/hls/axn"
          PLAYLIST="${HLS_DIR}/index.m3u8"
          SEGMENT_PATTERN="${HLS_DIR}/seg%06d.ts"

          FFMPEG_LOG="/tmp/ffmpeg.log"
          SUPERVISOR_LOG="/tmp/supervisor.log"

          MPD_URL="${MPD_URL:?}"
          CLEARKEY_KEY="${CLEARKEY_KEY:?}"

          USER_AGENT="${USER_AGENT:-Dalvik/2.1.0}"
          REFERER="${REFERER:-https://mytvnet.vn/}"

          FFMPEG_PID=""

          log() {
              echo "$(date -Is) $*" | tee -a "$SUPERVISOR_LOG"
          }

          cleanup_hls() {
              rm -f \
                "${HLS_DIR}"/*.m3u8 \
                "${HLS_DIR}"/*.ts \
                "${HLS_DIR}"/*.tmp
          }

          stop_ffmpeg() {
              if [[ -n "${FFMPEG_PID}" ]] &&
                 kill -0 "${FFMPEG_PID}" 2>/dev/null; then

                  kill -TERM "${FFMPEG_PID}" 2>/dev/null || true

                  for _ in {1..20}; do
                      if ! kill -0 "${FFMPEG_PID}" 2>/dev/null; then
                          break
                      fi

                      sleep 0.25
                  done

                  kill -KILL "${FFMPEG_PID}" 2>/dev/null || true
              fi

              FFMPEG_PID=""
          }

          start_ffmpeg() {

              cleanup_hls

              : > "$FFMPEG_LOG"

              log "[FFmpeg] starting AXN DASH"

              ffmpeg \
                -hide_banner \
                -loglevel warning \
                -nostdin \
                -stats \
                \
                -user_agent "${USER_AGENT}" \
                -headers "Referer: ${REFERER}\r\n" \
                \
                -reconnect 1 \
                -reconnect_streamed 1 \
                -reconnect_on_network_error 1 \
                -reconnect_delay_max 5 \
                \
                -rw_timeout 15000000 \
                \
                -cenc_decryption_key "${CLEARKEY_KEY}" \
                \
                -fflags +discardcorrupt \
                -err_detect ignore_err \
                \
                -i "${MPD_URL}" \
                \
                -map 0:v:0 \
                -map 0:a:0 \
                \
                -c:v libx264 \
                -preset ultrafast \
                -tune zerolatency \
                -profile:v main \
                -level 4.0 \
                -pix_fmt yuv420p \
                \
                -fps_mode passthrough \
                \
                -b:v 2200k \
                -maxrate 2500k \
                -bufsize 5000k \
                \
                -g 50 \
                -keyint_min 50 \
                -sc_threshold 0 \
                \
                -c:a aac \
                -b:a 128k \
                -ar 48000 \
                -ac 2 \
                \
                -max_muxing_queue_size 8192 \
                \
                -avoid_negative_ts make_zero \
                \
                -f hls \
                \
                -hls_time 4 \
                -hls_list_size 6 \
                -hls_delete_threshold 2 \
                \
                -hls_flags \
                  delete_segments+\
                  independent_segments+\
                  omit_endlist+\
                  temp_file+\
                  program_date_time \
                \
                -hls_segment_type mpegts \
                \
                -hls_segment_filename "${SEGMENT_PATTERN}" \
                \
                "${PLAYLIST}" \
                >"$FFMPEG_LOG" 2>&1 &

              FFMPEG_PID=$!

              log "[FFmpeg] pid=${FFMPEG_PID}"
          }

          trap 'stop_ffmpeg; exit 0' TERM INT EXIT

          while true; do

              start_ffmpeg

              while kill -0 "${FFMPEG_PID}" 2>/dev/null; do
                  sleep 5
              done

              log "[Supervisor] FFmpeg exited."

              echo "===== LAST FFMPEG LOG ====="
              tail -n 100 "$FFMPEG_LOG" || true

              cleanup_hls

              sleep 3

              log "[Supervisor] restarting FFmpeg..."
          done
          EOF

          chmod +x /tmp/restream-supervisor.sh


      # ============================================================
      # Start
      # ============================================================

      - name: Start restream
        shell: bash
        run: |
          set -euo pipefail

          nohup /tmp/restream-supervisor.sh \
            >/tmp/restream-supervisor-stdout.log \
            2>&1 &

          echo $! > /tmp/restream-supervisor.pid


      # ============================================================
      # Readiness
      # ============================================================

      - name: Wait for HLS readiness
        shell: bash
        run: |
          set -euo pipefail

          READY=0

          for i in {1..180}; do
              sleep 1

              if ! curl -fsS \
                  "http://127.0.0.1:5000/axn/index.m3u8" \
                  -o /tmp/live.m3u8 2>/dev/null; then
                  continue
              fi

              if ! grep -q '^#EXTM3U' /tmp/live.m3u8; then
                  continue
              fi

              if ! grep -q '^#EXTINF:' /tmp/live.m3u8; then
                  continue
              fi

              SEGMENT_NAME="$(
                  grep -E '^seg[0-9]+\.ts$' /tmp/live.m3u8 \
                  | tail -n 1
              )"

              if [[ -z "$SEGMENT_NAME" ]]; then
                  continue
              fi

              if ! curl -fsS \
                  "http://127.0.0.1:5000/axn/${SEGMENT_NAME}" \
                  -o /tmp/test.ts 2>/dev/null; then
                  continue
              fi

              if [[ ! -s /tmp/test.ts ]]; then
                  continue
              fi

              SIZE=$(stat -c '%s' /tmp/test.ts)

              if (( SIZE < 10000 )); then
                  continue
              fi

              echo "HLS READY"
              echo "Segment: ${SEGMENT_NAME}"
              echo "Size: ${SIZE} bytes"

              READY=1
              break
          done

          if [[ "$READY" != "1" ]]; then
              echo "ERROR: HLS playlist not ready."

              echo
              echo "===== PLAYLIST ====="
              cat /tmp/live.m3u8 2>/dev/null || true

              echo
              echo "===== SUPERVISOR ====="
              tail -n 200 \
                /tmp/restream-supervisor-stdout.log \
                2>/dev/null || true

              echo
              echo "===== FFMPEG ====="
              tail -n 200 \
                /tmp/ffmpeg.log \
                2>/dev/null || true

              echo
              echo "===== FILES ====="
              ls -lah /dev/shm/hls/axn || true

              exit 1
          fi


      # ============================================================
      # Validate
      # ============================================================

      - name: Validate HLS
        shell: bash
        run: |
          set -euo pipefail

          ffprobe \
            -hide_banner \
            -v warning \
            -i "http://127.0.0.1:5000/axn/index.m3u8" \
            -show_streams \
            -show_format \
            >/tmp/ffprobe.txt \
            2>/tmp/ffprobe.err

          echo "===== FFPROBE ====="
          cat /tmp/ffprobe.txt

          grep -qi 'codec_name=h264' /tmp/ffprobe.txt
          grep -qi 'codec_name=aac' /tmp/ffprobe.txt

          echo
          echo "HLS validation OK."


      # ============================================================
      # Bore
      # ============================================================

      - name: Start Bore tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup bore local 5000 \
            --to bore.pub \
            --port 30117 \
            >/tmp/bore.log \
            2>&1 &

          echo $! >/tmp/bore.pid

          for i in {1..30}; do
              sleep 1

              if grep -q 'listening at bore.pub:30117' /tmp/bore.log; then

                  echo
                  echo "=========================================="
                  echo "AXN HLS STREAM READY"
                  echo "=========================================="
                  echo "http://bore.pub:30117/axn/index.m3u8"
                  echo "=========================================="

                  break
              fi

              if [[ "$i" == "30" ]]; then
                  echo "ERROR: Bore failed"
                  cat /tmp/bore.log || true
                  exit 1
              fi
          done


      # ============================================================
      # Keep runner alive
      # ============================================================

      - name: Keep stream alive
        shell: bash
        run: |
          set -euo pipefail

          while true; do

              if ! kill -0 \
                  "$(cat /tmp/restream-supervisor.pid)" \
                  2>/dev/null; then

                  echo "ERROR: Supervisor died"

                  tail -n 200 \
                    /tmp/restream-supervisor-stdout.log || true

                  exit 1
              fi

              if ! kill -0 \
                  "$(cat /tmp/bore.pid)" \
                  2>/dev/null; then

                  echo "ERROR: Bore died"

                  cat /tmp/bore.log || true

                  exit 1
              fi

              if ! curl -fsS \
                  "http://127.0.0.1:5000/healthz" \
                  >/dev/null; then

                  echo "ERROR: Nginx health check failed"
                  exit 1
              fi

              if ! curl -fsS \
                  "http://127.0.0.1:5000/axn/index.m3u8" \
                  -o /tmp/health.m3u8; then

                  echo "ERROR: HLS playlist unavailable"

                  tail -n 100 \
                    /tmp/ffmpeg.log || true

                  exit 1
              fi

              if ! grep -q '^#EXTINF:' /tmp/health.m3u8; then
                  echo "ERROR: HLS playlist has no segments"
                  exit 1
              fi

              echo
              echo "===== STATUS $(date -Is) ====="

              stat \
                -c 'playlist=%n size=%s mtime=%y' \
                /dev/shm/hls/axn/index.m3u8 \
                2>/dev/null || true

              echo "FFmpeg: alive"
              echo "Bore: alive"
              echo "HLS: alive"

              sleep 30
          done
