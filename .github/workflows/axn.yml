- name: Run Restream Service
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080

          # 1. Khởi tạo SSHX Terminal
          sshx > sshx.log 2>&1 &
          sleep 2
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)

          # 2. Khởi tạo Bore Tunnel
          (
            while true; do
              bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
              sleep 3
            done
          ) &
          sleep 4

          # 3. Cập nhật DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}" > /dev/null
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # 4. Tạo Master Playlist & Playlist M3U
          cat << MASTER_EOF > /dev/shm/hls/axn/master.m3u8
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=2800000,RESOLUTION=1920x1080,CODECS="avc1.4d401f,mp4a.40.2"
          index.m3u8
          MASTER_EOF

          cat << M3U_EOF > playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="AXN.vn" tvg-name="AXN HD" group-title="VN Live", AXN HD (HLS AVC)
          ${PUBLIC_URL}/hls/axn/master.m3u8
          M3U_EOF

          # 5. Chạy Web Server (Gunicorn)
          gunicorn -w 2 --threads 4 -b 0.0.0.0:5000 app:app &
          sleep 2

          echo "===================================================="
          echo "🌐 CHRTV IPTV RESTREAM SERVER IS ONLINE!"
          echo "🔑 SSHX URL       : ${SSHX_URL}"
          echo "👉 PLAYLIST URL   : ${PUBLIC_URL}/playlist.m3u"
          echo "👉 STREAM URL     : ${PUBLIC_URL}/hls/axn/master.m3u8"
          echo "===================================================="

          # 6. Cấu hình luồng Stream & DRM Clearkey
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"
          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # Vòng lặp Restream chuẩn Unix Pipe: N_m3u8DL-RE -> stdout -> FFmpeg
          while true; do
            echo "🎬 Running Stream Pipeline (N_m3u8DL-RE | FFmpeg)..."
            
            N_m3u8DL-RE "$STREAM_MPD" \
              --key "$CLEARKEY" \
              --header "User-Agent: $USER_AGENT" \
              --header "Referer: https://mytvnet.vn/" \
              --auto-select \
              --live-pipe-options "" \
              --log-level OFF | ffmpeg -y -hide_banner -loglevel warning \
              -i pipe:0 \
              -c copy \
              -f hls \
              -hls_time 2 \
              -hls_list_size 5 \
              -hls_flags delete_segments+omit_endlist+discont_start \
              -hls_segment_filename "/dev/shm/hls/axn/seg_%03d.ts" \
              /dev/shm/hls/axn/index.m3u8 || true

            echo "⚠️ Reconnecting in 3 seconds..."
            sleep 3
          done
