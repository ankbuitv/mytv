name: IPTV Restream Server - AXN HD (Ultra-Low Latency & UDP Speed)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl dnsutils
          pip install --no-cache-dir flask flask-cors gunicorn

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Create Workspace Folders in RAMDisk
        run: |
          # Ghi HLS thẳng vào RAMDisk (/dev/shm) để đạt tốc độ như UDP
          mkdir -p /dev/shm/hls/axn
          ln -s /dev/shm/hls hls

      - name: Generate Flask Web Server (App Code)
        run: |
          cat << 'EOF' > app.py
          import os
          from flask import Flask, send_from_directory, abort, make_response
          from flask_cors import CORS

          app = Flask(__name__)
          CORS(app, resources={r"/*": {"origins": "*"}})

          @app.route("/")
          def index():
              return "IPTV Restream Server Running (AXN HD Low-Latency)!", 200

          @app.route("/playlist.m3u")
          def playlist():
              response = make_response(send_from_directory(".", "playlist.m3u"))
              response.headers["Content-Type"] = "audio/x-mpegurl"
              response.headers["Access-Control-Allow-Origin"] = "*"
              return response

          @app.route("/hls/<path:filename>")
          def serve_hls(filename):
              file_path = os.path.join("/dev/shm/hls", filename)
              if not os.path.exists(file_path):
                  return abort(404)
              
              response = make_response(send_from_directory("/dev/shm/hls", filename))
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Headers"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "GET, OPTIONS"
              response.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              response.headers["Pragma"] = "no-cache"
              response.headers["Expires"] = "0"

              if filename.endswith(".ts"):
                  response.headers["Content-Type"] = "video/MP2T"
              elif filename.endswith(".m3u8"):
                  response.headers["Content-Type"] = "application/vnd.apple.mpegurl"

              return response

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          EOF

      - name: Generate Main Stream Script
        run: |
          cat << 'EOF' > start_stream.sh
          #!/bin/bash

          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 3
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)

          echo "🌐 Starting Bore Tunnel on Port ${BORE_PORT}..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
              sleep 3
            done
          ) &
          sleep 4

          # Update IP for DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}" > /dev/null
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # Create Playlist M3U
          cat << M3U_EOF > playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="AXN.vn" tvg-name="AXN HD" group-title="VN Live", AXN HD (MyTV Restream)
          ${PUBLIC_URL}/hls/axn/index.m3u8
          M3U_EOF

          echo "🚀 Starting High-Performance Web Server (gthread)..."
          gunicorn -w 4 --threads 8 --access-logfile - --error-logfile - --keep-alive 15 -b 0.0.0.0:5000 app:app &
          sleep 2

          echo "===================================================="
          echo "🌐 CHRTV OPTIMIZED RESTREAM SERVER IS READY!"
          echo "🔑 SSHX TERMINAL URL : ${SSHX_URL}"
          echo "👉 PLAYLIST URL      : ${PUBLIC_URL}/playlist.m3u"
          echo "👉 DIRECT HLS STREAM : ${PUBLIC_URL}/hls/axn/index.m3u8"
          echo "===================================================="

          CLEARKEY="6f1c09c035eab36323d60d1454db3d20"
          STREAM_MPD="https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/axn.smil/manifest.mpd"

          while true; do
  echo "🎬 Restreaming AXN HD (Ultra-Smooth Low-Latency)..."
  ffmpeg -y -hide_banner -loglevel warning \
    -fflags +genpts+discardcorrupt+nobuffer \
    -cenc_decryption_key "$CLEARKEY" \
    -i "$STREAM_MPD" \
    -map 0:v:0 -map 0:a:0 \
    -c:v libx264 -preset ultrafast -tune zerolatency \
    -r 25 -g 50 -keyint_min 50 -sc_threshold 0 \
    -force_key_frames "expr:gte(t,n_forced*2)" \
    -c:a aac -b:a 128k -ar 48000 \
    -max_muxing_queue_size 2048 \
    -f hls \
    -hls_time 2 \
    -hls_list_size 6 \
    -hls_flags delete_segments+omit_endlist+discont_start \
    -hls_segment_filename "/dev/shm/hls/axn/seg_%03d.ts" /dev/shm/hls/axn/index.m3u8 || true

  echo "⚠️ Stream reconnecting in 2 seconds..."
  sleep 2
done
          EOF
          chmod +x start_stream.sh

      - name: Execute Streamer
        run: ./start_stream.sh
