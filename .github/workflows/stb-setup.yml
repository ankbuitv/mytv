name: stb-setup - HLS Server From Root Index

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT REPO
      # ==========================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================================
      # SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dnsutils
          pip install --no-cache-dir flask flask-cors gunicorn

      # ==========================================================
      # SETUP BORE + SSHX
      # ==========================================================
      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore
          curl -sSf https://sshx.io/get | sh

      # ==========================================================
      # CHECK FILE INDEX.M3U8 CÓ SẴN Ở ROOT
      # ==========================================================
      - name: Check Root index.m3u8
        run: |
          if [ ! -f "./index.m3u8" ]; then
            echo "❌ Không tìm thấy file index.m3u8 tại thư mục Root!"
            exit 1
          fi

          echo "=========================================="
          echo "✅ ĐÃ TÌM THẤY INDEX.M3U8 Ở ROOT REPO"
          echo "=========================================="
          head -n 20 ./index.m3u8

      # ==========================================================
      # GENERATE FLASK SERVER (PHÁT NGUYÊN BẢN TỪ ROOT REPO)
      # ==========================================================
      - name: Generate HLS Server
        run: |
          cat > app.py <<'PY'
          from flask import Flask, send_from_directory, abort, make_response
          from flask_cors import CORS
          import os

          app = Flask(__name__)
          CORS(app, resources={r"/*": {"origins": "*"}})

          # Đọc file trực tiếp từ thư mục hiện tại (Root Repo)
          BASE_DIR = os.path.dirname(os.path.abspath(__file__))

          @app.route("/")
          def index():
              return ("stb-setup HLS Server Running!", 200)

          @app.route("/playlist.m3u")
          def playlist():
              playlist_path = os.path.join(BASE_DIR, "playlist.m3u")
              if not os.path.exists(playlist_path):
                  return abort(404)
              return send_from_directory(BASE_DIR, "playlist.m3u", mimetype="application/x-mpegurl")

          @app.route("/hls/<path:filename>")
          def serve_hls(filename):
              file_path = os.path.join(BASE_DIR, filename)
              if not os.path.isfile(file_path):
                  return abort(404)

              response = make_response(send_from_directory(BASE_DIR, filename))
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "GET, HEAD, OPTIONS"
              response.headers["Access-Control-Allow-Headers"] = "*"
              response.headers["Connection"] = "keep-alive"
              response.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              response.headers["Pragma"] = "no-cache"

              if filename.endswith(".ts"):
                  response.headers["Content-Type"] = "video/mp2t"
              elif filename.endswith(".m3u8"):
                  response.headers["Content-Type"] = "application/vnd.apple.mpegurl"

              return response

          @app.route("/hls/<path:filename>", methods=["OPTIONS"])
          def hls_options(filename):
              response = make_response("", 204)
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "GET, HEAD, OPTIONS"
              response.headers["Access-Control-Allow-Headers"] = "*"
              return response

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=30115, threaded=True)
          PY

      # ==========================================================
      # GENERATE STREAM SCRIPT & START
      # ==========================================================
      - name: Generate Stream Script
        run: |
          cat > start_stream.sh <<'BASH'
          #!/bin/bash
          set +e

          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="${DUCKDNS_TOKEN}"

          LOCAL_PORT=30115
          BORE_PORT=30115

          # Start SSHX
          sshx > sshx.log 2>&1 &
          sleep 3
          SSHX_URL=$(grep "https://sshx.io/s/" sshx.log | head -n1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          # Start Bore Tunnel
          (
            while true; do
              bore local "$LOCAL_PORT" --to bore.pub --port "$BORE_PORT" >> bore.log 2>&1
              sleep 3
            done
          ) &
          sleep 5

          # Update DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # Tạo file playlist M3U chỉ tới file index.m3u8 ở root
          cat > playlist.m3u <<EOF
          #EXTM3U
          #EXTINF:-1 tvg-id="stb-setup" tvg-name="stb-setup" group-title="stb-setup",stb-setup
          ${PUBLIC_URL}/hls/index.m3u8
          EOF

          echo "🚀 Starting Gunicorn Server on Port $LOCAL_PORT..."
          echo "💻 SSHX: ${SSHX_URL}"
          echo "📺 HLS Link: ${PUBLIC_URL}/hls/index.m3u8"

          # Chạy Gunicorn giữ luồng cho Server
          gunicorn \
            -w 4 \
            --threads 4 \
            --access-logfile - \
            --error-logfile - \
            --keep-alive 30 \
            -b "0.0.0.0:${LOCAL_PORT}" \
            app:app
          BASH

          chmod +x start_stream.sh

      # ==========================================================
      # EXECUTE
      # ==========================================================
      - name: Execute Server
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          ./start_stream.sh
