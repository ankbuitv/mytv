name: ZTE IPTV Ultra-Light Proxy

on:
  workflow_dispatch: # Cho phép bấm Run thủ công
  schedule:
    # Tự động trigger chạy lại mỗi 5:55 phút (Cron của GitHub)
    - cron: '*/5 * * * *'

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải Bore CLI
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/

      - name: 2. Tạo & Chạy Python Proxy mỏng (Ép User-Agent VLC + Xóa Header Rác)
        run: |
          cat << 'EOF' > proxy.py
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import urllib.request

          class ProxyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # Bỏ prefix /zte/ để lấy đường dẫn thật từ Server ZTE
                  path = self.path.replace('/zte/', '/')
                  target_url = f"http://136.239.158.10:6610{path}"
                  
                  # Tạo Request mới - Ép User-Agent VLC & X-Requested-With
                  req = urllib.request.Request(target_url)
                  req.add_header('User-Agent', 'VLC/3.0.20 LibVLC/3.0.20')
                  req.add_header('X-Requested-With', 'com.zte.iptv.epg')
                  req.add_header('Accept', '*/*')
                  
                  try:
                      with urllib.request.urlopen(req) as response:
                          self.send_response(response.status)
                          # Bơm Header CORS cho Trình duyệt
                          self.send_header('Access-Control-Allow-Origin', '*')
                          self.send_header('Content-Type', response.headers.get('Content-Type', 'application/x-mpegURL'))
                          self.end_headers()
                          self.wfile.write(response.read())
                  except Exception as e:
                      self.send_error(500, str(e))

              def do_OPTIONS(self):
                  # Xử lý CORS Preflight request của Browser
                  self.send_response(200)
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')
                  self.send_header('Access-Control-Allow-Headers', '*')
                  self.end_headers()

          server = HTTPServer(('0.0.0.0', 8080), ProxyHandler)
          print("Proxy đang chạy trên port 8080...")
          server.serve_forever()
          EOF

          python3 proxy.py &
          sleep 2

      - name: 3. Khởi chạy Bore Tunnel (Cố định Port 55828)
        run: |
          echo "=========================================================="
          echo "Đang mở Port 55828 ra bore.pub..."
          echo "=========================================================="
          bore local 8080 --to bore.pub --port 55828
