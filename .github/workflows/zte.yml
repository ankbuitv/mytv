name: ZTE IPTV Zero-Lag Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai Bore CLI
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/

      - name: 2. Tao va Chay Raw Proxy Script
        run: |
          cat << 'EOF' > proxy.py
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import urllib.request
          import urllib.error

          class UltraFastProxyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  raw_path = self.path.replace('/zte/', '/')
                  target_url = f"http://136.239.158.10:6610{raw_path}"
                  
                  # 1. FILE VIDEO .TS -> REDIRECT 302 TẢI TRỰC TIẾP TỪ ZTE (KHÔNG QUA PROXY -> TỐC ĐỘ TỐI ĐA)
                  if '.ts' in raw_path:
                      self.send_response(302)
                      self.send_header('Location', target_url)
                      self.send_header('Access-Control-Allow-Origin', '*')
                      self.end_headers()
                      return

                  # 2. FILE PLAYLIST .M3U8 -> PROXY XỬ LÝ HEADER VÀ REWRITE
                  req = urllib.request.Request(target_url)
                  req.add_header('Host', '136.239.158.10:6610')
                  req.add_header('User-Agent', 'ZTE-STB-Android/1.0')
                  req.add_header('X-Requested-With', 'com.zte.iptv.epg')
                  req.add_header('Accept', '*/*')

                  try:
                      with urllib.request.urlopen(req, timeout=10) as response:
                          content = response.read().decode('utf-8', errors='ignore')
                          lines = content.splitlines()
                          new_lines = []
                          
                          host_header = self.headers.get('Host', '159.223.110.159:55828')
                          proxy_base = f"http://{host_header}"
                          
                          clean_path = raw_path.split('?')[0]
                          parent_dir = clean_path.rsplit('/', 1)[0] + '/'

                          for line in lines:
                              line_str = line.strip()
                              if line_str and not line_str.startswith('#'):
                                  if '.m3u8' in line_str:
                                      if line_str.startswith('/'):
                                          full_url = f"{proxy_base}/zte{line_str}"
                                      elif line_str.startswith('http'):
                                          full_url = line_str.replace('http://136.239.158.10:6610', f"{proxy_base}/zte")
                                      else:
                                          full_url = f"{proxy_base}/zte{parent_dir}{line_str}"
                                      new_lines.append(full_url)
                                  elif '.ts' in line_str:
                                      # File TS chỉ cần nối URL chuẩn của ZTE gốc
                                      if line_str.startswith('/'):
                                          full_url = f"http://136.239.158.10:6610{line_str}"
                                      elif line_str.startswith('http'):
                                          full_url = line_str
                                      else:
                                          full_url = f"http://136.239.158.10:6610{parent_dir}{line_str}"
                                      new_lines.append(full_url)
                                  else:
                                      new_lines.append(line)
                              else:
                                  new_lines.append(line)
                          
                          modified_content = '\n'.join(new_lines)
                          
                          self.send_response(200)
                          self.send_header('Access-Control-Allow-Origin', '*')
                          self.send_header('Content-Type', 'application/vnd.apple.mpegurl')
                          self.end_headers()
                          self.wfile.write(modified_content.encode('utf-8'))

                  except urllib.error.HTTPError as e:
                      self.send_response(e.code)
                      self.send_header('Access-Control-Allow-Origin', '*')
                      self.end_headers()
                  except Exception as e:
                      self.send_error(500, str(e))

              def do_OPTIONS(self):
                  self.send_response(200)
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')
                  self.send_header('Access-Control-Allow-Headers', '*')
                  self.end_headers()

          server = HTTPServer(('0.0.0.0', 8080), UltraFastProxyHandler)
          server.serve_forever()
          EOF

          python3 proxy.py &
          sleep 2

      - name: 3. Khoi chay Bore Tunnel (Port 55828)
        run: |
          bore local 8080 --to bore.pub --port 55828
