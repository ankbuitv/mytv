name: ZTE IPTV Smart Proxy (Direct TS)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải Bore CLI
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/

      - name: 2. Chạy Python Smart Proxy (Rewrite URL .ts về Direct IP ZTE)
        run: |
          cat << 'EOF' > proxy.py
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import urllib.request
          import re

          class SmartProxyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = self.path.replace('/zte/', '/')
                  
                  # NẾU LÀ FILE .TS -> REDIRECT NỐI THẲNG TRÌNH DUYỆT SANG BẰNG BĂNG THÔNG ZTE GỐC (KHÔNG PROXY)
                  if '.ts' in path:
                      self.send_response(302)
                      self.send_header('Location', f"http://136.239.158.10:6610{path}")
                      self.end_headers()
                      return

                  # CHỈ PROXY FILE .M3U8 ĐỂ NHỒI USER-AGENT VLC
                  target_url = f"http://136.239.158.10:6610{path}"
                  req = urllib.request.Request(target_url)
                  req.add_header('User-Agent', 'VLC/3.0.20 LibVLC/3.0.20')
                  req.add_header('X-Requested-With', 'com.zte.iptv.epg')
                  
                  try:
                      with urllib.request.urlopen(req) as response:
                          content = response.read().decode('utf-8', errors='ignore')
                          
                          # Sửa các đường dẫn tương đối trong M3U8 để Browser tự gọi
                          base_path = "http://136.239.158.10:6610" + path.rsplit('/', 1)[0] + "/"
                          
                          self.send_response(200)
                          self.send_header('Access-Control-Allow-Origin', '*')
                          self.send_header('Content-Type', 'application/x-mpegURL')
                          self.end_headers()
                          self.wfile.write(content.encode('utf-8'))
                  except Exception as e:
                      self.send_error(500, str(e))

              def do_OPTIONS(self):
                  self.send_response(200)
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')
                  self.send_header('Access-Control-Allow-Headers', '*')
                  self.end_headers()

          server = HTTPServer(('0.0.0.0', 8080), SmartProxyHandler)
          server.serve_forever()
          EOF

          python3 proxy.py &
          sleep 2

      - name: 3. Khởi chạy Bore Tunnel (Port 55828)
        run: |
          bore local 8080 --to bore.pub --port 55828
