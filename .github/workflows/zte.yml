name: ZTE IPTV Zero-Lag Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai Bore CLI va Cai Python Requests
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          pip3 install requests

      - name: 2. Tao va Chay Smart Proxy Script
        run: |
          cat << 'EOF' > proxy.py
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import requests

          class PerfectProxyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  raw_path = self.path.replace('/zte/', '/')
                  target_url = f"http://136.239.158.10:6610{raw_path}"
                  
                  headers = {
                      'Host': '136.239.158.10:6610',
                      'User-Agent': 'ZTE-STB-Android/1.0',
                      'X-Requested-With': 'com.zte.iptv.epg',
                      'Accept': '*/*',
                      'Connection': 'keep-alive'
                  }

                  # 1. XỬ LÝ TS FILE THROUGH PROXY (STREAM DATA TRỰC TIẾP TỪ ZTE)
                  if '.ts' in raw_path:
                      try:
                          r = requests.get(target_url, headers=headers, stream=True, timeout=10)
                          self.send_response(r.status_code)
                          self.send_header('Content-Type', 'video/mp2t')
                          self.send_header('Access-Control-Allow-Origin', '*')
                          self.end_headers()
                          for chunk in r.iter_content(chunk_size=8192):
                              if chunk:
                                  self.wfile.write(chunk)
                      except Exception as e:
                          self.send_error(500, str(e))
                      return

                  # 2. XỬ LÝ M3U8 PLAYLIST (REWRITE DUONG DAN SANG PROXY)
                  try:
                      resp = requests.get(target_url, headers=headers, timeout=10)
                      if resp.status_code != 200:
                          self.send_response(resp.status_code)
                          self.end_headers()
                          return
                          
                      content = resp.text
                      lines = content.splitlines()
                      new_lines = []
                      
                      host_header = self.headers.get('Host', '159.223.110.159:55828')
                      proxy_base = f"http://{host_header}"
                      
                      clean_path = raw_path.split('?')[0]
                      parent_dir = clean_path.rsplit('/', 1)[0] + '/'

                      for line in lines:
                          line_str = line.strip()
                          if line_str and not line_str.startswith('#'):
                              # Tat ca ca M3U8 va TS deu duoc noi thanh link Proxy
                              if line_str.startswith('/'):
                                  full_url = f"{proxy_base}/zte{line_str}"
                              elif line_str.startswith('http'):
                                  full_url = line_str.replace('http://136.239.158.10:6610', f"{proxy_base}/zte")
                              else:
                                  full_url = f"{proxy_base}/zte{parent_dir}{line_str}"
                              new_lines.append(full_url)
                          else:
                              new_lines.append(line)
                      
                      modified_content = '\n'.join(new_lines)
                      
                      self.send_response(200)
                      self.send_header('Access-Control-Allow-Origin', '*')
                      self.send_header('Content-Type', 'application/vnd.apple.mpegurl')
                      self.end_headers()
                      self.wfile.write(modified_content.encode('utf-8'))
                      
                  except Exception as e:
                      self.send_error(500, str(e))

              def do_OPTIONS(self):
                  self.send_response(200)
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')
                  self.send_header('Access-Control-Allow-Headers', '*')
                  self.end_headers()

          server = HTTPServer(('0.0.0.0', 8080), PerfectProxyHandler)
          server.serve_forever()
          EOF

          python3 proxy.py &
          sleep 2

      - name: 3. Khoi chay Bore Tunnel (Port 55828)
        run: |
          bore local 8080 --to bore.pub --port 55828
