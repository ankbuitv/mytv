name: ZTE IPTV Zero-Lag Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai Bore CLI va Cai Python Requests
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          pip3 install requests

      - name: 2. Tao va Chay Smart Proxy Script
        run: |
          cat << 'EOF' > proxy.py
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import requests

          class PerfectProxyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # Chuyen doi path proxy thanh path ZTE goc
                  path = self.path.replace('/zte/', '/')
                  target_url = f"http://136.239.158.10:6610{path}"
                  
                  # 1. FILE .TS -> DIRECT VE SERVER ZTE GOC (MAX TOC DO, KHONG PROXY DATA)
                  if '.ts' in path:
                      self.send_response(302)
                      self.send_header('Location', target_url)
                      self.end_headers()
                      return

                  # 2. FILE .M3U8 -> PROXY FAKE HEADER CHUAN STB ZTE
                  headers = {
                      'User-Agent': 'ZTE-STB-Android/1.0',
                      'X-Requested-With': 'com.zte.iptv.epg',
                      'Accept': '*/*'
                  }
                  
                  try:
                      resp = requests.get(target_url, headers=headers, timeout=10)
                      
                      if resp.status_code != 200:
                          self.send_error(resp.status_code)
                          return
                          
                      content = resp.text
                      lines = content.splitlines()
                      new_lines = []
                      
                      # Lay Domain Proxy dong (VD: http://159.223.110.159:55828)
                      host_header = self.headers.get('Host', '159.223.110.159:55828')
                      proxy_base = f"http://{host_header}"
                      
                      parent_path = path.rsplit('/', 1)[0] + '/'

                      for line in lines:
                          line_str = line.strip()
                          if line_str and not line_str.startswith('#'):
                              if '.m3u8' in line_str:
                                  # Ep sang Absolute URL di qua Proxy
                                  if line_str.startswith('/'):
                                      full_m3u8 = f"{proxy_base}/zte{line_str}"
                                  elif line_str.startswith('http'):
                                      full_m3u8 = line_str.replace('http://136.239.158.10:6610', f"{proxy_base}/zte")
                                  else:
                                      full_m3u8 = f"{proxy_base}/zte{parent_path}{line_str}"
                                  new_lines.append(full_m3u8)
                              elif '.ts' in line_str:
                                  # Ep sang Absolute URL di thang ZTE gốc
                                  if line_str.startswith('/'):
                                      full_ts = f"http://136.239.158.10:6610{line_str}"
                                  elif line_str.startswith('http'):
                                      full_ts = line_str
                                  else:
                                      full_ts = f"http://136.239.158.10:6610{parent_path}{line_str}"
                                  new_lines.append(full_ts)
                              else:
                                  new_lines.append(line)
                          else:
                              new_lines.append(line)
                      
                      modified_content = '\n'.join(new_lines)
                      
                      self.send_response(200)
                      self.send_header('Access-Control-Allow-Origin', '*')
                      self.send_header('Content-Type', 'application/vnd.apple.mpegurl')
                      self.end_headers()
                      self.wfile.write(modified_content.encode('utf-8'))
                      
                  except Exception as e:
                      self.send_error(500, str(e))

              def do_OPTIONS(self):
                  self.send_response(200)
                  self.send_header('Access-Control-Allow-Origin', '*')
                  self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')
                  self.send_header('Access-Control-Allow-Headers', '*')
                  self.end_headers()

          server = HTTPServer(('0.0.0.0', 8080), PerfectProxyHandler)
          server.serve_forever()
          EOF

          python3 proxy.py &
          sleep 2

      - name: 3. Khoi chay Bore Tunnel (Port 55828)
        run: |
          bore local 8080 --to bore.pub --port 55828
