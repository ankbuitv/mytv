name: IPTV Stream Server - TV360+9 (Direct Copy - Ultra Fast)

on:
  schedule:
    - cron: '59 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Streamer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl dnsutils
          pip install flask flask-cors

          # ====================================================
          # 1. CẤU HÌNH DUCKDNS
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"

          # 2. Cài đặt Bore
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          # Tạo thư mục HLS
          mkdir -p hls/tv360-9

          # 3. Mở Bore Tunnel Port 30206
          BORE_PORT=30206
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            bore local 5000 --to bore.pub --port 30206 > bore.log 2>&1 &
            sleep 4
            
            if grep -q "listening at bore.pub:30206" bore.log; then
              echo "✅ Đã giữ thành công Port 30206!"
              break
            else
              pkill bore || true
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 3
            fi
          done

          # 4. Update DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # 5. File Playlist M3U
          echo "#EXTM3U" > playlist.m3u
          echo '#EXTINF:-1 tvg-id="tv360plus9" tvg-name="TV360+9" group-title="Sự Kiện TV360", TV360+9' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/tv360-9/1080p.m3u8" >> playlist.m3u

          # 6. Flask Server Đa Luồng
          echo 'from flask import Flask, send_from_directory, abort' > app.py
          echo 'from flask_cors import CORS' >> app.py
          echo 'import os' >> app.py
          echo 'app = Flask(__name__)' >> app.py
          echo 'CORS(app)' >> app.py
          echo '@app.route("/")' >> app.py
          echo 'def index(): return "IPTV Stream Server is Running!", 200' >> app.py
          echo '@app.route("/playlist.m3u")' >> app.py
          echo 'def playlist(): return send_from_directory(".", "playlist.m3u")' >> app.py
          echo '@app.route("/hls/<path:filename>")' >> app.py
          echo 'def serve_hls(filename):' >> app.py
          echo '    file_path = os.path.join("hls", filename)' >> app.py
          echo '    if not os.path.exists(file_path): return abort(404)' >> app.py
          echo '    return send_from_directory("hls", filename)' >> app.py
          echo 'if __name__ == "__main__": app.run(host="0.0.0.0", port=5000, threaded=True)' >> app.py

          python3 app.py &
          sleep 2

          UA_DALVIK="Dalvik/2.1.0"

          # ====================================================
          # 7. CHẠY FFMPEG CHẾ ĐỘ DIRECT COPY (KHÔNG LOGO, SIÊU MƯỢT)
          # ====================================================
          STREAM_URL_9="https://vmttv.dpdns.org/tv360/?id=tv360-9"
          CURRENT_REAL_URL=""
          FFMPEG_PID=""

          get_real_url() {
            local fetched_url=$(curl -sI -A "$UA_DALVIK" "$STREAM_URL_9" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
            if [ -z "$fetched_url" ]; then
              fetched_url="$STREAM_URL_9"
            fi
            echo "$fetched_url"
          }

          start_ffmpeg() {
            local target_url="$1"
            echo "🎬 [FFmpeg Engine] Đang stream trực tiếp (Direct Stream Copy)..."
            ffmpeg -hide_banner -loglevel error \
              -rw_timeout 15000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
              -user_agent "$UA_DALVIK" \
              -i "$target_url" \
              -c copy \
              -f hls -hls_time 2 -hls_list_size 10 -hls_delete_threshold 4 -hls_flags delete_segments+omit_endlist \
              -hls_segment_filename "hls/tv360-9/seg_1080p_%05d.ts" hls/tv360-9/1080p.m3u8 &
            FFMPEG_PID=$!
          }

          CURRENT_REAL_URL=$(get_real_url)
          start_ffmpeg "$CURRENT_REAL_URL"

          # Vòng lặp 30 phút check link
          while true; do
            sleep 1800
            NEW_REAL_URL=$(get_real_url)
            if ! kill -0 $FFMPEG_PID 2>/dev/null || [ "$NEW_REAL_URL" != "$CURRENT_REAL_URL" ]; then
              if kill -0 $FFMPEG_PID 2>/dev/null; then kill -9 $FFMPEG_PID || true; fi
              CURRENT_REAL_URL="$NEW_REAL_URL"
              start_ffmpeg "$CURRENT_REAL_URL"
            fi
          done
