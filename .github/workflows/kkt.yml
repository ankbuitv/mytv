name: IPTV Stream Server - Technical ABR Reference (Auto-Heal & Precision UTC+7)

on:
  schedule:
    - cron: '50 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Streamer Engine ABR
        run: |
          # 1. Cài đặt hệ thống & Set múi giờ UTC+7
          sudo apt-get update && sudo apt-get install -y ffmpeg curl dnsutils fonts-dejavu-core tzdata
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || true
          export TZ="Asia/Ho_Chi_Minh"
          pip install flask flask-cors

          # CẤU HÌNH DUCKDNS & PORT 30602
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=30602

          # 2. Cài đặt Bore Tunnel
          echo "⏬ Đang tải Bore..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          # Dọn dẹp & tạo thư mục lưu HLS
          rm -rf hls
          mkdir -p hls/v0 hls/v1 hls/v2

          # 3. Mở Bore Tunnel tại Port 30602
          echo "🌐 Đang mở Bore Tunnel tại Port cố định ${BORE_PORT}..."
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            bore local 5000 --to bore.pub --port $BORE_PORT > bore.log 2>&1 &
            sleep 4
            
            if grep -q "listening at bore.pub:${BORE_PORT}" bore.log; then
              echo "✅ Đã giữ thành công Port ${BORE_PORT}!"
              break
            else
              echo "⚠️ Port ${BORE_PORT} đang bận... Thử lại ($((RETRY_COUNT+1))/$MAX_RETRIES)"
              pkill bore || true
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 3
            fi
          done

          # 4. Cập nhật IP Bore lên DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "🌐 Cập nhật IP Bore (${BORE_IP}) lên ${DUCKDNS_DOMAIN}.duckdns.org..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo ""
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # 5. Tạo file playlist.m3u
          echo "#EXTM3U" > playlist.m3u
          echo '#EXTINF:-1 tvg-id="tv360plus9" tvg-name="TV360+9" group-title="Sự Kiện TV360", TV360+9 (ABR Technical)' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/master.m3u8" >> playlist.m3u

          # 6. Khởi tạo Flask Server
          cat << 'EOF' > app.py
          from flask import Flask, send_from_directory, abort
          from flask_cors import CORS
          import os

          app = Flask(__name__)
          CORS(app)

          @app.route("/")
          def index():
              return "IPTV Technical ABR Server (Low-Latency Port 30602) is Running!", 200

          @app.route("/playlist.m3u")
          def playlist():
              return send_from_directory(".", "playlist.m3u")

          @app.route("/hls/<path:filename>")
          def serve_hls(filename):
              file_path = os.path.join("hls", filename)
              if not os.path.exists(file_path):
                  return abort(404)
              
              dir_name = os.path.dirname(file_path)
              base_name = os.path.basename(file_path)
              
              response = send_from_directory(dir_name, base_name)
              if filename.endswith(".m3u8"):
                  response.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              elif filename.endswith(".ts"):
                  response.headers["Cache-Control"] = "max-age=3600"
              return response

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          EOF

          python3 app.py &
          sleep 2

          UA_DALVIK="Dalvik/2.1.0"

          echo "===================================================="
          echo "🚀 CHRTV ABR TECHNICAL MONITOR READY PORT ${BORE_PORT}!"
          echo "👉 PLAYLIST M3U: ${PUBLIC_URL}/playlist.m3u"
          echo "👉 MASTER ABR:   ${PUBLIC_URL}/hls/master.m3u8"
          echo "===================================================="

          # ====================================================
          # 7. ENGINE ENCODE ABR (Bổ sung cờ chịu lỗi mạng demuxer)
          # ====================================================
          STREAM_URL_9="https://freem3u.xyz/api/live/play.m3u8?vid=9904"
          CURRENT_REAL_URL=""
          FFMPEG_PID=""

          get_real_url() {
            local fetched_url=$(curl -sI -A "$UA_DALVIK" "$STREAM_URL_9" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
            if [ -z "$fetched_url" ]; then
              fetched_url="$STREAM_URL_9"
            fi
            echo "$fetched_url"
          }

          start_ffmpeg() {
            local target_url="$1"
            echo "🎬 [FFmpeg Engine] Khởi chạy Low-Latency Technical Stream (Native ms)..."
            
            TZ="Asia/Ho_Chi_Minh" ffmpeg -hide_banner -loglevel error \
              -rw_timeout 15000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
              -max_reload 20 -m3u8_hold_counters 20 \
              -err_detect ignore_err \
              -user_agent "$UA_DALVIK" \
              -i "$target_url" \
              -filter_complex "[0:v]split=3[v1][v2][v3]; \
               [v1]scale=1920:1080,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{localtime\:%Y-%m-%d %H\\\\\:%M\\\\\:%S}.%{localtime\:%3N}':x=25:y=h-th-25:fontcolor=white:fontsize=28:box=1:boxcolor=black@0.65:boxborderw=7,format=yuv420p[v1080out]; \
               [v2]scale=1280:720,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{localtime\:%Y-%m-%d %H\\\\\:%M\\\\\:%S}.%{localtime\:%3N}':x=20:y=h-th-20:fontcolor=white:fontsize=20:box=1:boxcolor=black@0.65:boxborderw=5,format=yuv420p[v720out]; \
               [v3]scale=854:480,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{localtime\:%Y-%m-%d %H\\\\\:%M\\\\\:%S}.%{localtime\:%3N}':x=15:y=h-th-15:fontcolor=white:fontsize=15:box=1:boxcolor=black@0.65:boxborderw=4,format=yuv420p[v480out]; \
               [0:a]asplit=3[a1][a2][a3]" \
              -map "[v1080out]" -c:v:0 libx264 -preset ultrafast -tune zerolatency -profile:v:0 main -g:v:0 25 -b:v:0 2800k -maxrate:v:0 3200k -bufsize:v:0 5000k \
              -map "[a1]"       -c:a:0 aac -b:a:0 128k -ar:a:0 44100 \
              -map "[v720out]"  -c:v:1 libx264 -preset ultrafast -tune zerolatency -profile:v:1 baseline -g:v:1 25 -b:v:1 1200k -maxrate:v:1 1400k -bufsize:v:1 2400k \
              -map "[a2]"       -c:a:1 aac -b:a:1 96k -ar:a:1 44100 \
              -map "[v480out]"  -c:v:2 libx264 -preset ultrafast -tune zerolatency -profile:v:2 baseline -g:v:2 25 -b:v:2 500k  -maxrate:v:2 600k  -bufsize:v:2 1000k \
              -map "[a3]"       -c:a:2 aac -b:a:2 64k -ar:a:2 44100 \
              -f hls -hls_time 1 -hls_list_size 4 \
              -hls_flags delete_segments+omit_endlist+independent_segments+split_by_time \
              -master_pl_name master.m3u8 \
              -var_stream_map "v:0,a:0 v:1,a:1 v:2,a:2" \
              -hls_segment_filename "hls/v%v/seg_%03d.ts" hls/v%v/prog.m3u8 &
            
            FFMPEG_PID=$!
          }

          CURRENT_REAL_URL=$(get_real_url)
          echo "🔗 Link gốc: $CURRENT_REAL_URL"
          start_ffmpeg "$CURRENT_REAL_URL"

          while true; do
            sleep 600
            NEW_REAL_URL=$(get_real_url)

            if ! kill -0 $FFMPEG_PID 2>/dev/null || [ "$NEW_REAL_URL" != "$CURRENT_REAL_URL" ]; then
              echo "🔄 [Auto-Heal] Re-starting FFmpeg..."
              if kill -0 $FFMPEG_PID 2>/dev/null; then
                kill -9 $FFMPEG_PID || true
              fi
              
              CURRENT_REAL_URL="$NEW_REAL_URL"
              start_ffmpeg "$CURRENT_REAL_URL"
            fi
          done
