name: "HLS Restream - Woman"

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    env:
      CHANNEL_ID: "wo"
      TARGET_PORT: "30120"
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/WO/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"

    steps:
      - name: "Cài đặt gói phụ thuộc hệ thống - Woman"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg netcat-openbsd

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          mkdir -p /dev/shm/hls/${CHANNEL_ID}

      - name: "Kiểm tra kết nối MPD Manifest - Woman (Tối đa 2 phút)"
        shell: bash
        run: |
          set -euo pipefail
          echo "⏳ Đang kiểm tra kết nối trực tiếp tới manifest MPD (Tối đa 2 phút)..."
          
          TIMEOUT=120
          INTERVAL=5
          ELAPSED=0
          CONNECTED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "${USER_AGENT}" \
              -H "Referer: ${REFERER}" \
              -H "Origin: https://vtvprime.vn" \
              --connect-timeout 5 \
              "${MPD_URL}" || echo "000")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Kết nối thành công tới MPD trong ${ELAPSED}s! (HTTP 200)"
              CONNECTED=1
              break
            fi

            echo "⚠️ Chưa kết nối được (HTTP $HTTP_STATUS). Thử lại sau ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $CONNECTED -ne 1 ]; then
            echo "❌ Lỗi: Không thể kết nối tới MPD sau 2 phút! Server VTVPrime có thể đang chặn dải IP GitHub Actions."
            exit 1
          fi

      - name: "Khởi chạy Node.js HLS Server - Woman"
        shell: bash
        run: |
          set -euo pipefail
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const channelId = process.env.CHANNEL_ID;
          const HLS_DIR = `/dev/shm/hls/${channelId}`;

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let fileName = req.url.split('?')[0].replace('/', '');
            if (!fileName || fileName === '') fileName = 'index.m3u8';
            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            if (fileName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (fileName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            const stream = fs.createReadStream(filePath);
            stream.pipe(res);
            stream.on('error', () => {
              if (!res.headersSent) res.writeHead(500);
              res.end();
            });
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 Server started on port 5000...');
          });
          EOF

          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in {1..10}; do
            if nc -z localhost 5000; then
              echo "✅ Local HLS Server đang lắng nghe tại cổng 5000"
              break
            fi
            sleep 1
          done

      - name: "Khởi chạy FFmpeg Stream - Woman"
        shell: bash
        run: |
          set -euo pipefail

          cat << 'EOF' > /tmp/run_ffmpeg.sh
          #!/usr/bin/env bash
          set -euo pipefail

          # Header chuẩn với Origin không có slash ở cuối
          HEADERS=$'Referer: https://vtvprime.vn/\r\nOrigin: https://vtvprime.vn\r\n'

          while true; do
            echo "🚀 Starting FFmpeg stream (${CHANNEL_ID})..."
            
            ffmpeg -hide_banner -loglevel info \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -user_agent "${USER_AGENT}" \
              -headers "${HEADERS}" \
              -cenc_decryption_key "${CLEARKEY_KEY}" \
              -i "${MPD_URL}" \
              -c copy \
              -f hls \
              -hls_time 4 \
              -hls_list_size 5 \
              -hls_flags delete_segments+omit_endlist+temp_file \
              -hls_segment_filename "/dev/shm/hls/${CHANNEL_ID}/segment_%03d.ts" \
              "/dev/shm/hls/${CHANNEL_ID}/index.m3u8"

            EXIT_CODE=$?
            echo "⚠️ FFmpeg đã thoát với mã lỗi: ${EXIT_CODE}. Đang thử lại sau 3 giây..."
            sleep 3
          done
          EOF

          chmod +x /tmp/run_ffmpeg.sh
          nohup /tmp/run_ffmpeg.sh > /tmp/ffmpeg.log 2>&1 &

          echo "⏳ Chờ FFmpeg khởi tạo luồng và ghi file index.m3u8..."
          STREAM_READY=0
          for i in {1..40}; do
            if [ -s "/dev/shm/hls/${CHANNEL_ID}/index.m3u8" ]; then
              STREAM_READY=1
              echo "✅ FFmpeg đã tạo thành công file index.m3u8!"
              break
            fi
            sleep 2
          done

          if [ $STREAM_READY -ne 1 ]; then
            echo "❌ Lỗi: FFmpeg không thể tạo luồng HLS. Dưới đây là chi tiết log FFmpeg:"
            echo "--------------------- FFMPEG LOG ---------------------"
            cat /tmp/ffmpeg.log
            echo "------------------------------------------------------"
            exit 1
          fi

      - name: "Mở Tunnel Bore & Giám sát - Woman"
        shell: bash
        run: |
          set -euo pipefail

          echo "🚀 Khởi động Bore Tunnel tới bore.pub:${TARGET_PORT}..."
          bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          echo $BORE_PID > /tmp/bore.pid

          SUCCESS=0
          for i in {1..30}; do
            sleep 2
            if grep -q -e "bound to remote port" -e "bore.pub:${TARGET_PORT}" /tmp/bore.log 2>/dev/null; then
              SUCCESS=1
              break
            fi
            if ! kill -0 $BORE_PID 2>/dev/null || grep -q "address already in use" /tmp/bore.log 2>/dev/null; then
              kill -9 $BORE_PID 2>/dev/null || true
              > /tmp/bore.log
              bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
              BORE_PID=$!
              echo $BORE_PID > /tmp/bore.pid
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Không thể kết nối Bore Tunnel:"
            cat /tmp/bore.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ STREAM ĐÃ SẴN SÀNG: http://bore.pub:${TARGET_PORT}/index.m3u8"
          echo "=================================================="

          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            # Chạy khoảng 5 tiếng 59 phút
            if [ $(( NOW - START_TIME )) -ge 21540 ]; then
              echo "⏰ Đã đủ thời gian chạy workflow. Kết thúc tiến trình."
              exit 0
            fi

            # Kiểm tra Bore Watchdog
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then
              echo "⚠️ Phát hiện Bore tunnel ngắt kết nối. Đang khởi động lại..."
              bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
              echo $! > /tmp/bore.pid
            fi

            sleep 10
          done
