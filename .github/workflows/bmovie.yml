name: HLS Restream ABR - Box Movie 1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: boxmovie1-restream
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  hls-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/vtv"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb
          rm -f /tmp/cf.deb
          rm -rf "${HLS_DIR}"
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo_raw.png
          ffmpeg -y -i /tmp/logo_raw.png -vf "format=rgba,colorchannelmixer=aa=0.5" /tmp/logo_final.png
          echo "Setup ready."

      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          chmod 600 ~/.cloudflared/credentials.json
          python3 -c "import os,pathlib; pathlib.Path.home().joinpath('.cloudflared','config.yml').write_text('tunnel: '+os.environ['TUNNEL_ID']+'\ncredentials-file: /home/runner/.cloudflared/credentials.json\n\ningress:\n  - hostname: zzdigital01.thelac.dpdns.org\n    service: http://127.0.0.1:5000\n  - service: http_status:404\n')"

      - name: Start HLS Web Server
        run: |
          python3 -c 'from pathlib import Path; Path("/tmp/hls_server.js").write_text("""
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const ROOT = "/dev/shm/hls/vtv";
          const MIME = {".m3u8":"application/vnd.apple.mpegurl",".ts":"video/mp2t",".jpg":"image/jpeg",".jpeg":"image/jpeg"};
          http.createServer((req, res) => {
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
            res.setHeader("Access-Control-Allow-Headers", "*");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            if (req.method !== "GET" && req.method !== "HEAD") { res.writeHead(405); return res.end(); }
            let pathname;
            try { pathname = decodeURIComponent(new URL(req.url, "http://localhost").pathname); }
            catch (e) { res.writeHead(400); return res.end(); }
            if (!pathname.startsWith("/vtv")) { res.writeHead(404); return res.end(); }
            let relative = pathname.slice(4);
            if (relative === "" || relative === "/" || relative === "/boxmovie1.m3u8") relative = "/index.m3u8";
            if (relative === "/thumbnail.jpg") relative = "/thumb.jpg";
            const filePath = path.resolve(ROOT, "." + relative);
            if (!filePath.startsWith(ROOT + path.sep) && filePath !== ROOT) { res.writeHead(403); return res.end(); }
            const ext = path.extname(filePath);
            if (!MIME[ext]) { res.writeHead(403); return res.end(); }
            fs.stat(filePath, (err, stat) => {
              if (err || !stat.isFile()) { res.writeHead(404); return res.end(); }
              if (ext === ".m3u8") {
                let body = fs.readFileSync(filePath, "utf8");
                if (body.indexOf("#EXTINF") !== -1 && body.indexOf("#EXT-X-START") === -1) {
                  body = body.replace("#EXTM3U", "#EXTM3U\\n#EXT-X-START:TIME-OFFSET=-20.0");
                }
                const buf = Buffer.from(body);
                res.setHeader("Content-Type", MIME[ext]);
                res.setHeader("Cache-Control", "no-store, max-age=0");
                res.setHeader("Content-Length", buf.length);
                res.writeHead(200);
                if (req.method === "HEAD") return res.end();
                return res.end(buf);
              }
              res.setHeader("Content-Type", MIME[ext]);
              res.setHeader("Cache-Control", (ext === ".jpg") ? "no-store, max-age=0" : "public, max-age=8");
              res.setHeader("Content-Length", stat.size);
              res.writeHead(200);
              if (req.method === "HEAD") return res.end();
              const s = fs.createReadStream(filePath);
              s.on("error", () => res.destroy());
              s.pipe(res);
            });
          }).listen(5000, "127.0.0.1");
          """)'
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid

      - name: Run Stream Engine & Self-Chaining Watchdog
        run: |
          set -euo pipefail

          python3 -c 'from pathlib import Path; import os; Path(os.environ["HLS_DIR"]).joinpath("index.m3u8").write_text("#EXTM3U\n#EXT-X-VERSION:6\n#EXT-X-INDEPENDENT-SEGMENTS\n#EXT-X-STREAM-INF:BANDWIDTH=2096000,AVERAGE-BANDWIDTH=1896000,RESOLUTION=1280x720,FRAME-RATE=25,CODECS=\"avc1.4d401f,mp4a.40.2\"\n720p/stream.m3u8\n#EXT-X-STREAM-INF:BANDWIDTH=996000,AVERAGE-BANDWIDTH=896000,RESOLUTION=854x480,FRAME-RATE=25,CODECS=\"avc1.4d401e,mp4a.40.2\"\n480p/stream.m3u8\n")'

          HTTP_HEADERS="User-Agent: ${USER_AGENT}"$'\r\n'"Referer: ${REFERER}"$'\r\n'

          slim_mpd() {
            python3 - << 'PY'
          import os, re, urllib.request
          url = os.environ["MPD_URL"]
          ua = os.environ["USER_AGENT"]
          ref = os.environ["REFERER"]
          req = urllib.request.Request(url, headers={"User-Agent": ua, "Referer": ref})
          xml = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "replace")
          base = url.rsplit("/", 1)[0] + "/"
          if "<BaseURL>" not in xml:
              xml = xml.replace("<Period", "<Period", 1)
              xml = xml.replace("<Period", "<Period", 1)
              xml = re.sub(r"(<Period[^>]*>)", r"\1\n    <BaseURL>"+base+"</BaseURL>", xml, count=1)
          xml = re.sub(
              r'<Representation\b[^>]*\bid="V0"[^>]*/>',
              "",
              xml,
          )
          xml = re.sub(
              r'<Representation\b[^>]*\bid="V1"[^>]*/>',
              "",
              xml,
          )
          Path = __import__("pathlib").Path
          Path("/tmp/bm1-slim.mpd").write_text(xml, encoding="utf-8")
          print("slim mpd bytes", Path("/tmp/bm1-slim.mpd").stat().st_size)
          PY
          }

          # Khong setpts/fps/async. Overlay 1 lan, split 720/480. Audio asplit.
          FILTER_COMPLEX="[0:v:0]setsar=1[base];[1:v]format=rgba[lg];[base][lg]overlay=x=W-w-10:y=H-h-10:format=auto:repeatlast=1,split=2[out720][tmp480];[tmp480]scale=854:480:flags=fast_bilinear,setsar=1[out480];[0:a:0]asplit=2[a720][a480]"

          start_ffmpeg() {
            echo "Khoi dong FFmpeg (slim V2+A0, giu PTS)..."
            mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
            slim_mpd
            nohup ffmpeg -hide_banner -loglevel warning -nostdin \
              -fflags +genpts+discardcorrupt \
              -thread_queue_size 512 \
              -headers "$HTTP_HEADERS" \
              -rw_timeout 15000000 \
              -timeout 15000000 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -i /tmp/bm1-slim.mpd \
              -thread_queue_size 64 \
              -i /tmp/logo_final.png \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[out720]" -map "[a720]" \
              -c:v libx264 -preset ultrafast -profile:v main -level 3.1 \
              -x264-params "keyint=100:min-keyint=100:scenecut=0:open-gop=0" \
              -pix_fmt yuv420p -fps_mode cfr -r 25 -g 100 -keyint_min 100 -sc_threshold 0 \
              -b:v 1800k -maxrate 2000k -bufsize 3600k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 \
              -f hls -hls_time 4 -hls_list_size 450 -hls_delete_threshold 8 \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file+program_date_time \
              -hls_segment_filename "${HLS_DIR}/720p/s_%06d.ts" \
              "${HLS_DIR}/720p/stream.m3u8" \
              -map "[out480]" -map "[a480]" \
              -c:v libx264 -preset ultrafast -profile:v main -level 3.1 \
              -x264-params "keyint=100:min-keyint=100:scenecut=0:open-gop=0" \
              -pix_fmt yuv420p -fps_mode cfr -r 25 -g 100 -keyint_min 100 -sc_threshold 0 \
              -b:v 800k -maxrate 900k -bufsize 1600k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 \
              -f hls -hls_time 4 -hls_list_size 450 -hls_delete_threshold 8 \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file+program_date_time \
              -hls_segment_filename "${HLS_DIR}/480p/s_%06d.ts" \
              "${HLS_DIR}/480p/stream.m3u8" \
              > /tmp/ffmpeg.log 2>&1 &
            echo $! > /tmp/ffmpeg.pid
          }

          snap_thumb() {
            local ts
            ts=$(ls -1t "${HLS_DIR}/720p"/s_*.ts 2>/dev/null | head -n 1 || true)
            [ -n "$ts" ] || return 0
            ffmpeg -y -hide_banner -loglevel error -ss 0.4 -i "$ts" -frames:v 1 \
              -vf "scale=320:180:flags=fast_bilinear" -q:v 6 "${HLS_DIR}/thumb.jpg" || true
          }

          start_ffmpeg

          echo "Dang cho HLS..."
          READY=0
          for i in $(seq 1 60); do
            C720=$(grep -c "^#EXTINF" "${HLS_DIR}/720p/stream.m3u8" 2>/dev/null || echo 0)
            C480=$(grep -c "^#EXTINF" "${HLS_DIR}/480p/stream.m3u8" 2>/dev/null || echo 0)
            if [ "$C720" -ge 5 ] && [ "$C480" -ge 5 ]; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "FFmpeg da dung luc khoi dong!"
              cat /tmp/ffmpeg.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Loi khoi dong FFmpeg!"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi
          snap_thumb

          echo "=========================================================="
          echo "BOX MOVIE 1 ONLINE: https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
          echo "THUMB: https://zzdigital01.thelac.dpdns.org/vtv/thumb.jpg"
          echo "=========================================================="

          TARGET_PLAYLIST="${HLS_DIR}/720p/stream.m3u8"
          LAST_MOD_TIME=0
          STALE_SECONDS=0
          START_TIME=$(date +%s)
          AUTO_TRIGGER_SECONDS=19800
          NEXT_TRIGGERED=0
          THUMB_TICK=0

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$AUTO_TRIGGER_SECONDS" ] && [ "$NEXT_TRIGGERED" -eq 0 ]; then
              gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}" || true
              NEXT_TRIGGERED=1
            fi

            if ! kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null; then
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
            fi
            if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
              nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
              echo $! > /tmp/tunnel.pid
            fi

            FFMPEG_ALIVE=1
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              FFMPEG_ALIVE=0
            fi

            if [ -f "$TARGET_PLAYLIST" ]; then
              CURRENT_MOD_TIME=$(stat -c %Y "$TARGET_PLAYLIST" 2>/dev/null || echo 0)
              if [ "$CURRENT_MOD_TIME" -eq "$LAST_MOD_TIME" ]; then
                STALE_SECONDS=$((STALE_SECONDS + 10))
              else
                STALE_SECONDS=0
                LAST_MOD_TIME="$CURRENT_MOD_TIME"
              fi
            else
              STALE_SECONDS=$((STALE_SECONDS + 10))
            fi

            if [ "$FFMPEG_ALIVE" -eq 0 ] || [ "$STALE_SECONDS" -ge 80 ]; then
              echo "FFmpeg su co (Alive: $FFMPEG_ALIVE, Stalled: ${STALE_SECONDS}s)"
              tail -n 50 /tmp/ffmpeg.log || true
              kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              sleep 1
              start_ffmpeg
              STALE_SECONDS=0
              LAST_MOD_TIME=0
            fi

            THUMB_TICK=$((THUMB_TICK + 10))
            if [ "$THUMB_TICK" -ge 10 ]; then
              snap_thumb
              THUMB_TICK=0
            fi

            echo "[$(date -u '+%H:%M:%S UTC')] Running: $((ELAPSED / 60))m / 330m | Delay: ${STALE_SECONDS}s"
            sleep 10
          done
