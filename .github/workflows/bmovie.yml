name: HLS Restream ABR - Box Movie 1 (Cron Auto Restart)

on:
  workflow_dispatch:
  schedule:
    # Tự động khởi chạy lúc 05:59, 11:59, 17:59, 23:59 UTC (Cứ mỗi 6 tiếng)
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      BORE_PORT: "30117"
      HLS_DIR: "/dev/shm/hls/bm1"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg librsvg2-bin

          # Tải và cài đặt Bore Tunnel
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          # Tải Logo SVG và chuyển đổi thành PNG transparent nhỏ gọn
          echo "🎨 Đang tải và chuẩn bị Logo Watermark..."
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          # Chuyển SVG -> PNG chiều rộng 80px (gọn nhẹ)
          rsvg-convert -w 80 /tmp/logo.svg -o /tmp/logo.png

          # Tạo sẵn cấu trúc thư mục tự động (720p & 480p)
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"

      - name: Create HLS Server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/bm1';

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');
            res.setHeader('Access-Control-Expose-Headers', '*');
            res.setHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
            res.setHeader('Connection', 'keep-alive');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let reqPath = req.url.split('?')[0];
            if (!reqPath || reqPath === '/') {
              reqPath = '/index.m3u8';
            }

            const filePath = path.join(HLS_DIR, path.normalize(reqPath));

            if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            const lowerName = filePath.toLowerCase();
            if (lowerName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (lowerName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            const stream = fs.createReadStream(filePath);
            stream.pipe(res);
            stream.on('error', () => {
              if (!res.headersSent) res.writeHead(500);
              res.end();
            });
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 HLS Server running on port 5000...');
          });
          EOF

      - name: Start Services & FFmpeg ABR Stream with Watermark
        shell: bash
        run: |
          # 1. Khởi chạy HTTP Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # Hàm khởi động FFmpeg ABR với Logo Watermark
          start_ffmpeg() {
            echo "🎬 [FFmpeg Engine] Bắt đầu Encode ABR Box Movie 1 kèm Logo Watermark..."
            CUSTOM_HEADERS="Referer: ${REFERER}"$'\r\n'"Origin: https://vtvprime.vn"$'\r\n'
            
            # Cấu hình Filter:
            # - format=rgba,colorchannelmixer=aa=0.7 : Làm mờ logo còn 70% opacity
            # - overlay=main_w-overlay_w-20:main_h-overlay_h-20 : Đặt logo ở góc DƯỚI BÊN PHẢI (cách lề 20px)
            FILTER_COMPLEX="[1:v]format=rgba,colorchannelmixer=aa=0.7[logo]; \
            [0:v:2][logo]overlay=main_w-overlay_w-20:main_h-overlay_h-20[v720]; \
            [0:v:1][logo]overlay=main_w-overlay_w-20:main_h-overlay_h-20[v480]"

            nohup ffmpeg -hide_banner -loglevel warning \
              -user_agent "$USER_AGENT" \
              -headers "$CUSTOM_HEADERS" \
              -reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 \
              -reconnect_on_http_error 403,429,500,502,503,504 \
              -reconnect_delay_max 5 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -fflags +genpts+discardcorrupt+igndts \
              -i "$MPD_URL" \
              -i /tmp/logo.png \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[v720]" -map 0:a:0 \
              -map "[v480]" -map 0:a:0 \
              -c:v:0 libx264 -preset ultrafast -crf 23 \
              -c:v:1 libx264 -preset ultrafast -crf 25 \
              -c:a:0 aac -b:a:0 128k -ar:a:0 48000 -ac:a:0 2 \
              -c:a:1 aac -b:a:1 96k -ar:a:1 48000 -ac:a:1 2 \
              -f hls \
              -hls_time 2 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments \
              -master_pl_name index.m3u8 \
              -var_stream_map "v:0,a:0,name:720p v:1,a:1,name:480p" \
              -hls_segment_filename "${HLS_DIR}/%v/segment_%03d.ts" \
              "${HLS_DIR}/%v/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
            
            echo $! > /tmp/ffmpeg.pid
          }

          start_ffmpeg

          # 2. Khởi tạo Bore Tunnel
          start_bore() {
            echo "🌐 Đang mở kết nối Bore Tunnel tại port ${BORE_PORT}..."
            rm -f /tmp/bore.log
            nohup bore local 5000 --to bore.pub --port "${BORE_PORT}" > /tmp/bore.log 2>&1 &
            echo $! > /tmp/bore.pid
          }

          start_bore

          PORT_READY=0
          for i in {1..30}; do
            sleep 1
            if grep -qiE "bound to remote port|bore.pub:${BORE_PORT}" /tmp/bore.log 2>/dev/null; then
              PORT_READY=1
              echo "✅ Bore đã giữ thành công port ${BORE_PORT}!"
              break
            fi
          done

          echo "=================================================="
          echo "👉 MASTER ABR STREAM URL: http://bore.pub:${BORE_PORT}/index.m3u8"
          echo "=================================================="
          
          echo "⏳ Đang kiểm tra khởi tạo HLS Stream..."
          STREAM_READY=0
          for i in {1..60}; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              STREAM_READY=1
              echo "✅ HLS ABR Stream Sẵn Sàng!"
              break
            fi

            # Kiểm tra nếu FFmpeg bị sập ngay khi khởi chạy
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "❌ FFmpeg đã bị sập ngay khi khởi chạy! Log chi tiết:"
              echo "---------------- FFMPEG LOG ----------------"
              cat /tmp/ffmpeg.log || true
              echo "--------------------------------------------"
              exit 1
            fi

            sleep 1
          done

          if [ "$STREAM_READY" -ne 1 ]; then
            echo "❌ Không tạo được file index.m3u8 sau 60s. Log FFmpeg:"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

          # 3. Vòng lặp giám sát & Auto-Heal
          START_TIME=$(date +%s)
          LIMIT_SECONDS=21540  # 5 giờ 59 phút

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            if [ "$ELAPSED" -ge "$LIMIT_SECONDS" ]; then
              echo "⏰ Hết ca làm việc (5h59m), kết thúc phiên..."
              exit 0
            fi

            # Tự phục hồi FFmpeg
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] FFmpeg bị ngắt! Đang kích hoạt lại..."
              start_ffmpeg
              sleep 5
            fi

            # Tự phục hồi Bore Tunnel
            if ! kill -0 "$(cat /tmp/bore.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] Bore Tunnel bị rớt! Đang kết nối lại..."
              start_bore
              sleep 5
            fi

            # Tự phục hồi Node HTTP Server
            if ! kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] Node HTTP Server tắt! Đang bật lại..."
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
              sleep 2
            fi

            sleep 10
          done
