name: HLS Restream ABR - Box Movie 1 (Cloudflare Tunnel Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/bm1"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg librsvg2-bin procps
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          rm -f /tmp/cloudflared.deb

          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo.png

      - name: Setup Cloudflare Tunnel Config
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          
          cat << EOF > ~/.cloudflared/config.yml
          tunnel: $TUNNEL_ID
          credentials-file: /home/runner/.cloudflared/credentials.json

          ingress:
            - hostname: zzdigital01.thelac.dpdns.org
              service: http://localhost:5000
            - service: http_status:404
          EOF

      - name: Create Static HLS Server
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/bm1';

          http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let urlPath = req.url.split('?')[0];

            let cleanPath = urlPath.replace(/^\/vtv/, '');
            if (cleanPath === '' || cleanPath === '/' || cleanPath === '/boxmovie1.m3u8') {
              cleanPath = '/index.m3u8';
            }

            const filePath = path.join(HLS_DIR, path.normalize(cleanPath));

            if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            if (filePath.endsWith('.m3u8')) res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            if (filePath.endsWith('.ts')) res.setHeader('Content-Type', 'video/mp2t');

            fs.createReadStream(filePath).pipe(res);
          }).listen(5000, '0.0.0.0', () => {
            console.log('🚀 HTTP Server running on port 5000');
          });
          EOF

      - name: Start Restream Engine & Cloudflare Tunnel
        run: |
          # 1. Bật HTTP Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # 2. Hàm bật FFmpeg
          start_ffmpeg() {
            FILTER="[1:v]format=rgba,colorchannelmixer=aa=0.5,split=2[l1][l2]; \
                    [0:v:2]split=2[v7raw][v4pre]; [v4pre]scale=854:480[v4raw]; \
                    [v7raw][l1]overlay=main_w-overlay_w-10:main_h-overlay_h-10[v7]; \
                    [v4raw][l2]overlay=main_w-overlay_w-8:main_h-overlay_h-8[v4]"

            nohup ffmpeg -hide_banner -loglevel warning \
              -user_agent "$USER_AGENT" -headers "Referer: $REFERER"$'\r\n' \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -fflags +genpts+discardcorrupt+igndts \
              -i "$MPD_URL" -loop 1 -i /tmp/logo.png \
              -filter_complex "$FILTER" \
              -map "[v7]" -map 0:a? -map "[v4]" -map 0:a? \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v:0 2500k -b:v:1 1200k \
              -c:a aac -b:a:0 128k -b:a:1 96k \
              -f hls -hls_time 2 -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments \
              -master_pl_name index.m3u8 \
              -var_stream_map "v:0,a:0,name:720p v:1,a:1,name:480p" \
              -hls_segment_filename "${HLS_DIR}/%v/segment_%03d.ts" \
              "${HLS_DIR}/%v/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
            echo $! > /tmp/ffmpeg.pid
          }

          start_ffmpeg

          # 3. Hàm bật Tunnel (Đã sửa câu lệnh chuẩn)
          start_tunnel() {
            echo "🌐 Đang kết nối Cloudflare Tunnel..."
            rm -f /tmp/tunnel.log
            nohup cloudflared tunnel --config /home/runner/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
            echo $! > /tmp/tunnel.pid
          }

          start_tunnel

          echo "=================================================="
          echo "👉 STREAM URL: https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
          echo "=================================================="

          # Kiểm tra HLS Ready
          for i in {1..60}; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              echo "✅ HLS Stream Ready!"
              break
            fi
            sleep 1
          done

          # Chờ 5s để test kết nối Tunnel
          sleep 5
          if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
            echo "❌ Cloudflare Tunnel gặp lỗi! Log bên dưới:"
            echo "---------------- TUNNEL LOG ----------------"
            cat /tmp/tunnel.log || true
            echo "--------------------------------------------"
            exit 1
          else
            echo "✅ Cloudflare Tunnel đã kết nối thành công!"
          fi

          # 4. Auto Heal Loop
          START_TIME=$(date +%s)
          LIMIT_SECONDS=21540

          while true; do
            NOW=$(date +%s)
            if [ $(( NOW - START_TIME )) -ge "$LIMIT_SECONDS" ]; then
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 Restarting FFmpeg..."
              start_ffmpeg
            fi

            if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 Restarting Tunnel..."
              start_tunnel
              sleep 3
              cat /tmp/tunnel.log || true
            fi

            sleep 10
          done
