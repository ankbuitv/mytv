name: HLS Restream ABR - Box Movie 1 (Fresh Start)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/vtv"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"

    steps:
      - name: Install System & Prepare Assets
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg librsvg2-bin imagemagick procps
          
          # Cài đặt cloudflared
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"

          # Tải logo và xử lý mờ 50%, size 35px
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo_raw.png
          convert /tmp/logo_raw.png -alpha set -channel A -evaluate multiply 0.5 /tmp/logo_final.png

      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          
          cat << EOF > ~/.cloudflared/config.yml
          tunnel: $TUNNEL_ID
          credentials-file: /home/runner/.cloudflared/credentials.json

          ingress:
            - hostname: zzdigital01.thelac.dpdns.org
              service: http://localhost:5000
            - service: http_status:404
          EOF

      - name: Run Engine & Tunnel
        run: |
          # 1. Server Node.js
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const HLS_DIR = '/dev/shm/hls/vtv';

          http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, OPTIONS');
            if (req.method === 'OPTIONS') { res.writeHead(204); return res.end(); }

            let u = req.url.split('?')[0];
            let cleanPath = u.replace(/^\/vtv/, '');
            if (cleanPath === '' || cleanPath === '/' || cleanPath === '/boxmovie1.m3u8') {
              cleanPath = '/index.m3u8';
            }

            const filePath = path.join(HLS_DIR, path.normalize(cleanPath));
            if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              res.writeHead(404); return res.end();
            }

            if (filePath.endsWith('.m3u8')) res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            if (filePath.endsWith('.ts')) res.setHeader('Content-Type', 'video/mp2t');
            fs.createReadStream(filePath).pipe(res);
          }).listen(5000, '0.0.0.0');
          EOF
          nohup node /tmp/hls_server.js > /dev/null 2>&1 &

          # 2. FFmpeg ABR
          FILTER="[0:v:2][1:v]overlay=main_w-overlay_w-10:main_h-overlay_h-10[v7]; \
                  [0:v:1][1:v]overlay=main_w-overlay_w-8:main_h-overlay_h-8[v4]"

          nohup ffmpeg -hide_banner -loglevel warning -user_agent "$USER_AGENT" \
            -headers "Referer: $REFERER"$'\r\n' -cenc_decryption_key "$CLEARKEY_KEY" \
            -i "$MPD_URL" -loop 1 -i /tmp/logo_final.png -filter_complex "$FILTER" \
            -map "[v7]" -map 0:a? -map "[v4]" -map 0:a? \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v:0 2000k -b:v:1 900k \
            -c:a copy -f hls -hls_time 2 -hls_list_size 6 \
            -hls_flags delete_segments+omit_endlist+independent_segments \
            -master_pl_name index.m3u8 \
            -var_stream_map "v:0,a:0,name:720p v:1,a:1,name:480p" \
            -hls_segment_filename "${HLS_DIR}/%v/s_%03d.ts" \
            "${HLS_DIR}/%v/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # 3. Chạy Cloudflare Tunnel
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid

          echo "⏳ Đang kết nối và khởi tạo HLS..."
          while true; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              echo "✅ STREAM ONLINE: https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
            fi
            
            if ! kill -0 "$(cat /tmp/ffmpeg.pid)" 2>/dev/null; then
              echo "❌ FFmpeg lỗi!"
              cat /tmp/ffmpeg.log
              exit 1
            fi
            sleep 30
          done
