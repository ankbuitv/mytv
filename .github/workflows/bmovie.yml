name: HLS Restream ABR - Box Movie 1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: boxmovie1-restream
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  hls-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      # backup nếu cần: https://livevlisctcdnw.seenow.vn/mean/BM1/manifest.mpd
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      # Nếu cần dạng kid:key thì dùng: a7c942778e874d43be92b8d0a0cd11b4:6d54358306571658ffdb952c6560688b
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      USER_AGENT_FALLBACK: "Dalvik/2.1.0 (Linux; U; Android 14; Google TV Streamer Build/UTT3.240625.001.K5)"
      REFERER: "https://vtvprime.vn/"
      ORIGIN: "https://vtvprime.vn"
      HLS_DIR: "/dev/shm/hls/vtv"
      ADS_DIR: "/dev/shm/ads"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HLS_LIST_SIZE: "150"
      HLS_DELETE_THRESHOLD: "20"
      TZ: "Asia/Ho_Chi_Minh"

    steps:
      - name: Checkout repo (lấy ads/)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ads
          sparse-checkout-cone-mode: false

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin jq curl
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb
          rm -f /tmp/cf.deb

          rm -rf "${HLS_DIR}" "${ADS_DIR}"
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p" "${ADS_DIR}"

          # Logo (fix -update 1)
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 38 /tmp/logo.svg -o /tmp/logo_raw.png
          ffmpeg -y -hide_banner -loglevel error -i /tmp/logo_raw.png \
            -vf "format=rgba,colorchannelmixer=aa=0.45" \
            -frames:v 1 -update 1 /tmp/logo_final.png

          # Ads + transparent
          if [ -d "ads" ]; then
            cp -r ads/* "${ADS_DIR}/" 2>/dev/null || true
          fi
          ffmpeg -y -hide_banner -loglevel error -f lavfi \
            -i "color=c=black@0.0:s=512x512,format=rgba" \
            -frames:v 1 -update 1 "${ADS_DIR}/transparent.png"
          cp -f "${ADS_DIR}/transparent.png" "${HLS_DIR}/current_ad.png"
          echo "Setup + ads ready."

      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          chmod 600 ~/.cloudflared/credentials.json
          python3 -c "
          import os, pathlib
          pathlib.Path.home().joinpath('.cloudflared','config.yml').write_text(
          '''tunnel: ''' + os.environ['TUNNEL_ID'] + '''
          credentials-file: /home/runner/.cloudflared/credentials.json
          ingress:
            - hostname: zzdigital01.thelac.dpdns.org
              service: http://127.0.0.1:5000
            - service: http_status:404
          ''')
          "

      - name: Start HLS Web Server
        run: |
          python3 -c 'from pathlib import Path; Path("/tmp/hls_server.js").write_text(r"""
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const ROOT = "/dev/shm/hls/vtv";
          const MIME = {
            ".m3u8": "application/vnd.apple.mpegurl",
            ".ts": "video/mp2t",
            ".jpg": "image/jpeg",
            ".json": "application/json",
            ".png": "image/png"
          };
          function sendJson(res, code, obj) {
            const body = JSON.stringify(obj, null, 2);
            res.writeHead(code, {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(body),
              "Access-Control-Allow-Origin": "*",
              "Cache-Control": "no-store"
            });
            res.end(body);
          }
          const server = http.createServer((req, res) => {
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
            res.setHeader("Access-Control-Allow-Headers", "*");
            res.setHeader("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0");
            res.setHeader("Connection", "keep-alive");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            if (req.method !== "GET" && req.method !== "HEAD") { res.writeHead(405); return res.end(); }
            let pathname;
            try { pathname = decodeURIComponent(new URL(req.url, "http://localhost").pathname); }
            catch (e) { res.writeHead(400); return res.end("bad url"); }

            if (pathname === "/vtv/health" || pathname === "/health") {
              let stats = {};
              try { stats = JSON.parse(fs.readFileSync(ROOT + "/stats.json", "utf8")); } catch {}
              return sendJson(res, 200, {
                status: "ok",
                service: "boxmovie1",
                timestamp: new Date().toISOString(),
                uptime_seconds: stats.uptime_seconds || 0,
                ffmpeg_alive: !!stats.ffmpeg_alive,
                ad_active: stats.ad_active || false
              });
            }
            if (pathname === "/vtv/stats" || pathname === "/stats") {
              try { return sendJson(res, 200, JSON.parse(fs.readFileSync(ROOT + "/stats.json", "utf8"))); }
              catch (e) { return sendJson(res, 503, { error: "stats not ready" }); }
            }
            if (pathname === "/vtv/ads" || pathname === "/ads") {
              try { return sendJson(res, 200, JSON.parse(fs.readFileSync(ROOT + "/ads_state.json", "utf8"))); }
              catch (e) { return sendJson(res, 503, { error: "ads state not ready" }); }
            }
            if (pathname === "/vtv/thumb.jpg" || pathname === "/thumb.jpg") {
              const thumbPath = path.join(ROOT, "thumb.jpg");
              if (!fs.existsSync(thumbPath)) { res.writeHead(404); return res.end("no thumb"); }
              const stat = fs.statSync(thumbPath);
              res.writeHead(200, { "Content-Type": "image/jpeg", "Content-Length": stat.size, "Cache-Control": "no-store" });
              if (req.method === "HEAD") return res.end();
              fs.createReadStream(thumbPath).pipe(res);
              return;
            }
            if (!pathname.startsWith("/vtv")) { res.writeHead(404); return res.end(); }
            let relative = pathname.slice(4);
            if (relative === "" || relative === "/" || relative === "/boxmovie1.m3u8") relative = "/index.m3u8";
            const filePath = path.resolve(ROOT, "." + relative);
            if (!filePath.startsWith(ROOT + path.sep) && filePath !== ROOT) { res.writeHead(403); return res.end(); }
            const ext = path.extname(filePath).toLowerCase();
            if (!MIME[ext]) { res.writeHead(403); return res.end("forbidden"); }
            fs.stat(filePath, (err, stat) => {
              if (err || !stat.isFile()) { res.writeHead(404); return res.end(); }
              res.setHeader("Content-Type", MIME[ext]);
              res.setHeader("Content-Length", stat.size);
              res.writeHead(200);
              if (req.method === "HEAD") return res.end();
              fs.createReadStream(filePath).on("error", () => res.destroy()).pipe(res);
            });
          });
          server.keepAliveTimeout = 30000;
          server.headersTimeout = 35000;
          server.listen(5000, "127.0.0.1", () => console.log("Server ready"));
          """)'
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 1

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          sleep 2

      - name: Run Stream Engine + Hot-swap Ads Watchdog
        run: |
          set -euo pipefail
          export TZ=Asia/Ho_Chi_Minh

          cat > "${HLS_DIR}/index.m3u8" << 'EOF'
          #EXTM3U
          #EXT-X-VERSION:6
          #EXT-X-INDEPENDENT-SEGMENTS
          #EXT-X-STREAM-INF:BANDWIDTH=2400000,AVERAGE-BANDWIDTH=2200000,RESOLUTION=1280x720,FRAME-RATE=25,CODECS="avc1.4d401f,mp4a.40.2"
          720p/stream.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=1200000,AVERAGE-BANDWIDTH=1050000,RESOLUTION=854x480,FRAME-RATE=25,CODECS="avc1.4d401e,mp4a.40.2"
          480p/stream.m3u8
          EOF

          # Headers mạnh
          HTTP_HEADERS="User-Agent: ${USER_AGENT}"$'\r\n'"Referer: ${REFERER}"$'\r\n'"Origin: ${ORIGIN}"$'\r\n'"Accept: */*"$'\r\n'

          FILTER_COMPLEX="[0:v:2]fps=25,setsar=1[v720];[0:v:1]fps=25,scale=854:480:flags=fast_bilinear,setsar=1[v480];[1:v]format=rgba,split=2[lg720][lg480];[2:v]format=rgba,split=2[ad720][ad480];[v720][lg720]overlay=x=W-w-12:y=H-h-12:format=auto[tmp720];[tmp720][ad720]overlay=x=W-w-12:y=H-h-12:format=auto[out720];[v480][lg480]overlay=x=W-w-10:y=H-h-10:format=auto[tmp480];[tmp480][ad480]overlay=x=W-w-10:y=H-h-10:format=auto[out480]"

          RESTART_COUNT=0
          START_TIME=$(date +%s)
          AD_ACTIVE=""
          AD_END_TIME=0

          # ===== Pre-check MPD =====
          check_mpd() {
            local code
            code=$(curl -sS -o /tmp/mpd_test.xml -w "%{http_code}" \
              -A "$USER_AGENT" \
              -e "$REFERER" \
              -H "Origin: $ORIGIN" \
              --connect-timeout 10 --max-time 25 \
              "$MPD_URL" || echo "000")
            if [ "$code" = "200" ] && grep -q "<MPD" /tmp/mpd_test.xml 2>/dev/null; then
              echo "MPD OK (HTTP $code)"
              return 0
            fi
            echo "MPD check failed (HTTP $code)"
            head -c 300 /tmp/mpd_test.xml 2>/dev/null || true
            return 1
          }

          echo "=== Pre-check MPD ==="
          for t in 1 2 3 4 5 6 7 8; do
            if check_mpd; then break; fi
            echo "Retry pre-check $t/8 ..."
            sleep 4
          done

          start_ffmpeg() {
            echo "[$(date '+%H:%M:%S')] Starting FFmpeg #${RESTART_COUNT}"
            mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
            rm -f "${HLS_DIR}/720p/"*.ts "${HLS_DIR}/480p/"*.ts 2>/dev/null || true
            rm -f "${HLS_DIR}/720p/stream.m3u8" "${HLS_DIR}/480p/stream.m3u8" 2>/dev/null || true

            # Đảm bảo current_ad tồn tại
            [ -f "${HLS_DIR}/current_ad.png" ] || cp -f "${ADS_DIR}/transparent.png" "${HLS_DIR}/current_ad.png"

            nohup ffmpeg -hide_banner -loglevel warning -nostdin \
              -fflags +genpts+discardcorrupt+igndts \
              -analyzeduration 20M -probesize 20M \
              -user_agent "$USER_AGENT" \
              -headers "$HTTP_HEADERS" \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_on_network_error 1 -reconnect_on_http_error "4xx,5xx" \
              -reconnect_delay_max 12 \
              -rw_timeout 30000000 -timeout 30000000 \
              -multiple_requests 1 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -i "$MPD_URL" \
              -loop 1 -framerate 1 -i /tmp/logo_final.png \
              -f image2 -loop 1 -framerate 1 -i "${HLS_DIR}/current_ad.png" \
              -filter_complex "$FILTER_COMPLEX" \
              \
              -map "[out720]" -map 0:a:0? \
              -c:v libx264 -preset veryfast -tune zerolatency -profile:v main -level 3.1 \
              -pix_fmt yuv420p -r 25 \
              -force_key_frames "expr:gte(t,n_forced*2)" \
              -g 50 -keyint_min 50 -sc_threshold 0 -bf 0 \
              -x264-params "keyint=50:min-keyint=50:scenecut=0:bframes=0:ref=1:rc-lookahead=0" \
              -b:v 2100k -maxrate 2300k -bufsize 4200k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 -af "aresample=async=1000:first_pts=0" \
              -max_muxing_queue_size 2048 \
              -f hls -hls_time 2 -hls_list_size ${HLS_LIST_SIZE} -hls_delete_threshold ${HLS_DELETE_THRESHOLD} \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file+program_date_time \
              -hls_segment_filename "${HLS_DIR}/720p/s_%06d.ts" \
              "${HLS_DIR}/720p/stream.m3u8" \
              \
              -map "[out480]" -map 0:a:0? \
              -c:v libx264 -preset veryfast -tune zerolatency -profile:v main -level 3.1 \
              -pix_fmt yuv420p -r 25 \
              -force_key_frames "expr:gte(t,n_forced*2)" \
              -g 50 -keyint_min 50 -sc_threshold 0 -bf 0 \
              -x264-params "keyint=50:min-keyint=50:scenecut=0:bframes=0:ref=1:rc-lookahead=0" \
              -b:v 950k -maxrate 1050k -bufsize 1900k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 -af "aresample=async=1000:first_pts=0" \
              -max_muxing_queue_size 2048 \
              -f hls -hls_time 2 -hls_list_size ${HLS_LIST_SIZE} -hls_delete_threshold ${HLS_DELETE_THRESHOLD} \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file+program_date_time \
              -hls_segment_filename "${HLS_DIR}/480p/s_%06d.ts" \
              "${HLS_DIR}/480p/stream.m3u8" \
              > /tmp/ffmpeg.log 2>&1 &
            echo $! > /tmp/ffmpeg.pid
            RESTART_COUNT=$((RESTART_COUNT + 1))
            sleep 2
          }

          activate_ad() {
            local src="$1" width="$2" opacity="$3" id="$4"
            echo "[$(date '+%H:%M:%S')] ACTIVATING AD: $id (w=$width, op=$opacity)"
            ffmpeg -y -hide_banner -loglevel error -i "$src" \
              -vf "scale=${width}:-1:flags=lanczos,format=rgba,colorchannelmixer=aa=${opacity}" \
              -frames:v 1 -update 1 "${HLS_DIR}/current_ad_tmp.png"
            mv -f "${HLS_DIR}/current_ad_tmp.png" "${HLS_DIR}/current_ad.png"
            AD_ACTIVE="$id"
          }

          deactivate_ad() {
            echo "[$(date '+%H:%M:%S')] DEACTIVATING AD"
            cp -f "${ADS_DIR}/transparent.png" "${HLS_DIR}/current_ad.png"
            AD_ACTIVE=""
            AD_END_TIME=0
          }

          PLAYED_FILE="${HLS_DIR}/ads_played.json"
          echo '{"played":[]}' > "$PLAYED_FILE"
          echo '{"active":null}' > "${HLS_DIR}/ads_state.json"

          # ===== Start với retry =====
          start_ffmpeg

          READY=0
          for i in $(seq 1 90); do
            if [ -s "${HLS_DIR}/720p/stream.m3u8" ] && [ -s "${HLS_DIR}/480p/stream.m3u8" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "[$(date '+%H:%M:%S')] FFmpeg dead during start (try $i). Log:"
              tail -n 40 /tmp/ffmpeg.log || true
              echo "--- retry start ---"
              sleep 5
              check_mpd || true
              start_ffmpeg
            fi
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo "FAILED to get playlists after many retries"
            tail -n 100 /tmp/ffmpeg.log || true
            # Không exit 1 vội — vẫn vào loop để watchdog tiếp tục thử
            echo "Entering watchdog anyway..."
          fi

          echo "=========================================================="
          echo "BOX MOVIE 1 ONLINE + HOT-SWAP ADS"
          echo "Playlist : https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
          echo "Health   : https://zzdigital01.thelac.dpdns.org/vtv/health"
          echo "Stats    : https://zzdigital01.thelac.dpdns.org/vtv/stats"
          echo "Ads      : https://zzdigital01.thelac.dpdns.org/vtv/ads"
          echo "Thumb    : https://zzdigital01.thelac.dpdns.org/vtv/thumb.jpg"
          echo "=========================================================="

          TARGET1="${HLS_DIR}/720p/stream.m3u8"
          TARGET2="${HLS_DIR}/480p/stream.m3u8"
          LAST_MOD1=0
          LAST_MOD2=0
          STALE_SECONDS=0
          AUTO_TRIGGER_SECONDS=18600
          NEXT_TRIGGERED=0
          LAST_THUMB_TIME=0
          THUMB_INTERVAL=30

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            NOW_HM=$(date +%H:%M)

            if [ "$ELAPSED" -ge "$AUTO_TRIGGER_SECONDS" ] && [ "$NEXT_TRIGGERED" -eq 0 ]; then
              echo "[$(date '+%H:%M:%S')] Trigger next job..."
              gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}" || true
              NEXT_TRIGGERED=1
            fi

            if ! kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null; then
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
            fi
            if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
              nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
              echo $! > /tmp/tunnel.pid
            fi

            FFMPEG_ALIVE=1
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then FFMPEG_ALIVE=0; fi

            MOD1=$(stat -c %Y "$TARGET1" 2>/dev/null || echo 0)
            MOD2=$(stat -c %Y "$TARGET2" 2>/dev/null || echo 0)
            if [ "$MOD1" -eq "$LAST_MOD1" ] && [ "$MOD2" -eq "$LAST_MOD2" ]; then
              STALE_SECONDS=$((STALE_SECONDS + 10))
            else
              STALE_SECONDS=0
              LAST_MOD1=$MOD1
              LAST_MOD2=$MOD2
            fi

            if [ "$FFMPEG_ALIVE" -eq 0 ] || [ "$STALE_SECONDS" -ge 50 ]; then
              echo "[$(date '+%H:%M:%S')] FFmpeg issue (alive=$FFMPEG_ALIVE stale=${STALE_SECONDS}s) → restart"
              tail -n 50 /tmp/ffmpeg.log || true
              kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              sleep 3
              check_mpd || true
              start_ffmpeg
              STALE_SECONDS=0
              LAST_MOD1=0
              LAST_MOD2=0
              sleep 10
            fi

            # Hot-swap ads (play once)
            if [ -f "${ADS_DIR}/ads.json" ]; then
              if [ -n "$AD_ACTIVE" ] && [ "$CURRENT_TIME" -ge "$AD_END_TIME" ]; then
                deactivate_ad
                jq --arg id "$AD_ACTIVE" '.played += [$id]' "$PLAYED_FILE" > /tmp/p.json && mv /tmp/p.json "$PLAYED_FILE" || true
              fi

              while read -r ad; do
                id=$(echo "$ad" | jq -r '.id')
                file=$(echo "$ad" | jq -r '.file')
                start=$(echo "$ad" | jq -r '.start')
                dur=$(echo "$ad" | jq -r '.duration')
                width=$(echo "$ad" | jq -r '.width // 200')
                opacity=$(echo "$ad" | jq -r '.opacity // 0.7')
                enabled=$(echo "$ad" | jq -r '.enabled // true')
                played=$(jq -r --arg id "$id" '.played | index($id)' "$PLAYED_FILE" 2>/dev/null || echo "null")
                if [ "$enabled" = "true" ] && [ "$played" = "null" ] && [ "$NOW_HM" = "$start" ] && [ -z "$AD_ACTIVE" ]; then
                  src="${ADS_DIR}/${file}"
                  if [ -f "$src" ]; then
                    activate_ad "$src" "$width" "$opacity" "$id"
                    AD_END_TIME=$((CURRENT_TIME + dur))
                  fi
                fi
              done < <(jq -c '.[]' "${ADS_DIR}/ads.json" 2>/dev/null || true)
            fi

            # Thumb
            if [ $((CURRENT_TIME - LAST_THUMB_TIME)) -ge $THUMB_INTERVAL ]; then
              if [ -s "$TARGET1" ]; then
                ffmpeg -y -hide_banner -loglevel error -i "$TARGET1" \
                  -frames:v 1 -update 1 -q:v 5 "${HLS_DIR}/thumb.jpg" 2>/dev/null || true
              fi
              LAST_THUMB_TIME=$CURRENT_TIME
            fi

            SEG_COUNT=$(ls -1 "${HLS_DIR}/720p/"*.ts 2>/dev/null | wc -l || echo 0)
            cat > "${HLS_DIR}/stats.json" << EOF
          {
            "service": "boxmovie1",
            "uptime_seconds": $ELAPSED,
            "uptime_human": "$((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m",
            "ffmpeg_alive": $([ "$FFMPEG_ALIVE" -eq 1 ] && echo true || echo false),
            "restart_count": $RESTART_COUNT,
            "stale_seconds": $STALE_SECONDS,
            "ad_active": "$AD_ACTIVE",
            "ad_end_in": $([ -n "$AD_ACTIVE" ] && echo $((AD_END_TIME - CURRENT_TIME)) || echo 0),
            "dvr_window_seconds": $((HLS_LIST_SIZE * 2)),
            "approx_segments": $SEG_COUNT,
            "last_update": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

            cat > "${HLS_DIR}/ads_state.json" << EOF
          {
            "active": "$AD_ACTIVE",
            "end_time": $AD_END_TIME,
            "played": $(cat "$PLAYED_FILE" 2>/dev/null | jq '.played' || echo '[]'),
            "current_time_vn": "$NOW_HM",
            "note": "Hot-swap no-restart. Put images in ads/ + ads.json"
          }
          EOF

            echo "[$(date '+%H:%M:%S')] Up: $((ELAPSED/60))m | Stale: ${STALE_SECONDS}s | FF: $FFMPEG_ALIVE | AD: ${AD_ACTIVE:-none} | Segs: $SEG_COUNT"
            sleep 10
          done
