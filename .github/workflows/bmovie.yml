name: HLS Restream ABR - Box Movie 1

on:
  workflow_dispatch:
  schedule:
    # Cron dự phòng 12 tiếng/lần (phòng ngừa rủi ro đứt chuỗi)
    - cron: '0 */12 * * *'

concurrency:
  group: boxmovie1-restream
  cancel-in-progress: true

# Cấp quyền cho GitHub Token để tự nối chuỗi luồng
permissions:
  contents: read
  actions: write

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Chạy tối đa 5 tiếng 50 phút

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/vtv"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install Dependencies
        run: |
          set -euo pipefail

          # Cài đặt ffmpeg và thư viện convert svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin

          # Cài đặt Cloudflare Tunnel
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb
          rm -f /tmp/cf.deb

          # Chuẩn bị RAM Disk
          rm -rf "${HLS_DIR}"
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"

          # Tải và xử lý logo mờ 50%
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo_raw.png
          ffmpeg -y -i /tmp/logo_raw.png -vf "format=rgba,colorchannelmixer=aa=0.5" /tmp/logo_final.png

          echo "Setup ready."

      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          chmod 600 ~/.cloudflared/credentials.json

          cat << EOF > ~/.cloudflared/config.yml
          tunnel: $TUNNEL_ID
          credentials-file: /home/runner/.cloudflared/credentials.json

          ingress:
            - hostname: zzdigital01.thelac.dpdns.org
              service: http://127.0.0.1:5000
            - service: http_status:404
          EOF

      - name: Start HLS Web Server
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const ROOT = '/dev/shm/hls/vtv';
          const MIME = {
            '.m3u8': 'application/vnd.apple.mpegurl',
            '.ts': 'video/mp2t'
          };

          http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');
            res.setHeader('Cache-Control', 'no-store, no-cache, must-revalidate, max-age=0');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            if (!['GET', 'HEAD'].includes(req.method)) {
              res.writeHead(405);
              return res.end();
            }

            let pathname;
            try {
              pathname = decodeURIComponent(new URL(req.url, 'http://localhost').pathname);
            } catch {
              res.writeHead(400);
              return res.end();
            }

            if (!pathname.startsWith('/vtv')) {
              res.writeHead(404);
              return res.end();
            }

            let relative = pathname.slice(4);
            if (relative === '' || relative === '/' || relative === '/boxmovie1.m3u8') {
              relative = '/index.m3u8';
            }

            const filePath = path.resolve(ROOT, '.' + relative);

            if (!filePath.startsWith(ROOT + path.sep) && filePath !== ROOT) {
              res.writeHead(403);
              return res.end();
            }

            const ext = path.extname(filePath);
            if (!MIME[ext]) {
              res.writeHead(403);
              return res.end();
            }

            fs.stat(filePath, (err, stat) => {
              if (err || !stat.isFile()) {
                res.writeHead(404);
                return res.end();
              }

              res.setHeader('Content-Type', MIME[ext]);
              res.setHeader('Content-Length', stat.size);
              res.writeHead(200);

              if (req.method === 'HEAD') return res.end();

              const stream = fs.createReadStream(filePath);
              stream.on('error', () => res.destroy());
              stream.pipe(res);
            });
          }).listen(5000, '127.0.0.1');
          EOF

          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "HLS Server started on port 5000."

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          echo "Cloudflare Tunnel started."

      - name: Run Stream Engine & Self-Chaining Watchdog
        run: |
          set -euo pipefail

          HTTP_HEADERS="User-Agent: ${USER_AGENT}"$'\r\n'"Referer: ${REFERER}"$'\r\n'

          FILTER_COMPLEX="[0:v:0]fps=25,split=2[base720][base480];\
          [base720]scale=1280:720:flags=fast_bilinear,setsar=1[v720];\
          [base480]scale=854:480:flags=fast_bilinear,setsar=1[v480];\
          [v720][1:v]overlay=x=W-w-10:y=H-h-10[out720];\
          [v480][1:v]overlay=x=W-w-8:y=H-h-8[out480]"

          start_ffmpeg() {
            echo "🚀 Khởi động FFmpeg Engine..."
            mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
            
            nohup ffmpeg -hide_banner -loglevel warning -nostdin \
              -headers "$HTTP_HEADERS" \
              -rw_timeout 15000000 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -i "$MPD_URL" \
              -i /tmp/logo_final.png \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[out720]" -map "[out480]" -map 0:a:0? \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 50 -sc_threshold 0 \
              -b:v:0 2000k -maxrate:v:0 2200k -bufsize:v:0 4000k \
              -b:v:1 900k -maxrate:v:1 1000k -bufsize:v:1 1800k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 \
              -f hls -hls_time 2 -hls_list_size 8 -hls_delete_threshold 4 \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file \
              -master_pl_name index.m3u8 \
              -var_stream_map "v:0,a:0,name:720p v:1,a:0,name:480p" \
              -hls_segment_filename "${HLS_DIR}/%v/s_%06d.ts" \
              "${HLS_DIR}/%v/stream.m3u8" \
              > /tmp/ffmpeg.log 2>&1 &
            
            echo $! > /tmp/ffmpeg.pid
          }

          # Khởi động lần đầu
          start_ffmpeg

          # Đợi khởi tạo phân đoạn HLS
          echo "⏳ Đang kết nối và chờ xuất bản HLS..."
          READY=0
          for i in $(seq 1 40); do
            if [ -s "${HLS_DIR}/index.m3u8" ] && \
               [ -s "${HLS_DIR}/720p/stream.m3u8" ]; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ Lỗi khởi động FFmpeg ban đầu!"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

          echo "=========================================================="
          echo "✅ STREAM IS ONLINE:"
          echo "👉 URL: https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
          echo "=========================================================="

          TARGET_PLAYLIST="${HLS_DIR}/720p/stream.m3u8"
          LAST_MOD_TIME=0
          STALE_SECONDS=0
          
          START_TIME=$(date +%s)
          AUTO_TRIGGER_SECONDS=19800 # 5 tiếng 30 phút
          NEXT_TRIGGERED=0

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            # 1. TỰ NỐI LUỒNG: Chạy được 5h30m -> Gọi GitHub API kích hoạt job mới
            if [ "$ELAPSED" -ge "$AUTO_TRIGGER_SECONDS" ] && [ "$NEXT_TRIGGERED" -eq 0 ]; then
              echo "🔄 [5H30M REACHED] Đang kích hoạt job mới để duy trì chuỗi 24/7..."
              gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}" || true
              NEXT_TRIGGERED=1
              echo "✅ Đã trigger Job mới. Phiên hiện tại sẽ giữ luồng cho tới khi phiên mới tiếp quản."
            fi

            # 2. Giám sát Server & Tunnel
            if ! kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null; then
              echo "⚠️ Node.js Server chết, khởi động lại..."
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
            fi

            if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
              echo "⚠️ Cloudflared chết, khởi động lại..."
              nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
              echo $! > /tmp/tunnel.pid
            fi

            # 3. Giám sát tiến trình FFmpeg & Playlist
            FFMPEG_ALIVE=1
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              FFMPEG_ALIVE=0
            fi

            if [ -f "$TARGET_PLAYLIST" ]; then
              CURRENT_MOD_TIME=$(stat -c %Y "$TARGET_PLAYLIST" 2>/dev/null || echo 0)
              if [ "$CURRENT_MOD_TIME" -eq "$LAST_MOD_TIME" ]; then
                STALE_SECONDS=$((STALE_SECONDS + 10))
              else
                STALE_SECONDS=0
                LAST_MOD_TIME="$CURRENT_MOD_TIME"
              fi
            else
              STALE_SECONDS=$((STALE_SECONDS + 10))
            fi

            # 4. Tự phục hồi FFmpeg nếu crash hoặc đơ > 40s
            if [ "$FFMPEG_ALIVE" -eq 0 ] || [ "$STALE_SECONDS" -ge 40 ]; then
              echo "⚠️ FFmpeg gặp sự cố (Alive: $FFMPEG_ALIVE, Stalled: ${STALE_SECONDS}s). Đang tự phục hồi..."
              kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              sleep 1
              start_ffmpeg
              STALE_SECONDS=0
              LAST_MOD_TIME=0
            fi

            RUN_MINS=$((ELAPSED / 60))
            echo "🚀 [$(date -u '+%H:%M:%S UTC')] Running: ${RUN_MINS}m / 330m | Playlist Delay: ${STALE_SECONDS}s"
            sleep 10
          done
