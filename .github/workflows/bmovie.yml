name: HLS Restream ABR - Box Movie 1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: boxmovie1-restream
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  hls-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/vtv"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb
          rm -f /tmp/cf.deb
          rm -rf "${HLS_DIR}"
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
          
          # Tải logo và xử lý trong suốt
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg || true
          if [ -s /tmp/logo.svg ]; then
            rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo_raw.png
            ffmpeg -y -i /tmp/logo_raw.png -vf "format=rgba,colorchannelmixer=aa=0.5" /tmp/logo_final.png 2>/dev/null || true
          fi
          echo "Dependencies & Logo ready."

      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          chmod 600 ~/.cloudflared/credentials.json
          python3 -c "import os,pathlib; pathlib.Path.home().joinpath('.cloudflared','config.yml').write_text('tunnel: '+os.environ['TUNNEL_ID']+'\ncredentials-file: /home/runner/.cloudflared/credentials.json\n\ningress:\n  - hostname: zzdigital01.thelac.dpdns.org\n    service: http://127.0.0.1:5000\n  - service: http_status:404\n')"

      - name: Start HLS Web Server
        run: |
          python3 -c 'from pathlib import Path; Path("/tmp/hls_server.js").write_text("""
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const ROOT = "/dev/shm/hls/vtv";
          const MIME = {
            ".m3u8": "application/vnd.apple.mpegurl",
            ".ts": "video/mp2t",
            ".m4s": "video/iso.segment",
            ".mp4": "video/mp4",
            ".jpg": "image/jpeg",
            ".json": "application/json"
          };
          http.createServer((req, res) => {
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
            res.setHeader("Access-Control-Allow-Headers", "*");
            res.setHeader("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            if (req.method !== "GET" && req.method !== "HEAD") { res.writeHead(405); return res.end(); }
            let pathname;
            try { pathname = decodeURIComponent(new URL(req.url, "http://localhost").pathname); }
            catch (e) { res.writeHead(400); return res.end(); }
            if (!pathname.startsWith("/vtv")) { res.writeHead(404); return res.end(); }
            let relative = pathname.slice(4);
            if (relative === "" || relative === "/" || relative === "/boxmovie1.m3u8") relative = "/index.m3u8";
            const filePath = path.resolve(ROOT, "." + relative);
            if (!filePath.startsWith(ROOT + path.sep) && filePath !== ROOT) { res.writeHead(403); return res.end(); }
            const ext = path.extname(filePath).toLowerCase();
            if (!MIME[ext]) { res.writeHead(403); return res.end(); }
            fs.stat(filePath, (err, stat) => {
              if (err || !stat.isFile()) { res.writeHead(404); return res.end(); }
              res.setHeader("Content-Type", MIME[ext]);
              res.setHeader("Content-Length", stat.size);
              res.writeHead(200);
              if (req.method === "HEAD") return res.end();
              const stream = fs.createReadStream(filePath);
              stream.on("error", () => res.destroy());
              stream.pipe(res);
            });
          }).listen(5000, "127.0.0.1");
          """)'
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "HLS Server started on port 5000."

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          echo "Cloudflare Tunnel started."

      - name: Run Stream Engine & Self-Chaining Watchdog
        run: |
          set -euo pipefail

          # Tạo Master Playlist ABR
          python3 -c 'from pathlib import Path; import os; Path(os.environ["HLS_DIR"]).joinpath("index.m3u8").write_text("#EXTM3U\n#EXT-X-VERSION:6\n#EXT-X-INDEPENDENT-SEGMENTS\n#EXT-X-STREAM-INF:BANDWIDTH=2296000,AVERAGE-BANDWIDTH=2096000,RESOLUTION=1280x720,FRAME-RATE=25,CODECS=\"avc1.4d401f,mp4a.40.2\"\n720p/stream.m3u8\n#EXT-X-STREAM-INF:BANDWIDTH=1096000,AVERAGE-BANDWIDTH=996000,RESOLUTION=854x480,FRAME-RATE=25,CODECS=\"avc1.4d401e,mp4a.40.2\"\n480p/stream.m3u8\n")'

          HTTP_HEADERS="User-Agent: ${USER_AGENT}"$'\r\n'"Referer: ${REFERER}"$'\r\n'"Origin: https://vtvprime.vn"$'\r\n'

          # Xử lý Filter Complex (có logo hoặc không logo tùy tình trạng tải)
          if [ -f /tmp/logo_final.png ]; then
            FILTER_COMPLEX="[0:v:0]fps=25,setsar=1,split=2[vbase1][vbase2];[vbase1]scale=1280:720:flags=fast_bilinear[v720];[vbase2]scale=854:480:flags=fast_bilinear[v480];[1:v]format=rgba,split=2[lg720][lg480];[v720][lg720]overlay=x=W-w-10:y=H-h-10:format=auto[out720];[v480][lg480]overlay=x=W-w-8:y=H-h-8:format=auto[out480]"
            EXTRA_INPUT="-loop 1 -framerate 1 -i /tmp/logo_final.png"
          else
            FILTER_COMPLEX="[0:v:0]fps=25,setsar=1,split=2[vbase1][vbase2];[vbase1]scale=1280:720:flags=fast_bilinear[out720];[vbase2]scale=854:480:flags=fast_bilinear[out480]"
            EXTRA_INPUT=""
          fi

          start_ffmpeg() {
            echo "Khởi động FFmpeg fMP4 ABR Engine..."
            mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
            rm -f "${HLS_DIR}/720p/"*.m4s "${HLS_DIR}/480p/"*.m4s 2>/dev/null || true
            
            nohup ffmpeg -hide_banner -loglevel warning -nostdin \
              -fflags +genpts+discardcorrupt+igndts \
              -analyzeduration 10M -probesize 10M \
              -headers "$HTTP_HEADERS" \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -rw_timeout 15000000 \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -i "$MPD_URL" \
              $EXTRA_INPUT \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[out720]" -map 0:a:0? \
              -c:v libx264 -preset ultrafast -tune zerolatency -profile:v main -level 3.1 \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 50 -sc_threshold 0 \
              -b:v 2000k -maxrate 2200k -bufsize 4000k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 \
              -max_muxing_queue_size 2048 \
              -f hls -hls_time 2 -hls_list_size 20 -hls_delete_threshold 5 \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename init.mp4 \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file \
              -hls_segment_filename "${HLS_DIR}/720p/s_%06d.m4s" \
              "${HLS_DIR}/720p/stream.m3u8" \
              -map "[out480]" -map 0:a:0? \
              -c:v libx264 -preset ultrafast -tune zerolatency -profile:v main -level 3.1 \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 50 -sc_threshold 0 \
              -b:v 900k -maxrate 1000k -bufsize 1800k \
              -c:a aac -b:a 96k -ar 48000 -ac 2 \
              -max_muxing_queue_size 2048 \
              -f hls -hls_time 2 -hls_list_size 20 -hls_delete_threshold 5 \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename init.mp4 \
              -hls_flags delete_segments+omit_endlist+independent_segments+temp_file \
              -hls_segment_filename "${HLS_DIR}/480p/s_%06d.m4s" \
              "${HLS_DIR}/480p/stream.m3u8" \
              > /tmp/ffmpeg.log 2>&1 &
            echo $! > /tmp/ffmpeg.pid
          }

          start_ffmpeg

          echo "Đang chờ HLS fMP4..."
          READY=0
          for i in $(seq 1 40); do
            if [ -s "${HLS_DIR}/720p/stream.m3u8" ] && [ -s "${HLS_DIR}/480p/stream.m3u8" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "FFmpeg đã dừng lúc khởi động!"
              cat /tmp/ffmpeg.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Lỗi khởi động FFmpeg!"
            cat /tmp/ffmpeg.log || true
            exit 1
          fi

          echo "=========================================================="
          echo "BOX MOVIE 1 ONLINE (fMP4): https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
          echo "=========================================================="

          TARGET_PLAYLIST="${HLS_DIR}/720p/stream.m3u8"
          LAST_MOD_TIME=0
          STALE_SECONDS=0
          START_TIME=$(date +%s)
          AUTO_TRIGGER_SECONDS=19800
          NEXT_TRIGGERED=0

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            # Trigger tự động chuyển tiếp Job tại mốc 5h30m
            if [ "$ELAPSED" -ge "$AUTO_TRIGGER_SECONDS" ] && [ "$NEXT_TRIGGERED" -eq 0 ]; then
              echo "[5H30M] Trigger job mới..."
              gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}" || true
              NEXT_TRIGGERED=1
            fi

            # Kiểm tra và khôi phục Node.js Server
            if ! kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null; then
              echo "Restart Node.js..."
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
            fi

            # Kiểm tra và khôi phục Cloudflare Tunnel
            if ! kill -0 "$(cat /tmp/tunnel.pid 2>/dev/null)" 2>/dev/null; then
              echo "Restart cloudflared..."
              nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
              echo $! > /tmp/tunnel.pid
            fi

            # Trạng thái tiến trình FFmpeg
            FFMPEG_ALIVE=1
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              FFMPEG_ALIVE=0
            fi

            # Kiểm tra đợt ghi đĩa gần nhất (Stale Detection)
            if [ -f "$TARGET_PLAYLIST" ]; then
              CURRENT_MOD_TIME=$(stat -c %Y "$TARGET_PLAYLIST" 2>/dev/null || echo 0)
              if [ "$CURRENT_MOD_TIME" -eq "$LAST_MOD_TIME" ]; then
                STALE_SECONDS=$((STALE_SECONDS + 10))
              else
                STALE_SECONDS=0
                LAST_MOD_TIME="$CURRENT_MOD_TIME"
              fi
            else
              STALE_SECONDS=$((STALE_SECONDS + 10))
            fi

            # Khởi động lại FFmpeg nếu chết hoặc bị đứng (trên 40s không cập nhật playlist)
            if [ "$FFMPEG_ALIVE" -eq 0 ] || [ "$STALE_SECONDS" -ge 40 ]; then
              echo "FFmpeg gặp sự cố (Alive: $FFMPEG_ALIVE, Stalled: ${STALE_SECONDS}s). Restarting..."
              tail -n 50 /tmp/ffmpeg.log || true
              kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              sleep 1
              start_ffmpeg
              STALE_SECONDS=0
              LAST_MOD_TIME=0
            fi

            RUN_MINS=$((ELAPSED / 60))
            echo "[$(date -u '+%H:%M:%S UTC')] Running: ${RUN_MINS}m / 330m | Playlist Delay: ${STALE_SECONDS}s"
            sleep 10
          done
