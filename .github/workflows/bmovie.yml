name: HLS Restream ABR - Box Movie 1 (Final Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BM1/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/vtv"
      LOGO_URL: "https://github.com/ankbuitv/zztv/raw/refs/heads/main/apps/web/public/favicon.svg"

    steps:
      - name: Install System & Pre-process Logo
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq curl nodejs ffmpeg librsvg2-bin imagemagick procps
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          
          mkdir -p "${HLS_DIR}/720p" "${HLS_DIR}/480p"
          
          # Tải logo và xử lý mờ 50% ngay lập tức (Tiết kiệm CPU cho Action)
          curl -fsSL "$LOGO_URL" -o /tmp/logo.svg
          rsvg-convert -w 35 /tmp/logo.svg -o /tmp/logo_raw.png
          convert /tmp/logo_raw.png -alpha set -channel A -evaluate multiply 0.5 /tmp/logo_ready.png

      - name: Setup CF Tunnel Config
        env:
          TUNNEL_JSON: ${{ secrets.CF_TUNNEL_CREDENTIALS }}
          TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
        run: |
          mkdir -p ~/.cloudflared
          printf '%s' "$TUNNEL_JSON" > ~/.cloudflared/credentials.json
          cat << EOF > ~/.cloudflared/config.yml
          tunnel: $TUNNEL_ID
          credentials-file: /home/runner/.cloudflared/credentials.json
          ingress:
            - hostname: zzdigital01.thelac.dpdns.org
              service: http://localhost:5000
            - service: http_status:404
          EOF

      - name: Start HLS Engine & Tunnel
        run: |
          # 1. Start Server Node.js (Route chính xác /vtv/boxmovie1.m3u8)
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const HLS_DIR = '/dev/shm/hls/vtv';
          http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            let u = req.url.split('?')[0];
            // Xử lý route cho Master Playlist
            if (u === '/vtv/boxmovie1.m3u8' || u === '/boxmovie1.m3u8') {
              u = '/index.m3u8';
            } else {
              u = u.replace(/^\/vtv/, '');
            }
            const f = path.join(HLS_DIR, path.normalize(u));
            if (!fs.existsSync(f) || fs.statSync(f).isDirectory()) {
              res.writeHead(404); return res.end();
            }
            if (f.endsWith('.m3u8')) res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            if (f.endsWith('.ts')) res.setHeader('Content-Type', 'video/mp2t');
            fs.createReadStream(f).pipe(res);
          }).listen(5000);
          EOF
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &

          # 2. Start FFmpeg ABR (Đã tối ưu CPU để không bị treo)
          FILTER="[0:v:2][1:v]overlay=main_w-overlay_w-10:main_h-overlay_h-10[v7]; \
                  [0:v:1][1:v]overlay=main_w-overlay_w-8:main_h-overlay_h-8[v4]"

          nohup ffmpeg -hide_banner -loglevel warning -user_agent "$USER_AGENT" \
            -headers "Referer: $REFERER"$'\r\n' -cenc_decryption_key "$CLEARKEY_KEY" \
            -i "$MPD_URL" -loop 1 -i /tmp/logo_ready.png -filter_complex "$FILTER" \
            -map "[v7]" -map 0:a? -map "[v4]" -map 0:a? \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v:0 2000k -b:v:1 800k \
            -c:a copy -f hls -hls_time 2 -hls_list_size 5 -hls_flags delete_segments \
            -master_pl_name index.m3u8 -var_stream_map "v:0,a:0,name:720p v:1,a:1,name:480p" \
            -hls_segment_filename "${HLS_DIR}/%v/s_%03d.ts" \
            "${HLS_DIR}/%v/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # 3. Start Cloudflare Tunnel
          nohup cloudflared tunnel --config /home/runner/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid

          # Vòng lặp giám sát
          START_TIME=$(date +%s)
          while true; do
            if [ $(( $(date +%s) - START_TIME )) -ge 21540 ]; then exit 0; fi
            
            # Nếu FFmpeg chết, in log và thoát
            if ! kill -0 "$(cat /tmp/ffmpeg.pid)" 2>/dev/null; then
              echo "❌ FFmpeg lỗi nghiêm trọng! Log:"
              tail -n 20 /tmp/ffmpeg.log
              exit 1
            fi

            # Kiểm tra xem file playlist đã xuất hiện chưa
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              echo "✅ Stream Online: https://zzdigital01.thelac.dpdns.org/vtv/boxmovie1.m3u8"
            fi
            sleep 30
          done
