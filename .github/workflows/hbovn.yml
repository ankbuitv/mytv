name: HLS Restream - HBO Asia (Localtunnel Fixed Domain)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd"
      CLEARKEY_KEY: "3de0f38dcf014827dfd5bec38743c6a2"
      CLEARKEY_KID: "09ddfe3d63863cafaeb79d0546b098ab"
      
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      REFERER: "https://www.mytvnet.vn/"
      ORIGIN: "https://www.mytvnet.vn"
      HLS_DIR: "/dev/shm/hls/hbo"
      HLS_SERVER_PORT: "5000"
      SUBDOMAIN: "chrtv-hboasia"
      SSHX_NAME: "HBO-Restream"

    steps:
      - name: Setup Node.js & Cài đặt công cụ
        shell: bash
        run: |
          set -euo pipefail
          sudo npm install -g localtunnel

          curl -fL --retry 3 -m 300 -o /tmp/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            && tar -xJf /tmp/ff.tar.xz -C /tmp \
            && sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg \
            && sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe \
            && rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl

          curl -sSf https://sshx.io/get | sh || true
          SSHX_BIN="$(command -v sshx || true)"
          if [ -z "$SSHX_BIN" ] && [ -x "$HOME/.local/bin/sshx" ]; then SSHX_BIN="$HOME/.local/bin/sshx"; fi
          if [ -n "$SSHX_BIN" ] && [ "$SSHX_BIN" != "/usr/local/bin/sshx" ]; then
            sudo install -m 755 "$SSHX_BIN" /usr/local/bin/sshx
          fi

          mkdir -p "${HLS_DIR}"

      - name: Tạo HLS server (Node.js)
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/hbo';
          const PORT = parseInt(process.env.HLS_SERVER_PORT || '5000', 10);
          const mime = p => p.endsWith('.m3u8') ? 'application/vnd.apple.mpegurl' : p.endsWith('.ts') ? 'video/mp2t' : 'application/octet-stream';
          
          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');
            res.setHeader('bypass-tunnel-reminder', 'true');
            
            if (req.method === 'OPTIONS') { res.writeHead(204); return res.end(); }
            
            const urlPath = req.url.split('?')[0];
            let fileName = urlPath.replace('/', '');
            if (!fileName) fileName = 'index.m3u8';
            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) { res.writeHead(404); return res.end('404'); }

            const stat = fs.statSync(filePath);
            const cacheHeader = fileName.endsWith('.m3u8') ? 'no-cache, no-store, must-revalidate' : 'public, max-age=3600';

            const headers = { 
              'Content-Type': mime(filePath), 
              'Accept-Ranges': 'bytes', 
              'Content-Length': stat.size,
              'Cache-Control': cacheHeader
            };

            if (req.method === 'HEAD') { res.writeHead(200, headers); return res.end(); }
            res.writeHead(200, headers);
            fs.createReadStream(filePath).pipe(res);
          });
          server.listen(PORT, '0.0.0.0', () => console.log('HLS server listening on ' + PORT));
          EOF
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 1

      - name: SSHX - Web terminal
        shell: bash
        run: |
          nohup sshx --quiet --name "${SSHX_NAME}" > /tmp/sshx.log 2>&1 &
          echo $! > /tmp/sshx.pid
          sleep 2
          SSHX_URL=$(grep -oE 'https://sshx\.io/s/[^ ]+' /tmp/sshx.log 2>/dev/null | head -1 || true)
          [ -n "$SSHX_URL" ] && echo "SSHX TERMINAL: ${SSHX_URL}"

      - name: Restream chính & Localtunnel Cố Định Domain
        shell: bash
        run: |
          set -euo pipefail

          CUSTOM_HEADERS=$'Referer: '${REFERER}$'\r\nOrigin: '${ORIGIN}$'\r\n'

          # Khởi chạy FFmpeg chuẩn
          nohup ffmpeg -hide_banner -loglevel warning \
            -user_agent "$USER_AGENT" \
            -headers "$CUSTOM_HEADERS" \
            -cenc_decryption_key "${CLEARKEY_KEY}" \
            -fflags +genpts+discardcorrupt -avoid_negative_ts make_zero \
            -i "${MPD_URL}" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -c:a aac -b:a 128k -ar 48000 -af "aresample=async=1000:min_hard_comp=0.100000:first_pts=0" \
            -max_muxing_queue_size 8192 \
            -f hls \
            -hls_time 4 \
            -hls_list_size 6 \
            -hls_flags delete_segments+omit_endlist \
            -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
            "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # Chờ HLS tạo file thành công
          for i in {1..60}; do
            if [ -s "${HLS_DIR}/index.m3u8" ]; then echo "HLS Ready!"; break; fi
            sleep 1
          done

          # Lấy IP Public để qua mặt màn hình xác thực Tunnel Password của Localtunnel (nếu mở bằng trình duyệt)
          PUBLIC_IP=$(curl -s https://api.ipify.org || echo "N/A")

          # Khởi chạy Localtunnel cố định domain
          rm -f /tmp/lt.log
          nohup lt --port "${HLS_SERVER_PORT}" --subdomain "${SUBDOMAIN}" > /tmp/lt.log 2>&1 &
          echo $! > /tmp/lt.pid

          echo "=================================================="
          echo "URL PLAYLIST CỐ ĐỊNH: https://${SUBDOMAIN}.loca.lt/index.m3u8"
          echo "Tunnel Password (nếu web bắt nhập): ${PUBLIC_IP}"
          echo "=================================================="
          {
            echo "### HBO Restream"
            echo "- URL Playlist: https://${SUBDOMAIN}.loca.lt/index.m3u8"
            echo "- Tunnel Password: ${PUBLIC_IP}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Watchdog duy trì process
          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge 20940 ]; then exit 0; fi

            # Tự dọn segment cũ
            find "${HLS_DIR}" -maxdepth 1 -name 'seg_*.ts' -mmin +4 -delete 2>/dev/null || true

            # Tự khôi phục Localtunnel nếu bị rớt
            if ! kill -0 "$(cat /tmp/lt.pid 2>/dev/null)" 2>/dev/null; then
              echo "Localtunnel rớt, đang kết nối lại..."
              nohup lt --port "${HLS_SERVER_PORT}" --subdomain "${SUBDOMAIN}" > /tmp/lt.log 2>&1 &
              echo $! > /tmp/lt.pid
            fi

            sleep 10
          done
