name: HLS Restream - HBO Asia (Cloudflare Tunnel Engine)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd"
      CLEARKEY_KEY: "3de0f38dcf014827dfd5bec38743c6a2"
      CLEARKEY_KID: "09ddfe3d63863cafaeb79d0546b098ab"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      REFERER: "https://www.mytvnet.vn/"
      ORIGIN: "https://www.mytvnet.vn"
      HLS_DIR: "/dev/shm/hls_hbo"

    steps:
      - name: Install Optimized FFmpeg & Cloudflared
        shell: bash
        run: |
          set -euo pipefail
          
          # Tối ưu RAM buffer Linux kernel
          sudo sysctl -w net.core.rmem_max=33554432
          sudo sysctl -w net.core.wmem_max=33554432

          # Cài FFmpeg bản mới nhất
          curl -fL --retry 3 -m 300 -o /tmp/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            && tar -xJf /tmp/ff.tar.xz -C /tmp \
            && sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg \
            && rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl

          # Cài Caddy Webserver siêu nhẹ để làm CDN Server
          sudo apt-get update && sudo apt-get install -y caddy

          # Cài Cloudflared (Tunnel cực nhanh không lo bóp băng thông)
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          mkdir -p "${HLS_DIR}"

      - name: Start Webserver & Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          # Cấu hình Caddy phục vụ HLS với CORS & no-cache chuẩn
          cat << 'EOF' > /tmp/Caddyfile
          :8080 {
              root * /dev/shm/hls_hbo
              file_server
              header Access-Control-Allow-Origin *
              header Cache-Control "no-cache, no-store, must-revalidate"
          }
          EOF
          caddy start --config /tmp/Caddyfile

          # Mở tunnel Cloudflare
          cloudflared tunnel --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &
          
          echo "Đang khởi tạo Cloudflare Tunnel..."
          sleep 5
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done

          echo "=================================================="
          echo "LINK HLS STREAM TRỰC TIẾP (CỰC MƯỢT):"
          echo "${TUNNEL_URL}/index.m3u8"
          echo "=================================================="

      - name: FFmpeg Remux chuẩn Timestamp (Fix Lệch Tiếng & Xé Hình)
        shell: bash
        run: |
          set -euo pipefail

          CUSTOM_HEADERS=$'Referer: '${REFERER}$'\r\nOrigin: '${ORIGIN}$'\r\n'

          # Fix lỗi Timestamp, buộc tạo Keyframe chuẩn 2 giây, align Audio/Video
          nohup ffmpeg -hide_banner -loglevel warning \
            -user_agent "$USER_AGENT" \
            -headers "$CUSTOM_HEADERS" \
            -cenc_decryption_key "${CLEARKEY_KEY}" \
            -fflags +genpts+igndts+discardcorrupt -avoid_negative_ts make_zero \
            -i "${MPD_URL}" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -c:a copy \
            -bsf:v h264_mp4toannexb \
            -max_muxing_queue_size 10240 \
            -f hls \
            -hls_time 2 \
            -hls_list_size 5 \
            -hls_flags delete_segments+omit_endlist+split_by_time \
            -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
            "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &

          # Duy trì runner & dọn RAM
          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge 20940 ]; then exit 0; fi

            find "${HLS_DIR}" -maxdepth 1 -name 'seg_*.ts' -mmin +2 -delete 2>/dev/null || true
            sleep 5
          done
