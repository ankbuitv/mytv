name: HLS Restream - HBO Asia (Supabase CDN)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd"
      CLEARKEY_KEY: "3de0f38dcf014827dfd5bec38743c6a2"
      CLEARKEY_KID: "09ddfe3d63863cafaeb79d0546b098ab"
      
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      REFERER: "https://www.mytvnet.vn/"
      ORIGIN: "https://www.mytvnet.vn"
      HLS_DIR: "/dev/shm/hls_hbo"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: System Tuning & Install Tools
        shell: bash
        run: |
          set -euo pipefail

          # Socket buffers
          sudo sysctl -w net.core.rmem_max=33554432
          sudo sysctl -w net.core.wmem_max=33554432

          # Install FFmpeg & Node fetch helper
          curl -fL --retry 3 -m 300 -o /tmp/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            && tar -xJf /tmp/ff.tar.xz -C /tmp \
            && sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg \
            && rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl

          npm install -g @supabase/supabase-js

          mkdir -p "${HLS_DIR}"

      - name: Tạo Uploader Sync lên Supabase
        shell: bash
        run: |
          cat << 'EOF' > /tmp/upload_supabase.js
          const { createClient } = require('@supabase/supabase-js');
          const fs = require('fs');
          const path = require('path');

          const supabaseUrl = process.env.SUPABASE_URL;
          const supabaseKey = process.env.SUPABASE_KEY;
          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls_hbo';
          const BUCKET = 'hbo';

          if (!supabaseUrl || !supabaseKey) {
            console.error("Thiếu SUPABASE_URL hoặc SUPABASE_KEY trong Secrets!");
            process.exit(1);
          }

          const supabase = createClient(supabaseUrl, supabaseKey);

          async function uploadFile(filePath) {
            const fileName = path.basename(filePath);
            const fileBuffer = fs.readFileSync(filePath);
            const contentType = fileName.endsWith('.m3u8') ? 'application/vnd.apple.mpegurl' : 'video/mp2t';
            const cacheControl = fileName.endsWith('.m3u8') ? '0' : '3600';

            const { error } = await supabase.storage
              .from(BUCKET)
              .upload(fileName, fileBuffer, {
                contentType: contentType,
                cacheControl: cacheControl,
                upsert: true
              });

            if (error) console.error(`Lỗi upload ${fileName}:`, error.message);
          }

          // Monitor & Sync RAM folder
          const uploaded = new Set();
          setInterval(async () => {
            if (!fs.existsSync(HLS_DIR)) return;
            const files = fs.readdirSync(HLS_DIR);
            
            for (const file of files) {
              const fullPath = path.join(HLS_DIR, file);
              if (file.endsWith('.m3u8')) {
                await uploadFile(fullPath);
              } else if (file.endsWith('.ts') && !uploaded.has(file)) {
                await uploadFile(fullPath);
                uploaded.add(file);
              }
            }

            if (uploaded.size > 50) uploaded.clear();
          }, 2000);
          EOF

      - name: Restream & Uploader Sync
        shell: bash
        run: |
          set -euo pipefail

          CUSTOM_HEADERS=$'Referer: '${REFERER}$'\r\nOrigin: '${ORIGIN}$'\r\n'

          # Giữ nguyên Video & Audio gốc (copy 100%, không bị mất tiếng hay giật hình)
          nohup ffmpeg -hide_banner -loglevel warning \
            -user_agent "$USER_AGENT" \
            -headers "$CUSTOM_HEADERS" \
            -cenc_decryption_key "${CLEARKEY_KEY}" \
            -fflags +genpts+discardcorrupt -avoid_negative_ts make_zero \
            -i "${MPD_URL}" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -c:a copy \
            -max_muxing_queue_size 16384 \
            -f hls \
            -hls_time 4 \
            -hls_list_size 6 \
            -hls_flags delete_segments+omit_endlist \
            -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
            "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # Chờ tạo HLS
          for i in {1..60}; do
            if [ -s "${HLS_DIR}/index.m3u8" ]; then echo "HLS stream ready!"; break; fi
            sleep 1
          done

          # Chạy Uploader Sync Supabase
          nohup node /tmp/upload_supabase.js > /tmp/uploader.log 2>&1 &
          echo $! > /tmp/uploader.pid

          echo "=================================================="
          echo "URL PLAYLIST SUPABASE CỐ ĐỊNH:"
          echo "https://gipthkjizdpcbneaggpd.supabase.co/storage/v1/object/public/hbo/index.m3u8"
          echo "=================================================="

          # Watchdog duy trì & dọn RAM local
          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge 20940 ]; then exit 0; fi

            find "${HLS_DIR}" -maxdepth 1 -name 'seg_*.ts' -mmin +3 -delete 2>/dev/null || true
            sleep 10
          done
