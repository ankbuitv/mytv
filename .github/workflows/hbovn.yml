name: HLS Restream - HBO Asia (Fixed Tunnel & Service)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://s7771.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd"
      CLEARKEY_KEY: "3de0f38dcf014827dfd5bec38743c6a2"
      CLEARKEY_KID: "09ddfe3d63863cafaeb79d0546b098ab"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
      REFERER: "https://www.mytvnet.vn/"
      ORIGIN: "https://www.mytvnet.vn"
      HLS_DIR: "/tmp/hls_hbo"
      TUNNEL_CREDENTIALS: ${{ secrets.TUNNEL_CREDENTIALS }}
      TUNNEL_ID: ${{ secrets.TUNNEL_ID }}

    steps:
      - name: System Tuning & Install Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w net.core.rmem_max=33554432
          sudo sysctl -w net.core.wmem_max=33554432

          curl -fL --retry 3 -m 300 -o /tmp/ff.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            && tar -xJf /tmp/ff.tar.xz -C /tmp \
            && sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg \
            && rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl

          sudo apt-get update && sudo apt-get install -y caddy

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb && rm -f cloudflared.deb

          # Tạo thư mục và cấp quyền công cộng 777 để Caddy không bị Permission Denied
          mkdir -p "${HLS_DIR}" ~/.cloudflared
          chmod -R 777 "${HLS_DIR}"

      - name: Start Webserver & Cloudflare Fixed Tunnel
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl stop caddy || true

          # Ghi Caddyfile chuẩn
          echo "{" > /tmp/Caddyfile
          echo "    admin off" >> /tmp/Caddyfile
          echo "}" >> /tmp/Caddyfile
          echo ":8080 {" >> /tmp/Caddyfile
          echo "    root * ${HLS_DIR}" >> /tmp/Caddyfile
          echo "    file_server" >> /tmp/Caddyfile
          echo "    header Access-Control-Allow-Origin *" >> /tmp/Caddyfile
          echo "    header Cache-Control \"no-cache, no-store, must-revalidate\"" >> /tmp/Caddyfile
          echo "}" >> /tmp/Caddyfile

          caddy start --config /tmp/Caddyfile

          if [ -z "$TUNNEL_CREDENTIALS" ] || [ -z "$TUNNEL_ID" ]; then
            echo "LỖI: Chưa cài TUNNEL_CREDENTIALS hoặc TUNNEL_ID trong Secrets!"
            exit 1
          fi

          # Ghi Credentials File
          echo "$TUNNEL_CREDENTIALS" > ~/.cloudflared/credentials.json

          # Ghi config.yml cho Cloudflared
          echo "tunnel: ${TUNNEL_ID}" > ~/.cloudflared/config.yml
          echo "credentials-file: /home/runner/.cloudflared/credentials.json" >> ~/.cloudflared/config.yml
          echo "" >> ~/.cloudflared/config.yml
          echo "ingress:" >> ~/.cloudflared/config.yml
          echo "  - hostname: hbo.ankb.qzz.io" >> ~/.cloudflared/config.yml
          echo "    service: http://localhost:8080" >> ~/.cloudflared/config.yml
          echo "  - service: http_status:404" >> ~/.cloudflared/config.yml

          # Bật Tunnel
          nohup cloudflared tunnel --config /home/runner/.cloudflared/config.yml run > /tmp/tunnel.log 2>&1 &

          echo "Đang chờ Cloudflare Tunnel khởi tạo..."
          sleep 5

          # In log ra màn hình Action để debug nếu có lỗi
          echo "=== LOG CLOUDFLARED ==="
          cat /tmp/tunnel.log | head -n 30 || true

      - name: FFmpeg Match Native 4s GOP & Strict Sync
        shell: bash
        run: |
          set -euo pipefail

          HEADERS=$(printf "Referer: %s\r\nOrigin: %s\r\n" "$REFERER" "$ORIGIN")

          nohup ffmpeg -hide_banner -loglevel warning \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -user_agent "$USER_AGENT" \
            -headers "$HEADERS" \
            -cenc_decryption_key "$CLEARKEY_KEY" \
            -analyzeduration 10000000 -probesize 10000000 \
            -fflags +genpts+igndts+discardcorrupt -avoid_negative_ts make_zero \
            -i "$MPD_URL" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy -bsf:v h264_mp4toannexb \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -max_interleave_delta 0 \
            -f hls \
            -hls_time 4 \
            -hls_list_size 6 \
            -hls_flags delete_segments+omit_endlist+independent_segments \
            -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
            "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &

          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge 20940 ]; then exit 0; fi

            # Đảm bảo quyền file cho Caddy liên tục
            chmod -R 777 "${HLS_DIR}" 2>/dev/null || true
            find "${HLS_DIR}" -maxdepth 1 -name 'seg_*.ts' -mmin +4 -delete 2>/dev/null || true
            sleep 10
          done
