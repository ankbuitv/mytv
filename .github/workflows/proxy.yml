name: IPTV Pure Proxy & Dynamic Route Engine

on:
  schedule:
    - cron: '59 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl dnsutils netcat-openbsd
          pip install flask flask-cors gunicorn requests

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          curl -sSf https://sshx.io/get | sh

      - name: Generate App Code
        shell: bash
        run: |
          cat > app.py <<'PYTHON'
          import os
          import requests
          from flask import Flask, Response, request

          app = Flask(__name__)

          WORKER_URL = "https://api.ankb.qzz.io" # Link Cloudflare Worker của bạn
          MY_SECRET = os.environ.get("MY_SECRET", "")

          def get_public_base_url():
              domain = os.environ.get("DUCKDNS_DOMAIN", "chrtv")
              port = os.environ.get("BORE_PORT", "30114")
              return os.environ.get("PUBLIC_BASE_URL", f"http://{domain}.duckdns.org:{port}")

          @app.route("/")
          def home():
              return f"IPTV Engine Active! Base URL: {get_public_base_url()}", 200

          @app.route("/playlist.m3u")
          def get_playlist():
              p = get_public_base_url()
              m3u = f"""#EXTM3U
          #EXTINF:-1 tvg-id="tv360plus9" group-title="Sự Kiện TV360",TV360+9 HD
          {p}/stream/tv360-9
          #EXTINF:-1 tvg-id="tv360plus10" group-title="Sự Kiện TV360",TV360+10 HD
          {p}/stream/tv360-10
          #EXTINF:-1 tvg-id="DreamWorks" group-title="Kids",DreamWorks HD
          {p}/stream/dreamworks
          #EXTINF:-1 tvg-id="HBO" group-title="US Live" tvg-logo="https://i.imgur.com/vHqQZ4u.png",HBO Movies HD (Proxy)
          {p}/stream/USA_HBO_ZONE/index.m3u8
          #EXTINF:-1 tvg-id="Discovery" group-title="US Live",Discovery Channel HD (Proxy)
          {p}/stream/USA_DISCOVERY/index.m3u8
          #EXTINF:-1 tvg-id="WarnerTV" group-title="US Live" tvg-logo="https://i.imgur.com/2Xy349p.png",Warner TV HD
          {p}/stream/warner
          #EXTINF:-1 tvg-id="Paramount" group-title="US Live" tvg-logo="https://i.imgur.com/Q23kLMl.png",Paramount Network HD
          {p}/stream/paramount
          #EXTINF:-1 tvg-id="StudioC" group-title="US Live",Amagi Studio C HD
          {p}/stream/studioc
          #EXTINF:-1 tvg-id="Live180" group-title="VN Live",KensCom Channel 180 HD
          {p}/stream/180.m3u8
          #EXTINF:-1 tvg-id="Live191" group-title="VN Live",KensCom Channel 191 HD
          {p}/stream/191.m3u8
          #EXTINF:-1 tvg-id="DiscoveryAsia" group-title="Asia",Discovery Asia HD
          {p}/stream/asia
          #EXTINF:-1 tvg-id="SoutheastAsia" group-title="Asia",Southeast Asia HD
          {p}/stream/dsc
          #EXTINF:-1 tvg-id="Hollywood" group-title="Cinema",Hollywood HD
          {p}/stream/hc
          #EXTINF:-1 tvg-id="Women" group-title="Cinema",Women HD
          {p}/stream/wo
          #EXTINF:-1 tvg-id="BoxMovie1" group-title="Box TV",Box Movie 1 HD
          {p}/stream/box1
          #EXTINF:-1 tvg-id="BoxHits" group-title="Box TV",Box Hits HD
          {p}/stream/bhits"""
              return Response(m3u.strip(), mimetype="application/x-mpegurl", headers={"Access-Control-Allow-Origin": "*"})

          @app.route("/stream/<path:stream_path>", methods=["GET", "OPTIONS"])
          def proxy_gateway(stream_path):
              if request.method == "OPTIONS":
                  return Response(status=204, headers={"Access-Control-Allow-Origin": "*", "Access-Control-Allow-Methods": "*"})
              
              sub_url = request.args.get("url", "")
              target_endpoint = f"{WORKER_URL}/stream/{stream_path}"
              if sub_url:
                  target_endpoint += f"?url={sub_url}"

              try:
                  resp = requests.get(
                      target_endpoint,
                      headers={"X-API-KEY": MY_SECRET},
                      stream=True,
                      timeout=15
                  )
                  return Response(
                      resp.iter_content(chunk_size=16384),
                      status=resp.status_code,
                      mimetype=resp.headers.get("Content-Type", "application/x-mpegurl"),
                      headers={"Access-Control-Allow-Origin": "*"}
                  )
              except Exception as e:
                  return Response(f"Proxy Error: {str(e)}", status=502)

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000, threaded=True)
          PYTHON

          python3 -m py_compile app.py
          echo "✅ app.py syntax OK"

      - name: Start Proxy Server & Smart Bore Tunnel
        shell: bash
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          BORE_PORT: "30114"
        run: |
          cat > start_proxy.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          BORE_PORT="${BORE_PORT:-30114}"

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          echo $! > sshx.pid
          sleep 3

          SSHX_URL="$(grep -o "https://sshx.io/s/[^ ]*" sshx.log | head -n1 || true)"
          if [ -n "${SSHX_URL}" ]; then
              echo "🔗 Web Terminal URL: ${SSHX_URL}"
          fi

          echo "🌐 Connecting Bore Tunnel to port ${BORE_PORT}..."
          bore local 5000 --to bore.pub --port "${BORE_PORT}" > bore.log 2>&1 &
          BORE_PID=$!
          echo $BORE_PID > bore.pid

          SUCCESS=0
          for i in $(seq 1 60); do
              sleep 2
              if grep -q "bound to remote port ${BORE_PORT}" bore.log 2>/dev/null || \
                 grep -q "bore.pub:${BORE_PORT}" bore.log 2>/dev/null; then
                  echo "✅ Bore Tunnel successfully connected to port ${BORE_PORT}!"
                  SUCCESS=1
                  break
              fi

              if ! kill -0 $BORE_PID 2>/dev/null || grep -q "address already in use" bore.log 2>/dev/null; then
                  echo "⏳ Port ${BORE_PORT} đang bị giữ bởi job cũ, thử lại lần $i..."
                  kill -9 $BORE_PID 2>/dev/null || true
                  > bore.log
                  bore local 5000 --to bore.pub --port "${BORE_PORT}" > bore.log 2>&1 &
                  BORE_PID=$!
                  echo $BORE_PID > bore.pid
              fi
          done

          if [ $SUCCESS -ne 1 ]; then
              echo "❌ Không thể chiếm giữ port ${BORE_PORT} sau 2 phút chờ đợi!"
              cat bore.log
              exit 1
          fi

          BORE_IP="$(dig +short bore.pub | tail -n1 || true)"
          if [ -n "${BORE_IP}" ] && [ -n "${DUCKDNS_TOKEN:-}" ]; then
              echo "📡 Updating DuckDNS with Bore IP: ${BORE_IP}"
              curl -fsS "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" || true
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"
          export PUBLIC_BASE_URL="${PUBLIC_URL}"



          gunicorn -w 8 --threads 4 --access-logfile - --error-logfile - --keep-alive 15 --bind 0.0.0.0:5000 app:app > gunicorn.log 2>&1 &
          GUNICORN_PID=$!
          echo $GUNICORN_PID > gunicorn.pid

          START_TIME=$(date +%s)
          LIMIT_SECONDS=21540 # 5h 59m

          while true; do
              NOW=$(date +%s)
              ELAPSED=$(( NOW - START_TIME ))

              if [ "$ELAPSED" -ge "$LIMIT_SECONDS" ]; then
                  echo "⏰ Đã đủ 5h 59m, tự thoát nhường cho Cron Job mới..."
                  exit 0
              fi

              if ! kill -0 $(cat bore.pid) 2>/dev/null; then
                  echo "⚠️ Bore Tunnel bị ngắt, đang tự kết nối lại..."
                  bore local 5000 --to bore.pub --port "${BORE_PORT}" > bore.log 2>&1 &
                  echo $! > bore.pid
              fi

              if ! kill -0 $(cat gunicorn.pid) 2>/dev/null; then
                  echo "❌ Gunicorn Server crashed! Log:"
                  cat gunicorn.log
                  exit 1
              fi

              sleep 10
          done
          BASH

          chmod +x start_proxy.sh
          bash -n start_proxy.sh
          echo "✅ start_proxy.sh syntax OK"

          ./start_proxy.sh
