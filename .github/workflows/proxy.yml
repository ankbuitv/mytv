name: IPTV Pure Proxy Engine

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dnsutils
          pip install flask flask-cors gunicorn requests

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Generate app.py
        run: |
          printf '%s' "\"\"\"\n    return add_cors(Response(m.replace('\\r', '').strip(), mimetype=\"application/x-mpegurl\"))

def hls_proxy(tgt, path):
    if request.method == "OPTIONS":
        return add_cors(Response(status=204))
    u = unquote(request.args.get("url") or tgt)
    try:
        rs = requests.get(u, headers=HEADERS, timeout=12, stream=True)
        if rs.status_code != 200:
            return add_cors(Response("Err", status=rs.status_code))
        ct = rs.headers.get("Content-Type", "")
        if ".m3u8" in u or "m3u8" in ct or rs.text.startswith("#EXTM3U"):
            rw = [f"{path}?url={quote(urljoin(rs.url, l))}" if l and not l.startswith("#") else l for l in rs.text.splitlines()]
            return add_cors(Response("\n".join(rw), mimetype="application/x-mpegurl"))
        return add_cors(Response(stream_with_context(rs.iter_content(chunk_size=16384)), mimetype=ct or "video/mp2t"))
    except:
        return add_cors(Response("Ex", status=502))

@app.route("/stream/<chid>", methods=["GET", "OPTIONS"])
@app.route("/stream/<chid>/index.m3u8", methods=["GET", "OPTIONS"])
def p_chan(chid):
    if chid in CHANNELS:
        return hls_proxy(CHANNELS[chid], f"/stream/{chid}")
    return add_cors(Response("Not Found", status=404))

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000, threaded=True)
