name: IPTV Pure Proxy & Dynamic Route Engine - Auto Random Port

on:
  schedule:
    - cron: '50 0,5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dnsutils
          pip install flask flask-cors gunicorn requests

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Generate App Code (Pure Proxy & Dynamic Routes)
        run: |
          python3 -c '
          code = """import os
          import requests
          from urllib.parse import urljoin, quote, unquote
          from flask import Flask, Response, request

          app = Flask(__name__)

          # ============================================================================
          # CẤU HÌNH DUCKDNS
          # ============================================================================
          DUCKDNS_DOMAIN = "chrtv"
          DUCKDNS_TOKEN = "0a7471b5-56fc-4b60-a5d9-5381f66930d9"

          # ============================================================================
          # CẤU HÌNH BIẾN & LINK LUỒNG GỐC
          # ============================================================================
          TARGET_SERVER = "http://23.237.104.106:8080"
          AMAGI_STUDIO_C = "https://amg12058-c15studio-amg12058c1-lg-us-5787.playouts.now.amagi.tv/playlist.m3u8"
          WARNER_TV = "http://190.61.90.17:40000/play/a0ho/index.m3u8"
          PARAMOUNT = "http://206.212.244.63/137/index.m3u8"
          KENSCOM_180 = "http://103.152.216.26:8443/live/DUC3mlZ3O2Z0i4May6u1cA/1785547208/180.m3u8"
          KENSCOM_191 = "http://103.152.216.26:8443/live/DUC3mlZ3O2Z0i4May6u1cA/1785547208/191.m3u8"

          HEADERS = {
              "User-Agent": "VLC/3.0.20 LibVLC/3.0.20",
              "Accept": "*/*",
              "Accept-Language": "vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7",
              "Connection": "keep-alive",
              "Host": "103.152.216.26:8443"
          }

          def get_public_base_url():
              return os.environ.get("PUBLIC_BASE_URL", "http://chrtv.duckdns.org:5000")

          def add_cors_headers(response):
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "GET, OPTIONS, HEAD"
              response.headers["Access-Control-Allow-Headers"] = "*"
              return response

          @app.route("/")
          def home():
              return f"IPTV Pure Proxy Engine Active! Base URL: {get_public_base_url()}", 200

          # ============================================================================
          # 1. PLAYLIST M3U TỔNG HỢP
          # ============================================================================
          @app.route("/playlist.m3u", methods=["GET", "OPTIONS"])
          def get_playlist():
              if request.method == "OPTIONS":
                  return add_cors_headers(Response(status=204))
              public_url = get_public_base_url()
              m3u_content = f\"\"\"#EXTM3U
          #EXTINF:-1 tvg-id="HBO" group-title="US Live" tvg-logo="https://i.imgur.com/vHqQZ4u.png",HBO Movies HD (Proxy)
          {public_url}/stream/USA_HBO_ZONE/index.m3u8
          #EXTINF:-1 tvg-id="WarnerTV" group-title="US Live" tvg-logo="https://i.imgur.com/2Xy349p.png",Warner TV HD
          {public_url}/stream/warnertv
          #EXTINF:-1 tvg-id="Paramount" group-title="US Live" tvg-logo="https://i.imgur.com/Q23kLMl.png",Paramount Network HD
          {public_url}/stream/paramount
          #EXTINF:-1 tvg-id="StudioC" group-title="US Live",Amagi Studio C HD
          {public_url}/stream/studioc
          #EXTINF:-1 tvg-id="Live180" group-title="VN Live",KensCom Channel 180 HD
          {public_url}/stream/180.m3u8
          #EXTINF:-1 tvg-id="Live191" group-title="VN Live",KensCom Channel 191 HD
          {public_url}/stream/191.m3u8\"\"\"
              res = Response(m3u_content.strip(), mimetype="application/x-mpegurl")
              return add_cors_headers(res)

          # ============================================================================
          # 2. CORE PROXY ENGINE
          # ============================================================================
          def handle_hls_proxy(default_target_url, endpoint_path):
              if request.method == "OPTIONS":
                  return add_cors_headers(Response(status=204))
              target_url = request.args.get("url") or default_target_url
              target_url = unquote(target_url)
              
              req_headers = HEADERS.copy()
              if "amagi.tv" in target_url:
                  req_headers.pop("Host", None)
              elif "103.152.216.26" in target_url:
                  req_headers["Host"] = "103.152.216.26:8443"
              else:
                  req_headers.pop("Host", None)

              try:
                  resp = requests.get(target_url, headers=req_headers, timeout=10, stream=True)
                  if resp.status_code != 200:
                      return add_cors_headers(Response(f"Upstream Error: HTTP {resp.status_code}", status=resp.status_code))
                  
                  raw_bytes = resp.content
                  raw_text = raw_bytes.decode("utf-8-sig", errors="ignore")
                  
                  if raw_text.strip().startswith("#EXTM3U"):
                      lines = raw_text.splitlines()
                      rewritten_lines = []
                      for line in lines:
                          line_str = line.strip()
                          if not line_str or line_str.startswith("#"):
                              rewritten_lines.append(line_str)
                          else:
                              full_url = urljoin(target_url, line_str)
                              rewritten_lines.append(f"{endpoint_path}?url={quote(full_url)}")
                      res = Response("\\n".join(rewritten_lines).strip(), status=200, mimetype="application/x-mpegurl")
                      res.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
                      return add_cors_headers(res)
                  else:
                      res = Response(raw_bytes, status=200, mimetype="video/mp2t")
                      return add_cors_headers(res)
              except Exception as e:
                  return add_cors_headers(Response(f"Proxy Exception: {str(e)}", status=502))

          # ============================================================================
          # 3. DYNAMIC ROUTE FOR SERVER 23.237.104.106:8080
          # Ví dụ: /stream/USA_DISCOVERY/index.m3u8 -> Map tới http://23.237.104.106:8080/USA_DISCOVERY/tracks-v1a1/mono.m3u8
          # ============================================================================
          @app.route("/stream/<channel_id>/<path:subpath>", methods=["GET", "OPTIONS"])
          def proxy_dynamic_23_237(channel_id, subpath):
              if request.method == "OPTIONS":
                  return add_cors_headers(Response(status=204))
              
              if request.args.get("url"):
                  target_url = unquote(request.args.get("url"))
              else:
                  if subpath == "index.m3u8":
                      target_subpath = "tracks-v1a1/mono.m3u8"
                  else:
                      target_subpath = subpath
                  target_url = f"{TARGET_SERVER}/{channel_id}/{target_subpath}"

              return handle_hls_proxy(target_url, f"/stream/{channel_id}/{subpath}")

          # ============================================================================
          # 4. FIXED ROUTES
          # ============================================================================
          @app.route("/stream/studioc", methods=["GET", "OPTIONS"])
          def proxy_studioc(): return handle_hls_proxy(AMAGI_STUDIO_C, "/stream/studioc")

          @app.route("/stream/warnertv", methods=["GET", "OPTIONS"])
          def proxy_warnertv(): return handle_hls_proxy(WARNER_TV, "/stream/warnertv")

          @app.route("/stream/paramount", methods=["GET", "OPTIONS"])
          def proxy_paramount(): return handle_hls_proxy(PARAMOUNT, "/stream/paramount")

          @app.route("/stream/180.m3u8", methods=["GET", "OPTIONS"])
          def proxy_180(): return handle_hls_proxy(KENSCOM_180, "/stream/180.m3u8")

          @app.route("/stream/191.m3u8", methods=["GET", "OPTIONS"])
          def proxy_191(): return handle_hls_proxy(KENSCOM_191, "/stream/191.m3u8")

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000, threaded=True)
          """
          with open("app.py", "w", encoding="utf-8") as f:
              f.write(code)
          '

      - name: Start Proxy Server & Tunnel
        run: |
          python3 -c '
          script = """#!/bin/bash
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 4
          SSHX_URL=$(grep "https://sshx.io/s/" sshx.log | head -n1 | sed -e '\''s/^[[:space:]]*//'\'' -e '\''s/[[:space:]]*$//'\'')

          echo "🌐 Requesting Random Available Port from Bore Tunnel..."
          bore local 5000 --to bore.pub > bore.log 2>&1 &

          # Chờ Bore cấp port rảnh
          ASSIGNED_PORT=""
          for i in {1..15}; do
            sleep 1
            ASSIGNED_PORT=$(grep -oP "listening at bore.pub:\K[0-9]+" bore.log | head -n1)
            if [ -n "$ASSIGNED_PORT" ]; then
              break
            fi
          done

          if [ -z "$ASSIGNED_PORT" ]; then
            echo "❌ Không thể cấp port từ Bore! Đang kiểm tra log:"
            cat bore.log
            exit 1
          fi

          echo "✅ Bore đã cấp Port Trống Hoàn Toàn: $ASSIGNED_PORT"

          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${ASSIGNED_PORT}"
          export PUBLIC_BASE_URL="${PUBLIC_URL}"

          echo "===================================================="
          echo "🚀 IPTV PROXY ACTIVE ON ASSIGNED PORT: ${ASSIGNED_PORT}"
          echo "🔑 SSHX URL         : ${SSHX_URL}"
          echo "👉 PLAYLIST URL     : ${PUBLIC_URL}/playlist.m3u"
          echo "👉 DYNAMIC EXAMPLE  : ${PUBLIC_URL}/stream/USA_DISCOVERY/index.m3u8"
          echo "===================================================="

          # Khởi chạy Gunicorn server
          gunicorn -w 8 --threads 4 --access-logfile - --error-logfile - --keep-alive 15 -b 0.0.0.0:5000 app:app
          """
          with open("start_proxy.sh", "w", encoding="utf-8") as f: f.write(script)
          '
          chmod +x start_proxy.sh
          ./start_proxy.sh
