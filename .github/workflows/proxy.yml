name: IPTV Pure Proxy & Dynamic Route Engine

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dnsutils
          pip install flask flask-cors gunicorn requests

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Create app.py
        run: |
          cat << 'EOF' > app.py
          import os
          import requests
          from urllib.parse import urljoin, quote, unquote
          from flask import Flask, Response, request, stream_with_context

          app = Flask(__name__)

          HEADERS_DEFAULT = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://thinkkast.dpdns.org/",
              "Origin": "https://thinkkast.dpdns.org",
              "Accept": "*/*",
              "Connection": "keep-alive"
          }

          CHANNELS = {
              "studioc": "https://amg12058-c15studio-amg12058c1-lg-us-5787.playouts.now.amagi.tv/playlist.m3u8",
              "warner": "http://190.61.90.17:40000/play/a0ho/index.m3u8",
              "paramount": "http://206.212.244.63/137/index.m3u8",
              "180.m3u8": "http://103.152.216.26:8443/live/DUC3mlZ3O2Z0i4May6u1cA/1785547208/180.m3u8",
              "191.m3u8": "http://103.152.216.26:8443/live/DUC3mlZ3O2Z0i4May6u1cA/1785547208/191.m3u8",
              "cg_axn": "https://thinkkast.dpdns.org/mytv/ph/cg_axn/index.m3u8",
              "cg_hbofam": "https://thinkkast.dpdns.org/mytv/ph/cg_hbofam/index.m3u8",
              "cg_hbohits": "https://thinkkast.dpdns.org/mytv/ph/cg_hbohits/index.m3u8",
              "cg_hbosign": "https://thinkkast.dpdns.org/mytv/ph/cg_hbosign/index.m3u8"
          }

          def _get_base_url():
              return os.environ.get("PUBLIC_BASE_URL", "http://chrtv.duckdns.org:55801")

          def add_cors(r):
              r.headers["Access-Control-Allow-Origin"] = "*"
              r.headers["Access-Control-Allow-Methods"] = "GET, OPTIONS, HEAD"
              r.headers["Access-Control-Allow-Headers"] = "*"
              return r

          @app.route("/")
          def home():
              return f"IPTV Engine Active! Base URL: {_get_base_url()}", 200

          @app.route("/playlist.m3u", methods=["GET", "OPTIONS"])
          def get_playlist():
              if request.method == "OPTIONS":
                  return add_cors(Response(status=204))
              p = _get_base_url()
              m = f"""#EXTM3U
          #EXTINF:-1 tvg-id="cg_hbofam" tvg-name="HBO Family" tvg-logo="https://qp-pldt-image-resizer-cloud-prod.akamaized.net/image/62F1AAED-EB56-49DF-912D-0A2388131772/06169.jpg?width=1980" tvg-chno="31" group-title="Cignal",HBO Family
          {p}/stream/cg_hbofam/index.m3u8
          #EXTINF:-1 tvg-id="cg_hbohits" tvg-name="HBO Hits" tvg-logo="https://qp-pldt-image-resizer-cloud-prod.akamaized.net/image/CEE83EE5-D870-4B3C-9339-ACA4F64020D0/06169.jpg?width=1980" tvg-chno="32" group-title="Cignal",HBO Hits
          {p}/stream/cg_hbohits/index.m3u8
          #EXTINF:-1 tvg-id="cg_hbosign" tvg-name="HBO Signature" tvg-logo="https://qp-pldt-image-resizer-cloud-prod.akamaized.net/image/D5127959-34E4-41B2-AA80-CE74DDC2C3C4/0-16x9.jpg?width=1980" tvg-chno="33" group-title="Cignal",HBO Signature
          {p}/stream/cg_hbosign/index.m3u8
          #EXTINF:-1 tvg-id="cg_axn" tvg-name="AXN SD" group-title="Cignal",AXN SD
          {p}/stream/cg_axn/index.m3u8
          #EXTINF:-1 tvg-id="HBO" group-title="US Live" tvg-logo="https://i.imgur.com/vHqQZ4u.png",HBO Movies HD (Proxy)
          {p}/stream/USA_HBO_ZONE/index.m3u8
          #EXTINF:-1 tvg-id="Discovery" group-title="US Live",Discovery Channel HD (Proxy)
          {p}/stream/USA_DISCOVERY/index.m3u8
          #EXTINF:-1 tvg-id="WarnerTV" group-title="US Live",Warner TV
          {p}/stream/warner
          #EXTINF:-1 tvg-id="Paramount" group-title="US Live",Paramount Network
          {p}/stream/paramount
          #EXTINF:-1 tvg-id="StudioC" group-title="US Live",Amagi Studio C
          {p}/stream/studioc
          #EXTINF:-1 tvg-id="Live180" group-title="VN Live",KensCom Channel 180 HD
          {p}/stream/180.m3u8
          #EXTINF:-1 tvg-id="Live191" group-title="VN Live",KensCom Channel 191 HD
          {p}/stream/191.m3u8"""
              return add_cors(Response(m.strip(), mimetype="application/x-mpegurl"))

          def handle_hls_proxy(tgt, path):
              if request.method == "OPTIONS":
                  return add_cors(Response(status=204))
              u = unquote(request.args.get("url") or tgt)
              h = HEADERS_DEFAULT.copy()
              if "103.152.216.26" in u:
                  h["Host"] = "103.152.216.26:8443"
              try:
                  rs = requests.get(u, headers=h, timeout=12, stream=True, allow_redirects=True)
                  if rs.status_code != 200:
                      return add_cors(Response(f"Err: HTTP {rs.status_code}", status=rs.status_code))
                  ct = rs.headers.get("Content-Type", "")
                  if ".m3u8" in u or "m3u8" in ct or rs.text.strip().startswith("#EXTM3U"):
                      ep = path.rsplit('/index.m3u8', 1)[0]
                      rw = [f"{ep}?url={quote(urljoin(rs.url, l))}" if l and not l.startswith("#") else l for l in rs.text.splitlines()]
                      res = Response("\n".join(rw).strip(), status=200, mimetype="application/x-mpegurl")
                      res.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
                      return add_cors(res)
                  else:
                      res = Response(stream_with_context(rs.iter_content(chunk_size=16384)), status=200, mimetype="video/mp2t")
                      return add_cors(res)
              except Exception as e:
                  return add_cors(Response(f"Exception: {str(e)}", status=502))

          @app.route("/stream/<chid>", methods=["GET", "OPTIONS"])
          @app.route("/stream/<chid>/index.m3u8", methods=["GET", "OPTIONS"])
          def p_chan(chid):
              if chid in CHANNELS:
                  return handle_hls_proxy(CHANNELS[chid], f"/stream/{chid}")
              return add_cors(Response("Not Found", status=404))

          @app.route("/stream/<channel_id>/<path:subpath>", methods=["GET", "OPTIONS"])
          def p_dynamic(channel_id, subpath):
              if request.method == "OPTIONS":
                  return add_cors(Response(status=204))
              u = unquote(request.args.get("url")) if request.args.get("url") else f"http://23.237.104.106:8080/{channel_id}/{subpath}"
              return handle_hls_proxy(u, f"/stream/{channel_id}/{subpath}")

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000, threaded=True)
          EOF

      - name: Run Server Engine
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          FIXED_PORT=55801

          echo "Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 4
          SSHX_URL=$(grep "https://sshx.io/s/" sshx.log | head -n1 | xargs)

          echo "Requesting Port $FIXED_PORT from Bore..."
          bore local 5000 --to bore.pub --port $FIXED_PORT > bore.log 2>&1 &
          sleep 3

          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          fi

          export PUBLIC_BASE_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${FIXED_PORT}"

          echo "===================================================="
          echo "PROXY ACTIVE ON PORT : ${FIXED_PORT}"
          echo "SSHX URL            : ${SSHX_URL}"
          echo "PLAYLIST URL        : ${PUBLIC_BASE_URL}/playlist.m3u"
          echo "===================================================="

          gunicorn -w 12 --threads 8 --access-logfile - --error-logfile - --keep-alive 15 -b 0.0.0.0:5000 app:app
