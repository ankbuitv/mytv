name: IPTV Pure Proxy & Dynamic Route Engine

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  proxy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dnsutils
          pip install flask flask-cors gunicorn requests

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Generate App Code
        run: |
          cat << 'EOF' > app.py
import os
import requests
from urllib.parse import urljoin, quote, unquote
from flask import Flask, Response, request, stream_with_context

app = Flask(__name__)

DUCKDNS_DOMAIN = "chrtv"
DUCKDNS_TOKEN = "0a7471b5-56fc-4b60-a5d9-5381f66930d9"

AMAGI_STUDIO_C = "https://amg12058-c15studio-amg12058c1-lg-us-5787.playouts.now.amagi.tv/playlist.m3u8"
WARNER_TV = "http://190.61.90.17:40000/play/a0ho/index.m3u8"
PARAMOUNT = "http://206.212.244.63/137/index.m3u8"
CG_AXN = "https://thinkkast.dpdns.org/mytv/ph/cg_axn_sd/main/index.m3u8"

HEADERS_DEFAULT = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
    "Accept": "*/*",
    "Connection": "keep-alive"
}

def get_public_base_url():
    return os.environ.get("PUBLIC_BASE_URL", "http://chrtv.duckdns.org:55801")

def add_cors_headers(response):
    response.headers["Access-Control-Allow-Origin"] = "*"
    response.headers["Access-Control-Allow-Methods"] = "GET, OPTIONS, HEAD"
    response.headers["Access-Control-Allow-Headers"] = "*"
    return response

def serve_parrot_live():
    try:
        req = requests.get("https://ascii.live/parrot", stream=True, timeout=5)
        def generate():
            for chunk in req.iter_content(chunk_size=1024):
                if chunk:
                    yield chunk
        return Response(stream_with_context(generate()), mimetype="text/plain; charset=utf-8")
    except Exception:
        return Response("🦜 Party Parrot Guard Active!", status=429)

@app.before_request
def check_anti_scan():
    if request.method == "OPTIONS":
        return
    user_agent = (request.headers.get("User-Agent") or "").lower()
    is_bot = any(b in user_agent for b in ["zgrab", "nmap", "nikto", "sqlmap", "postman"])
    if is_bot and request.path == "/":
        return serve_parrot_live()

@app.route("/")
def home():
    user_agent = (request.headers.get("User-Agent") or "").lower()
    if "curl" in user_agent or "wget" in user_agent:
        return serve_parrot_live()
    return f"IPTV Engine Active! Base URL: {get_public_base_url()}", 200

# ============================================================================
# PLAYLIST M3U TỔNG HỢP
# ============================================================================
@app.route("/playlist.m3u", methods=["GET", "OPTIONS"])
def get_playlist():
    if request.method == "OPTIONS":
        return add_cors_headers(Response(status=204))
    public_url = get_public_base_url()
    m3u_content = f"""#EXTM3U
#EXTINF:-1 tvg-id="AXN" group-title="PH Live",AXN SD (Proxy)
{public_url}/stream/cg_axn/index.m3u8
#EXTINF:-1 tvg-id="WarnerTV" group-title="US Live" tvg-logo="https://i.imgur.com/2Xy349p.png",Warner TV HD
{public_url}/stream/warner
#EXTINF:-1 tvg-id="Paramount" group-title="US Live" tvg-logo="https://i.imgur.com/Q23kLMl.png",Paramount Network HD
{public_url}/stream/paramount
#EXTINF:-1 tvg-id="StudioC" group-title="US Live",Amagi Studio C HD
{public_url}/stream/studioc"""
    res = Response(m3u_content.strip(), mimetype="application/x-mpegurl")
    return add_cors_headers(res)

# ============================================================================
# CORE PROXY FUNCTION
# ============================================================================
def handle_hls_proxy(default_target_url, endpoint_path):
    if request.method == "OPTIONS":
        return add_cors_headers(Response(status=204))
    target_url = unquote(request.args.get("url") or default_target_url)
    
    req_headers = HEADERS_DEFAULT.copy()
    if "thinkkast.dpdns.org" in target_url:
        req_headers["Referer"] = "https://thinkkast.dpdns.org/"
        req_headers["Origin"] = "https://thinkkast.dpdns.org"

    try:
        resp = requests.get(target_url, headers=req_headers, timeout=12, stream=True, allow_redirects=True)
        if resp.status_code != 200:
            return add_cors_headers(Response(f"Upstream Error: HTTP {resp.status_code}", status=resp.status_code))
        
        final_url = resp.url
        if ".m3u8" in target_url or "m3u8" in resp.headers.get("Content-Type", "") or resp.text.startswith("#EXTM3U"):
            lines = resp.text.splitlines()
            rewritten_lines = []
            for line in lines:
                line_str = line.strip()
                if not line_str or line_str.startswith("#"):
                    rewritten_lines.append(line_str)
                else:
                    full_url = urljoin(final_url, line_str)
                    rewritten_lines.append(f"{endpoint_path}?url={quote(full_url)}")
            res = Response("\n".join(rewritten_lines).strip(), status=200, mimetype="application/x-mpegurl")
            res.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
            return add_cors_headers(res)
        else:
            def generate():
                for chunk in resp.iter_content(chunk_size=16384):
                    if chunk:
                        yield chunk
            content_type = resp.headers.get("Content-Type", "video/mp2t")
            res = Response(stream_with_context(generate()), status=200, mimetype=content_type)
            return add_cors_headers(res)
    except Exception as e:
        return add_cors_headers(Response(f"Proxy Exception: {str(e)}", status=502))

@app.route("/stream/cg_axn/index.m3u8", methods=["GET", "OPTIONS"])
def proxy_cg_axn(): return handle_hls_proxy(CG_AXN, "/stream/cg_axn/index.m3u8")

@app.route("/stream/studioc", methods=["GET", "OPTIONS"])
def proxy_studioc(): return handle_hls_proxy(AMAGI_STUDIO_C, "/stream/studioc")

@app.route("/stream/warner", methods=["GET", "OPTIONS"])
def proxy_warner(): return handle_hls_proxy(WARNER_TV, "/stream/warner")

@app.route("/stream/paramount", methods=["GET", "OPTIONS"])
def proxy_paramount(): return handle_hls_proxy(PARAMOUNT, "/stream/paramount")

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000, threaded=True)
EOF

      - name: Start Proxy Server & Tunnel
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          FIXED_PORT=55801

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 4
          SSHX_URL=$(grep "https://sshx.io/s/" sshx.log | head -n1 | xargs)

          echo "🌐 Requesting Port $FIXED_PORT from Bore..."
          bore local 5000 --to bore.pub --port $FIXED_PORT > bore.log 2>&1 &
          sleep 3

          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          fi

          export PUBLIC_BASE_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${FIXED_PORT}"

          echo "===================================================="
          echo "🚀 PROXY ACTIVE ON PORT : ${FIXED_PORT}"
          echo "🔑 SSHX URL            : ${SSHX_URL}"
          echo "👉 PLAYLIST URL        : ${PUBLIC_BASE_URL}/playlist.m3u"
          echo "===================================================="

          gunicorn -w 12 --threads 8 --access-logfile - --error-logfile - --keep-alive 15 -b 0.0.0.0:5000 app:app
