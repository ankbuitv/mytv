name: IPTV Stream Server - History (Fixed Port 30205)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Streamer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl dnsutils
          pip install flask flask-cors

          # ====================================================
          # 1. CẤU HÌNH DUCKDNS
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"

          # 2. Cài đặt Bore Tunnel
          echo "⏬ Đang tải Bore..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          # Tải logo PNG (Sử dụng link Wikimedia / Catbox chống chặn Hotlink)
          echo "⏬ Đang tải logo..."
          curl -s -L "https://i.ibb.co/HDmcxzMK/Gemini-Generated-Image-v7i9yav7i9yav7i9-removebg-preview.png" -o logo1.png

          # Tạo thư mục lưu HLS
          mkdir -p hls/history

          # 3. Ép mở Bore ở Port Cố Định 30205
          echo "🌐 Đang mở Bore Tunnel tại Port cố định 30205..."
          BORE_PORT=30205
          MAX_RETRIES=5
          RETRY_COUNT=0
          CONNECTED=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            bore local 5000 --to bore.pub --port 30205 > bore.log 2>&1 &
            sleep 4
            
            if grep -q "listening at bore.pub:30205" bore.log; then
              echo "✅ Đã giữ thành công Port 30205!"
              CONNECTED=true
              break
            else
              echo "⚠️ Port 30205 đang bận... Thử lại ($((RETRY_COUNT+1))/$MAX_RETRIES)"
              pkill bore || true
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 3
            fi
          done

          # 4. Cập nhật IP Bore lên DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "🌐 Cập nhật IP Bore (${BORE_IP}) lên ${DUCKDNS_DOMAIN}.duckdns.org..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo ""
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # 5. Tạo file playlist.m3u
          echo "#EXTM3U" > playlist.m3u
          echo '#EXTINF:-1 tvg-id="History" tvg-name="History Channel" group-title="US Live", History Channel' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/history/1080p.m3u8" >> playlist.m3u

          # 6. Flask Server
          echo 'from flask import Flask, send_from_directory, abort' > app.py
          echo 'from flask_cors import CORS' >> app.py
          echo 'import os' >> app.py
          echo 'app = Flask(__name__)' >> app.py
          echo 'CORS(app)' >> app.py
          echo '@app.route("/")' >> app.py
          echo 'def index(): return "IPTV Stream Server is Running!", 200' >> app.py
          echo '@app.route("/playlist.m3u")' >> app.py
          echo 'def playlist(): return send_from_directory(".", "playlist.m3u")' >> app.py
          echo '@app.route("/hls/<path:filename>")' >> app.py
          echo 'def serve_hls(filename):' >> app.py
          echo '    file_path = os.path.join("hls", filename)' >> app.py
          echo '    if not os.path.exists(file_path): return abort(404)' >> app.py
          echo '    return send_from_directory("hls", filename)' >> app.py
          echo 'if __name__ == "__main__": app.run(host="0.0.0.0", port=5000)' >> app.py

          python3 app.py &
          sleep 2

          UA_BROWSER="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36"

          echo "===================================================="
          echo "🚀 CHRTV SINGLE STREAM SERVER (HISTORY NO LAG) READY!"
          echo "👉 LINK PLAYLIST TỔNG M3U: ${PUBLIC_URL}/playlist.m3u"
          echo "===================================================="

          # 7. FIX LAG HISTORY TRUYỀN HÌNH: ÉP BITRATE NẸT 800K + FPS 25 SUPER SMOOTH
          ffmpeg -hide_banner -loglevel error \
            -rw_timeout 30000000 \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -user_agent "$UA_BROWSER" \
            -i "https://freem3u.xyz/api/live/play.m3u8?vid=9856" \
            -stream_loop -1 -i logo1.png \
            -filter_complex "[0:v]fps=25,scale=1280:720[main];[1:v]scale=60:-1[logo];[main][logo]overlay=W-w-15:15[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset ultrafast -tune zerolatency -crf 30 -g 50 -b:v 800k -maxrate 1000k -bufsize 2000k \
            -c:a aac -b:a 96k -ar 44100 \
            -f hls -hls_time 2 -hls_list_size 6 -hls_flags delete_segments+omit_endlist \
            -hls_segment_filename "hls/history/seg_%03d.ts" hls/history/1080p.m3u8
