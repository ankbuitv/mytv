name: IPTV Live Stream Server (Ngrok)

on:
  workflow_dispatch: # Cho phép bấm Nút "Run workflow" bằng tay trên GitHub
  schedule:
    - cron: '0 */5 * * *' # Tự động gia hạn lại sau mỗi 5 tiếng để không bị rớt stream

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Cài đặt các gói hỗ trợ hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

          # Cài đặt Ngrok Agent
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: 4. Cài đặt Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests

      - name: 5. Khởi chạy Flask Server & Ngrok Tunnel
        env:
          # 🔑 Nhập Ngrok Authtoken của bro vào đây (hoặc cài trong GitHub Secrets: Secrets -> Actions)
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. Thêm Authtoken cho Ngrok
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "❌ LỖI: Chưa cấu hình NGROK_AUTHTOKEN trong GitHub Secrets!"
            echo "Vui lòng nhập trực tiếp token vào file YML hoặc tạo Secret NGROK_AUTHTOKEN trên GitHub."
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN

          # 2. Khởi chạy app Python (Flask Server) ở nền
          python app.py &
          echo "⏳ Đang đợi Flask Server khởi động..."
          sleep 5

          # 3. Khởi chạy Ngrok tunnel cổng 5000
          ngrok http 5000 --log=stdout > ngrok.log &
          echo "⏳ Đang đợi Ngrok thiết lập kết nối..."
          sleep 5

          # 4. Lấy public URL từ Ngrok API
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          if [ "$NGROK_URL" == "null" ] || [ -z "$NGROK_URL" ]; then
            echo "❌ Lỗi: Không lấy được public URL từ Ngrok!"
            cat ngrok.log
            exit 1
          fi

          echo ""
          echo "=========================================================="
          echo "🚀 TẠO TUNNEL NGROK THÀNH CÔNG!"
          echo "👉 Domain Ngrok: ${NGROK_URL}"
          echo "👉 Link Playlist M3U: ${NGROK_URL}/playlist.m3u"
          echo "👉 Link Stream HLS: ${NGROK_URL}/hls/history/master.m3u8"
          echo "=========================================================="
          echo ""

          # 5. Lưu URL Ngrok ra file ngrok_url.txt để dùng nếu cần
          echo "$NGROK_URL" > ngrok_url.txt

          # 6. Giữ cho Workflow chạy liên tục 5 tiếng
          sleep 18000
