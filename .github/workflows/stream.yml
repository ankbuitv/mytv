name: IPTV Multi-Stream Server (Fixed Port 30205)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Multi Streamer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl dnsutils
          pip install flask flask-cors

          # ====================================================
          # 1. CẤU HÌNH DUCKDNS CỦA BRO
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"

          # 2. Cài đặt Bore Tunnel & SSHX
          echo "⏬ Đang tải Bore..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          echo "⏬ Đang khởi tạo Terminal SSHX..."
          curl -sSF https://sshx.io/get | sh -s run > sshx.log 2>&1 &
          sleep 2

          # Tải logo PNG chuẩn (Trong suốt)
          echo "⏬ Đang tải logo..."
          curl -s -L "https://i.ibb.co/HDmcxzMK/Gemini-Generated-Image-v7i9yav7i9yav7i9-removebg-preview.png" -o logo1.png

          # Tạo thư mục lưu HLS
          mkdir -p hls/history hls/tv360-9 hls/tv360-10 hls/tv360-11

          # 3. Ép mở Bore ở Port Cố Định 30205
          echo "🌐 Đang mở Bore Tunnel tại Port cố định 30205..."
          BORE_PORT=30205
          MAX_RETRIES=5
          RETRY_COUNT=0
          CONNECTED=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            bore local 5000 --to bore.pub --port 30205 > bore.log 2>&1 &
            sleep 4
            
            if grep -q "listening at bore.pub:30205" bore.log; then
              echo "✅ Đã giữ thành công Port 30205!"
              CONNECTED=true
              break
            else
              echo "⚠️ Port 30205 đang bận... Thử lại ($((RETRY_COUNT+1))/$MAX_RETRIES)"
              pkill bore || true
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 3
            fi
          done

          # 4. Cập nhật IP Bore lên DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "🌐 Cập nhật IP Bore (${BORE_IP}) lên ${DUCKDNS_DOMAIN}.duckdns.org..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo ""
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"
          SSHX_LINK=$(grep -oE 'https://sshx.io/s/[a-zA-Z0-9#]+' sshx.log | head -n 1 || true)

          # 5. Tạo file playlist.m3u
          echo "#EXTM3U" > playlist.m3u
          echo '#EXTINF:-1 tvg-id="History" tvg-name="History Channel" group-title="US Live", History Channel' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/history/1080p.m3u8" >> playlist.m3u

          for ch in 9 10 11; do
            echo "#EXTINF:-1 tvg-id=\"tv360plus${ch}\" tvg-name=\"TV360+${ch}\" group-title=\"Sự Kiện TV360\", TV360+${ch}" >> playlist.m3u
            echo "${PUBLIC_URL}/hls/tv360-${ch}/1080p.m3u8" >> playlist.m3u
          done

          # 6. Flask Server
          echo 'from flask import Flask, send_from_directory, abort' > app.py
          echo 'from flask_cors import CORS' >> app.py
          echo 'import os' >> app.py
          echo 'app = Flask(__name__)' >> app.py
          echo 'CORS(app)' >> app.py
          echo '@app.route("/")' >> app.py
          echo 'def index(): return "IPTV Multi-Stream Server is Running!", 200' >> app.py
          echo '@app.route("/playlist.m3u")' >> app.py
          echo 'def playlist(): return send_from_directory(".", "playlist.m3u")' >> app.py
          echo '@app.route("/hls/<path:filename>")' >> app.py
          echo 'def serve_hls(filename):' >> app.py
          echo '    file_path = os.path.join("hls", filename)' >> app.py
          echo '    if not os.path.exists(file_path): return abort(404)' >> app.py
          echo '    return send_from_directory("hls", filename)' >> app.py
          echo 'if __name__ == "__main__": app.run(host="0.0.0.0", port=5000)' >> app.py

          python3 app.py &
          sleep 2

          UA_DALVIK="Dalvik/2.1.0"
          UA_BROWSER="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36"

          echo "===================================================="
          echo "🚀 CHRTV MULTI-STREAM SERVER READY!"
          echo "👉 LINK PLAYLIST TỔNG M3U: ${PUBLIC_URL}/playlist.m3u"
          echo "💻 LINK SSHX WEB TERMINAL: ${SSHX_LINK}"
          echo "===================================================="

          # 7. KÊNH HISTORY (GẮN LOGO PNG TỰ ĐỘNG SCALE NHỎ CẠNH TRÊN BÊN PHẢI)
          ffmpeg -hide_banner -loglevel error \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
            -user_agent "$UA_BROWSER" \
            -i "https://freem3u.xyz/api/live/play.m3u8?vid=9856" \
            -stream_loop -1 -i logo1.png \
            -filter_complex "[0:v]scale=1920:1080[v_base]; [1:v]scale=120:-1[logo]; [v_base][logo]overlay=main_w-overlay_w-20:20,format=yuv420p[v1080]" \
            -map "[v1080]" -map 0:a? \
            -c:v libx264 -preset ultrafast -threads 2 -b:v 2200k -maxrate 2500k -bufsize 3000k \
            -c:a aac -b:a 128k \
            -f hls -hls_time 3 -hls_list_size 8 -hls_flags delete_segments \
            -hls_segment_filename "hls/history/seg_1080p_%03d.ts" hls/history/1080p.m3u8 &

          # 8. KÊNH TV360+9 (GẮN LOGO PNG TỰ ĐỘNG SCALE NHỎ CẠNH TRÊN BÊN PHẢI)
          STREAM_URL_9="https://vmttv.dpdns.org/tv360/?id=tv360-9"
          REAL_URL_9=$(curl -sI -A "$UA_DALVIK" "$STREAM_URL_9" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
          if [ -z "$REAL_URL_9" ]; then REAL_URL_9="$STREAM_URL_9"; fi

          ffmpeg -hide_banner -loglevel error \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
            -user_agent "$UA_DALVIK" \
            -i "$REAL_URL_9" \
            -stream_loop -1 -i logo1.png \
            -filter_complex "[0:v]scale=1920:1080[v_base]; [1:v]scale=120:-1[logo]; [v_base][logo]overlay=main_w-overlay_w-20:20,format=yuv420p[v1080]" \
            -map "[v1080]" -map 0:a? \
            -c:v libx264 -preset ultrafast -threads 2 -b:v 2200k -maxrate 2500k -bufsize 3000k \
            -c:a aac -b:a 128k \
            -f hls -hls_time 3 -hls_list_size 8 -hls_flags delete_segments \
            -hls_segment_filename "hls/tv360-9/seg_1080p_%03d.ts" hls/tv360-9/1080p.m3u8 &

          # 9. KÊNH TV360+10 (DIRECT COPY - SIÊU NHẸ)
          STREAM_URL_10="https://vmttv.dpdns.org/tv360/?id=tv360-10"
          REAL_URL_10=$(curl -sI -A "$UA_DALVIK" "$STREAM_URL_10" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
          if [ -z "$REAL_URL_10" ]; then REAL_URL_10="$STREAM_URL_10"; fi

          ffmpeg -hide_banner -loglevel error \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
            -user_agent "$UA_DALVIK" \
            -i "$REAL_URL_10" \
            -c:v copy -c:a copy \
            -f hls -hls_time 3 -hls_list_size 8 -hls_flags delete_segments \
            -hls_segment_filename "hls/tv360-10/seg_1080p_%03d.ts" hls/tv360-10/1080p.m3u8 &

          # 10. KÊNH TV360+11 (DIRECT COPY - FOREGROUND)
          STREAM_URL_11="https://vmttv.dpdns.org/tv360/?id=tv360-11"
          REAL_URL_11=$(curl -sI -A "$UA_DALVIK" "$STREAM_URL_11" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
          if [ -z "$REAL_URL_11" ]; then REAL_URL_11="$STREAM_URL_11"; fi

          ffmpeg -hide_banner -loglevel info \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
            -user_agent "$UA_DALVIK" \
            -i "$REAL_URL_11" \
            -c:v copy -c:a copy \
            -f hls -hls_time 3 -hls_list_size 8 -hls_flags delete_segments \
            -hls_segment_filename "hls/tv360-11/seg_1080p_%03d.ts" hls/tv360-11/1080p.m3u8
