name: IPTV Live Stream Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Streamer & Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 0. Cài đặt Ngrok & jq
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok jq

          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "❌ LỖI: Chưa có NGROK_AUTHTOKEN trong GitHub Secrets!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN

          pip install flask

          # Tạo thư mục chứa HLS
          mkdir -p hls/history

          # 1. Chạy FFmpeg render video (Có logo chuẩn 100%)
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          STREAM_HISTORY="https://freem3u.xyz/api/live/play.m3u8?vid=9856"

          ffmpeg -hide_banner -loglevel error \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 3 \
            -user_agent "$USER_AGENT" \
            -i "$STREAM_HISTORY" \
            -stream_loop -1 -i logo1.png \
            -filter_complex "[0:v]scale=1920:1080[v_base]; [1:v]scale=80:-1[logo]; [v_base][logo]overlay=20:main_h-overlay_h-20,format=yuv420p[v1080]" \
            -map "[v1080]" -map 0:a? \
            -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 3000k -bufsize 3500k \
            -c:a aac -b:a 128k \
            -f hls -hls_time 3 -hls_list_size 8 -hls_flags delete_segments \
            -hls_segment_filename "hls/history/seg_1080p_%03d.ts" hls/history/1080p.m3u8 &

          sleep 6

          # 2. Bật Web Server Flask
          python3 app.py &

          sleep 3

          # 3. Bật Ngrok Tunnel (Ép IPv4 127.0.0.1 để chống lỗi 8012)
          ngrok http http://127.0.0.1:5000 --host-header=rewrite --log=stdout > ngrok.log &

          sleep 5

          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "===================================================="
          echo "🚀 KẾT NỐI NGROK THÀNH CÔNG!"
          echo "👉 LINK M3U IPTV MỚI CỦA BRO ĐÂY: ${NGROK_URL}/playlist.m3u"
          echo "===================================================="

          wait
