name: IPTV Stream Server - Web HLS Optimized (1080p Full Power)

on:
  schedule:
    - cron: '50 0,5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl dnsutils
          pip install flask flask-cors gunicorn

      - name: Setup Bore Tunnel & SSHX
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Create Workspace Folders
        run: mkdir -p hls/kenscom180

      - name: Generate Server App Code (Python)
        run: |
          python3 -c '
          code = """from flask import Flask, send_from_directory, abort, make_response
          from flask_cors import CORS
          import os

          app = Flask(__name__)
          CORS(app, resources={r"/*": {"origins": "*"}})

          @app.route("/")
          def index(): return "IPTV Stream Server Running (1080p Web Optimized)!", 200

          @app.route("/playlist.m3u")
          def playlist(): 
              return send_from_directory(".", "playlist.m3u")

          @app.route("/hls/<path:filename>")
          def serve_hls(filename):
              file_path = os.path.join("hls", filename)
              if not os.path.exists(file_path): return abort(404)
              
              response = make_response(send_from_directory("hls", filename))
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Connection"] = "keep-alive"
              response.headers["Keep-Alive"] = "timeout=15, max=100"
              response.headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              return response

          if __name__ == "__main__": app.run(host="0.0.0.0", port=5000)
          """
          with open("app.py", "w") as f:
              f.write(code)
          '

      - name: Generate Stream Script
        run: |
          python3 -c '
          script = """#!/bin/bash
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=30211

          echo "💻 Starting SSHX Web Terminal..."
          sshx > sshx.log 2>&1 &
          sleep 4
          SSHX_URL=$(grep "https://sshx.io/s/" sshx.log | head -n1 | sed -e '\''s/^[[:space:]]*//'\'' -e '\''s/[[:space:]]*$//'\'')

          echo "🌐 Starting Bore Tunnel..."
          (
            while true; do
              bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
              sleep 3
            done
          ) &
          sleep 5

          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
          else
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}"
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          echo "#EXTM3U" > playlist.m3u
          echo '\''#EXTINF:-1 tvg-id="Kenscom180" tvg-name="Kenscom Channel 180" group-title="VN Live", KensCom Channel 180 HD'\'' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/kenscom180/1080p.m3u8" >> playlist.m3u

          gunicorn -w 4 --threads 2 --access-logfile - --error-logfile - --keep-alive 15 -b 0.0.0.0:5000 app:app &
          sleep 2

          echo "===================================================="
          echo "🚀 CHRTV STREAM READY (1080P WEB PERFECT HLS)!"
          echo "🔑 SSHX TERMINAL URL : ${SSHX_URL}"
          echo "👉 PLAYLIST URL      : ${PUBLIC_URL}/playlist.m3u"
          echo "👉 DIRECT STREAM    : ${PUBLIC_URL}/hls/kenscom180/1080p.m3u8"
          echo "===================================================="

          HEADERS="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36\\r\\nAccept: */*\\r\\nConnection: keep-alive"

          while true; do
            echo "🎬 Starting FFmpeg Transcode (4 CPU / Web HLS Compatible)..."
            ffmpeg -y -hide_banner -loglevel info \\
              -headers "$HEADERS" \\
              -rw_timeout 10000000 \\
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \\
              -i "http://103.152.216.26:8443/live/DUC3mlZ3O2Z0i4May6u1cA/1785547208/180.m3u8" \\
              -threads 4 \\
              -c:v libx264 -preset superfast -profile:v main -pix_fmt yuv420p \\
              -g 50 -keyint_min 50 -sc_threshold 0 \\
              -crf 23 -maxrate 3500k -bufsize 7000k \\
              -c:a aac -b:a 128k -ar 48000 -af "aresample=async=1" \\
              -f hls -hls_time 2 -hls_list_size 6 -hls_flags delete_segments+omit_endlist+independent_segments \\
              -hls_segment_filename "hls/kenscom180/seg_%03d.ts" hls/kenscom180/1080p.m3u8 || true
            
            echo "⚠️ Source stream down, retrying in 5s..."
            sleep 5
          done
          """
          with open("start_stream.sh", "w") as f:
              f.write(script)
          '
          chmod +x start_stream.sh

      - name: Execute Streamer
        run: ./start_stream.sh
