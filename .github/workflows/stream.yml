name: IPTV Live Stream Server (Ngrok)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Cài đặt các gói hỗ trợ hệ thống & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: 4. Cài đặt Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests

      - name: 5. Khởi chạy Flask Server & Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "❌ LỖI: Chưa cấu hình NGROK_AUTHTOKEN trong GitHub Secrets!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN

          # 🔥 Ép Flask lắng nghe chính xác ở IPv4 (0.0.0.0:5000) từ file yml
          python -c "import app; app.app.run(host='0.0.0.0', port=5000)" &
          echo "⏳ Đang đợi Flask Server khởi động..."
          sleep 5

          # 🔥 Ép Ngrok trỏ thẳng vào IPv4 127.0.0.1 (Tránh hoàn toàn lỗi ::1 IPv6)
          ngrok http http://127.0.0.1:5000 --host-header=rewrite --log=stdout > ngrok.log &
          echo "⏳ Đang đợi Ngrok thiết lập kết nối..."
          sleep 5

          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          if [ "$NGROK_URL" == "null" ] || [ -z "$NGROK_URL" ]; then
            echo "❌ Lỗi: Không lấy được public URL từ Ngrok!"
            cat ngrok.log
            exit 1
          fi

          echo ""
          echo "=========================================================="
          echo "🚀 KẾT NỐI THÀNH CÔNG (NO MORE ERR_NGROK_8012)!"
          echo "👉 Domain Ngrok: ${NGROK_URL}"
          echo "👉 Link Playlist M3U: ${NGROK_URL}/playlist.m3u"
          echo "👉 Link Stream HLS: ${NGROK_URL}/hls/history/master.m3u8"
          echo "=========================================================="
          echo ""

          sleep 18000
