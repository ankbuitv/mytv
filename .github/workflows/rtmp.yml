name: IPTV RTMP test

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install bore
        shell: bash
        run: |
          set -eu
          cargo install --locked bore-cli --root /tmp/bore-install

      - name: Start MediaMTX and tunnels
        env:
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        shell: bash
        run: |
          set -eu

          if [ -z "$PUBLISH_PASSWORD" ]; then
            echo "Thiếu GitHub secret PUBLISH_PASSWORD."
            exit 1
          fi

          # Chỉ chấp nhận chữ và số để tránh lỗi YAML/URL.
          if ! [[ "$PUBLISH_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "PUBLISH_PASSWORD chỉ được gồm chữ và số."
            exit 1
          fi

          cleanup() {
            if [ -n "${LOG_PID:-}" ]; then
              kill "$LOG_PID" 2>/dev/null || true
            fi
            if [ -n "${RTMP_PID:-}" ]; then
              kill "$RTMP_PID" 2>/dev/null || true
            fi
            if [ -n "${HLS_PID:-}" ]; then
              kill "$HLS_PID" 2>/dev/null || true
            fi
            docker rm -f mediamtx >/dev/null 2>&1 || true
            rm -f /tmp/mediamtx.yml
          }
          trap cleanup EXIT

          # Publish cần mật khẩu; xem HLS không cần đăng nhập.
          cat > /tmp/mediamtx.yml <<EOF
          authMethod: internal

          authInternalUsers:
            - user: publisher
              pass: "$PUBLISH_PASSWORD"
              permissions:
                - action: publish
                  path: live/channel

            - user: any
              pass: 
              permissions:
                - action: read
                  path: live/channel
          paths:
            live/channel:
          EOF

          docker run -d --name mediamtx \
            -p 127.0.0.1:1935:1935 \
            -p 127.0.0.1:8888:8888 \
            -v /tmp/mediamtx.yml:/mediamtx.yml:ro \
            bluenviron/mediamtx:latest

          # Tunnel OBS → MediaMTX.
          /tmp/bore-install/bin/bore local 1935 --to bore.pub \
            > /tmp/bore-rtmp.log 2>&1 &
          RTMP_PID=$!

          # Tunnel IPTV → HLS MediaMTX.
          /tmp/bore-install/bin/bore local 8888 --to bore.pub \
            > /tmp/bore-hls.log 2>&1 &
          HLS_PID=$!

          RTMP_ADDR=""
          HLS_ADDR=""

          echo "Đang chờ hai bore tunnel..."

          for i in $(seq 1 60); do
            if [ -z "$RTMP_ADDR" ]; then
              RTMP_ADDR=$(grep -oE 'bore\.pub:[0-9]+' \
                /tmp/bore-rtmp.log | head -n 1 || true)
            fi

            if [ -z "$HLS_ADDR" ]; then
              HLS_ADDR=$(grep -oE 'bore\.pub:[0-9]+' \
                /tmp/bore-hls.log | head -n 1 || true)
            fi

            if [ -n "$RTMP_ADDR" ] && [ -n "$HLS_ADDR" ]; then
              break
            fi

            if ! kill -0 "$RTMP_PID" 2>/dev/null \
              || ! kill -0 "$HLS_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ -z "$RTMP_ADDR" ] || [ -z "$HLS_ADDR" ]; then
            echo "Không mở được cả hai tunnel."
            echo "=== RTMP tunnel ==="
            cat /tmp/bore-rtmp.log
            echo "=== HLS tunnel ==="
            cat /tmp/bore-hls.log
            echo "=== MediaMTX ==="
            docker logs mediamtx
            exit 1
          fi

          echo ""
          echo "========= OBS ========="
          echo "Server: rtmp://$RTMP_ADDR/live"
          echo "Stream Key: channel?user=publisher&pass=MAT_KHAU_CUA_BRO"
          echo "Thay MAT_KHAU_CUA_BRO bằng secret đã tạo."
          echo ""
          echo "========= IPTV / VLC ========="
          echo "http://$HLS_ADDR/live/channel/index.m3u8"
          echo "Không cần đăng nhập để xem."
          echo "=============================="
          echo "Bật OBS trước, chờ vài giây rồi mở link HLS."
          echo ""
          echo "=== MediaMTX log ==="

          docker logs -f mediamtx &
          LOG_PID=$!

          while kill -0 "$RTMP_PID" 2>/dev/null \
            && kill -0 "$HLS_PID" 2>/dev/null \
            && [ "$(docker inspect -f '{{.State.Running}}' mediamtx)" = "true" ]; do
            sleep 5
          done

          echo "Tunnel hoặc MediaMTX đã dừng."
          echo "=== RTMP tunnel ==="
          cat /tmp/bore-rtmp.log
          echo "=== HLS tunnel ==="
          cat /tmp/bore-hls.log
          echo "=== MediaMTX ==="
          docker logs mediamtx
          exit 1
