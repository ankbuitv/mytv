name: VeoTV live prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veotv-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install tools
        shell: bash
        run: |
          set -eu

          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx fonts-dejavu-core curl

          curl -fL --retry 3 --max-time 120 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

      - name: Run VeoTV
        shell: bash
        env:
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          TUNNEL_CREDENTIALS: ${{ secrets.TUNNEL_CREDENTIALS }}
          TUNNEL_ID: ${{ vars.TUNNEL_ID }}
          CONTROL_USER: ${{ secrets.CONTROL_USER }}
          CONTROL_PASSWORD: ${{ secrets.CONTROL_PASSWORD }}
        run: |
          set -eu
          umask 077

          for var in \
            PUBLISH_PASSWORD \
            RUNNER_TOKEN \
            TUNNEL_CREDENTIALS \
            TUNNEL_ID \
            CONTROL_USER \
            CONTROL_PASSWORD
          do
            if [ -z "${!var:-}" ]; then
              echo "Thiếu cấu hình: $var"
              exit 1
            fi
          done

          if ! [[ "$PUBLISH_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "PUBLISH_PASSWORD chỉ được gồm chữ và số."
            exit 1
          fi

          if ! [[ "$TUNNEL_ID" =~ ^[a-fA-F0-9-]+$ ]]; then
            echo "TUNNEL_ID không đúng định dạng."
            exit 1
          fi

          if [ "${#CONTROL_PASSWORD}" -lt 16 ]; then
            echo "CONTROL_PASSWORD phải có ít nhất 16 ký tự."
            exit 1
          fi

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "Không lấy được IP Tailscale."
            exit 1
          fi

          ROOT=/tmp/veotv

          mkdir -p \
            "$ROOT/assets" \
            "$ROOT/www/livestream01/720" \
            "$ROOT/www/livestream01/1080"

          cleanup() {
            for pid in \
              "${SUP_PID:-}" \
              "${CF_PID:-}" \
              "${NGINX_PID:-}" \
              "${LOG_PID:-}"
            do
              if [ -n "$pid" ]; then
                kill "$pid" 2>/dev/null || true
              fi
            done

            if [ -n "${SUP_PID:-}" ]; then
              wait "$SUP_PID" 2>/dev/null || true
            fi

            docker rm -f veotv-mediamtx >/dev/null 2>&1 || true
            rm -rf "$ROOT"
          }

          trap cleanup EXIT

          echo ">>> Tải ảnh fallback..."

          if ! curl -fL --retry 2 --max-time 30 \
            "https://i.ibb.co/b5ZC62p5/1-1.png" \
            -o "$ROOT/assets/fallback.png"; then

            echo ">>> Không tải được ảnh fallback; tạo nền tối."

            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi \
              -i "color=c=0x15172b:s=1280x720" \
              -frames:v 1 -threads 1 \
              "$ROOT/assets/fallback.png"
          fi

          echo ">>> Tải logo..."

          if ! curl -fL --retry 2 --max-time 30 \
            "https://i.ibb.co/xtShkTkr/logo.png" \
            -o "$ROOT/assets/logo.png"; then

            echo ">>> Không tải được logo; tạo ảnh trong suốt."

            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi \
              -i "color=c=black@0.0:s=100x100,format=rgba" \
              -frames:v 1 -threads 1 \
              "$ROOT/assets/logo.png"
          fi

          echo ">>> Tải ident..."

          if curl -fL --retry 2 --max-time 120 \
            "https://raw.githubusercontent.com/ankbuitv/link/refs/heads/main/ident.mp4" \
            -o "$ROOT/assets/ident.mp4"; then

            if ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_type \
              -of csv=p=0 \
              "$ROOT/assets/ident.mp4" | grep -q video; then

              echo ">>> Tải ident thành công."
            else
              echo ">>> Ident không hợp lệ; sẽ bỏ qua ident."
              rm -f "$ROOT/assets/ident.mp4"
            fi
          else
            echo ">>> Không tải được ident; sẽ bỏ qua ident."
            rm -f "$ROOT/assets/ident.mp4"
          fi

          printf '%s' "$TUNNEL_CREDENTIALS" > "$ROOT/credentials.json"

          cat > "$ROOT/mediamtx.yml" <<EOF
          authMethod: internal

          authInternalUsers:
            - user: publisher
              pass: "$PUBLISH_PASSWORD"
              permissions:
                - action: publish
                  path: live/channel

            - user: any
              pass:
              permissions:
                - action: read
                  path: live/channel

          paths:
            live/channel:
          EOF

          docker run -d --name veotv-mediamtx \
            -p 127.0.0.1:1935:1935 \
            -p "$TS_IP:1935:1935" \
            -v "$ROOT/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.21.3

          cat > "$ROOT/www/livestream01/manifest.m3u8" <<'EOF'
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=3300000,RESOLUTION=1280x720
          720/index.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=5800000,RESOLUTION=1920x1080
          1080/index.m3u8
          EOF

          cat > "$ROOT/nginx.conf" <<'EOF'
          worker_processes 1;
          error_log /tmp/veotv/nginx-error.log warn;
          pid /tmp/veotv/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              access_log off;

              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }

              server {
                  listen 127.0.0.1:8080;
                  root /tmp/veotv/www;

                  location = /control {
                      return 301 /control/;
                  }

                  location /control/ {
                      proxy_pass http://127.0.0.1:8091;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header Authorization $http_authorization;

                      add_header Cache-Control "no-store" always;
                      add_header X-Content-Type-Options "nosniff" always;
                      add_header X-Frame-Options "DENY" always;
                  }

                  location /livestream01/ {
                      add_header Cache-Control "no-cache" always;
                      add_header Access-Control-Allow-Origin "*" always;
                  }

                  location / {
                      return 404;
                  }
              }
          }
          EOF

          nginx -t -c "$ROOT/nginx.conf"

          nginx -c "$ROOT/nginx.conf" -g 'daemon off;' &
          NGINX_PID=$!

          cat > "$ROOT/cloudflared.yml" <<EOF
          tunnel: $TUNNEL_ID
          credentials-file: /tmp/veotv/credentials.json

          ingress:
            - hostname: ott0.ankworks.bond
              service: http://localhost:8080
            - service: http_status:404
          EOF

          /tmp/cloudflared \
            --config "$ROOT/cloudflared.yml" \
            tunnel run > "$ROOT/cloudflared.log" 2>&1 &
          CF_PID=$!

          echo ""
          echo "========= OBS QUA TAILSCALE ========="
          echo "Server: rtmp://$TS_IP:1935/live"
          echo "Stream key: channel?user=publisher&pass=MAT_KHAU_CUA_BRO"
          echo ""
          echo "========= HLS ========="
          echo "Master: https://ott0.ankworks.bond/livestream01/manifest.m3u8"
          echo "720p:   https://ott0.ankworks.bond/livestream01/720/index.m3u8"
          echo "1080p:  https://ott0.ankworks.bond/livestream01/1080/index.m3u8"
          echo ""
          echo "========= CONTROL ========="
          echo "https://ott0.ankworks.bond/control/"
          echo "==========================="

          docker logs -f veotv-mediamtx &
          LOG_PID=$!

          cat > "$ROOT/supervisor.py" <<'PY'
          import base64
          import collections
          import hashlib
          import hmac
          import json
          import os
          import re
          import secrets
          import signal
          import subprocess
          import threading
          import time
          import urllib.error
          import urllib.request
          import uuid

          from datetime import datetime, timedelta
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          ROOT = Path("/tmp/veotv")
          ASSETS = ROOT / "assets"
          IDENT = ASSETS / "ident.mp4"

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          API_URL = (
              "https://veotv.htxuan-business.workers.dev"
              "/api/runner/config"
          )

          TOKEN = os.environ["RUNNER_TOKEN"]
          CONTROL_USER = os.environ["CONTROL_USER"]
          CONTROL_PASSWORD = os.environ["CONTROL_PASSWORD"]

          OBS_URL = "rtmp://127.0.0.1:1935/live/channel"

          EDM_URL = "https://streams.ankb.qzz.io/mytv/edm.m3u8"

          BACKUP_AUDIO_URL = (
              "https://multi-playlist-zmp3.zmdcdn.me/"
              "-XosZVJX9XA/zhls/playback-realtime/f49e383"
          )

          TZ = ZoneInfo("Asia/Ho_Chi_Minh")

          # Giảm số lượt đọc KV. Nút EPG có thể yêu cầu đọc ngay.
          CONFIG_INTERVAL = 30

          PROBE_INTERVAL = 20
          AUDIO_PROBE_INTERVAL = 90
          MAX_PROBE_FAILURES = 3
          RESTART_DELAY = 5

          stop_event = threading.Event()
          fetch_event = threading.Event()

          lock = threading.RLock()

          logs = collections.deque(maxlen=250)

          csrf_token = secrets.token_urlsafe(32)

          shared = {
              "config": None,
              "config_last_ok": None,
              "config_error": "Chưa đọc Worker",
              "config_fetching": False,

              "selected": None,
              "generation": 0,
              "video_available": False,
              "video_failures": 0,

              "audio_candidates": (),
              "audio_generation": 0,
              "audio_result": None,

              "emergency": False,
              "direct_url": None,

              "restart_seq": 0,
              "ident_seq": 0,

              "current_mode": "Đang khởi động",
              "current_name": "",
              "ffmpeg_running": False,
          }

          process = None
          current_key = None
          current_mode = None
          last_start = 0.0
          last_cleanup = 0.0

          previous_selection = None
          ident_playing = False
          ident_deadline = 0.0

          URL_RE = re.compile(
              r"(?i)\b(?:https?|rtmps?|rtsp)://[^\s'\"<>]+"
          )

          SECRET_VALUES = [
              os.environ.get("RUNNER_TOKEN", ""),
              os.environ.get("PUBLISH_PASSWORD", ""),
              os.environ.get("CONTROL_PASSWORD", ""),
              os.environ.get("TUNNEL_CREDENTIALS", ""),
          ]

          def sanitize(value):
              text = str(value)

              text = URL_RE.sub("[URL đã ẩn]", text)

              for secret in SECRET_VALUES:
                  if secret:
                      text = text.replace(secret, "[SECRET]")

              text = re.sub(
                  r"(?i)(token|password|passwd|authorization|secret)"
                  r"([=: ]+)([^\s,;]+)",
                  r"\1\2[SECRET]",
                  text,
              )

              text = text.replace("\r", " ").replace("\n", " ")

              return text[:1000]

          def log(message):
              safe = sanitize(message)

              stamp = datetime.now(TZ).strftime("%H:%M:%S")
              line = f"[{stamp}] {safe}"

              with lock:
                  logs.append(line)

              print(">>> " + safe, flush=True)

          def ffmpeg_log_reader(pipe):
              try:
                  for line in iter(pipe.readline, ""):
                      if not line:
                          break

                      safe = sanitize(line.strip())

                      if not safe:
                          continue

                      stamp = datetime.now(TZ).strftime("%H:%M:%S")

                      with lock:
                          logs.append(f"[{stamp}] FFmpeg: {safe}")

                      print("FFmpeg: " + safe, flush=True)

              except Exception:
                  pass

              finally:
                  try:
                      pipe.close()
                  except Exception:
                      pass

          def on_signal(signum, frame):
              stop_event.set()
              fetch_event.set()

          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)

          def valid_url(value):
              if not isinstance(value, str):
                  return False

              if len(value) > 4096:
                  return False

              if any(ch in value for ch in ("\r", "\n", "\x00")):
                  return False

              try:
                  parsed = urlsplit(value)

                  return (
                      parsed.scheme.lower() in ("http", "https", "rtmp")
                      and bool(parsed.hostname)
                  )

              except Exception:
                  return False

          def valid_direct_url(value):
              if not valid_url(value):
                  return False

              try:
                  parsed = urlsplit(value)

                  # Link dán trực tiếp chỉ nhận HTTP(S).
                  return parsed.scheme.lower() in ("http", "https")

              except Exception:
                  return False

          def is_mp4(value):
              try:
                  return urlsplit(value).path.lower().endswith(
                      (".mp4", ".m4v", ".mov")
                  )
              except Exception:
                  return False

          def fetch_config():
              request = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "User-Agent": "VeoTV-Control/2.0",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                  },
              )

              with urllib.request.urlopen(request, timeout=10) as response:
                  data = json.load(response)

              if not isinstance(data, dict):
                  raise ValueError("Cấu hình không phải object")

              return data

          def config_loop():
              last_error_log = 0.0

              # Đọc ngay lúc khởi động.
              fetch_event.set()

              while not stop_event.is_set():
                  fetch_event.wait(CONFIG_INTERVAL)
                  fetch_event.clear()

                  if stop_event.is_set():
                      break

                  with lock:
                      shared["config_fetching"] = True

                  try:
                      config = fetch_config()

                      with lock:
                          shared["config"] = config
                          shared["config_last_ok"] = (
                              datetime.now(TZ).isoformat(timespec="seconds")
                          )
                          shared["config_error"] = ""

                  except Exception as exc:
                      error_name = type(exc).__name__

                      if isinstance(exc, urllib.error.HTTPError):
                          error_name += f" HTTP {exc.code}"

                      with lock:
                          shared["config_error"] = error_name

                      now = time.monotonic()

                      if now - last_error_log >= 30:
                          log(
                              "Không đọc được Worker: "
                              + error_name
                              + ". Giữ cấu hình gần nhất."
                          )
                          last_error_log = now

                  finally:
                      with lock:
                          shared["config_fetching"] = False

          def minute_value(value):
              hour, minute = map(int, str(value).split(":"))

              if not 0 <= hour <= 24 or not 0 <= minute < 60:
                  raise ValueError("Giờ không hợp lệ")

              if hour == 24 and minute != 0:
                  raise ValueError("Chỉ cho phép 24:00")

              return hour * 60 + minute

          def resolve_source(config, name):
              if name == "obs":
                  return OBS_URL

              sources = config.get("sources", {})

              if not isinstance(sources, dict):
                  return None

              value = sources.get(name)
              return value if valid_url(value) else None

          def select_program(config):
              if config.get("mode") == "manual":
                  name = str(config.get("manualSource", "obs"))

                  return {
                      "reason": "manual",
                      "name": name,
                      "kind": "source",
                      "url": resolve_source(config, name),
                      "occurrence": None,
                      "waiting": {},
                  }

              now = datetime.now(TZ)
              current = now.hour * 60 + now.minute

              epg = config.get("epg", [])

              if not isinstance(epg, list):
                  epg = []

              for item in epg:
                  try:
                      if not isinstance(item, dict):
                          continue

                      start = minute_value(item["start"])
                      end = minute_value(item["end"])

                      if start < end:
                          active = start <= current < end
                      elif start > end:
                          active = current >= start or current < end
                      else:
                          active = False

                      if not active:
                          continue

                      name = str(item.get("source", "obs"))

                      kind = (
                          "waiting"
                          if item.get("type") == "waiting"
                          else "source"
                      )

                      waiting = item.get("waiting", {})

                      if not isinstance(waiting, dict):
                          waiting = {}

                      if kind == "waiting":
                          value = waiting.get("videoUrl")
                          url = value if valid_url(value) else None
                      else:
                          url = resolve_source(config, name)

                      occurrence_date = now.date()

                      if start > end and current < end:
                          occurrence_date -= timedelta(days=1)

                      occurrence = (
                          occurrence_date.isoformat(),
                          str(item.get("start")),
                          str(item.get("end")),
                          name,
                          kind,
                      )

                      return {
                          "reason": "epg",
                          "name": (
                              str(item.get("title", "Chờ event"))
                              if kind == "waiting"
                              else name
                          ),
                          "kind": kind,
                          "url": url,
                          "occurrence": occurrence,
                          "waiting": waiting,
                      }

                  except (ValueError, KeyError, TypeError):
                      continue

              return {
                  "reason": "default",
                  "name": "obs",
                  "kind": "source",
                  "url": OBS_URL,
                  "occurrence": None,
                  "waiting": {},
              }

          def direct_program(url):
              return {
                  "reason": "direct",
                  "name": "Link trực tiếp",
                  "kind": "source",
                  "url": url,
                  "occurrence": None,
                  "waiting": {},
              }

          def probe(url, stream_type):
              if not valid_url(url):
                  return False

              try:
                  result = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-rw_timeout", "8000000",
                          "-select_streams", stream_type,
                          "-show_entries", "stream=codec_type",
                          "-of", "csv=p=0",
                          url,
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=15,
                  )

                  expected = (
                      "video"
                      if stream_type == "v:0"
                      else "audio"
                  )

                  return (
                      result.returncode == 0
                      and expected in result.stdout
                  )

              except (subprocess.TimeoutExpired, OSError):
                  return False

          def video_probe_loop():
              last_generation = -1
              next_probe = 0.0

              while not stop_event.is_set():
                  with lock:
                      selected = shared["selected"]
                      generation = shared["generation"]

                  if selected is None:
                      stop_event.wait(0.5)
                      continue

                  if generation != last_generation:
                      last_generation = generation
                      next_probe = 0.0

                  now = time.monotonic()

                  if now < next_probe:
                      stop_event.wait(min(0.5, next_probe - now))
                      continue

                  kind, url = selected
                  available = probe(url, "v:0")
                  next_probe = time.monotonic() + PROBE_INTERVAL

                  with lock:
                      if generation != shared["generation"]:
                          continue

                      if available:
                          previous = shared["video_failures"]
                          shared["video_failures"] = 0
                          shared["video_available"] = True
                      else:
                          shared["video_failures"] += 1
                          previous = shared["video_failures"]

                          if previous >= MAX_PROBE_FAILURES:
                              shared["video_available"] = False

                  if available and previous:
                      log(f"Video {kind} kiểm tra lại OK.")
                  elif not available and (
                      previous <= MAX_PROBE_FAILURES
                      or previous % 5 == 0
                  ):
                      log(
                          f"Probe video {kind} lỗi "
                          f"{previous} lần liên tiếp."
                      )

          def audio_probe_loop():
              last_generation = -1
              next_probe = 0.0

              while not stop_event.is_set():
                  with lock:
                      candidates = shared["audio_candidates"]
                      generation = shared["audio_generation"]

                  if generation != last_generation:
                      last_generation = generation
                      next_probe = 0.0

                  now = time.monotonic()

                  if now < next_probe:
                      stop_event.wait(min(0.5, next_probe - now))
                      continue

                  chosen = None

                  for candidate in candidates:
                      if stop_event.is_set():
                          break

                      if probe(candidate, "a:0"):
                          chosen = candidate
                          break

                  with lock:
                      if generation == shared["audio_generation"]:
                          shared["audio_result"] = chosen

                  next_probe = time.monotonic() + AUDIO_PROBE_INTERVAL

                  if candidates:
                      if chosen:
                          log("Audio riêng kiểm tra OK.")
                      else:
                          log("Audio riêng chưa khả dụng; dùng im lặng.")

          def set_audio_candidates(candidates):
              clean = tuple(
                  url for url in candidates
                  if valid_url(url)
              )

              with lock:
                  if clean != shared["audio_candidates"]:
                      shared["audio_candidates"] = clean
                      shared["audio_generation"] += 1
                      shared["audio_result"] = None

          def fallback_audio_candidates(config):
              sources = config.get("sources", {})

              if not isinstance(sources, dict):
                  sources = {}

              return (
                  sources.get("edm", EDM_URL),
                  sources.get("audioBackup", BACKUP_AUDIO_URL),
              )

          def waiting_audio_candidates(program):
              waiting = program["waiting"]

              if waiting.get("audioEnabled") is not True:
                  return ()

              return (waiting.get("audioUrl"),)

          def ident_duration():
              if not IDENT.is_file():
                  return None

              try:
                  result = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-show_entries", "format=duration",
                          "-of", "default=noprint_wrappers=1:nokey=1",
                          str(IDENT),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=10,
                  )

                  duration = float(result.stdout.strip())

                  if result.returncode == 0 and 0 < duration <= 300:
                      return duration

              except (
                  ValueError,
                  OSError,
                  subprocess.TimeoutExpired,
              ):
                  pass

              return None

          def stop_ffmpeg():
              global process

              if process is None:
                  return

              if process.poll() is None:
                  process.terminate()

                  try:
                      process.wait(timeout=6)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()

              process = None

              with lock:
                  shared["ffmpeg_running"] = False

          def signature(value):
              raw = json.dumps(
                  value,
                  sort_keys=True,
                  ensure_ascii=False,
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()

          def build_filters(config, mode, waiting):
              logo_cfg = config.get("logo", {})
              fallback_banner = config.get("banner", {})

              if not isinstance(logo_cfg, dict):
                  logo_cfg = {}

              if not isinstance(fallback_banner, dict):
                  fallback_banner = {}

              try:
                  width = int(logo_cfg.get("width", 75))
              except (ValueError, TypeError):
                  width = 75

              width = max(24, min(width, 400))

              logo_enabled = bool(
                  logo_cfg.get("enabled", True)
              )

              banner_enabled = False
              banner_text = ""

              if mode == "fallback":
                  banner_enabled = bool(
                      fallback_banner.get("enabled", True)
                  )

                  banner_text = str(
                      fallback_banner.get(
                          "text",
                          "VeoTV 1 — Nguồn phát không khả dụng."
                      )
                  )[:300]

              elif mode == "waiting":
                  banner_enabled = bool(
                      waiting.get("bannerEnabled", True)
                  )

                  banner_text = str(
                      waiting.get("bannerText", "")
                  )[:300]

              (ROOT / "banner.txt").write_text(
                  banner_text,
                  encoding="utf-8",
              )

              parts = [
                  "[0:v]fps=30,"
                  "scale=1920:1080:"
                  "force_original_aspect_ratio=decrease,"
                  "pad=1920:1080:(ow-iw)/2:(oh-ih)/2,"
                  "setsar=1[base]"
              ]

              current = "base"

              if logo_enabled and mode != "ident":
                  parts.append(
                      f"[1:v]scale={width}:-1,format=rgba[logo]"
                  )

                  parts.append(
                      f"[{current}][logo]"
                      "overlay=W-w-20:H-h-20:"
                      "shortest=1[withlogo]"
                  )

                  current = "withlogo"

              if banner_enabled and banner_text:
                  parts.append(
                      f"[{current}]"
                      "drawbox=x=0:y=ih-70:w=iw:h=70:"
                      "color=red@0.92:t=fill,"
                      f"drawtext=fontfile={FONT}:"
                      f"textfile={ROOT}/banner.txt:"
                      "expansion=none:"
                      "fontcolor=yellow:fontsize=34:"
                      "x=w-mod(t*150\\,w+text_w):"
                      "y=h-55[bannered]"
                  )

                  current = "bannered"

              parts.append(f"[{current}]split=2[a][b]")
              parts.append(
                  "[a]scale=1280:720,format=yuv420p[v720]"
              )
              parts.append(
                  "[b]format=yuv420p[v1080]"
              )

              return ";".join(parts)

          def output_args(
              label,
              audio_map,
              resolution,
              bitrate,
              run_id,
              duration=None,
          ):
              folder = (
                  ROOT / "www" / "livestream01" / resolution
              )

              args = [
                  "-map", label,
                  "-map", audio_map,
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-b:v", bitrate,
                  "-g", "60",
                  "-keyint_min", "60",
                  "-sc_threshold", "0",
                  "-c:a", "aac",
                  "-b:a", "128k",
              ]

              if duration is not None:
                  args += ["-t", str(duration)]

              args += [
                  "-f", "hls",
                  "-hls_time", "2",
                  "-hls_list_size", "6",

                  # Giữ thêm segment cũ cho player chậm hơn.
                  "-hls_delete_threshold", "12",

                  "-hls_flags",
                  "append_list+delete_segments+temp_file+omit_endlist",

                  "-hls_segment_filename",
                  str(folder / f"{run_id}_%06d.ts"),

                  str(folder / "index.m3u8"),
              ]

              return args

          def start_ffmpeg(
              config,
              mode,
              source_url=None,
              audio_url=None,
              waiting=None,
              duration=None,
          ):
              global process, last_start

              stop_ffmpeg()

              waiting = waiting or {}
              run_id = uuid.uuid4().hex[:10]

              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "warning",
                  "-y",
              ]

              if mode == "fallback":
                  cmd += [
                      "-re",
                      "-loop", "1",
                      "-framerate", "30",
                      "-i", str(ASSETS / "fallback.png"),
                  ]

              elif mode == "ident":
                  cmd += [
                      "-re",
                      "-i", str(IDENT),
                  ]

              elif mode in ("waiting", "main"):
                  if is_mp4(source_url):
                      cmd += [
                          "-re",
                          "-stream_loop", "-1",
                      ]

                  cmd += [
                      "-thread_queue_size", "512",
                      "-rw_timeout", "10000000",
                      "-i", source_url,
                  ]

              cmd += [
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(ASSETS / "logo.png"),
              ]

              if mode in ("fallback", "waiting"):
                  if audio_url:
                      if is_mp4(audio_url):
                          cmd += [
                              "-re",
                              "-stream_loop", "-1",
                          ]

                      cmd += [
                          "-thread_queue_size", "512",
                          "-rw_timeout", "10000000",
                          "-i", audio_url,
                      ]
                  else:
                      cmd += [
                          "-f", "lavfi",
                          "-i", "anullsrc=r=44100:cl=stereo",
                      ]

                  # Chờ event không map tiếng gốc.
                  audio_map = "2:a:0"

              else:
                  audio_map = "0:a:0?"

              cmd += [
                  "-filter_complex",
                  build_filters(config, mode, waiting),
              ]

              cmd += output_args(
                  "[v720]",
                  audio_map,
                  "720",
                  "2800k",
                  run_id,
                  duration,
              )

              cmd += output_args(
                  "[v1080]",
                  audio_map,
                  "1080",
                  "5000k",
                  run_id,
                  duration,
              )

              log("Khởi động FFmpeg: " + mode)

              # Không in command vì URL có thể chứa token.
              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
                  bufsize=1,
              )

              threading.Thread(
                  target=ffmpeg_log_reader,
                  args=(process.stderr,),
                  daemon=True,
              ).start()

              last_start = time.monotonic()

              with lock:
                  shared["ffmpeg_running"] = True
                  shared["current_mode"] = mode

          def cleanup_old_segments():
              now = time.time()

              for resolution in ("720", "1080"):
                  folder = (
                      ROOT / "www" / "livestream01" / resolution
                  )

                  for path in folder.glob("*.ts"):
                      try:
                          if now - path.stat().st_mtime > 300:
                              path.unlink()
                      except OSError:
                          pass

          CONTROL_HTML = r"""<!doctype html>
