          def download_image_asset(url, dest_path, max_bytes=5 * 1024 * 1024):
              if not valid_direct_url(url):
                  return False
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "VeoTV-Control/5.0"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      final_url = resp.geturl()
                      if not valid_direct_url(final_url):
                          return False
                      raw = resp.read(max_bytes + 1)
                  if not raw or len(raw) > max_bytes:
                      return False
                  tmp = dest_path.with_suffix(".tmp")
                  tmp.write_bytes(raw)
                  chk = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-select_streams", "v:0",
                          "-show_entries", "stream=codec_type",
                          "-of", "csv=p=0",
                          str(tmp),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=10,
                  )
                  if chk.returncode != 0 or "video" not in chk.stdout:
                      tmp.unlink(missing_ok=True)
                      return False
                  tmp.replace(dest_path)
                  return True
              except Exception:
                  return False


          def sync_logo(config):
              global cached_logo_url, cached_logo_path, cached_logo_hash
              logo_cfg = config.get("logo", {})
              url = ""
              if isinstance(logo_cfg, dict):
                  url = str(logo_cfg.get("url", "") or "").strip()
              if url != cached_logo_url:
                  cached_logo_url = url
                  custom = ASSETS / "logo_custom.png"
                  if url and download_image_asset(url, custom):
                      cached_logo_path = custom
                      cached_logo_hash = hashlib.sha256(custom.read_bytes()).hexdigest()
                      log("Đã tải logo từ cấu hình Worker.")
                  else:
                      cached_logo_path = ASSETS / "logo.png"
                      cached_logo_hash = (
                          hashlib.sha256(cached_logo_path.read_bytes()).hexdigest()
                          if cached_logo_path.is_file()
                          else ""
                      )
              return cached_logo_path, cached_logo_hash


          def choose_ident():
              global last_ident_path
              available = []
              for name, path, weight in IDENT_OPTIONS:
                  duration = ident_file_duration(path)
                  if duration is not None and weight > 0:
                      available.append((name, path, weight, duration))
              if not available:
                  return None

              pool = available
              if len(available) > 1 and last_ident_path is not None:
                  filtered = [x for x in available if x[1] != last_ident_path]
                  if filtered:
                      pool = filtered

              total = sum(item[2] for item in pool)
              ticket = secrets.randbelow(total)
              for name, path, weight, duration in pool:
                  if ticket < weight:
                      last_ident_path = path
                      log(f"Đã chọn {name}; thời lượng {duration:.1f} giây.")
                      return path, duration
                  ticket -= weight
              return None


          def stop_ffmpeg():
              global process
              if process is None:
                  return
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=6)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
              process = None
              with lock:
                  shared["ffmpeg_running"] = False


          def signature(value):
              raw = json.dumps(
                  value,
                  sort_keys=True,
                  ensure_ascii=False,
              )
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()


          def build_filters(
              config,
              mode,
              waiting,
              subtitle_path=None,
              ad_overlay=None,
              ad_input_idx=None,
              seek_seconds=0.0,
              deinterlace=False,
          ):
              logo_cfg = config.get("logo", {})
              fallback_banner = config.get("banner", {})
              if not isinstance(logo_cfg, dict):
                  logo_cfg = {}
              if not isinstance(fallback_banner, dict):
                  fallback_banner = {}

              try:
                  width = int(logo_cfg.get("width", 75))
              except (ValueError, TypeError):
                  width = 75
              width = max(24, min(width, 400))
              logo_enabled = bool(logo_cfg.get("enabled", True))

              banner_enabled = False
              banner_text = ""
              if mode == "fallback":
                  banner_enabled = bool(fallback_banner.get("enabled", True))
                  banner_text = str(
                      fallback_banner.get(
                          "text",
                          "VeoTV 1 — Nguồn phát không khả dụng.",
                      )
                  )[:300]
              elif mode == "waiting":
                  banner_enabled = bool(waiting.get("bannerEnabled", True))
                  banner_text = str(waiting.get("bannerText", ""))[:300]

              (ROOT / "banner.txt").write_text(banner_text, encoding="utf-8")

              parts = [
                  "[0:v]" + ("yadif=0:-1:1," if deinterlace else "") + "setpts=PTS-STARTPTS,fps=30,"
                  "scale=1920:1080:"
                  "force_original_aspect_ratio=decrease,"
                  "pad=1920:1080:(ow-iw)/2:(oh-ih)/2,"
                  "setsar=1[base]"
              ]
              current = "base"

              if mode == "main" and subtitle_path is not None and subtitle_path.is_file():
                  safe_srt = str(subtitle_path).replace("\\", "/").replace(":", "\\:")
                  sub_chain = f"[{current}]"
                  if seek_seconds and seek_seconds > 1.0:
                      sub_chain += f"setpts=PTS-STARTPTS+{seek_seconds:.2f}/TB,"
                  sub_chain += (
                      f"subtitles={safe_srt}:charenc=UTF-8:"
                      "force_style='FontName=DejaVu Sans,FontSize=15,"
                      "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
                      "BackColour=&H80000000,BorderStyle=1,Outline=1.2,"
                      "Shadow=0.5,MarginV=20'"
                  )
                  if seek_seconds and seek_seconds > 1.0:
                      sub_chain += ",setpts=PTS-STARTPTS"
                  parts.append(sub_chain + "[subbed]")
                  current = "subbed"

              if mode == "main" and ad_overlay and ad_input_idx is not None:
                  try:
                      ad_w = max(60, min(int(ad_overlay.get("width", 140)), 450))
                  except (ValueError, TypeError):
                      ad_w = 140
                  pos = ad_overlay.get("position", "bottom-left")
                  pos_expr = {
                      "top-left": "20:20",
                      "top-right": "W-w-20:20",
                      "bottom-right": "W-w-20:H-h-20",
                      "bottom-left": "20:H-h-20",
                  }.get(pos, "20:H-h-20")
                  parts.append(f"[{ad_input_idx}:v]scale={ad_w}:-1,format=rgba[adwm]")
                  parts.append(
                      f"[{current}][adwm]overlay={pos_expr}:shortest=1[withad]"
                  )
                  current = "withad"

              if logo_enabled and mode != "ident":
                  parts.append(f"[1:v]scale={width}:-1,format=rgba[logo]")
                  parts.append(
                      f"[{current}][logo]"
                      "overlay=W-w-20:H-h-20:"
                      "shortest=1[withlogo]"
                  )
                  current = "withlogo"

              if banner_enabled and banner_text:
                  parts.append(
                      f"[{current}]"
                      "drawbox=x=0:y=ih-70:w=iw:h=70:"
                      "color=red@0.92:t=fill,"
                      f"drawtext=fontfile={FONT}:"
                      f"textfile={ROOT}/banner.txt:"
                      "expansion=none:"
                      "fontcolor=yellow:fontsize=34:"
                      "x=w-mod(t*150\\,w+text_w):"
                      "y=h-55[bannered]"
                  )
                  current = "bannered"

              parts.append(f"[{current}]split=2[a][b]")
              parts.append("[a]scale=1280:720:flags=fast_bilinear,format=yuv420p[v720]")
              parts.append("[b]format=yuv420p[v1080]")
              return ";".join(parts)


