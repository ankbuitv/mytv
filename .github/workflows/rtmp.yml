name: VeoTV control test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Read dashboard config
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        shell: bash
        run: |
          set -eu

          if [ -z "$RUNNER_TOKEN" ]; then
            echo "Thiếu GitHub Secret RUNNER_TOKEN."
            exit 1
          fi

          cat > /tmp/veotv-control.py <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          API_URL = (
              "https://veotv.htxuan-business.workers.dev"
              "/api/runner/config"
          )
          TOKEN = os.environ["RUNNER_TOKEN"]
          TZ = ZoneInfo("Asia/Ho_Chi_Minh")

          def minutes(value):
              """Chuyển HH:MM thành số phút; cho phép 24:00."""
              hour, minute = map(int, value.split(":"))
              if not (0 <= hour <= 24 and 0 <= minute < 60):
                  raise ValueError("Giờ không hợp lệ")
              if hour == 24 and minute != 0:
                  raise ValueError("Chỉ chấp nhận 24:00")
              return hour * 60 + minute

          def get_config():
              request = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.load(response)

          def select_source(config):
              if config.get("mode") == "manual":
                  return (
                      config.get("manualSource", "obs"),
                      "manual",
                      None,
                  )

              now = datetime.now(TZ)
              current = now.hour * 60 + now.minute

              for item in config.get("epg", []):
                  start = minutes(item["start"])
                  end = minutes(item["end"])

                  # Hỗ trợ khung giờ thường và khung qua nửa đêm.
                  active = (
                      start <= current < end
                      if start < end
                      else current >= start or current < end
                      if start > end
                      else False
                  )

                  if active:
                      return (
                          item.get("source", "obs"),
                          "epg",
                          item.get("title", ""),
                      )

              return ("obs", "default", None)

          previous = None
          print(">>> Đang đọc dashboard mỗi 10 giây...", flush=True)

          while True:
              try:
                  config = get_config()
                  source, reason, title = select_source(config)

                  # Không in URL nguồn hoặc token vào log.
                  state = (
                      source,
                      reason,
                      title,
                      bool(config.get("logo", {}).get("enabled")),
                      bool(config.get("banner", {}).get("enabled")),
                  )

                  if state != previous:
                      print(
                          ">>> Nguồn chọn:", source,
                          "| Chế độ:", reason,
                          "| Chương trình:", title or "-",
                          "| Logo:", "bật" if state[3] else "tắt",
                          "| Banner:", "bật" if state[4] else "tắt",
                          flush=True,
                      )
                      previous = state

              except urllib.error.HTTPError as exc:
                  print(
                      f">>> Worker trả HTTP {exc.code}. "
                      "Kiểm tra RUNNER_TOKEN và endpoint.",
                      flush=True,
                  )
              except Exception as exc:
                  print(
                      f">>> Không đọc được cấu hình: {type(exc).__name__}",
                      flush=True,
                  )

              time.sleep(10)
          PY

          python3 -u /tmp/veotv-control.py
