name: VeoTV dashboard connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Read dashboard settings
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        shell: bash
        run: |
          set -eu

          if [ -z "$RUNNER_TOKEN" ]; then
            echo "Thiếu GitHub secret RUNNER_TOKEN."
            exit 1
          fi

          cat > /tmp/veotv-test.py <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          URL = "https://veotv.htxuan-business.workers.dev/api/runner/config"
          TOKEN = os.environ["RUNNER_TOKEN"]

          def get_config():
              request = urllib.request.Request(
                  URL,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "User-Agent": "VeoTV-Control-Test/1.0",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                  },
              )

              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          print(">>> Đang kết nối Worker...", flush=True)

          try:
              config = get_config()
          except urllib.error.HTTPError as exc:
              print(f">>> Worker trả HTTP {exc.code}", flush=True)
              print(f">>> Server: {exc.headers.get('Server', '-')}", flush=True)
              print(f">>> CF-Ray: {exc.headers.get('CF-Ray', '-')}", flush=True)

              if exc.code == 401:
                  print(
                      ">>> Kiểm tra RUNNER_TOKEN ở GitHub và Worker.",
                      flush=True,
                  )
              elif exc.code == 403:
                  print(
                      ">>> Request có thể bị Cloudflare hoặc rule từ chối. "
                      "Kiểm tra Security Events bằng CF-Ray.",
                      flush=True,
                  )
              else:
                  print(">>> Kiểm tra Worker và KV binding.", flush=True)

              raise SystemExit(1)
          except Exception as exc:
              print(
                  f">>> Không kết nối được: {type(exc).__name__}: {exc}",
                  flush=True,
              )
              raise SystemExit(1)

          print(">>> KẾT NỐI THÀNH CÔNG!", flush=True)
          print(">>> Theo dõi cấu hình mỗi 10 giây.", flush=True)

          previous = None

          while True:
              try:
                  config = get_config()

                  # Chỉ in trạng thái cần test, không in token hay URL nguồn.
                  state = (
                      config.get("mode", "auto"),
                      config.get("manualSource", "obs"),
                      config.get("logo", {}).get("enabled", False),
                      config.get("banner", {}).get("enabled", False),
                  )

                  if state != previous:
                      mode, source, logo, banner = state
                      print(
                          f">>> mode={mode} | manualSource={source} "
                          f"| logo={logo} | banner={banner}",
                          flush=True,
                      )
                      previous = state

              except urllib.error.HTTPError as exc:
                  print(
                      f">>> Lần đọc này bị HTTP {exc.code}; sẽ thử lại.",
                      flush=True,
                  )
              except Exception as exc:
                  print(
                      f">>> Lỗi đọc cấu hình: {type(exc).__name__}; "
                      "sẽ thử lại.",
                      flush=True,
                  )

              time.sleep(10)
          PY

          python3 -u /tmp/veotv-test.py
