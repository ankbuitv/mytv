          <script>
          const csrf = "__CSRF__";

          function showMessage(text) {
            document.getElementById("message").textContent = text;
          }

          async function sendAction(action, extra = {}) {
            try {
              const response = await fetch("/control/api/action", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRF-Token": csrf
                },
                body: JSON.stringify({action, ...extra}),
                cache: "no-store"
              });
              const data = await response.json();
              if (!response.ok) {
                throw new Error(data.error || ("HTTP " + response.status));
              }
              showMessage(data.message || "Đã gửi lệnh.");
              await refreshStatus();
            } catch (error) {
              showMessage("Lỗi: " + error.message);
            }
          }

          function emergencyOn() {
            if (confirm("Bật khẩn và chuyển sang fallback?")) {
              sendAction("emergency_on");
            }
          }

          function addAudioTrackRow() {
            const box = document.getElementById("audioTracksBox");
            const row = document.createElement("div");
            row.className = "row";
            row.style.marginBottom = "8px";
            row.innerHTML =
              '<input type="text" class="tr-lang" placeholder="Mã (vd: vi, en)" style="width:110px">' +
              '<input type="text" class="tr-label" placeholder="Tên (vd: Tiếng Việt)" style="width:150px">' +
              '<input type="text" class="tr-url" placeholder="https://.../audio.m3u8" style="flex:1;min-width:180px">' +
              '<input type="text" class="tr-offset" value="0" placeholder="Trễ (s)" style="width:75px">' +
              '<label style="margin:0;display:flex;align-items:center;gap:4px"><input type="checkbox" class="tr-def"> Mặc định</label>' +
              '<button type="button" class="red" onclick="this.parentElement.remove()">Xóa</button>';
            box.appendChild(row);
          }

          function collectAudioTracks() {
            const rows = document.querySelectorAll("#audioTracksBox > .row");
            const out = [];
            rows.forEach(r => {
              const url = r.querySelector(".tr-url").value.trim();
              if (!url) return;
              const lang = r.querySelector(".tr-lang").value.trim() || "und";
              const label = r.querySelector(".tr-label").value.trim() || lang;
              const offset = Number(r.querySelector(".tr-offset").value.trim() || 0);
              out.push({
                lang,
                label,
                url,
                offset: Number.isFinite(offset) ? offset : 0,
                default: r.querySelector(".tr-def").checked
              });
            });
            return out;
          }

          function syncAdVideoChecks(items) {
            const box = document.getElementById("adVideoChecks");
            if (!box) return;
            const key = JSON.stringify(items || []);
            if (box.dataset.key === key) return;
            const checked = new Set(
              Array.from(box.querySelectorAll("input:checked")).map(i => i.value)
            );
            box.dataset.key = key;
            box.innerHTML = "";
            if (!items || !items.length) {
              box.innerHTML = "<span class='small'>Chưa có file video nào trong ads/.</span>";
              return;
            }
            items.forEach(name => {
              const lbl = document.createElement("label");
              lbl.style.margin = "4px 0";
              const cb = document.createElement("input");
              cb.type = "checkbox";
              cb.value = "repo:" + name;
              if (checked.has(cb.value)) cb.checked = true;
              lbl.append(cb, " " + name);
              box.appendChild(lbl);
            });
          }

          function playAdBreak() {
            const checked = Array.from(
              document.querySelectorAll("#adVideoChecks input:checked")
            ).map(i => i.value);
            const lines = document.getElementById("adVideoUrls").value
              .split(/\r?\n/)
              .map(s => s.trim())
              .filter(Boolean);
            const sources = checked.concat(lines);
            if (!sources.length) {
              showMessage("Hãy tick ít nhất 1 video trong ads/ hoặc dán URL QC.");
              return;
            }
            sendAction("ad_break", {
              sources,
              with_ident: document.getElementById("adWithIdent").checked
            });
          }

          function applyAdOverlay(enabled) {
            if (!enabled) {
              sendAction("ad_overlay", { enabled: false });
              return;
            }
            const sel = document.getElementById("adImgSelect").value;
            const url = document.getElementById("adImgUrl").value.trim();
            const source = url || sel;
            if (!source) {
              showMessage("Hãy chọn ảnh trong ads/ hoặc dán URL ảnh QC.");
              return;
            }
            const width = Number(document.getElementById("adWidth").value.trim() || 140);
            sendAction("ad_overlay", {
              enabled: true,
              source,
              position: document.getElementById("adPosition").value,
              width: Number.isFinite(width) ? width : 140
            });
          }

          function syncSelectOptions(selectId, items, prefix) {
            const sel = document.getElementById(selectId);
            if (!sel) return;
            const prev = sel.value;
            const key = JSON.stringify(items || []);
            if (sel.dataset.key === key) return;
            sel.dataset.key = key;
            while (sel.options.length > 1) sel.remove(1);
            (items || []).forEach(name => {
              const opt = document.createElement("option");
              opt.value = prefix + name;
              opt.textContent = name;
              sel.appendChild(opt);
            });
            sel.value = prev;
          }

          function playDirect() {
            const url = document.getElementById("url").value.trim();
            const clearkey = document.getElementById("clearkey").value.trim();
            const subtitle_url = document.getElementById("subtitleUrl").value.trim();
            const subtitle_offset = Number(document.getElementById("subtitleOffset").value.trim() || 0);
            if (!url) {
              showMessage("Bro hãy dán link trước.");
              return;
            }
            sendAction("direct", {
              url,
              clearkey,
              subtitle_url,
              subtitle_offset: Number.isFinite(subtitle_offset) ? subtitle_offset : 0,
              audio_tracks: collectAudioTracks(),
              input_type: document.getElementById("inputType").value,
              ident: document.getElementById("withIdent").checked
            });
          }

          async function refreshStatus() {
            try {
              const response = await fetch("/control/api/status", {
                cache: "no-store"
              });
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              const data = await response.json();
              document.getElementById("status").textContent =
                "Khẩn cấp: " + (data.emergency ? "ĐANG BẬT" : "Tắt") + "\n" +
                "Điều khiển: " + data.control_mode + "\n" +
                "Đang phát: " + data.current_mode + "\n" +
                "Nguồn: " + data.current_name + "\n" +
                "FFmpeg: " + (data.ffmpeg_running ? "Đang chạy" : "Không chạy") + "\n" +
                "Tốc độ FFmpeg: " + (data.ffmpeg_speed || "Chưa có") + "\n" +
                "Thời gian đầu ra: " + (data.ffmpeg_out_time || "Chưa có") + "\n" +
                "Worker đọc thành công gần nhất: " + (data.config_last_ok || "Chưa có") + "\n" +
                "Worker: " + (data.config_fetching
                  ? "Đang đọc..."
                  : (data.config_error || "OK"));
              document.getElementById("logs").textContent = data.logs.join("\n");
              syncAdVideoChecks(data.ads_videos);
              syncSelectOptions("adImgSelect", data.ads_images, "repo:");
            } catch (error) {
              showMessage("Không tải được trạng thái: " + error.message);
            }
          }

          refreshStatus();
          setInterval(refreshStatus, 3000);
          </script>
          </body>
          </html>
          """


          class ControlHandler(BaseHTTPRequestHandler):
              server_version = "VeoTVControl"

              def log_message(self, format, *args):
                  return

              def client_ip(self):
                  xff = self.headers.get("X-Forwarded-For", "")
                  if xff:
                      return xff.split(",", 1)[0].strip()
                  return self.client_address[0]

              def is_rate_limited(self, ip):
                  now = time.monotonic()
                  with lock:
                      recent = [
                          t for t in auth_failures.get(ip, [])
                          if now - t < AUTH_WINDOW_SEC
                      ]
                      if recent:
                          auth_failures[ip] = recent
                      else:
                          auth_failures.pop(ip, None)
                      return len(recent) >= AUTH_MAX_FAILS

              def record_auth_failure(self, ip):
                  now = time.monotonic()
                  with lock:
                      recent = [
                          t for t in auth_failures.get(ip, [])
                          if now - t < AUTH_WINDOW_SEC
                      ]
                      recent.append(now)
                      auth_failures[ip] = recent

              def clear_auth_failures(self, ip):
                  with lock:
                      auth_failures.pop(ip, None)

              def authenticated(self):
                  header = self.headers.get("Authorization", "")
                  if not header.startswith("Basic "):
                      return False
                  try:
                      raw = base64.b64decode(
                          header[6:],
                          validate=True,
                      ).decode("utf-8")
                      user, password = raw.split(":", 1)
                      return (
                          hmac.compare_digest(
                              user.encode("utf-8"),
                              CONTROL_USER.encode("utf-8"),
                          )
                          and hmac.compare_digest(
                              password.encode("utf-8"),
                              CONTROL_PASSWORD.encode("utf-8"),
                          )
                      )
                  except Exception:
                      return False

              def send_bytes(self, code, body, content_type):
                  self.send_response(code)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header("Referrer-Policy", "no-referrer")
                  self.send_header(
                      "Content-Security-Policy",
                      "default-src 'self'; script-src 'unsafe-inline'; "
                      "style-src 'unsafe-inline'; connect-src 'self'; "
                      "frame-ancestors 'none'; base-uri 'none'",
                  )
                  self.end_headers()
                  self.wfile.write(body)

              def send_json(self, code, value):
                  body = json.dumps(value, ensure_ascii=False).encode("utf-8")
                  self.send_bytes(code, body, "application/json; charset=utf-8")

              def require_auth(self):
                  ip = self.client_ip()
                  if self.is_rate_limited(ip):
                      body = b"Too many failed attempts"
                      self.send_response(429)
                      self.send_header("Retry-After", str(AUTH_WINDOW_SEC))
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return False
                  if self.authenticated():
                      self.clear_auth_failures(ip)
                      return True
                  self.record_auth_failure(ip)
                  body = b"Authentication required"
                  self.send_response(401)
                  self.send_header(
                      "WWW-Authenticate",
                      'Basic realm="VeoTV Control", charset="UTF-8"',
                  )
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)
                  return False

              def do_GET(self):
                  if not self.require_auth():
                      return
                  path = urlsplit(self.path).path
                  if path == "/control/":
                      html = CONTROL_HTML.replace("__CSRF__", csrf_token)
                      self.send_bytes(
                          200,
                          html.encode("utf-8"),
                          "text/html; charset=utf-8",
                      )
                      return
                  if path == "/control/api/status":
                      with lock:
                          control_mode = (
                              "Link trực tiếp (" + shared["direct_type"] + ")"
                              if shared["direct_url"]
                              else "Worker"
                          )
                          data = {
                              "emergency": shared["emergency"],
                              "control_mode": control_mode,
                              "current_mode": shared["current_mode"],
                              "current_name": shared["current_name"],
                              "ffmpeg_running": shared["ffmpeg_running"],
                              "ffmpeg_speed": shared["ffmpeg_speed"],
                              "ffmpeg_out_time": shared["ffmpeg_out_time"],
                              "config_last_ok": shared["config_last_ok"],
                              "config_error": shared["config_error"],
                              "config_fetching": shared["config_fetching"],
                              "ads_videos": list_ad_videos(),
                              "ads_images": list_ad_images(),
                              "logs": list(logs),
                          }
                      self.send_json(200, data)
                      return
                  self.send_json(404, {"error": "Không tìm thấy."})

              def do_POST(self):
                  if not self.require_auth():
                      return
                  path = urlsplit(self.path).path
                  if path != "/control/api/action":
                      self.send_json(404, {"error": "Không tìm thấy."})
                      return

                  origin = self.headers.get("Origin")
                  fetch_site = self.headers.get("Sec-Fetch-Site", "")
                  if origin:
                      if origin != "https://ott0.ankworks.bond":
                          self.send_json(403, {"error": "Origin không hợp lệ."})
                          return
                  elif fetch_site != "same-origin":
                      self.send_json(403, {"error": "Thiếu Origin hợp lệ."})
                      return

                  if fetch_site and fetch_site not in ("same-origin", "none"):
                      self.send_json(403, {"error": "Yêu cầu khác nguồn."})
                      return

                  supplied_csrf = self.headers.get("X-CSRF-Token", "")
                  try:
                      csrf_ok = hmac.compare_digest(
                          supplied_csrf.encode("utf-8"),
                          csrf_token.encode("utf-8"),
                      )
                  except Exception:
                      csrf_ok = False
                  if not csrf_ok:
                      self.send_json(403, {"error": "CSRF không hợp lệ."})
                      return

                  content_type = (
                      self.headers.get("Content-Type", "")
                      .split(";", 1)[0]
                      .strip()
                      .lower()
                  )
                  if content_type != "application/json":
                      self.send_json(415, {"error": "Cần JSON."})
                      return

                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      if length <= 0 or length > 8192:
                          raise ValueError("Kích thước không hợp lệ")
                      body = self.rfile.read(length)
                      data = json.loads(body)
                      if not isinstance(data, dict):
                          raise ValueError("JSON không hợp lệ")
                  except Exception:
                      self.send_json(400, {"error": "Dữ liệu không hợp lệ."})
                      return

                  action = data.get("action")
                  if action == "refresh":
                      fetch_event.set()
                      log("Control: yêu cầu đọc lại Worker.")
                      self.send_json(200, {"message": "Đã yêu cầu đọc lại Worker."})
                      return

                  if action == "restart":
                      with lock:
                          shared["restart_seq"] += 1
                      log("Control: yêu cầu restart nguồn.")
                      self.send_json(200, {"message": "Đã yêu cầu restart nguồn."})
                      return

                  if action == "ident":
                      with lock:
                          if shared["emergency"]:
                              self.send_json(
                                  409,
                                  {"error": "Đang khẩn cấp; không phát ident."},
                              )
                              return
                          shared["ident_seq"] += 1
                      log("Control: yêu cầu phát ident.")
                      self.send_json(200, {"message": "Đã yêu cầu phát ident."})
                      return

                  if action == "emergency_on":
                      with lock:
                          shared["emergency"] = True
                      log("Control: BẬT khẩn cấp.")
                      self.send_json(200, {"message": "Đã bật khẩn cấp."})
                      return

                  if action == "emergency_off":
                      with lock:
                          shared["emergency"] = False
                      fetch_event.set()
                      log("Control: TẮT khẩn cấp.")
                      self.send_json(
                          200,
                          {"message": "Đã tắt khẩn cấp; đang quay lại chế độ trước."},
                      )
                      return

                  if action == "direct":
                      url = str(data.get("url", "")).strip()
                      raw_ck = str(data.get("clearkey", "")).strip()
                      clearkey = parse_clearkey_hex(raw_ck)
                      if raw_ck and not clearkey:
                          self.send_json(
                              400,
                              {"error": "ClearKey không hợp lệ (cần KID:KEY hoặc KEY 32 ký tự hex)."},
                          )
                          return
                      subtitle_url = str(data.get("subtitle_url", "")).strip()
                      try:
                          subtitle_offset = float(data.get("subtitle_offset", 0) or 0)
                      except (ValueError, TypeError):
                          subtitle_offset = 0.0
                      subtitle_offset = max(-3600.0, min(3600.0, subtitle_offset))
                      input_type = data.get("input_type", "live")
                      if not valid_direct_url(url):
                          self.send_json(
                              400,
                              {"error": "Link HTTP/HTTPS không hợp lệ hoặc bị chặn."},
                          )
                          return
                      if subtitle_url and not valid_direct_url(subtitle_url):
                          self.send_json(
                              400,
                              {"error": "Link phụ đề .srt không hợp lệ."},
                          )
                          return
                      if input_type not in ("live", "vod"):
                          self.send_json(400, {"error": "Loại nguồn không hợp lệ."})
                          return
                      with lock:
                          if shared["emergency"]:
                              self.send_json(409, {"error": "Hãy tắt khẩn cấp trước."})
                              return
                          shared["direct_url"] = url
                          shared["direct_type"] = input_type
                          shared["direct_subtitle_url"] = subtitle_url
                          shared["direct_subtitle_offset"] = subtitle_offset
                          shared["direct_audio_tracks"] = sanitize_audio_tracks(data.get("audio_tracks", []))
                          shared["direct_clearkey"] = clearkey
                          if data.get("ident") is True:
                              shared["ident_seq"] += 1
                      log("Control: chọn link trực tiếp, loại " + input_type + ".")
                      self.send_json(200, {"message": "Đã chọn link trực tiếp."})
                      return

                  if action == "ad_break":
                      raw_sources = data.get("sources")
                      if not isinstance(raw_sources, list):
                          single = str(data.get("source", "")).strip()
                          raw_sources = [single] if single else []
                      cleaned = []
                      for item in raw_sources[:20]:
                          s = str(item or "").strip()
                          if not s:
                              continue
                          if s.startswith("repo:"):
                              fname = os.path.basename(s[5:])
                              if not (ROOT / "ads" / "videos" / fname).is_file():
                                  self.send_json(404, {"error": f"Không thấy file trong ads/: {fname}"})
                                  return
                              cleaned.append("repo:" + fname)
                          elif valid_direct_url(s):
                              cleaned.append(s)
                          else:
                              self.send_json(400, {"error": "Có URL quảng cáo không hợp lệ."})
                              return
                      if not cleaned:
                          self.send_json(400, {"error": "Thiếu nguồn quảng cáo."})
                          return
                      with lock:
                          if shared["emergency"]:
                              self.send_json(409, {"error": "Đang khẩn cấp; không phát quảng cáo."})
                              return
                          shared["ad_break_queue"].extend(cleaned)
                          shared["ad_break_with_ident"] = bool(data.get("with_ident", True))
                          shared["ad_break_seq"] += 1
                          total_q = len(shared["ad_break_queue"])
                      log(f"Control: xếp hàng {len(cleaned)} video quảng cáo (tổng hàng đợi: {total_q}).")
                      self.send_json(200, {"message": f"Đã thêm {len(cleaned)} video quảng cáo vào hàng đợi."})
                      return

                  if action == "ad_stop":
                      with lock:
                          shared["ad_break_queue"].clear()
                          shared["ad_break_stop_seq"] += 1
                      log("Control: yêu cầu THOÁT quảng cáo ngay.")
                      self.send_json(200, {"message": "Đang thoát quảng cáo để quay lại luồng chính."})
                      return

                  if action == "ad_overlay":
                      enabled = bool(data.get("enabled", False))
                      if not enabled:
                          with lock:
                              shared["ad_overlay_override"] = {"enabled": False}
                          log("Control: TẮT watermark quảng cáo.")
                          self.send_json(200, {"message": "Đã tắt watermark quảng cáo."})
                          return
                      source = str(data.get("source", "")).strip()
                      pos = str(data.get("position", "bottom-left"))
                      if pos not in ("bottom-left", "top-left", "top-right", "bottom-right"):
                          pos = "bottom-left"
                      try:
                          width = max(60, min(int(data.get("width", 140)), 450))
                      except (ValueError, TypeError):
                          width = 140
                      if source.startswith("repo:"):
                          fname = os.path.basename(source[5:])
                          if not (ROOT / "ads" / "images" / fname).is_file():
                              self.send_json(404, {"error": "Không thấy ảnh trong ads/."})
                              return
                      elif not valid_direct_url(source):
                          self.send_json(400, {"error": "URL ảnh watermark không hợp lệ."})
                          return
                      with lock:
                          shared["ad_overlay_override"] = {
                              "enabled": True,
                              "source": source,
                              "position": pos,
                              "width": width,
                          }
                      log("Control: BẬT watermark quảng cáo.")
                      self.send_json(200, {"message": "Đã bật watermark quảng cáo."})
                      return

                  if action == "worker":
                      with lock:
                          shared["direct_url"] = None
                          shared["direct_type"] = "live"
                          shared["direct_subtitle_url"] = ""
                          shared["direct_subtitle_offset"] = 0.0
                          shared["direct_audio_tracks"] = []
                          shared["direct_clearkey"] = ""
                      fetch_event.set()
                      log("Control: quay về Worker.")
                      self.send_json(200, {"message": "Đã chọn lịch Worker."})
                      return

                  self.send_json(400, {"error": "Lệnh không hợp lệ."})


          class ControlServer(ThreadingHTTPServer):
              daemon_threads = True


          # ======================================================================
          # VeoTV Playout Monitor: trạng thái, ảnh chụp, VU, lệnh, lịch sử (v6)
          # ======================================================================
          ERR_PATTERNS = [
              (r"Last message repeated", "__repeat__"),
              (r"PES packet size mismatch", "PES lệch kích thước"),
              (r"Packet corrupt|corrupt (?:input )?packet", "Gói dữ liệu lỗi"),
              (r"aac @|/aac @|aist#|Number of bands|channel element|Reserved bit|Prediction is not allowed|invalid band type|[Ss]calefactor|ms_present|decode_pce|SBR was found", "Lỗi audio AAC"),
              (r"corrupt decoded frame", "Khung hình hỏng"),
              (r"reference picture missing|Missing reference picture|Reference \d+ >=", "Thiếu khung tham chiếu H.264"),
              (r"mmco|number of reference frames", "Lỗi mmco H.264"),
              (r"[Nn]on[- ]monoton", "DTS không đơn điệu"),
              (r"[Ee]rror while decoding|decode_slice_header|concealing|cabac|co located POCs|left block unavailable|h264 @", "Lỗi giải mã H.264"),
              (r"timed? ?out|Connection (?:refused|reset)|Network is unreachable", "Mất kết nối / timeout"),
              (r"HTTP error (?:4|5)\d\d|Server returned (?:4|5)\d\d", "Lỗi HTTP từ nguồn"),
              (r"Error opening input|Failed to open", "Không mở được nguồn"),
              (r"Invalid data found", "Dữ liệu không hợp lệ"),
              (r"buffer (?:overflow|full)|queue (?:full|overflow)|[Tt]hread message queue|Too many packets buffered", "Tràn bộ đệm"),
          ]
          ERR_COMPILED = [(re.compile(p), name) for p, name in ERR_PATTERNS]
          REPEAT_RE = re.compile(r"Last message repeated (\d+) times?")
          last_err_cat = [None]


          def classify_error(text):
              for rx, name in ERR_COMPILED:
                  if rx.search(text):
                      return name
              return "Khác"


          def record_ffmpeg_issue(safe, stamp):
              cat = classify_error(safe)
              with lock:
                  if cat == "__repeat__":
                      m = REPEAT_RE.search(safe)
                      n = int(m.group(1)) if m else 1
                      prev = last_err_cat[0]
                      if prev:
                          err_counts[prev] += n
                          if err_lines and err_lines[-1]["cat"] == prev:
                              err_lines[-1]["n"] += n
                      return
                  last_err_cat[0] = cat
                  msg = safe[:160]
                  err_counts[cat] += 1
                  if err_lines and err_lines[-1]["cat"] == cat and err_lines[-1]["msg"] == msg:
                      err_lines[-1]["n"] += 1
                      err_lines[-1]["t"] = stamp
                  else:
                      err_lines.append({"t": stamp, "cat": cat, "msg": msg, "n": 1})


          def worker_base():
              return API_URL.rsplit("/api/runner/config", 1)[0]


          def worker_request(path, payload=None, method="GET", timeout=8):
              data = None
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(
                  worker_base() + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "User-Agent": "VeoTV-Control/6.0",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  raw = response.read(2_000_000)
              return json.loads(raw) if raw else {}


          def note_program_event(program):
              """Ghi lịch sử phát khi chương trình / chế độ đổi (gửi lên Worker sau)."""
              global last_event_key
              if program.get("reason") == "no_config":
                  return
              with lock:
                  key = (
                      program.get("name"),
                      program.get("kind"),
                      program.get("occurrence"),
                      shared.get("on_backup"),
                      shared.get("stopped"),
                      shared.get("emergency"),
                  )
                  if key == last_event_key:
                      return
                  last_event_key = key
                  state = "stopped" if shared.get("stopped") else (
                      "emergency" if shared.get("emergency") else (
                          "backup" if shared.get("on_backup") else "live"
                      )
                  )
                  events_q.append({
                      "ts": datetime.now(TZ).isoformat(timespec="seconds"),
                      "title": sanitize(program.get("title") or program.get("name") or ""),
                      "source": sanitize(program.get("name") or ""),
                      "kind": program.get("kind") or "source",
                      "reason": program.get("reason") or "",
                      "state": state,
                  })


          def event_loop():
              last_err = 0.0
              while not stop_event.wait(15):
                  with lock:
                      batch = list(events_q)
                      events_q.clear()
                  if not batch:
                      continue
                  try:
                      worker_request("/api/runner/history", {"events": batch}, "POST")
                  except Exception as exc:
                      with lock:
                          for item in reversed(batch):
                              events_q.appendleft(item)
                      if time.monotonic() - last_err > 60:
                          log("Không gửi được lịch sử lên Worker: " + type(exc).__name__)
                          last_err = time.monotonic()


          def next_info(config):
              nxt = (config or {}).get("nextEpg") if isinstance(config, dict) else None
              if not isinstance(nxt, dict):
                  return None
              return {
                  "title": sanitize(nxt.get("title", "")),
                  "start": str(nxt.get("start", "")),
                  "end": str(nxt.get("end", "")),
                  "kind": "waiting" if nxt.get("type") == "waiting" else "source",
              }


          def build_status():
              now = time.time()
              with lock:
                  config = shared["config"]
                  ok_ts = shared["config_last_ok"]
                  status = {
                      "v": 6,
                      "ts": round(now, 2),
                      "uptime": int(now - START_TS),
                      "title": shared.get("current_title") or shared.get("current_name") or "",
                      "source": shared.get("current_name") or "",
                      "kind": shared.get("current_kind") or "",
                      "reason": shared.get("current_reason") or "",
                      "window": list(shared.get("current_window") or ["", ""]),
                      "mode": current_mode or "",
                      "backup": bool(shared.get("on_backup")),
                      "stopped": bool(shared.get("stopped")),
                      "emergency": bool(shared.get("emergency")),
                      "ffmpeg": bool(shared.get("ffmpeg_running")),
                      "speed": shared.get("ffmpeg_speed") or "",
                      "out_time": shared.get("ffmpeg_out_time") or "",
                      "config_error": shared.get("config_error") or "",
                      "errors": list(err_lines),
                      "err_counts": dict(err_counts),
                      "err_total": int(sum(err_counts.values())),
                  }
                  vu = dict(vu_state)
              status["next"] = next_info(config)
              status["vu"] = {
                  "l": vu["l"], "r": vu["r"], "pl": vu["pl"], "pr": vu["pr"],
                  "age": round(now - vu["ts"], 1) if vu["ts"] else None,
              }
              status["snap_ts"] = snap_state["ts"] or None
              try:
                  pl = STATUS_DIR / "720" / "index.m3u8"
                  status["playlist_age"] = round(now - pl.stat().st_mtime, 1)
              except OSError:
                  status["playlist_age"] = None
              status["config_age"] = None
              if ok_ts:
                  try:
                      status["config_age"] = round(
                          now - datetime.fromisoformat(ok_ts).timestamp(), 1
                      )
                  except Exception:
                      pass
              return status


          def write_status_file():
              STATUS_DIR.mkdir(parents=True, exist_ok=True)
              tmp = STATUS_DIR / "status.json.tmp"
              tmp.write_text(
                  json.dumps(build_status(), ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              os.replace(tmp, STATUS_DIR / "status.json")


          def status_loop():
              while not stop_event.wait(1.0):
                  try:
                      write_status_file()
                  except Exception:
                      pass


          def snapshot_once():
              seg_dir = STATUS_DIR / "720"
              segs = []
              for path in seg_dir.glob("*.ts"):
                  try:
                      segs.append((path.stat().st_mtime, path))
                  except OSError:
                      pass
              if len(segs) < 2:
                  return False
              segs.sort()
              mtime, seg = segs[-2]
              if time.time() - segs[-1][0] > 20:
                  return False
              tmp = STATUS_DIR / "preview.tmp.jpg"
              result = subprocess.run(
                  [
                      "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", str(seg), "-frames:v", "1",
                      "-vf", "scale=480:-2", "-q:v", "6", str(tmp),
                  ],
                  capture_output=True,
                  timeout=20,
              )
              if result.returncode == 0 and tmp.exists() and tmp.stat().st_size > 0:
                  os.replace(tmp, STATUS_DIR / "preview.jpg")
                  snap_state["ts"] = round(time.time(), 1)
                  return True
              return False


          def snapshot_loop():
              while not stop_event.wait(10):
                  try:
                      snapshot_once()
                  except Exception:
                      pass


          VU_RX = re.compile(
              r"lavfi\.astats\.(1|2)\.(RMS_level|Peak_level)=(\S+)"
          )


          def vu_value(text):
              try:
                  value = float(text)
              except ValueError:
                  return -90.0
              if value != value or value < -90.0:
                  return -90.0
              return min(value, 0.0)


          def vu_loop():
              url = "http://127.0.0.1:8080/livestream01/720/index.m3u8"
              while not stop_event.is_set():
                  if not (STATUS_DIR / "720" / "index.m3u8").exists():
                      stop_event.wait(3)
                      continue
                  proc = None
                  try:
                      proc = subprocess.Popen(
                          [
                              "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error",
                              "-i", url, "-vn",
                              "-af",
                              "asetnsamples=n=11025:p=0,astats=metadata=1:reset=1,"
                              "ametadata=mode=print:file=-",
                              "-f", "null", "-",
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL,
                          text=True,
                          bufsize=1,
                      )
                      cur = {}
                      for line in iter(proc.stdout.readline, ""):
                          if stop_event.is_set():
                              break
                          if line.startswith("frame:"):
                              if cur:
                                  with lock:
                                      l = cur.get((1, "RMS_level"), -90.0)
                                      r = cur.get((2, "RMS_level"), l)
                                      vu_state.update({
                                          "l": l, "r": r,
                                          "pl": cur.get((1, "Peak_level"), l),
                                          "pr": cur.get((2, "Peak_level"), cur.get((1, "Peak_level"), l)),
                                          "ts": time.time(),
                                      })
                              cur = {}
                              continue
                          m = VU_RX.search(line)
                          if m:
                              cur[(int(m.group(1)), m.group(2))] = vu_value(m.group(3))
                  except Exception:
                      pass
                  finally:
                      if proc is not None:
                          try:
                              proc.kill()
                              proc.wait(timeout=3)
                          except Exception:
                              pass
                  stop_event.wait(5)


          def cmd_stop():
              with lock:
                  shared["stopped"] = True
                  shared["stop_occurrence"] = "__pending__"
                  shared["skip_item"] = None
                  shared["skip_expire"] = None
              return True, "Đã dừng kênh. Tự chạy lại khi tới chương trình kế hoặc bấm Start."


          def cmd_start():
              with lock:
                  was = shared["stopped"]
                  shared["stopped"] = False
                  shared["stop_occurrence"] = None
                  shared["restart_seq"] += 1
              fetch_event.set()
              return True, "Đã chạy lại kênh." if was else "Kênh đang chạy; đã khởi động lại nguồn."


          def cmd_restart():
              with lock:
                  shared["stopped"] = False
                  shared["stop_occurrence"] = None
                  shared["restart_seq"] += 1
              fetch_event.set()
              return True, "Đã khởi động lại FFmpeg."


          def cmd_skip():
              with lock:
                  config = shared["config"]
              if not isinstance(config, dict):
                  return False, "Runner chưa đọc được cấu hình."
              if config.get("mode") == "manual":
                  return False, "Đang ở chế độ Manual; Skip chỉ dùng cho Auto."
              nxt = config.get("nextEpg")
              if not isinstance(nxt, dict):
                  return False, "Không có chương trình kế tiếp hôm nay."
              item = dict(nxt)
              name = str(item.get("source", "obs"))
              try:
                  start = time_seconds(item["start"])
                  end = time_seconds(item["end"])
              except Exception:
                  return False, "Giờ của chương trình kế không hợp lệ."
              if item.get("type") != "waiting":
                  url = resolve_source(config, name)
                  if not url:
                      return False, "Nguồn của chương trình kế không hợp lệ."
                  item["_url"] = url
                  item["_type"] = source_input_type(config, name)
              day0 = datetime.now(TZ).replace(hour=0, minute=0, second=0, microsecond=0)
              end_s = end if end > start else end + 86400
              if config.get("nextEpgDay") == 1:
                  end_s += 86400
              expire = (day0 + timedelta(seconds=end_s)).timestamp()
              with lock:
                  shared["skip_item"] = item
                  shared["skip_expire"] = expire
                  shared["stopped"] = False
                  shared["stop_occurrence"] = None
                  shared["restart_seq"] += 1
              fetch_event.set()
              return True, "Đã nhảy sang: " + sanitize(item.get("title", "chương trình kế"))


          COMMANDS = {
              "stop": cmd_stop,
              "start": cmd_start,
              "restart": cmd_restart,
              "skip": cmd_skip,
          }
          done_command_ids = collections.deque(maxlen=100)


          def execute_command(cmd):
              action = str(cmd.get("action", ""))
              func = COMMANDS.get(action)
              if func is None:
                  return False, "Lệnh không hỗ trợ: " + sanitize(action)
              try:
                  ok, message = func()
              except Exception as exc:
                  return False, "Lỗi: " + type(exc).__name__
              log("Lệnh từ Worker: " + action + " -> " + ("OK" if ok else "LỖI") + " · " + message)
              return ok, message


          def command_loop():
              last_err = 0.0
              while not stop_event.wait(5):
                  try:
                      data = worker_request("/api/runner/commands")
                      for cmd in data.get("commands", []) or []:
                          cid = str(cmd.get("id", ""))
                          if not cid:
                              continue
                          if cid in done_command_ids:
                              ok, message = True, "Đã chạy trước đó."
                          else:
                              ok, message = execute_command(cmd)
                              done_command_ids.append(cid)
                          worker_request(
                              "/api/runner/ack",
                              {"id": cid, "ok": ok, "message": message},
                              "POST",
                          )
                  except Exception as exc:
                      if time.monotonic() - last_err > 60:
                          name = type(exc).__name__
                          if isinstance(exc, urllib.error.HTTPError):
                              name += f" HTTP {exc.code}"
                          log("Không lấy được lệnh từ Worker: " + name)
                          last_err = time.monotonic()


          control_server = ControlServer(("127.0.0.1", 8091), ControlHandler)
          threading.Thread(
              target=control_server.serve_forever,
              daemon=True,
          ).start()

          threading.Thread(target=config_loop, daemon=True).start()
          threading.Thread(target=video_probe_loop, daemon=True).start()
          threading.Thread(target=audio_probe_loop, daemon=True).start()
          threading.Thread(target=status_loop, daemon=True).start()
          threading.Thread(target=snapshot_loop, daemon=True).start()
          threading.Thread(target=vu_loop, daemon=True).start()
          threading.Thread(target=command_loop, daemon=True).start()
          threading.Thread(target=event_loop, daemon=True).start()

          log("Supervisor bắt đầu.")
          log("Trang control đã khởi động.")
          scan_idents()
          scan_ads()
          log("Ident: chọn ngẫu nhiên theo trọng số (không lặp liên tiếp).")
          log("Bản thử nghiệm: HLS vẫn có thể khựng hoặc nhảy.")

          seen_restart_seq = 0
          seen_ident_seq = 0
          seen_ad_break_seq = 0
          seen_ad_break_stop_seq = 0
          was_emergency = False

          ad_break_stage = None
          ad_break_source_active = ""
          ad_break_deadline = 0.0
          main_seek_offset = 0.0
          paused_main_state = None
          cached_ad_img_key = None
          cached_ad_img_path = None
          cached_ad_img_hash = ""

          next_direct_attempt = 0.0
          attempt_generation = -1
          direct_attempt_active = False

          cached_subtitle_key = None
          cached_subtitle_path = None
          cached_subtitle_hash = ""

          try:
              while not stop_event.is_set():
                  try:
                      with lock:
                          config = shared["config"]
                          emergency = shared["emergency"]
                          direct_url = shared["direct_url"]
                          direct_type = shared["direct_type"]
                          direct_subtitle_url = shared["direct_subtitle_url"]
                          direct_subtitle_offset = shared["direct_subtitle_offset"]
                          direct_audio_tracks = list(shared["direct_audio_tracks"])
                          direct_clearkey = shared["direct_clearkey"]
                          ad_break_seq = shared["ad_break_seq"]
                          ad_break_stop_seq = shared["ad_break_stop_seq"]
                          ad_break_with_ident = shared["ad_break_with_ident"]
                          ad_overlay_override = shared["ad_overlay_override"]
                          restart_seq = shared["restart_seq"]
                          ident_seq = shared["ident_seq"]
                          stopped = shared["stopped"]
                          stop_occurrence = shared["stop_occurrence"]

                      effective_config = config if isinstance(config, dict) else {}
                      logo_path, logo_hash = sync_logo(effective_config)

                      if emergency:
                          if not was_emergency:
                              log("Đang chuyển sang fallback khẩn cấp.")
                              stop_ffmpeg()
                              ident_playing = False
                              ident_from_control = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0
                              previous_selection = None

                          was_emergency = True
                          seen_ident_seq = ident_seq
                          seen_restart_seq = restart_seq

                          set_audio_candidates(
                              fallback_audio_candidates(effective_config)
                          )
                          with lock:
                              audio_url = shared["audio_result"]
                              shared["current_name"] = "Khẩn cấp"

                          relevant = {
                              "logo": effective_config.get("logo", {}),
                              "banner": effective_config.get("banner", {}),
                          }
                          emergency_key = (
                              "emergency",
                              audio_url,
                              signature(relevant),
                          )

                          if process is not None and process.poll() is not None:
                              log(
                                  "FFmpeg khẩn đã thoát, mã: "
                                  + str(process.returncode)
                              )
                              process = None
                              current_key = None
                              with lock:
                                  shared["ffmpeg_running"] = False

                          if emergency_key != current_key or process is None:
                              if time.monotonic() - last_start >= RESTART_DELAY:
                                  start_ffmpeg(
                                      effective_config,
                                      "fallback",
                                      audio_url=audio_url,
                                  )
                                  current_key = emergency_key
                                  current_mode = "fallback"

                          stop_event.wait(0.5)
                          continue

                      if was_emergency:
                          log("Đã thoát khẩn cấp.")
                          was_emergency = False
                          previous_selection = None
                          current_key = None
                          current_mode = None
                          last_start = 0.0

                      if direct_url:
                          program = direct_program(
                              direct_url,
                              direct_type,
                              direct_subtitle_url,
                              direct_subtitle_offset,
                              direct_audio_tracks,
                              direct_clearkey,
                          )
                      elif config is not None:
                          program = select_program(config)
                      else:
                          program = {
                              "reason": "no_config",
                              "name": "Chưa có cấu hình Worker",
                              "kind": "source",
                              "url": None,
                              "input_type": "live",
                              "subtitle_url": "",
                              "occurrence": None,
                              "waiting": {},
                          }

                      reason = program["reason"]
                      occurrence = program["occurrence"]

                      with lock:
                          shared["current_name"] = sanitize(program["name"])
                          shared["current_title"] = sanitize(
                              program.get("title") or program["name"]
                          )
                          shared["current_kind"] = program["kind"]
                          shared["current_reason"] = reason
                          shared["current_window"] = (
                              program.get("start", ""),
                              program.get("end", ""),
                          )

                      if stopped:
                          if stop_occurrence == "__pending__":
                              with lock:
                                  shared["stop_occurrence"] = occurrence
                              stop_occurrence = occurrence
                          elif reason != "manual" and occurrence != stop_occurrence:
                              log("Tới chương trình kế; tự chạy lại sau khi dừng.")
                              with lock:
                                  shared["stopped"] = False
                                  shared["stop_occurrence"] = None
                              stopped = False
                          if stopped:
                              if process is not None:
                                  stop_ffmpeg()
                              ident_playing = False
                              ident_from_control = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0
                              with lock:
                                  shared["on_backup"] = False
                              note_program_event(program)
                              stop_event.wait(0.5)
                              continue

                      current_selection = (reason, occurrence, program["url"])
                      schedule_changed = False
                      manual_changed = False

                      if previous_selection is not None:
                          previous_reason, previous_occurrence, previous_url = (
                              previous_selection
                          )
                          if (
                              previous_reason in ("epg", "default")
                              and reason == "epg"
                              and occurrence != previous_occurrence
                          ):
                              schedule_changed = True
                          if reason == "manual" and (
                              previous_reason != "manual"
                              or previous_url != program["url"]
                          ):
                              manual_changed = True

                      previous_selection = current_selection

                      selected = (program["kind"], program["url"])
                      with lock:
                          if selected != shared["selected"]:
                              shared["selected"] = selected
                              shared["generation"] += 1
                              shared["video_available"] = False
                              shared["video_failures"] = 0
                              changed = True
                          else:
                              changed = False
                          generation = shared["generation"]
                          video_available = shared["video_available"]

                      if changed:
                          log(
                              "Nguồn được chọn: "
                              + program["name"]
                              + " ("
                              + reason
                              + ", "
                              + program["kind"]
                              + ", "
                              + program["input_type"]
                              + ")."
                          )

                      if generation != attempt_generation:
                          attempt_generation = generation
                          # Chuyển theo lịch: mở nguồn mới ngay (không chờ probe) để kịp giờ.
                          next_direct_attempt = time.monotonic() + (0 if reason == "epg" else 20)
                          direct_attempt_active = False

                      if restart_seq != seen_restart_seq:
                          seen_restart_seq = restart_seq
                          log("Thực hiện restart nguồn.")
                          stop_ffmpeg()
                          ident_playing = False
                          ident_from_control = False
                          current_key = None
                          current_mode = None
                          last_start = 0.0
                          next_direct_attempt = 0.0
                          direct_attempt_active = False
                          cached_subtitle_key = None

                      manual_ident_requested = ident_seq != seen_ident_seq
                      if manual_ident_requested:
                          seen_ident_seq = ident_seq

                      if (
                          ident_playing
                          and manual_changed
                          and not ident_from_control
                      ):
                          log("Manual Worker mới được chọn: ngắt ident tự động.")
                          stop_ffmpeg()
                          ident_playing = False
                          ident_from_control = False
                          current_key = None
                          current_mode = None
                          last_start = 0.0

                      if ad_break_stop_seq != seen_ad_break_stop_seq:
                          seen_ad_break_stop_seq = ad_break_stop_seq
                          if ad_break_stage is not None:
                              log("Thoát quảng cáo ngay; quay lại luồng chính.")
                              stop_ffmpeg()
                              ad_break_stage = None
                              ad_break_source_active = ""
                              current_key = None
                              current_mode = None
                              last_start = 0.0

                      if ad_break_seq != seen_ad_break_seq:
                          seen_ad_break_seq = ad_break_seq
                          if ad_break_stage is None:
                              if current_mode == "main" and program.get("url") and (program.get("input_type") == "vod" or is_mp4(program.get("url"))):
                                  with lock:
                                      played_s = parse_out_time(shared.get("ffmpeg_out_time", ""))
                                  resume_pos = main_seek_offset + played_s
                                  paused_main_state = {
                                      "url": program["url"],
                                      "resume_at": resume_pos,
                                  }
                                  log(f"Lưu vị trí phát chính tại {resume_pos:.1f}s để quay lại sau QC.")
                              if ident_playing:
                                  stop_ffmpeg()
                                  ident_playing = False
                                  ident_from_control = False
                              ad_ident_file = ASSETS / "ad_ident.mp4"
                              ad_ident_dur = ident_file_duration(ad_ident_file) if ad_break_with_ident else None
                              if ad_ident_dur is not None:
                                  log(f"Phát ad_ident ({ad_ident_dur:.1f}s) trước đợt quảng cáo.")
                                  start_ffmpeg(
                                      effective_config,
                                      "ad_ident",
                                      duration=ad_ident_dur,
                                      ident_path=ad_ident_file,
                                      logo_path=logo_path,
                                  )
                                  ad_break_stage = "ad_ident"
                                  ad_break_deadline = time.monotonic() + ad_ident_dur + 20
                              else:
                                  with lock:
                                      next_item = shared["ad_break_queue"].pop(0) if shared["ad_break_queue"] else ""
                                  ad_src = (
                                      str(ROOT / "ads" / "videos" / os.path.basename(next_item[5:]))
                                      if next_item.startswith("repo:")
                                      else next_item
                                  )
                                  ad_break_source_active = ad_src
                                  if ad_src:
                                      ad_dur = ident_file_duration(Path(ad_src)) if Path(ad_src).is_file() else 180.0
                                      log("Bắt đầu phát video quảng cáo.")
                                      start_ffmpeg(
                                          effective_config,
                                          "ad_break",
                                          source_url=ad_src,
                                          duration=ad_dur,
                                          logo_path=logo_path,
                                      )
                                      ad_break_stage = "ad_video"
                                      ad_break_deadline = time.monotonic() + (ad_dur or 180.0) + 30
                              if ad_break_stage is not None:
                                  current_key = ("ad", ad_break_seq)
                                  current_mode = ad_break_stage

                      if ad_break_stage is not None:
                          if process is None or process.poll() is not None or time.monotonic() >= ad_break_deadline:
                              if process is not None and process.poll() is None:
                                  log("Quảng cáo quá thời gian; chuyển tiếp.")
                                  stop_ffmpeg()
                              else:
                                  process = None
                              with lock:
                                  shared["ffmpeg_running"] = False
                              with lock:
                                  next_item = shared["ad_break_queue"].pop(0) if shared["ad_break_queue"] else ""
                                  rem_q = len(shared["ad_break_queue"])
                              if next_item:
                                  ad_src = (
                                      str(ROOT / "ads" / "videos" / os.path.basename(next_item[5:]))
                                      if next_item.startswith("repo:")
                                      else next_item
                                  )
                                  ad_break_source_active = ad_src
                                  ad_dur = ident_file_duration(Path(ad_src)) if Path(ad_src).is_file() else 180.0
                                  if ad_break_stage == "ad_ident":
                                      log(f"Chuyển từ ad_ident sang video quảng cáo (còn {rem_q} sau clip này).")
                                  else:
                                      log(f"Chuyển sang video quảng cáo tiếp theo (còn {rem_q} sau clip này).")
                                  start_ffmpeg(
                                      effective_config,
                                      "ad_break",
                                      source_url=ad_src,
                                      duration=ad_dur,
                                      logo_path=logo_path,
                                  )
                                  ad_break_stage = "ad_video"
                                  ad_break_deadline = time.monotonic() + (ad_dur or 180.0) + 30
                                  current_mode = "ad_break"
                                  stop_event.wait(0.5)
                                  continue
                              else:
                                  log("Quảng cáo kết thúc; quay lại luồng chính.")
                                  ad_break_stage = None
                                  ad_break_source_active = ""
                                  current_key = None
                                  current_mode = None
                                  last_start = 0.0
                          else:
                              stop_event.wait(0.5)
                              continue

                      if schedule_changed or manual_ident_requested:
                          if schedule_changed and pending_ident:
                              chosen = pending_ident
                          else:
                              chosen = choose_ident()
                          if schedule_changed:
                              pending_ident = None
                          if chosen is None:
                              log("Không có ident hợp lệ; bỏ qua.")
                              if ident_playing:
                                  stop_ffmpeg()
                                  ident_playing = False
                                  ident_from_control = False
                                  current_key = None
                                  current_mode = None
                                  last_start = 0.0
                          else:
                              ident_path, duration = chosen
                              if manual_ident_requested:
                                  log(f"Control phát ident {duration:.1f} giây.")
                              else:
                                  log(
                                      "Lịch chuyển sang "
                                      + program["name"]
                                      + f"; phát ident {duration:.1f} giây."
                                  )
                              start_ffmpeg(
                                  effective_config,
                                  "ident",
                                  duration=duration,
                                  ident_path=ident_path,
                              )
                              ident_playing = True
                              ident_from_control = manual_ident_requested
                              ident_deadline = time.monotonic() + duration + 20
                              current_key = ("ident", occurrence)
                              current_mode = "ident"

                      if ident_playing:
                          if process is None or process.poll() is not None:
                              code = None if process is None else process.returncode
                              log(f"Ident kết thúc; mã {code}.")
                              process = None
                              ident_playing = False
                              ident_from_control = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0
                              with lock:
                                  shared["ffmpeg_running"] = False
                          elif time.monotonic() >= ident_deadline:
                              log("Ident quá thời gian; chuyển tiếp.")
                              stop_ffmpeg()
                              ident_playing = False
                              ident_from_control = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0
                          else:
                              stop_event.wait(0.5)
                              continue

                      if process is not None and process.poll() is not None:
                          log("FFmpeg đã thoát, mã: " + str(process.returncode))
                          if current_mode in ("main", "waiting"):
                              with lock:
                                  shared["video_available"] = False
                              video_available = False
                              next_direct_attempt = time.monotonic() + 30
                              direct_attempt_active = False
                          process = None
                          current_key = None
                          current_mode = None
                          with lock:
                              shared["ffmpeg_running"] = False

                      if (
                          process is not None
                          and process.poll() is None
                          and playlist_is_stalled()
                      ):
                          log(
                              f"Playlist 720 không cập nhật quá {stall_limit()} giây; restart FFmpeg."
                          )
                          if current_mode in ("main", "waiting"):
                              with lock:
                                  shared["video_available"] = False
                              video_available = False
                              next_direct_attempt = time.monotonic() + 30
                              direct_attempt_active = False
                          stop_ffmpeg()
                          current_key = None
                          current_mode = None

                      now = time.monotonic()
                      can_try_source = (
                          valid_url(program["url"], allow_internal_obs=True)
                          and (
                              video_available
                              or direct_attempt_active
                              or now >= next_direct_attempt
                          )
                      )

                      if can_try_source:
                          desired_mode = (
                              "waiting"
                              if program["kind"] == "waiting"
                              else "main"
                          )
                      else:
                          desired_mode = "fallback"

                      backup_url = program.get("backup_url") or effective_config.get(
                          "backupUrl"
                      ) or ""
                      use_backup = bool(
                          desired_mode == "fallback"
                          and program["kind"] == "source"
                          and program["reason"] != "no_config"
                          and isinstance(backup_url, str)
                          and backup_url
                          and valid_url(backup_url)
                          and backup_url != program.get("url")
                      )
                      with lock:
                          shared["on_backup"] = use_backup

                      if desired_mode == "waiting":
                          set_audio_candidates(waiting_audio_candidates(program))
                      elif desired_mode == "fallback":
                          set_audio_candidates(
                              fallback_audio_candidates(effective_config)
                          )
                      else:
                          set_audio_candidates(())

                      with lock:
                          audio_url = shared["audio_result"]

                      sub_url = program.get("subtitle_url", "") if desired_mode == "main" else ""
                      sub_offset = float(program.get("subtitle_offset", 0.0) or 0.0)
                      sub_key = (sub_url, sub_offset)
                      if sub_key != cached_subtitle_key:
                          cached_subtitle_key = sub_key
                          if sub_url:
                              cached_subtitle_path, cached_subtitle_hash = download_subtitle(sub_url, sub_offset)
                          else:
                              cached_subtitle_path, cached_subtitle_hash = None, ""

                      active_ad_overlay = None
                      raw_ov = ad_overlay_override if ad_overlay_override is not None else effective_config.get("adOverlay")
                      if isinstance(raw_ov, dict) and raw_ov.get("enabled") is True:
                          ov_src = str(raw_ov.get("source") or raw_ov.get("url") or "").strip()
                          ov_pos = str(raw_ov.get("position", "bottom-left"))
                          ov_w = raw_ov.get("width", 140)
                          ov_key = (ov_src, ov_pos, ov_w)
                          if ov_key != cached_ad_img_key:
                              cached_ad_img_key = ov_key
                              if ov_src.startswith("repo:"):
                                  p = ROOT / "ads" / "images" / os.path.basename(ov_src[5:])
                                  if p.is_file():
                                      cached_ad_img_path = p
                                      cached_ad_img_hash = hashlib.sha256(p.read_bytes()).hexdigest()
                                  else:
                                      cached_ad_img_path, cached_ad_img_hash = None, ""
                              elif ov_src:
                                  dest = ASSETS / "ad_watermark.png"
                                  if download_image_asset(ov_src, dest):
                                      cached_ad_img_path = dest
                                      cached_ad_img_hash = hashlib.sha256(dest.read_bytes()).hexdigest()
                                  else:
                                      cached_ad_img_path, cached_ad_img_hash = None, ""
                              else:
                                  cached_ad_img_path, cached_ad_img_hash = None, ""
                          if cached_ad_img_path is not None and cached_ad_img_path.is_file():
                              active_ad_overlay = {"position": ov_pos, "width": ov_w}

                      logo_cfg = effective_config.get("logo", {})
                      if desired_mode == "waiting":
                          relevant = {"logo": logo_cfg, "logo_hash": logo_hash, "waiting": program["waiting"]}
                          desired_key = (
                              "waiting",
                              program["url"],
                              program["input_type"],
                              audio_url,
                              signature(relevant),
                          )
                      elif desired_mode == "fallback":
                          relevant = {
                              "logo": logo_cfg,
                              "logo_hash": logo_hash,
                              "banner": effective_config.get("banner", {}),
                          }
                          desired_key = (
                              "fallback",
                              program["kind"],
                              program["url"],
                              audio_url,
                              signature(relevant),
                          )
                      else:
                          desired_key = (
                              "main",
                              program["url"],
                              program["input_type"],
                              program.get("clearkey", ""),
                              cached_subtitle_hash,
                              cached_ad_img_hash if active_ad_overlay else "",
                              signature(active_ad_overlay or {}),
                              signature(program.get("audio_tracks", [])),
                              signature({"logo": logo_cfg, "logo_hash": logo_hash}),
                          )

                      if use_backup:
                          desired_key = (
                              "backup",
                              backup_url,
                              signature({"logo": logo_cfg, "logo_hash": logo_hash}),
                          )

                      can_restart = now - last_start >= RESTART_DELAY
                      if (desired_key != current_key or process is None) and can_restart:
                          if use_backup:
                              log("Nguồn chính chưa khả dụng; phát luồng dự phòng.")
                              next_direct_attempt = time.monotonic() + 600
                              direct_attempt_active = False
                          elif desired_mode == "fallback":
                              log("Video được chọn chưa khả dụng; phát fallback.")
                          elif desired_mode == "waiting":
                              log("Phát chờ event; tiếng gốc video được tắt.")
                          else:
                              log("Phát nguồn chính: " + program["name"])

                          if desired_mode in ("main", "waiting") and not video_available:
                              log("Probe chưa OK; thử FFmpeg trực tiếp.")
                              direct_attempt_active = True

                          resume_seek = 0.0
                          if (
                              desired_mode == "main"
                              and paused_main_state is not None
                              and paused_main_state.get("url") == program["url"]
                              and (program["input_type"] == "vod" or is_mp4(program["url"]))
                          ):
                              resume_seek = float(paused_main_state.get("resume_at", 0.0))
                              main_seek_offset = resume_seek
                              paused_main_state = None
                              log(f"Quay lại luồng chính tại {resume_seek:.1f}s.")
                          elif desired_mode == "main":
                              main_seek_offset = 0.0
                              paused_main_state = None

                          start_ffmpeg(
                              effective_config,
                              "main" if use_backup else desired_mode,
                              source_url=backup_url if use_backup else program["url"],
                              audio_url=audio_url,
                              waiting=program["waiting"],
                              input_type="live" if use_backup else program["input_type"],
                              subtitle_path=cached_subtitle_path if desired_mode == "main" else None,
                              audio_tracks=program.get("audio_tracks", []) if desired_mode == "main" else [],
                              logo_path=logo_path,
                              ad_overlay=active_ad_overlay if desired_mode == "main" else None,
                              ad_image_path=cached_ad_img_path if (desired_mode == "main" and active_ad_overlay) else None,
                              seek_seconds=resume_seek,
                              clearkey=program.get("clearkey", "") if desired_mode == "main" else "",
                          )
                          current_key = desired_key
                          current_mode = "backup" if use_backup else desired_mode

                      note_program_event(program)

                      if time.monotonic() - last_cleanup > 60:
                          cleanup_old_segments()
                          last_cleanup = time.monotonic()

                  except Exception as exc:
                      log("Lỗi supervisor: " + type(exc).__name__ + ": " + str(exc))

                  stop_event.wait(0.5)
          finally:
              stop_event.set()
              fetch_event.set()
              stop_ffmpeg()
              control_server.shutdown()
              control_server.server_close()
              log("Supervisor đã dừng.")
          PY

          python3 -u "$ROOT/supervisor.py" &
          SUP_PID=$!

          while kill -0 "$CF_PID" 2>/dev/null \
            && kill -0 "$NGINX_PID" 2>/dev/null \
            && kill -0 "$SUP_PID" 2>/dev/null \
            && [ "$(docker inspect -f '{{.State.Running}}' veotv-mediamtx)" = "true" ]
          do
            sleep 5
          done

          echo ">>> Một thành phần đã dừng."
          echo "=== cloudflared ==="
          cat "$ROOT/cloudflared.log" 2>/dev/null || true
          echo "=== nginx ==="
          cat "$ROOT/nginx-error.log" 2>/dev/null || true
          echo "=== MediaMTX ==="
          docker logs veotv-mediamtx 2>&1 || true
          exit 1
