          def write_master_manifest(audio_renditions=None):
              manifest = ROOT / "www" / "livestream01" / "manifest.m3u8"
              lines = [
                  "#EXTM3U",
                  "#EXT-X-VERSION:3",
              ]
              audio_attr = ""
              if audio_renditions:
                  has_default = any(r.get("default") for r in audio_renditions)
                  for i, r in enumerate(audio_renditions):
                      is_def = "YES" if (r.get("default") or (not has_default and i == 0)) else "NO"
                      lines.append(
                          '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
                          f'NAME="{r["label"]}",LANGUAGE="{r["lang"]}",'
                          f'DEFAULT={is_def},AUTOSELECT=YES,URI="audio/{i}/index.m3u8"'
                      )
                  audio_attr = ',AUDIO="audio"'
              lines += [
                  f'#EXT-X-STREAM-INF:BANDWIDTH=3300000,RESOLUTION=1280x720{audio_attr}',
                  "720/index.m3u8",
                  f'#EXT-X-STREAM-INF:BANDWIDTH=5800000,RESOLUTION=1920x1080{audio_attr}',
                  "1080/index.m3u8",
              ]
              manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")


          def reset_playlist_watch():
              global playlist_last_change, playlist_last_signature
              playlist_last_change = time.monotonic()
              playlist_last_signature = None


          def start_ffmpeg(
              config,
              mode,
              source_url=None,
              audio_url=None,
              waiting=None,
              duration=None,
              input_type="live",
              ident_path=None,
              subtitle_path=None,
              audio_tracks=None,
              logo_path=None,
              ad_overlay=None,
              ad_image_path=None,
              seek_seconds=0.0,
              clearkey="",
          ):
              global process, last_start, current_udpxy, current_run_id
              t_call = time.monotonic()
              stop_ffmpeg()
              reset_playlist_watch()

              waiting = waiting or {}
              audio_tracks = audio_tracks or []
              logo_file = logo_path if (logo_path and Path(logo_path).is_file()) else (ASSETS / "logo.png")
              run_id = uuid.uuid4().hex[:10]
              current_udpxy = bool(source_url) and mode in ("main", "waiting") and is_udpxy(source_url)

              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "warning",
                  "-y",
                  "-progress", "pipe:1",
                  "-stats_period", "5",
              ]

              live_info = None
              if mode == "fallback":
                  cmd += [
                      "-re",
                      "-loop", "1",
                      "-framerate", "30",
                      "-i", str(ASSETS / "fallback.png"),
                  ]
              elif mode in ("ident", "ad_ident"):
                  if ident_path is None:
                      raise ValueError("Thiếu đường dẫn ident")
                  cmd += [
                      "-re",
                      "-i", str(ident_path),
                  ]
              elif mode == "ad_break":
                  if not source_url:
                      raise ValueError("Thiếu nguồn quảng cáo")
                  cmd += ["-re"]
                  if str(source_url).startswith(("http://", "https://")):
                      cmd += [
                          "-fflags", "+genpts",
                          "-analyzeduration", "1500000",
                          "-probesize", "1500000",
                          "-thread_queue_size", "512",
                          "-rw_timeout", "6000000",
                          "-user_agent", "Dalvik/2.1.0",
                      ]
                  cmd += ["-i", str(source_url)]
              elif mode in ("waiting", "main"):
                  if input_type == "vod" or is_mp4(source_url):
                      cmd += ["-re"]
                  if is_mp4(source_url):
                      cmd += ["-stream_loop", "-1"]
                  if is_udpxy(source_url):
                      live_info = probe_live(source_url, single=True)
                      if live_info["ok"]:
                          log(f"Probe udpxy: {live_info['vcodec']} {live_info['width']}x{live_info['height']}, audio={live_info['acodec'] or 'không có'}, khử xen kẽ={'có' if live_info['deint'] else 'không'}")
                      else:
                          log(f"Probe udpxy lỗi: {live_info['err']}. Vẫn thử chạy FFmpeg.")
                  if is_udpxy(source_url):
                      cmd += [
                          "-fflags", "+genpts",
                          "-analyzeduration", UDPXY_ANALYZE,
                          "-probesize", UDPXY_ANALYZE,
                          "-thread_queue_size", "4096",
                          "-rw_timeout", UDPXY_RW_TIMEOUT,
                      ]
                  else:
                      cmd += [
                          "-fflags", "+genpts",
                          "-analyzeduration", "5000000" if live_info else "1500000",
                          "-probesize", "5000000" if live_info else "1500000",
                          "-thread_queue_size", "512",
                          "-rw_timeout", "6000000",
                      ]
                  resolved_src = resolve_media_redirect(source_url)
                  if resolved_src.startswith(("http://", "https://")):
                      cmd += ["-user_agent", "Dalvik/2.1.0"]
                  if mode == "main" and seek_seconds and seek_seconds > 1.0 and (input_type == "vod" or is_mp4(resolved_src)):
                      cmd += ["-ss", f"{seek_seconds:.2f}"]
                  if clearkey:
                      cmd += ["-cenc_decryption_key", clearkey]
                  if is_udpxy(resolved_src):
                      cmd += ["-err_detect", "ignore_err", "-reconnect", "1", "-reconnect_streamed", "1", "-reconnect_delay_max", "5"]
                  cmd += ["-i", resolved_src]

              cmd += [
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(logo_file),
              ]

              next_input_idx = 2
              ad_input_idx = None
              if mode == "main" and ad_overlay and ad_image_path and Path(ad_image_path).is_file():
                  cmd += [
                      "-loop", "1",
                      "-framerate", "30",
                      "-i", str(ad_image_path),
                  ]
                  ad_input_idx = next_input_idx
                  next_input_idx += 1

              extra_renditions = []

              if mode in ("fallback", "waiting"):
                  if audio_url:
                      if is_mp4(audio_url):
                          cmd += ["-re", "-stream_loop", "-1"]
                      cmd += [
                          "-thread_queue_size", "512",
                          "-rw_timeout", "10000000",
                          "-i", audio_url,
                      ]
                  else:
                      cmd += ["-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo"]
                  audio_map = f"{next_input_idx}:a:0"
                  next_input_idx += 1
              elif mode in ("ident", "ad_ident"):
                  if local_has_audio(ident_path):
                      audio_map = "0:a:0"
                  else:
                      cmd += ["-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo"]
                      audio_map = f"{next_input_idx}:a:0"
                      next_input_idx += 1
              elif mode == "ad_break":
                  ad_p = Path(str(source_url))
                  has_ad_audio = local_has_audio(ad_p) if ad_p.is_file() else probe(str(source_url), "a:0")[0]
                  if has_ad_audio:
                      audio_map = "0:a:0?"
                  else:
                      cmd += ["-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo"]
                      audio_map = f"{next_input_idx}:a:0"
                      next_input_idx += 1
              else:
                  has_src_audio, _ = probe(source_url, "a:0", clearkey=clearkey)
                  if has_src_audio:
                      audio_map = "0:a:0?"
                  else:
                      cmd += ["-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo"]
                      audio_map = f"{next_input_idx}:a:0"
                      next_input_idx += 1

                  if audio_tracks:
                      valid_extras = []
                      for tr in audio_tracks:
                          ok, _ = probe(tr["url"], "a:0")
                          if ok:
                              valid_extras.append(tr)
                          else:
                              log(f"Bỏ qua audio track {tr['lang']} ({tr['label']}): không đọc được stream audio.")
                      if valid_extras:
                          extra_renditions.append({
                              "lang": "und",
                              "label": "Âm thanh gốc",
                              "default": not any(t.get("default") for t in valid_extras),
                              "map": audio_map,
                          })
                          for tr in valid_extras:
                              if input_type == "vod" or is_mp4(tr["url"]):
                                  cmd += ["-re"]
                              if is_mp4(tr["url"]):
                                  cmd += ["-stream_loop", "-1"]
                              if tr.get("offset"):
                                  cmd += ["-itsoffset", str(tr["offset"])]
                              if mode == "main" and seek_seconds and seek_seconds > 1.0 and (input_type == "vod" or is_mp4(tr["url"])):
                                  cmd += ["-ss", f"{seek_seconds:.2f}"]
                              cmd += [
                                  "-fflags", "+genpts",
                                  "-analyzeduration", "1500000",
                                  "-probesize", "1500000",
                                  "-thread_queue_size", "512",
                                  "-rw_timeout", "6000000",
                                  "-i", tr["url"],
                              ]
                              extra_renditions.append({
                                  "lang": tr["lang"],
                                  "label": tr["label"],
                                  "default": tr.get("default", False),
                                  "map": f"{next_input_idx}:a:0",
                              })
                              next_input_idx += 1

              cmd += [
                  "-filter_complex",
                  build_filters(
                      config,
                      mode,
                      waiting,
                      subtitle_path=subtitle_path,
                      ad_overlay=ad_overlay if mode == "main" else None,
                      ad_input_idx=ad_input_idx,
                      seek_seconds=seek_seconds if mode == "main" else 0.0,
                      deinterlace=bool(live_info and live_info.get("ok") and live_info.get("deint")),
                  ),
              ]
              if extra_renditions:
                  write_master_manifest(extra_renditions)
                  cmd += output_args("[v720]", audio_map, "720", "2800k", run_id, duration, video_only=True)
                  cmd += output_args("[v1080]", audio_map, "1080", "5000k", run_id, duration, video_only=True)
                  for idx, rend in enumerate(extra_renditions):
                      cmd += audio_output_args(rend["map"], idx, run_id)
              else:
                  write_master_manifest(None)
                  cmd += output_args("[v720]", audio_map, "720", "2800k", run_id, duration)
                  cmd += output_args("[v1080]", audio_map, "1080", "5000k", run_id, duration)

              log(
                  "Khởi động FFmpeg: "
                  + mode
                  + (f", input={input_type}" if mode in ("waiting", "main") else "")
                  + (", srt=on" if (mode == "main" and subtitle_path) else "")
                  + (f", audio_tracks={len(extra_renditions)}" if extra_renditions else "")
              )

              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  errors="replace",
                  bufsize=1,
              )

              threading.Thread(
                  target=ffmpeg_log_reader,
                  args=(process.stderr,),
                  daemon=True,
              ).start()
              threading.Thread(
                  target=progress_reader,
                  args=(process.stdout,),
                  daemon=True,
              ).start()

              current_run_id = run_id
              if mode in ("ident", "ad_ident"):
                  skey = "ident"
              elif mode in ("main", "waiting"):
                  skey = startup_key(source_url, input_type)
              else:
                  skey = None
              if skey:
                  threading.Thread(
                      target=watch_startup,
                      args=(run_id, t_call, skey),
                      daemon=True,
                  ).start()

              last_start = time.monotonic()
              with lock:
                  shared["ffmpeg_running"] = True
                  shared["current_mode"] = mode
                  shared["ffmpeg_speed"] = ""
                  shared["ffmpeg_out_time"] = ""


          def playlist_is_stalled():
              global playlist_last_change, playlist_last_signature
              playlist = ROOT / "www" / "livestream01" / "720" / "index.m3u8"
              try:
                  stat = playlist.stat()
                  current = (stat.st_mtime_ns, stat.st_size)
              except OSError:
                  current = None
              if current != playlist_last_signature:
                  playlist_last_signature = current
                  playlist_last_change = time.monotonic()
              return time.monotonic() - playlist_last_change > stall_limit()


          def cleanup_old_segments():
              now = time.time()
              folders = [
                  ROOT / "www" / "livestream01" / "720",
                  ROOT / "www" / "livestream01" / "1080",
              ]
              audio_root = ROOT / "www" / "livestream01" / "audio"
              if audio_root.is_dir():
                  folders.extend(p for p in audio_root.iterdir() if p.is_dir())
              for folder in folders:
                  for path in folder.glob("*.ts"):
                      try:
                          if now - path.stat().st_mtime > 300:
                              path.unlink()
                      except OSError:
                          pass


          CONTROL_HTML = r"""<!doctype html>
