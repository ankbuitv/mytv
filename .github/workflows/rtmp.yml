name: IPTV Cloudflare - test OBS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install bore
        shell: bash
        run: |
          set -eu
          cargo install --locked bore-cli --root /tmp/bore-install

      - name: Start MediaMTX and tunnels
        env:
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        shell: bash
        run: |
          set -eu

          if [ -z "$PUBLISH_PASSWORD" ] || [ -z "$TUNNEL_TOKEN" ]; then
            echo "Thiếu PUBLISH_PASSWORD hoặc CLOUDFLARE_TUNNEL_TOKEN."
            exit 1
          fi

          if ! [[ "$PUBLISH_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "PUBLISH_PASSWORD chỉ được gồm chữ và số."
            exit 1
          fi

          cleanup() {
            if [ -n "${BORE_PID:-}" ]; then
              kill "$BORE_PID" 2>/dev/null || true
            fi

            if [ -n "${LOG_PID:-}" ]; then
              kill "$LOG_PID" 2>/dev/null || true
            fi

            docker rm -f iptv-cloudflared iptv-mediamtx \
              >/dev/null 2>&1 || true
            rm -f /tmp/iptv-mediamtx.yml
          }
          trap cleanup EXIT

          cat > /tmp/iptv-mediamtx.yml <<EOF
          authMethod: internal

          authInternalUsers:
            - user: publisher
              pass: "$PUBLISH_PASSWORD"
              permissions:
                - action: publish
                  path: live/channel

            - user: any
              pass:
              permissions:
                - action: read
                  path: live/channel

          hlsAlwaysRemux: yes

          paths:
            live/channel:
          EOF

          # MediaMTX chỉ mở cổng trên localhost của runner.
          docker run -d --name iptv-mediamtx \
            -p 127.0.0.1:1935:1935 \
            -p 127.0.0.1:8888:8888 \
            -v /tmp/iptv-mediamtx.yml:/mediamtx.yml:ro \
            bluenviron/mediamtx:1.21.3

          # Cloudflare connector dùng mạng host để tới localhost:8888.
          # Token truyền qua biến môi trường, không in ra log.
          docker run -d --name iptv-cloudflared \
            --network host \
            -e TUNNEL_TOKEN \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run

          # bore public cổng RTMP cho OBS.
          /tmp/bore-install/bin/bore local 1935 --to bore.pub \
            > /tmp/iptv-bore.log 2>&1 &
          BORE_PID=$!

          RTMP_ADDR=""

          for i in $(seq 1 60); do
            RTMP_ADDR=$(grep -oE 'bore\.pub:[0-9]+' \
              /tmp/iptv-bore.log | head -n 1 || true)

            if [ -n "$RTMP_ADDR" ]; then
              break
            fi

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ -z "$RTMP_ADDR" ]; then
            echo "Không mở được bore:"
            cat /tmp/iptv-bore.log
            exit 1
          fi

          echo ""
          echo "========= OBS ========="
          echo "Server: rtmp://$RTMP_ADDR/live"
          echo "Stream Key: channel?user=publisher&pass=MAT_KHAU_CUA_BRO"
          echo ""
          echo "========= HLS TEST ========="
          echo "https://ott0.ankworks.bond/live/channel/index.m3u8"
          echo "============================"
          echo "Đợi Cloudflare Tunnel kết nối, bật OBS rồi mở HLS."
          echo ""

          echo "=== MediaMTX log ==="
          docker logs -f iptv-mediamtx &
          LOG_PID=$!

          while kill -0 "$BORE_PID" 2>/dev/null \
            && [ "$(docker inspect -f '{{.State.Running}}' iptv-mediamtx)" = "true" ] \
            && [ "$(docker inspect -f '{{.State.Running}}' iptv-cloudflared)" = "true" ]; do
            sleep 5
          done

          echo "Một thành phần đã dừng."
          echo "=== bore ==="
          cat /tmp/iptv-bore.log
          echo "=== MediaMTX ==="
          docker logs iptv-mediamtx
          echo "=== Cloudflare connector ==="
          docker logs iptv-cloudflared
          exit 1
