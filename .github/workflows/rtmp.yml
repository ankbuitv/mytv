          <script>
          const csrf = "__CSRF__";

          function showMessage(text) {
            document.getElementById("message").textContent = text;
          }

          async function sendAction(action, extra = {}) {
            try {
              const response = await fetch("/control/api/action", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRF-Token": csrf
                },
                body: JSON.stringify({ action, ...extra }),
                cache: "no-store"
              });

              const data = await response.json();

              if (!response.ok) {
                throw new Error(data.error || ("HTTP " + response.status));
              }

              showMessage(data.message || "Đã gửi lệnh.");
              await refreshStatus();
            } catch (error) {
              showMessage("Lỗi: " + error.message);
            }
          }

          function emergencyOn() {
            if (confirm("Bật khẩn và chuyển sang fallback?")) {
              sendAction("emergency_on");
            }
          }

          function playDirect() {
            const url = document.getElementById("url").value.trim();

            if (!url) {
              showMessage("Bro hãy dán link trước.");
              return;
            }

            sendAction("direct", {
              url,
              ident: document.getElementById("withIdent").checked
            });
          }

          async function refreshStatus() {
            try {
              const response = await fetch("/control/api/status", {
                cache: "no-store"
              });

              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              const data = await response.json();

              const status = document.getElementById("status");

              status.textContent =
                "Khẩn cấp: " + (data.emergency ? "ĐANG BẬT" : "Tắt") + "\n" +
                "Chế độ điều khiển: " + data.control_mode + "\n" +
                "Đang phát: " + data.current_mode + "\n" +
                "Nguồn: " + data.current_name + "\n" +
                "FFmpeg: " + (data.ffmpeg_running ? "Đang chạy" : "Không chạy") + "\n" +
                "Worker đọc thành công gần nhất: " + (data.config_last_ok || "Chưa có") + "\n" +
                "Worker: " + (data.config_fetching
                  ? "Đang đọc..."
                  : (data.config_error || "OK"));

              status.style.whiteSpace = "pre-line";

              document.getElementById("logs").textContent =
                data.logs.join("\n");
            } catch (error) {
              showMessage("Không tải được trạng thái: " + error.message);
            }
          }

          refreshStatus();
          setInterval(refreshStatus, 3000);
          </script>
          </body>
          </html>
          """

          class ControlHandler(BaseHTTPRequestHandler):
              server_version = "VeoTVControl"

              def log_message(self, format, *args):
                  # Không ghi URL hoặc header request vào log.
                  return

              def authenticated(self):
                  header = self.headers.get("Authorization", "")

                  if not header.startswith("Basic "):
                      return False

                  try:
                      raw = base64.b64decode(
                          header[6:],
                          validate=True,
                      ).decode("utf-8")

                      user, password = raw.split(":", 1)

                      return (
                          hmac.compare_digest(user, CONTROL_USER)
                          and hmac.compare_digest(
                              password,
                              CONTROL_PASSWORD,
                          )
                      )

                  except Exception:
                      return False

              def send_bytes(self, code, body, content_type):
                  self.send_response(code)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header(
                      "Referrer-Policy",
                      "no-referrer",
                  )
                  self.end_headers()
                  self.wfile.write(body)

              def send_json(self, code, value):
                  body = json.dumps(
                      value,
                      ensure_ascii=False,
                  ).encode("utf-8")

                  self.send_bytes(
                      code,
                      body,
                      "application/json; charset=utf-8",
                  )

              def require_auth(self):
                  if self.authenticated():
                      return True

                  body = b"Authentication required"

                  self.send_response(401)
                  self.send_header(
                      "WWW-Authenticate",
                      'Basic realm="VeoTV Control", charset="UTF-8"',
                  )
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

                  return False

              def do_GET(self):
                  if not self.require_auth():
                      return

                  path = urlsplit(self.path).path

                  if path == "/control/":
                      html = CONTROL_HTML.replace(
                          "__CSRF__",
                          csrf_token,
                      )

                      self.send_bytes(
                          200,
                          html.encode("utf-8"),
                          "text/html; charset=utf-8",
                      )
                      return

                  if path == "/control/api/status":
                      with lock:
                          if shared["direct_url"]:
                              control_mode = "Link trực tiếp"
                          else:
                              control_mode = "Worker"

                          data = {
                              "emergency": shared["emergency"],
                              "control_mode": control_mode,
                              "current_mode": shared["current_mode"],
                              "current_name": shared["current_name"],
                              "ffmpeg_running": shared["ffmpeg_running"],
                              "config_last_ok": shared["config_last_ok"],
                              "config_error": shared["config_error"],
                              "config_fetching": shared["config_fetching"],
                              "logs": list(logs),
                          }

                      self.send_json(200, data)
                      return

                  self.send_json(404, {"error": "Không tìm thấy."})

              def do_POST(self):
                  if not self.require_auth():
                      return

                  path = urlsplit(self.path).path

                  if path != "/control/api/action":
                      self.send_json(404, {"error": "Không tìm thấy."})
                      return

                  origin = self.headers.get("Origin", "")

                  if origin != "https://ott0.ankworks.bond":
                      self.send_json(403, {"error": "Origin không hợp lệ."})
                      return

                  supplied_csrf = self.headers.get(
                      "X-CSRF-Token",
                      "",
                  )

                  if not hmac.compare_digest(
                      supplied_csrf,
                      csrf_token,
                  ):
                      self.send_json(403, {"error": "CSRF không hợp lệ."})
                      return

                  content_type = self.headers.get(
                      "Content-Type",
                      "",
                  ).split(";", 1)[0].strip().lower()

                  if content_type != "application/json":
                      self.send_json(415, {"error": "Cần JSON."})
                      return

                  try:
                      length = int(
                          self.headers.get("Content-Length", "0")
                      )

                      if length <= 0 or length > 8192:
                          raise ValueError("Kích thước không hợp lệ")

                      body = self.rfile.read(length)
                      data = json.loads(body)

                      if not isinstance(data, dict):
                          raise ValueError("JSON không hợp lệ")

                  except Exception:
                      self.send_json(400, {"error": "Dữ liệu không hợp lệ."})
                      return

                  action = data.get("action")

                  if action == "refresh":
                      fetch_event.set()
                      log("Control: yêu cầu đọc lại Worker.")

                      self.send_json(
                          200,
                          {"message": "Đã yêu cầu đọc lại Worker."},
                      )
                      return

                  if action == "restart":
                      with lock:
                          shared["restart_seq"] += 1

                      log("Control: yêu cầu restart nguồn.")

                      self.send_json(
                          200,
                          {"message": "Đã yêu cầu restart nguồn."},
                      )
                      return

                  if action == "ident":
                      with lock:
                          if shared["emergency"]:
                              self.send_json(
                                  409,
                                  {"error": "Đang khẩn cấp; không phát ident."},
                              )
                              return

                          shared["ident_seq"] += 1

                      log("Control: yêu cầu phát ident.")

                      self.send_json(
                          200,
                          {"message": "Đã yêu cầu phát ident."},
                      )
                      return

                  if action == "emergency_on":
                      with lock:
                          shared["emergency"] = True

                      log("Control: BẬT khẩn cấp.")

                      self.send_json(
                          200,
                          {"message": "Đã bật khẩn cấp."},
                      )
                      return

                  if action == "emergency_off":
                      with lock:
                          shared["emergency"] = False

                      fetch_event.set()
                      log("Control: TẮT khẩn cấp.")

                      self.send_json(
                          200,
                          {
                              "message": (
                                  "Đã tắt khẩn cấp; "
                                  "runner đang quay lại chế độ trước."
                              )
                          },
                      )
                      return

                  if action == "direct":
                      url = data.get("url", "")

                      if not valid_direct_url(url):
                          self.send_json(
                              400,
                              {"error": "Link HTTP/HTTPS không hợp lệ."},
                          )
                          return

                      with lock:
                          if shared["emergency"]:
                              self.send_json(
                                  409,
                                  {"error": "Hãy tắt khẩn cấp trước."},
                              )
                              return

                          shared["direct_url"] = url

                          if data.get("ident") is True:
                              shared["ident_seq"] += 1

                      log("Control: chọn link trực tiếp.")

                      self.send_json(
                          200,
                          {"message": "Đã chọn link trực tiếp."},
                      )
                      return

                  if action == "worker":
                      with lock:
                          shared["direct_url"] = None

                      fetch_event.set()
                      log("Control: quay về Worker.")

                      self.send_json(
                          200,
                          {"message": "Đã chọn lịch Worker."},
                      )
                      return

                  self.send_json(
                      400,
                      {"error": "Lệnh không hợp lệ."},
                  )

          class ControlServer(ThreadingHTTPServer):
              daemon_threads = True

          control_server = ControlServer(
              ("127.0.0.1", 8091),
              ControlHandler,
          )

          threading.Thread(
              target=control_server.serve_forever,
              daemon=True,
          ).start()

          threading.Thread(
              target=config_loop,
              daemon=True,
          ).start()

          threading.Thread(
              target=video_probe_loop,
              daemon=True,
          ).start()

          threading.Thread(
              target=audio_probe_loop,
              daemon=True,
          ).start()

          log("Supervisor bắt đầu.")
          log("Trang control đã khởi động.")
          log("Đây là bản FFmpeg thử nghiệm; HLS vẫn có thể khựng.")

          seen_restart_seq = 0
          seen_ident_seq = 0
          was_emergency = False

          try:
              while not stop_event.is_set():
                  try:
                      with lock:
                          config = shared["config"]
                          emergency = shared["emergency"]
                          direct_url = shared["direct_url"]
                          restart_seq = shared["restart_seq"]
                          ident_seq = shared["ident_seq"]

                      # Fallback mặc định vẫn hoạt động ngay cả khi
                      # Worker chưa từng đọc thành công.
                      effective_config = (
                          config if isinstance(config, dict) else {}
                      )

                      # Ưu tiên khẩn cao nhất, không chờ Worker.
                      if emergency:
                          if not was_emergency:
                              log("Đang chuyển sang fallback khẩn cấp.")

                              if ident_playing:
                                  stop_ffmpeg()

                              ident_playing = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0

                              previous_selection = None

                          was_emergency = True

                          # Lệnh ident/restart cũ không được chạy muộn.
                          seen_ident_seq = ident_seq
                          seen_restart_seq = restart_seq

                          set_audio_candidates(
                              fallback_audio_candidates(effective_config)
                          )

                          with lock:
                              audio_url = shared["audio_result"]
                              shared["current_name"] = "Khẩn cấp"

                          relevant = {
                              "logo": effective_config.get("logo", {}),
                              "banner": effective_config.get("banner", {}),
                          }

                          emergency_key = (
                              "emergency",
                              audio_url,
                              signature(relevant),
                          )

                          if process is not None and process.poll() is not None:
                              log(
                                  "FFmpeg khẩn đã thoát, mã: "
                                  + str(process.returncode)
                              )

                              process = None
                              current_key = None

                              with lock:
                                  shared["ffmpeg_running"] = False

                          if (
                              emergency_key != current_key
                              or process is None
                          ):
                              # Khi vừa bật khẩn, không chờ RESTART_DELAY.
                              if (
                                  current_key is None
                                  or time.monotonic() - last_start
                                  >= RESTART_DELAY
                              ):
                                  start_ffmpeg(
                                      effective_config,
                                      "fallback",
                                      audio_url=audio_url,
                                  )

                                  current_key = emergency_key
                                  current_mode = "fallback"

                          stop_event.wait(0.5)
                          continue

                      if was_emergency:
                          log("Đã thoát khẩn cấp.")

                          was_emergency = False
                          previous_selection = None
                          current_key = None
                          current_mode = None
                          last_start = 0.0

                      # Link trực tiếp không phụ thuộc Worker.
                      if direct_url:
                          program = direct_program(direct_url)

                      elif config is not None:
                          program = select_program(config)

                      else:
                          # Nếu Worker chưa có dữ liệu, dùng fallback.
                          program = {
                              "reason": "no_config",
                              "name": "Chưa có cấu hình Worker",
                              "kind": "source",
                              "url": None,
                              "occurrence": None,
                              "waiting": {},
                          }

                      reason = program["reason"]
                      occurrence = program["occurrence"]

                      with lock:
                          shared["current_name"] = sanitize(
                              program["name"]
                          )

                      current_selection = (
                          reason,
                          occurrence,
                      )

                      schedule_changed = False

                      if previous_selection is not None:
                          previous_reason, previous_occurrence = (
                              previous_selection
                          )

                          if (
                              previous_reason in ("epg", "default")
                              and reason == "epg"
                              and occurrence != previous_occurrence
                          ):
                              schedule_changed = True

                      previous_selection = current_selection

                      selected = (
                          program["kind"],
                          program["url"],
                      )

                      with lock:
                          if selected != shared["selected"]:
                              shared["selected"] = selected
                              shared["generation"] += 1
                              shared["video_available"] = False
                              shared["video_failures"] = 0
                              changed = True
                          else:
                              changed = False

                          video_available = shared["video_available"]

                      if changed:
                          log(
                              "Nguồn được chọn: "
                              + program["name"]
                              + " ("
                              + reason
                              + ", "
                              + program["kind"]
                              + ")."
                          )

                      # Restart không tự phát ident.
                      if restart_seq != seen_restart_seq:
                          seen_restart_seq = restart_seq

                          log("Thực hiện restart nguồn.")

                          stop_ffmpeg()

                          ident_playing = False
                          current_key = None
                          current_mode = None
                          last_start = 0.0

                      manual_ident_requested = (
                          ident_seq != seen_ident_seq
                      )

                      if manual_ident_requested:
                          seen_ident_seq = ident_seq

                      # Manual Worker được phép ngắt ident tự động.
                      # Ident do nút control yêu cầu vẫn được phát.
                      if (
                          ident_playing
                          and reason == "manual"
                          and not manual_ident_requested
                      ):
                          log("Manual Worker được chọn: ngắt ident.")
                          stop_ffmpeg()
                          ident_playing = False
                          current_key = None
                          current_mode = None
                          last_start = 0.0

                      if schedule_changed or manual_ident_requested:
                          duration = ident_duration()

                          if duration is None:
                              log(
                                  "Ident không hợp lệ hoặc không có; "
                                  "bỏ qua."
                              )

                              if ident_playing:
                                  stop_ffmpeg()
                                  ident_playing = False
                                  current_key = None
                                  current_mode = None
                                  last_start = 0.0

                          else:
                              if manual_ident_requested:
                                  log(
                                      "Control phát ident "
                                      + f"{duration:.1f} giây."
                                  )
                              else:
                                  log(
                                      "Lịch chuyển sang "
                                      + program["name"]
                                      + f"; phát ident {duration:.1f} giây."
                                  )

                              start_ffmpeg(
                                  effective_config,
                                  "ident",
                                  duration=duration,
                              )

                              ident_playing = True
                              ident_deadline = (
                                  time.monotonic()
                                  + duration
                                  + 20
                              )

                              current_key = (
                                  "ident",
                                  occurrence,
                              )

                              current_mode = "ident"

                      if ident_playing:
                          if process is None or process.poll() is not None:
                              code = (
                                  None
                                  if process is None
                                  else process.returncode
                              )

                              log(f"Ident kết thúc; mã {code}.")

                              process = None
                              ident_playing = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0

                              with lock:
                                  shared["ffmpeg_running"] = False

                          elif time.monotonic() >= ident_deadline:
                              log("Ident quá thời gian; chuyển tiếp.")

                              stop_ffmpeg()
                              ident_playing = False
                              current_key = None
                              current_mode = None
                              last_start = 0.0

                          else:
                              stop_event.wait(0.5)
                              continue

                      if process is not None and process.poll() is not None:
                          log(
                              "FFmpeg đã thoát, mã: "
                              + str(process.returncode)
                          )

                          process = None
                          current_key = None
                          current_mode = None

                          with lock:
                              shared["ffmpeg_running"] = False

                      if video_available:
                          desired_mode = (
                              "waiting"
                              if program["kind"] == "waiting"
                              else "main"
                          )
                      else:
                          desired_mode = "fallback"

                      if desired_mode == "waiting":
                          set_audio_candidates(
                              waiting_audio_candidates(program)
                          )

                      elif desired_mode == "fallback":
                          set_audio_candidates(
                              fallback_audio_candidates(effective_config)
                          )

                      else:
                          set_audio_candidates(())

                      with lock:
                          audio_url = shared["audio_result"]

                      logo_cfg = effective_config.get("logo", {})

                      if desired_mode == "waiting":
                          relevant = {
                              "logo": logo_cfg,
                              "waiting": program["waiting"],
                          }

                          desired_key = (
                              "waiting",
                              program["url"],
                              audio_url,
                              signature(relevant),
                          )

                      elif desired_mode == "fallback":
                          relevant = {
                              "logo": logo_cfg,
                              "banner": effective_config.get("banner", {}),
                          }

                          desired_key = (
                              "fallback",
                              program["kind"],
                              program["url"],
                              audio_url,
                              signature(relevant),
                          )

                      else:
                          desired_key = (
                              "main",
                              program["url"],
                              signature({"logo": logo_cfg}),
                          )

                      now = time.monotonic()

                      can_restart = (
                          now - last_start >= RESTART_DELAY
                      )

                      if (
                          desired_key != current_key
                          or process is None
                      ) and can_restart:

                          if desired_mode == "fallback":
                              log(
                                  "Video được chọn chưa khả dụng; "
                                  "phát fallback."
                              )

                          elif desired_mode == "waiting":
                              log(
                                  "Phát chờ event; tiếng gốc video "
                                  "được tắt."
                              )

                          else:
                              log(
                                  "Phát nguồn chính: "
                                  + program["name"]
                              )

                          start_ffmpeg(
                              effective_config,
                              desired_mode,
                              source_url=program["url"],
                              audio_url=audio_url,
                              waiting=program["waiting"],
                          )

                          current_key = desired_key
                          current_mode = desired_mode

                      if time.monotonic() - last_cleanup > 60:
                          cleanup_old_segments()
                          last_cleanup = time.monotonic()

                  except Exception as exc:
                      log(
                          "Lỗi supervisor: "
                          + type(exc).__name__
                          + ": "
                          + str(exc)
                      )

                  stop_event.wait(0.5)

          finally:
              stop_event.set()
              fetch_event.set()
              stop_ffmpeg()
              control_server.shutdown()
              control_server.server_close()
              log("Supervisor đã dừng.")
          PY

          python3 -u "$ROOT/supervisor.py" &
          SUP_PID=$!

          while kill -0 "$CF_PID" 2>/dev/null \
            && kill -0 "$NGINX_PID" 2>/dev/null \
            && kill -0 "$SUP_PID" 2>/dev/null \
            && [ "$(docker inspect -f '{{.State.Running}}' veotv-mediamtx)" = "true" ]; do
            sleep 5
          done

          echo ">>> Một thành phần đã dừng."

          echo "=== cloudflared ==="
          cat "$ROOT/cloudflared.log" 2>/dev/null || true

          echo "=== nginx ==="
          cat "$ROOT/nginx-error.log" 2>/dev/null || true

          echo "=== MediaMTX ==="
          docker logs veotv-mediamtx 2>&1 || true

          exit 1
