name: RTMP test bore

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install bore
        shell: bash
        run: |
          set -eu

          # Runner Ubuntu thường đã có Rust/Cargo.
          cargo --version

          # Cài bore vào thư mục tạm của runner.
          cargo install --locked bore-cli --root /tmp/bore-install

      - name: Start MediaMTX and tunnels
        shell: bash
        run: |
          set -eu

          docker run -d --name mediamtx \
            -p 1935:1935 \
            -p 8888:8888 \
            bluenviron/mediamtx:latest

          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

          cleanup() {
            kill "${BORE_PID:-}" "${CF_PID:-}" 2>/dev/null || true
            docker rm -f mediamtx >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Đưa cổng RTMP lên bore.pub.
          /tmp/bore-install/bin/bore local 1935 --to bore.pub \
            > /tmp/bore.log 2>&1 &
          BORE_PID=$!

          # Public HLS đầu ra để xem bằng VLC.
          /tmp/cloudflared tunnel --url http://localhost:8888 \
            > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          RTMP_ADDR=""
          HLS_HOST=""

          echo "Đang chờ bore và Cloudflare Tunnel..."

          for i in $(seq 1 60); do
            if [ -z "$RTMP_ADDR" ]; then
              RTMP_ADDR=$(grep -oE 'bore\.pub:[0-9]+' \
                /tmp/bore.log | head -n 1 || true)
            fi

            if [ -z "$HLS_HOST" ]; then
              HLS_HOST=$(grep -oE \
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log | head -n 1 || true)
            fi

            if [ -n "$RTMP_ADDR" ] && [ -n "$HLS_HOST" ]; then
              break
            fi

            if ! kill -0 "$BORE_PID" 2>/dev/null \
              || ! kill -0 "$CF_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ -z "$RTMP_ADDR" ] || [ -z "$HLS_HOST" ]; then
            echo "Không mở được tunnel."
            echo "=== bore log ==="
            cat /tmp/bore.log
            echo "=== cloudflared log ==="
            cat /tmp/cloudflared.log
            exit 1
          fi

          # Đường dẫn ngẫu nhiên để tránh dùng stream key dễ đoán.
          STREAM_KEY=$(openssl rand -hex 12)

          echo ""
          echo "========== CẤU HÌNH OBS =========="
          echo "Server:     rtmp://$RTMP_ADDR/live"
          echo "Stream Key: $STREAM_KEY"
          echo ""
          echo "========== LINK VLC =============="
          echo "$HLS_HOST/live/$STREAM_KEY/index.m3u8"
          echo "=================================="
          echo "Bắt đầu OBS, chờ vài giây rồi mở link VLC."
          echo "Workflow tự dừng sau tối đa 30 phút."

          while kill -0 "$BORE_PID" 2>/dev/null \
            && kill -0 "$CF_PID" 2>/dev/null; do
            sleep 5
          done

          echo "Một tunnel đã dừng."
          echo "=== bore log ==="
          cat /tmp/bore.log
          echo "=== cloudflared log ==="
          cat /tmp/cloudflared.log
          exit 1
