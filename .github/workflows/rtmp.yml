name: VeoTV live prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veotv-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Install tools
        shell: bash
        run: |
          set -eu
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --fix-missing \
            ffmpeg \
            nginx \
            fonts-dejavu-core \
            curl \
            ca-certificates

          echo ">>> Tải cloudflared từ GitHub..."
          if curl -fL \
            --retry 2 \
            --retry-delay 3 \
            --max-time 120 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /tmp/cloudflared
          then
            echo ">>> Đã tải cloudflared từ GitHub."
          else
            echo ">>> GitHub tải lỗi, thử kho APT Cloudflare..."
            rm -f /tmp/cloudflared
            sudo mkdir -p /usr/share/keyrings
            curl -fL \
              --retry 3 \
              --retry-delay 3 \
              --max-time 60 \
              "https://pkg.cloudflare.com/cloudflare-main.gpg" \
              -o /tmp/cloudflare-main.gpg
            sudo install -m 0644 \
              /tmp/cloudflare-main.gpg \
              /usr/share/keyrings/cloudflare-main.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
              | sudo tee /etc/apt/sources.list.d/cloudflared.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y cloudflared
            cp "$(command -v cloudflared)" /tmp/cloudflared
          fi

          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Run VeoTV
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          TUNNEL_CREDENTIALS: ${{ secrets.TUNNEL_CREDENTIALS }}
          TUNNEL_ID: ${{ vars.TUNNEL_ID }}
          CONTROL_USER: ${{ secrets.CONTROL_USER }}
          CONTROL_PASSWORD: ${{ secrets.CONTROL_PASSWORD }}
        run: |
          set -eu
          umask 077

          for var in \
            PUBLISH_PASSWORD \
            RUNNER_TOKEN \
            TUNNEL_CREDENTIALS \
            TUNNEL_ID \
            CONTROL_USER \
            CONTROL_PASSWORD
          do
            if [ -z "${!var:-}" ]; then
              echo "Thiếu cấu hình: $var"
              exit 1
            fi
          done

          if ! [[ "$PUBLISH_PASSWORD" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "PUBLISH_PASSWORD chỉ được gồm chữ và số."
            exit 1
          fi

          if ! [[ "$TUNNEL_ID" =~ ^[a-fA-F0-9-]+$ ]]; then
            echo "TUNNEL_ID không đúng định dạng."
            exit 1
          fi

          if [ "${#CONTROL_PASSWORD}" -lt 12 ]; then
            echo "CONTROL_PASSWORD phải có ít nhất 12 ký tự."
            exit 1
          fi

          TS_IP="$(tailscale ip -4 | head -n 1)"
          if [ -z "$TS_IP" ]; then
            echo "Không lấy được IP Tailscale."
            exit 1
          fi

          ROOT=/tmp/veotv
          mkdir -p \
            "$ROOT/assets" \
            "$ROOT/ads/videos" \
            "$ROOT/ads/images" \
            "$ROOT/www/livestream01/720" \
            "$ROOT/www/livestream01/1080"

          cleanup() {
            for pid in \
              "${SUP_PID:-}" \
              "${CF_PID:-}" \
              "${NGINX_PID:-}" \
              "${LOG_PID:-}"
            do
              if [ -n "$pid" ]; then
                kill "$pid" 2>/dev/null || true
              fi
            done
            if [ -n "${SUP_PID:-}" ]; then
              wait "$SUP_PID" 2>/dev/null || true
            fi
            docker rm -f veotv-mediamtx >/dev/null 2>&1 || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT

          echo ">>> Tải ảnh fallback..."
          if ! curl -fL --retry 2 --max-time 30 \
            "https://i.ibb.co/b5ZC62p5/1-1.png" \
            -o "$ROOT/assets/fallback.png"
          then
            echo ">>> Không tải được fallback; tạo nền tối."
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi \
              -i "color=c=0x15172b:s=1280x720" \
              -frames:v 1 \
              -threads 1 \
              "$ROOT/assets/fallback.png"
          fi

          echo ">>> Tải logo..."
          if curl -fsSL --retry 2 --max-time 30 \
            "https://i.ibb.co/xtShkTkr/logo.png" \
            -o "$ROOT/assets/logo.png"
          then
            echo ">>> Đã tải logo mặc định ($(wc -c < "$ROOT/assets/logo.png" 2>/dev/null || echo 0) bytes)."
          else
            echo ">>> Không tải được logo; tạo ảnh trong suốt."
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi \
              -i "color=c=black@0.0:s=100x100,format=rgba" \
              -frames:v 1 \
              -threads 1 \
              "$ROOT/assets/logo.png"
          fi

          download_ident() {
            local name="$1"
            local url="$2"
            local target="$ROOT/assets/$name.mp4"

            echo ">>> Đang tải $name..."
            local auth_args=()
            if [[ "$url" == *"raw.githubusercontent.com/ankbuitv/mytv/"* ]] && [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_args=(-H "Authorization: Bearer $GITHUB_TOKEN")
            fi
            if curl -fsSL \
              --retry 2 \
              --retry-delay 2 \
              --max-time 120 \
              "${auth_args[@]}" \
              "$url" \
              -o "$target"
            then
              if ffprobe -v error \
                -select_streams v:0 \
                -show_entries stream=codec_type \
                -of csv=p=0 \
                "$target" | grep -q video
              then
                local size
                size=$(wc -c < "$target" 2>/dev/null || echo 0)
                echo ">>> $name có video hợp lệ (${size} bytes)."
              else
                echo ">>> $name không có video hợp lệ; bỏ qua."
                rm -f "$target"
              fi
            else
              echo ">>> Không tải được $name; bỏ qua."
              rm -f "$target"
            fi
          }

          download_ident ident1 \
            "https://raw.githubusercontent.com/ankbuitv/link/refs/heads/main/ident.mp4"
          download_ident ident2 \
            "https://raw.githubusercontent.com/ankbuitv/mytv/refs/heads/main/ident02.mp4"
          download_ident ident3 \
            "https://raw.githubusercontent.com/ankbuitv/mytv/refs/heads/main/ident03.mp4"
          download_ident ident4 \
            "https://raw.githubusercontent.com/ankbuitv/mytv/refs/heads/main/ident04.mp4"

          echo ">>> Quét thư mục ads/ từ ankbuitv/mytv..."
          ADS_JSON="$ROOT/ads_list.json"
          GH_HEADERS=(-H "Accept: application/vnd.github+json" -H "User-Agent: VeoTV-Runner")
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            GH_HEADERS+=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi
          if curl -fsSL --retry 2 --max-time 30 "${GH_HEADERS[@]}" \
            "https://api.github.com/repos/ankbuitv/mytv/contents/ads" \
            -o "$ADS_JSON"
          then
            python3 - "$ADS_JSON" "$ROOT" "${GITHUB_TOKEN:-}" <<'PYADS'
          import json, os, pathlib, subprocess, sys, urllib.request
          json_path, root_dir, gh_token = sys.argv[1], sys.argv[2], sys.argv[3]
          root = pathlib.Path(root_dir)
          try:
              items = json.loads(pathlib.Path(json_path).read_text(encoding="utf-8"))
          except Exception as exc:
              print(">>> Lỗi đọc danh sách ads:", exc)
              sys.exit(0)
          if not isinstance(items, list):
              sys.exit(0)
          for item in items:
              if not isinstance(item, dict) or item.get("type") != "file":
                  continue
              name = str(item.get("name", ""))
              url = str(item.get("download_url", ""))
              if not name or not url:
                  continue
              low = name.lower()
              safe_name = os.path.basename(name)
              if low == "ad_ident.mp4":
                  dest = root / "assets" / "ad_ident.mp4"
              elif low.endswith((".mp4", ".mov", ".m4v")):
                  dest = root / "ads" / "videos" / safe_name
              elif low.endswith((".png", ".jpg", ".jpeg", ".webp")):
                  dest = root / "ads" / "images" / safe_name
              else:
                  continue
              req = urllib.request.Request(url, headers={"User-Agent": "VeoTV-Runner"})
              if gh_token:
                  req.add_header("Authorization", "Bearer " + gh_token)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = resp.read()
                  dest.write_bytes(data)
                  print(f">>> Đã tải QC: {safe_name} ({len(data)} bytes)")
              except Exception as exc:
                  print(f">>> Lỗi tải QC {safe_name}: {exc}")
          PYADS
          else
            echo ">>> Không quét được thư mục ads/ (có thể chưa có file)."
          fi
          rm -f "$ADS_JSON"

          printf '%s' "$TUNNEL_CREDENTIALS" > "$ROOT/credentials.json"

          cat > "$ROOT/mediamtx.yml" <<EOF
          authMethod: internal

          authInternalUsers:
            - user: publisher
              pass: "$PUBLISH_PASSWORD"
              permissions:
                - action: publish
                  path: live/channel
            - user: any
              pass:
              permissions:
                - action: read
                  path: live/channel

          paths:
            live/channel:
          EOF

          docker run -d \
            --name veotv-mediamtx \
            -p 127.0.0.1:1935:1935 \
            -p "$TS_IP:1935:1935" \
            -v "$ROOT/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.21.3

          cat > "$ROOT/www/livestream01/manifest.m3u8" <<'EOF'
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=3300000,RESOLUTION=1280x720
          720/index.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=5800000,RESOLUTION=1920x1080
          1080/index.m3u8
          EOF

          cat > "$ROOT/nginx.conf" <<'EOF'
          worker_processes 1;
          error_log /tmp/veotv/nginx-error.log warn;
          pid /tmp/veotv/nginx.pid;

          events {
            worker_connections 1024;
          }

          http {
            server_tokens off;
            access_log off;

            types {
              application/vnd.apple.mpegurl m3u8;
              video/mp2t ts;
              image/jpeg jpg jpeg;
              application/json json;
            }

            server {
              listen 127.0.0.1:8080;
              root /tmp/veotv/www;

              location = /control {
                return 301 /control/;
              }

              location /control/ {
                proxy_pass http://127.0.0.1:8091;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Authorization $http_authorization;

                add_header Cache-Control "no-store" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
              }

              location /livestream01/ {
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Access-Control-Allow-Origin "*" always;
                add_header X-Content-Type-Options "nosniff" always;
              }

              location / {
                return 404;
              }
            }
          }
          EOF

          nginx -t -c "$ROOT/nginx.conf"
          nginx -c "$ROOT/nginx.conf" -g 'daemon off;' &
          NGINX_PID=$!

          cat > "$ROOT/cloudflared.yml" <<EOF
          tunnel: $TUNNEL_ID
          credentials-file: /tmp/veotv/credentials.json

          ingress:
            - hostname: ott0.ankworks.bond
              service: http://localhost:8080
            - service: http_status:404
          EOF

          /tmp/cloudflared \
            --config "$ROOT/cloudflared.yml" \
            tunnel run > "$ROOT/cloudflared.log" 2>&1 &
          CF_PID=$!

          echo ""
          echo "========= OBS QUA TAILSCALE ========="
          echo "Server: rtmp://$TS_IP:1935/live"
          echo "Stream key: channel?user=publisher&pass=MAT_KHAU_CUA_BRO"
          echo ""
          echo "========= HLS ========="
          echo "Master: https://ott0.ankworks.bond/livestream01/manifest.m3u8"
          echo "720p:   https://ott0.ankworks.bond/livestream01/720/index.m3u8"
          echo "1080p:  https://ott0.ankworks.bond/livestream01/1080/index.m3u8"
          echo ""
          echo "========= CONTROL ========="
          echo "https://ott0.ankworks.bond/control/"
          echo "==========================="

          docker logs -f veotv-mediamtx &
          LOG_PID=$!

          cat > "$ROOT/supervisor.py" <<'PY'
          import base64
          import collections
          import hashlib
          import hmac
          import ipaddress
          import json
          import os
          import re
          import secrets
          import signal
          import socket
          import subprocess
          import threading
          import time
          import urllib.error
          import urllib.request
          import uuid
          from datetime import datetime, timedelta
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          ROOT = Path("/tmp/veotv")
          ASSETS = ROOT / "assets"
          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          API_URL = (
              "https://veotv.htxuan-business.workers.dev"
              "/api/runner/config"
          )

          TOKEN = os.environ["RUNNER_TOKEN"]
          CONTROL_USER = os.environ["CONTROL_USER"]
          CONTROL_PASSWORD = os.environ["CONTROL_PASSWORD"]

          OBS_URL = "rtmp://127.0.0.1:1935/live/channel"
          EDM_URL = "https://streams.ankb.qzz.io/mytv/edm.m3u8"
          BACKUP_AUDIO_URL = (
              "https://multi-playlist-zmp3.zmdcdn.me/"
              "-XosZVJX9XA/zhls/playback-realtime/f49e383"
          )

          IDENT_OPTIONS = [
              ("Ident 1", ASSETS / "ident1.mp4", 40),
              ("Ident 2", ASSETS / "ident2.mp4", 35),
              ("Ident 3", ASSETS / "ident3.mp4", 25),
              ("Ident 4", ASSETS / "ident4.mp4", 20),
          ]

          TZ = ZoneInfo("Asia/Ho_Chi_Minh")

          CONFIG_INTERVAL = 30
          PROBE_INTERVAL = 20
          AUDIO_PROBE_INTERVAL = 90
          RESTART_DELAY = 5
          # Chạy sớm (pre-roll): bắt đầu chương trình kế trước giờ để hình lên ĐÚNG giờ.
          PREROLL_MAX = 60.0          # tối đa chạy sớm 60 giây
          PREROLL_MARGIN = 0.3        # cộng thêm cho vòng lặp 0,5 giây
          HLS_SEGMENT_SECONDS = 2.0   # khớp -hls_time 2
          STARTUP_DEFAULT = {"ident": 1.0, "obs": 2.0, "vod": 2.0, "live": 4.0, "udpxy": 6.0}
          STARTUP_EST = {}            # đo thực tế từng lần khởi động (trung bình trượt)
          pending_ident = None        # ident chọn trước cho lần chuyển lịch sắp tới
          current_run_id = ""
          PLAYLIST_STALL_TIMEOUT = 90
          # udpxy khởi động chậm: chờ dữ liệu đầu lâu hơn và cho phép playlist trễ hơn
          UDPXY_RW_TIMEOUT = "30000000"
          UDPXY_ANALYZE = "5000000"
          UDPXY_STALL_TIMEOUT = 180
          current_udpxy = False


          def stall_limit():
              return UDPXY_STALL_TIMEOUT if current_udpxy else PLAYLIST_STALL_TIMEOUT
          MAX_SRT_BYTES = 2 * 1024 * 1024

          AUTH_WINDOW_SEC = 60
          AUTH_MAX_FAILS = 10

          stop_event = threading.Event()
          fetch_event = threading.Event()
          lock = threading.RLock()

          logs = collections.deque(maxlen=300)
          csrf_token = secrets.token_urlsafe(32)
          auth_failures = {}

          shared = {
              "config": None,
              "config_last_ok": None,
              "config_error": "Chưa đọc Worker",
              "config_fetching": False,
              "selected": None,
              "generation": 0,
              "video_available": False,
              "video_failures": 0,
              "audio_candidates": (),
              "audio_generation": 0,
              "audio_result": None,
              "emergency": False,
              "direct_url": None,
              "direct_type": "live",
              "direct_subtitle_url": "",
              "direct_subtitle_offset": 0.0,
              "direct_audio_tracks": [],
              "direct_clearkey": "",
              "ad_break_seq": 0,
              "ad_break_queue": [],
              "ad_break_stop_seq": 0,
              "ad_break_with_ident": True,
              "ad_overlay_override": None,
              "restart_seq": 0,
              "ident_seq": 0,
              "current_mode": "Đang khởi động",
              "current_name": "",
              "ffmpeg_running": False,
              "ffmpeg_speed": "",
              "ffmpeg_out_time": "",
          }

          shared.update({
              "stopped": False,
              "stop_occurrence": None,
              "skip_item": None,
              "skip_expire": None,
              "on_backup": False,
              "current_title": "",
              "current_kind": "",
              "current_reason": "",
              "current_window": ("", ""),
          })
          STATUS_DIR = ROOT / "www" / "livestream01"
          START_TS = time.time()
          err_counts = collections.Counter()
          err_lines = collections.deque(maxlen=20)
          events_q = collections.deque(maxlen=200)
          vu_state = {"l": -90.0, "r": -90.0, "pl": -90.0, "pr": -90.0, "ts": 0.0}
          snap_state = {"ts": 0.0}
          last_event_key = None

          process = None
          current_key = None
          current_mode = None
          last_start = 0.0
          last_cleanup = 0.0

          previous_selection = None
          ident_playing = False
          ident_from_control = False
          ident_deadline = 0.0
          last_ident_path = None

          playlist_last_change = time.monotonic()
          playlist_last_signature = None

          URL_RE = re.compile(
              r"(?i)\b(?:https?|rtmps?|rtsp)://[^\s'\"<>]+"
          )

          SECRET_VALUES = [
              os.environ.get("RUNNER_TOKEN", ""),
              os.environ.get("PUBLISH_PASSWORD", ""),
              os.environ.get("CONTROL_PASSWORD", ""),
              os.environ.get("TUNNEL_CREDENTIALS", ""),
              os.environ.get("TAILSCALE_AUTHKEY", ""),
          ]


          def sanitize(value):
              text = str(value)
              text = URL_RE.sub("[URL đã ẩn]", text)
              for secret in SECRET_VALUES:
                  if secret:
                      text = text.replace(secret, "[SECRET]")
              text = re.sub(
                  r"(?i)(token|password|passwd|authorization|secret)"
                  r"([=: ]+)([^\s,;]+)",
                  r"\1\2[SECRET]",
                  text,
              )
              text = text.replace("\r", " ").replace("\n", " ")
              return text[:1000]


          def log(message):
              safe = sanitize(message)
              stamp = datetime.now(TZ).strftime("%H:%M:%S")
              line = f"[{stamp}] {safe}"
              with lock:
                  logs.append(line)
              print(">>> " + safe, flush=True)


          def ffmpeg_log_reader(pipe):
              try:
                  for line in iter(pipe.readline, ""):
                      safe = sanitize(line.strip())
                      if not safe:
                          continue
                      stamp = datetime.now(TZ).strftime("%H:%M:%S")
                      with lock:
                          logs.append(f"[{stamp}] FFmpeg: {safe}")
                      record_ffmpeg_issue(safe, stamp)
                      print("FFmpeg: " + safe, flush=True)
              except Exception:
                  pass
              finally:
                  try:
                      pipe.close()
                  except Exception:
                      pass


          def progress_reader(pipe):
              values = {}
              last_report = 0.0
              try:
                  for line in iter(pipe.readline, ""):
                      line = line.strip()
                      if "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      values[key] = value
                      if key != "progress":
                          continue
                      speed = values.get("speed", "")
                      out_time = values.get("out_time", "")
                      with lock:
                          shared["ffmpeg_speed"] = speed
                          shared["ffmpeg_out_time"] = out_time
                      now = time.monotonic()
                      if now - last_report >= 30:
                          log(
                              "FFmpeg progress: speed="
                              + speed
                              + ", out_time="
                              + out_time
                          )
                          last_report = now
                      values = {}
              except Exception:
                  pass
              finally:
                  try:
                      pipe.close()
                  except Exception:
                      pass


          def on_signal(signum, frame):
              stop_event.set()
              fetch_event.set()


          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)


          def is_blocked_ip(ip_str):
              try:
                  ip_obj = ipaddress.ip_address(ip_str)
              except ValueError:
                  return False
              return (
                  ip_obj.is_private
                  or ip_obj.is_loopback
                  or ip_obj.is_link_local
                  or ip_obj.is_multicast
                  or ip_obj.is_reserved
                  or ip_obj.is_unspecified
              )


          def is_safe_public_host(hostname):
              if not hostname:
                  return False
              low = hostname.lower().rstrip(".")
              if (
                  low in ("localhost", "ip6-localhost", "ip6-loopback")
                  or low.endswith((".local", ".internal", ".localhost"))
              ):
                  return False
              if is_blocked_ip(low):
                  return False
              try:
                  infos = socket.getaddrinfo(low, None, proto=socket.IPPROTO_TCP)
              except OSError:
                  return True
              for info in infos:
                  addr = info[4][0].split("%", 1)[0]
                  if is_blocked_ip(addr):
                      return False
              return True


          def valid_url(value, allow_internal_obs=False):
              if not isinstance(value, str):
                  return False
              if not value or len(value) > 4096:
                  return False
              if any(ch in value for ch in ("\r", "\n", "\x00")):
                  return False
              if allow_internal_obs and value == OBS_URL:
                  return True
              try:
                  parsed = urlsplit(value)
                  if parsed.scheme.lower() not in ("http", "https", "rtmp"):
                      return False
                  return is_safe_public_host(parsed.hostname)
              except Exception:
                  return False


          def valid_direct_url(value):
              if not valid_url(value):
                  return False
              try:
                  return urlsplit(value).scheme.lower() in ("http", "https")
              except Exception:
                  return False


          UDPXY_RE = re.compile(
              r"(?i)^https?://[^/]+/(?:rtp|udp)/[0-9a-z.\-:\[\]]+(?:\?.*)?$"
          )


          def is_udpxy(url):
              return isinstance(url, str) and bool(UDPXY_RE.match(url))


          def is_mp4(value):
              try:
                  return urlsplit(value).path.lower().endswith(
                      (".mp4", ".m4v", ".mov")
                  )
              except Exception:
                  return False


          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not valid_direct_url(newurl):
                      raise urllib.error.URLError("Redirect bị chặn")
                  return super().redirect_request(
                      req, fp, code, msg, headers, newurl
                  )


          _safe_opener = urllib.request.build_opener(SafeRedirectHandler)


          SRT_TS_RE = re.compile(
              r"(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})"
          )


          def shift_srt_timestamps(text, offset_sec):
              if not offset_sec:
                  return text
              offset_ms = int(round(offset_sec * 1000))

              def _fmt(ms):
                  ms = max(0, ms)
                  h, rem = divmod(ms, 3600000)
                  m, rem = divmod(rem, 60000)
                  s, mil = divmod(rem, 1000)
                  return f"{h:02d}:{m:02d}:{s:02d},{mil:03d}"

              def _repl(match):
                  h1, m1, s1, ms1, h2, m2, s2, ms2 = map(int, match.groups())
                  t1 = ((h1 * 3600 + m1 * 60 + s1) * 1000 + ms1) + offset_ms
                  t2 = ((h2 * 3600 + m2 * 60 + s2) * 1000 + ms2) + offset_ms
                  return f"{_fmt(t1)} --> {_fmt(t2)}"

              return SRT_TS_RE.sub(_repl, text)


          def download_subtitle(url, offset_sec=0.0):
              if not url or not valid_direct_url(url):
                  return None, ""
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "VeoTV-Control/5.1",
                          "Accept": "text/plain, application/x-subrip, */*",
                      },
                  )
                  with _safe_opener.open(req, timeout=10) as resp:
                      raw = resp.read(MAX_SRT_BYTES + 1)
                  if len(raw) > MAX_SRT_BYTES:
                      log("Phụ đề .srt vượt quá 2 MB; bỏ qua.")
                      return None, ""
                  text = raw.decode("utf-8-sig", errors="replace")
                  stripped = text.lstrip()
                  if not stripped or stripped.startswith("<"):
                      log("File phụ đề không hợp lệ (trống hoặc HTML); bỏ qua.")
                      return None, ""
                  if offset_sec:
                      text = shift_srt_timestamps(text, offset_sec)
                  srt_path = ROOT / "current.srt"
                  srt_path.write_text(text, encoding="utf-8")
                  digest = hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]
                  log(f"Đã tải phụ đề .srt ({len(raw)} bytes, offset={offset_sec:+.1f}s).")
                  return srt_path, digest
              except Exception as exc:
                  log("Không tải được phụ đề .srt: " + type(exc).__name__)
                  return None, ""


          def fetch_config():
              request = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "User-Agent": "VeoTV-Control/5.1",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  data = json.load(response)
              if not isinstance(data, dict):
                  raise ValueError("Cấu hình không phải object")
              return data


          def config_loop():
              last_error_log = 0.0
              fetch_event.set()
              while not stop_event.is_set():
                  fetch_event.wait(CONFIG_INTERVAL)
                  fetch_event.clear()
                  if stop_event.is_set():
                      break
                  with lock:
                      shared["config_fetching"] = True
                  try:
                      config = fetch_config()
                      with lock:
                          shared["config"] = config
                          shared["config_last_ok"] = (
                              datetime.now(TZ).isoformat(timespec="seconds")
                          )
                          shared["config_error"] = ""
                  except Exception as exc:
                      error_name = type(exc).__name__
                      if isinstance(exc, urllib.error.HTTPError):
                          error_name += f" HTTP {exc.code}"
                      with lock:
                          shared["config_error"] = error_name
                      now = time.monotonic()
                      if now - last_error_log >= 30:
                          log(
                              "Không đọc được Worker: "
                              + error_name
                              + ". Giữ cấu hình gần nhất."
                          )
                          last_error_log = now
                  finally:
                      with lock:
                          shared["config_fetching"] = False


          def time_seconds(value):
              """'HH:MM' hoặc 'HH:MM:SS' -> số giây trong ngày (0..86400)."""
              parts = str(value).strip().split(":")
              if len(parts) not in (2, 3):
                  raise ValueError("Giờ không hợp lệ")
              hour, minute = int(parts[0]), int(parts[1])
              second = int(parts[2]) if len(parts) == 3 else 0
              if not 0 <= hour <= 24 or not 0 <= minute < 60 or not 0 <= second < 60:
                  raise ValueError("Giờ không hợp lệ")
              if hour == 24 and (minute or second):
                  raise ValueError("Chỉ cho phép 24:00")
              return hour * 3600 + minute * 60 + second


          def minute_value(value):
              return time_seconds(value) / 60.0


          def startup_key(url, input_type="live"):
              if not url:
                  return "live"
              if url == OBS_URL:
                  return "obs"
              if is_udpxy(url):
                  return "udpxy"
              if input_type == "vod" or is_mp4(url):
                  return "vod"
              return "live"


          def startup_estimate(key):
              with lock:
                  value = STARTUP_EST.get(key)
              return value if value is not None else STARTUP_DEFAULT.get(key, 4.0)


          def update_startup(key, latency):
              with lock:
                  old = STARTUP_EST.get(key)
                  new = latency if old is None else old * 0.6 + latency * 0.4
                  STARTUP_EST[key] = new
              log(f"Đo khởi động {key}: {latency:.1f}s (ước tính chạy sớm {new:.1f}s).")


          def watch_startup(run_id, t0, key):
              """Đo từ lúc gọi start_ffmpeg tới khung hình đầu (segment đầu xong - 2s)."""
              folder = ROOT / "www" / "livestream01" / "720"
              while time.monotonic() - t0 < 90 and not stop_event.is_set():
                  if current_run_id != run_id:
                      return
                  try:
                      found = next(folder.glob(run_id + "_*.ts"), None) is not None
                  except OSError:
                      found = False
                  if found:
                      latency = time.monotonic() - t0 - HLS_SEGMENT_SECONDS
                      update_startup(key, max(0.3, min(45.0, latency)))
                      return
                  time.sleep(0.2)


          def peek_ident():
              """Chọn trước ident cho lần chuyển lịch kế tiếp để biết chính xác thời lượng."""
              global pending_ident
              if pending_ident is None:
                  pending_ident = choose_ident() or False
              return pending_ident or None


          def program_lead(config, item):
              """Số giây cần chạy sớm để chương trình lên hình đúng giờ."""
              if item.get("type") == "waiting":
                  waiting = item.get("waiting", {}) if isinstance(item.get("waiting"), dict) else {}
                  url = waiting.get("videoUrl")
                  itype = waiting_input_type(waiting)
              else:
                  name = str(item.get("source", "obs"))
                  url = resolve_source(config, name)
                  itype = source_input_type(config, name)
              lead = startup_estimate(startup_key(url, itype))
              ident = peek_ident()
              if ident:
                  # ident khởi động + chạy hết, rồi vòng lặp (≈0,25s) mới mở chương trình
                  lead += startup_estimate("ident") + ident[1] + 0.25
              return min(PREROLL_MAX, lead + PREROLL_MARGIN)


          def preroll_shift(config, items, now_real):
              """Nếu sắp tới giờ một chương trình và đã vào cửa sổ chạy sớm, trả về số
              giây cần 'tua' đồng hồ ảo tới đúng giờ bắt đầu của nó."""
              cur = (now_real.hour * 3600 + now_real.minute * 60 + now_real.second
                     + now_real.microsecond / 1e6)
              best = None
              for item in items:
                  try:
                      if not isinstance(item, dict):
                          continue
                      start = time_seconds(item["start"])
                      end = time_seconds(item["end"])
                      if start == end or start >= 86400:
                          continue
                      delta = (start - cur) % 86400
                      if delta <= 0 or delta > PREROLL_MAX:
                          continue
                      if best is not None and delta >= best[0]:
                          continue
                      lead = program_lead(config, item)
                      if delta <= lead:
                          best = (delta, lead, item)
                  except (ValueError, KeyError, TypeError):
                      continue
              return best


          def resolve_source(config, name):
              if name == "obs":
                  return OBS_URL
              sources = config.get("sources", {})
              if not isinstance(sources, dict):
                  return None
              value = sources.get(name)
              return value if valid_url(value) else None


          def source_input_type(config, name):
              if name == "obs":
                  return "live"
              types = config.get("sourceTypes", {})
              if not isinstance(types, dict):
                  return "live"
              value = types.get(name, "live")
              return value if value in ("live", "vod") else "live"


          def waiting_input_type(waiting):
              value = waiting.get("inputType", "live")
              return value if value in ("live", "vod") else "live"


          def select_program(config):
              if config.get("mode") == "manual":
                  name = str(config.get("manualSource", "obs"))
                  sub_map = config.get("sourceSubtitles", {})
                  sub_url = ""
                  if isinstance(sub_map, dict):
                      cand = sub_map.get(name, "")
                      if valid_direct_url(cand):
                          sub_url = cand
                  return {
                      "reason": "manual",
                      "name": name,
                      "kind": "source",
                      "url": resolve_source(config, name),
                      "input_type": source_input_type(config, name),
                      "subtitle_url": sub_url,
                      "subtitle_offset": 0.0,
                      "audio_tracks": [],
                      "occurrence": None,
                      "waiting": {},
                      "backup_url": config.get("backupUrl", ""),
                  }

              now_real = datetime.now(TZ)
              epg = config.get("epg", [])
              if not isinstance(epg, list):
                  epg = []
              epg = list(epg)
              nxt = config.get("nextEpg")
              if isinstance(nxt, dict) and nxt not in epg:
                  # Worker chỉ gửi chương trình đang chạy + chương trình kế:
                  # giữ cả hai để chuyển đúng giây mà không phải chờ lần tải cấu hình sau.
                  epg.append(nxt)
              skip_item = None
              with lock:
                  s_item = shared.get("skip_item")
                  s_exp = shared.get("skip_expire")
                  if s_item is not None:
                      if s_exp is not None and now_real.timestamp() < s_exp:
                          skip_item = s_item
                      else:
                          shared["skip_item"] = None
                          shared["skip_expire"] = None
              candidates = [skip_item] if skip_item is not None else epg

              now = now_real
              lead_info = None
              if skip_item is None:
                  pre = preroll_shift(config, candidates, now_real)
                  if pre is not None:
                      # Đồng hồ ảo = đúng giờ bắt đầu chương trình kế (+50ms).
                      now = now_real + timedelta(seconds=pre[0] + 0.05)
                      lead_info = (pre[0], pre[1])
              current = now.hour * 3600 + now.minute * 60 + now.second + now.microsecond / 1e6

              for item in candidates:
                  try:
                      if not isinstance(item, dict):
                          continue
                      start = time_seconds(item["start"])
                      end = time_seconds(item["end"])
                      if start < end:
                          active = start <= current < end
                      elif start > end:
                          active = current >= start or current < end
                      else:
                          active = False
                      if not active and item is not skip_item:
                          continue

                      name = str(item.get("source", "obs"))
                      kind = (
                          "waiting"
                          if item.get("type") == "waiting"
                          else "source"
                      )
                      waiting = item.get("waiting", {})
                      if not isinstance(waiting, dict):
                          waiting = {}

                      if kind == "waiting":
                          value = waiting.get("videoUrl")
                          url = value if valid_url(value) else None
                          input_type = waiting_input_type(waiting)
                          sub_url = ""
                          sub_offset = 0.0
                          audio_tracks = []
                      else:
                          url = resolve_source(config, name)
                          input_type = source_input_type(config, name)
                          if item is skip_item and item.get("_url"):
                              url = item["_url"]
                              input_type = item.get("_type", "live")
                          raw_sub = item.get("subtitleUrl", "")
                          sub_url = raw_sub if valid_direct_url(raw_sub) else ""
                          try:
                              sub_offset = float(item.get("subtitleOffset", 0) or 0)
                          except (ValueError, TypeError):
                              sub_offset = 0.0
                          sub_offset = max(-3600.0, min(3600.0, sub_offset))
                          audio_tracks = sanitize_audio_tracks(item.get("audioTracks", []))

                      occurrence_date = now.date()
                      if start > end and current < end:
                          occurrence_date -= timedelta(days=1)

                      occ_name = "__direct__" if name in ("__epg_direct__", "__next_direct__") else name
                      occurrence = (
                          occurrence_date.isoformat(),
                          str(item.get("start")),
                          str(item.get("end")),
                          occ_name,
                          kind,
                      )
                      if lead_info is not None:
                          with lock:
                              first = shared.get("preroll_occ") != occurrence
                              shared["preroll_occ"] = occurrence
                          if first:
                              log(f"Chạy sớm {lead_info[0]:.1f}s cho \"{sanitize(str(item.get('title') or name))}\" "
                                  f"(bắt đầu {item.get('start')}, ước tính khởi động {lead_info[1]:.1f}s).")

                      return {
                          "reason": "epg",
                          "name": (
                              str(item.get("title", "Chờ event"))
                              if kind == "waiting"
                              else name
                          ),
                          "kind": kind,
                          "url": url,
                          "input_type": input_type,
                          "subtitle_url": sub_url,
                          "subtitle_offset": sub_offset,
                          "audio_tracks": audio_tracks,
                          "occurrence": occurrence,
                          "waiting": waiting,
                          "title": str(item.get("title", "")),
                          "start": str(item.get("start", "")),
                          "end": str(item.get("end", "")),
                          "backup_url": str(
                              item.get("backupUrl") or config.get("backupUrl") or ""
                          ),
                      }
                  except (ValueError, KeyError, TypeError):
                      continue

              return {
                  "reason": "default",
                  "name": "obs",
                  "kind": "source",
                  "url": OBS_URL,
                  "input_type": "live",
                  "subtitle_url": "",
                  "subtitle_offset": 0.0,
                  "audio_tracks": [],
                  "occurrence": None,
                  "waiting": {},
              }


          def sanitize_audio_tracks(raw_tracks):
              if not isinstance(raw_tracks, list):
                  return []
              cleaned = []
              for item in raw_tracks[:8]:
                  if not isinstance(item, dict):
                      continue
                  url = str(item.get("url", "")).strip()
                  if not valid_url(url):
                      continue
                  lang = re.sub(r"[^a-zA-Z0-9-]", "", str(item.get("lang", "und")))[:16] or "und"
                  label = str(item.get("label", lang)).replace('"', "").replace("\n", " ").strip()[:50] or lang
                  try:
                      offset = float(item.get("offset", 0) or 0)
                  except (ValueError, TypeError):
                      offset = 0.0
                  offset = max(-3600.0, min(3600.0, offset))
                  cleaned.append({
                      "lang": lang,
                      "label": label,
                      "url": url,
                      "offset": offset,
                      "default": bool(item.get("default", False)),
                  })
              return cleaned


          def parse_clearkey_hex(value):
              if not value or not isinstance(value, str):
                  return ""
              raw = value.strip()
              if not raw:
                  return ""
              if raw.startswith("{"):
                  try:
                      obj = json.loads(raw)
                      keys = obj.get("keys") if isinstance(obj, dict) else None
                      if isinstance(keys, list) and keys:
                          k_b64 = str(keys[0].get("k", "")).strip()
                          pad = "=" * (-len(k_b64) % 4)
                          decoded = base64.urlsafe_b64decode(k_b64 + pad)
                          if len(decoded) == 16:
                              return decoded.hex()
                  except Exception:
                      return ""
              if ":" in raw:
                  raw = raw.split(":", 1)[1]
              cleaned = re.sub(r"[^0-9a-fA-F]", "", raw)
              return cleaned.lower() if len(cleaned) == 32 else ""


          def direct_program(url, input_type, subtitle_url="", subtitle_offset=0.0, audio_tracks=None, clearkey=""):
              return {
                  "reason": "direct",
                  "name": "Link trực tiếp",
                  "kind": "source",
                  "url": url,
                  "input_type": input_type,
                  "subtitle_url": subtitle_url if valid_direct_url(subtitle_url) else "",
                  "subtitle_offset": subtitle_offset,
                  "audio_tracks": sanitize_audio_tracks(audio_tracks or []),
                  "clearkey": parse_clearkey_hex(clearkey),
                  "occurrence": None,
                  "waiting": {},
              }


          PROBE_CACHE = {}
          PROBE_TTL = 120.0


          def parse_out_time(value):
              if not value or not isinstance(value, str):
                  return 0.0
              parts = value.strip().split(":")
              if len(parts) != 3:
                  return 0.0
              try:
                  return max(0.0, int(parts[0]) * 3600 + int(parts[1]) * 60 + float(parts[2]))
              except (ValueError, TypeError):
                  return 0.0


          def resolve_media_redirect(url):
              if is_udpxy(url):
                  return url
              if not url or not url.startswith(("http://", "https://")):
                  return url
              try:
                  opener = urllib.request.build_opener(SafeRedirectHandler())
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Dalvik/2.1.0"},
                  )
                  with opener.open(req, timeout=5) as resp:
                      final_url = resp.geturl()
                      if final_url and valid_url(final_url):
                          return final_url
              except Exception:
                  pass
              return url


          LIVE_INFO_CACHE = {}


          def probe_live(url, force=False, single=False):
              now_mono = time.monotonic()
              cached = LIVE_INFO_CACHE.get(url)
              if cached and not force:
                  ttl = 600.0 if cached[1].get("ok") else 30.0
                  if (now_mono - cached[0]) < ttl:
                      return cached[1]
              info = {
                  "ok": False, "has_video": False, "has_audio": False,
                  "deint": False, "vcodec": "", "acodec": "",
                  "width": 0, "height": 0, "err": "",
              }
              udp = is_udpxy(url)
              rw_us = UDPXY_RW_TIMEOUT if udp else "6000000"
              limit = 40 if udp else 20
              for attempt in range(1 if single else 2):
                  span = str(5000000 * (attempt + 1))
                  try:
                      res = subprocess.run(
                          [
                              "ffprobe", "-v", "error",
                              "-rw_timeout", rw_us,
                              "-analyzeduration", span,
                              "-probesize", span,
                              "-user_agent", "Dalvik/2.1.0",
                              "-show_entries",
                              "stream=codec_type,codec_name,width,height,field_order",
                              "-of", "json",
                              url,
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          errors="replace",
                          timeout=limit,
                      )
                  except subprocess.TimeoutExpired:
                      info["err"] = (
                          f"udpxy trả 200 nhưng chưa có dữ liệu sau {limit} giây (kênh tắt hoặc sai địa chỉ?)"
                          if udp else f"ffprobe quá {limit} giây"
                      )
                      if udp:
                          break
                      continue
                  except OSError as exc:
                      info["err"] = type(exc).__name__
                      break
                  try:
                      streams = (json.loads(res.stdout or "{}").get("streams")) or []
                  except ValueError:
                      streams = []
                  vids = [s for s in streams if s.get("codec_type") == "video"]
                  auds = [s for s in streams if s.get("codec_type") == "audio"]
                  v = vids[0] if vids else None
                  if v and int(v.get("width") or 0) > 0 and int(v.get("height") or 0) > 0:
                      info.update({
                          "ok": True,
                          "has_video": True,
                          "has_audio": bool(auds),
                          "vcodec": str(v.get("codec_name") or ""),
                          "acodec": str(auds[0].get("codec_name") or "") if auds else "",
                          "width": int(v["width"]),
                          "height": int(v["height"]),
                          "deint": str(v.get("field_order") or "unknown") != "progressive",
                          "err": "",
                      })
                      break
                  detail = sanitize((res.stderr or "").strip())
                  if v:
                      detail = "Chưa đọc được kích thước video (luồng đang hỏng gói)"
                  elif udp and (not detail or "timed out" in detail.lower() or "timeout" in detail.lower()):
                      detail = "udpxy trả 200 nhưng không có dữ liệu (kênh tắt hoặc sai địa chỉ?)"
                  elif not detail:
                      detail = "Không thấy luồng video"
                  info["err"] = detail[:300]
                  if udp and not v and "udpxy" in detail:
                      break
              LIVE_INFO_CACHE[url] = (now_mono, info)
              return info


          def probe(url, stream_type, clearkey=""):
              if not valid_url(url, allow_internal_obs=True):
                  return False, "URL không hợp lệ"
              url = resolve_media_redirect(url)
              if is_udpxy(url):
                  # Đang phát nguồn udpxy này: dùng kết quả dò cũ, KHÔNG mở thêm kết nối
                  # (mỗi kết nối phụ tranh băng thông upload của router nhà bạn).
                  cached_live = LIVE_INFO_CACHE.get(url)
                  if (current_udpxy and shared.get("ffmpeg_running")
                          and cached_live and cached_live[1].get("ok")):
                      info = cached_live[1]
                  else:
                      info = probe_live(url)
                  if not info["ok"]:
                      return False, info["err"] or "ffprobe lỗi"
                  if stream_type == "v:0":
                      return info["has_video"], "" if info["has_video"] else "Không có video"
                  return info["has_audio"], "" if info["has_audio"] else "Không có audio"
              cache_key = (url, stream_type, clearkey)
              cached = PROBE_CACHE.get(cache_key)
              now_mono = time.monotonic()
              ttl = 600.0 if (is_udpxy(url) and cached and cached[1]) else PROBE_TTL
              if cached and (now_mono - cached[0]) < ttl:
                  return cached[1], cached[2]
              try:
                  ffprobe_cmd = [
                      "ffprobe",
                      "-v", "error",
                      "-rw_timeout", "4000000",
                      "-analyzeduration", "1500000",
                      "-probesize", "1500000",
                      "-select_streams", stream_type,
                      "-show_entries", "stream=codec_type",
                      "-of", "csv=p=0",
                  ]
                  if url.startswith(("http://", "https://")):
                      ffprobe_cmd += ["-user_agent", "Dalvik/2.1.0"]
                  if clearkey:
                      ffprobe_cmd += ["-cenc_decryption_key", clearkey]
                  ffprobe_cmd.append(url)
                  result = subprocess.run(
                      ffprobe_cmd,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      errors="replace",
                      timeout=7,
                  )
                  expected = "video" if stream_type == "v:0" else "audio"
                  if result.returncode == 0 and expected in result.stdout:
                      PROBE_CACHE[cache_key] = (now_mono, True, "")
                      return True, ""
                  detail = sanitize(result.stderr.strip())
                  if not detail:
                      detail = f"ffprobe exit {result.returncode}"
                  PROBE_CACHE[cache_key] = (now_mono, False, detail[:300])
                  return False, detail[:300]
              except subprocess.TimeoutExpired:
                  return False, "ffprobe quá 7 giây"
              except OSError as exc:
                  return False, type(exc).__name__


          def local_has_audio(path):
              try:
                  res = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-select_streams", "a:0",
                          "-show_entries", "stream=codec_type",
                          "-of", "csv=p=0",
                          str(path),
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=5,
                  )
                  return res.returncode == 0 and "audio" in res.stdout
              except Exception:
                  return False


          def video_probe_loop():
              last_generation = -1
              next_probe = 0.0
              while not stop_event.is_set():
                  with lock:
                      selected = shared["selected"]
                      generation = shared["generation"]
                  if selected is None:
                      stop_event.wait(0.5)
                      continue
                  if generation != last_generation:
                      last_generation = generation
                      next_probe = 0.0
                  now = time.monotonic()
                  if now < next_probe:
                      stop_event.wait(min(0.5, next_probe - now))
                      continue

                  kind, url = selected
                  available, detail = probe(url, "v:0")
                  next_probe = time.monotonic() + PROBE_INTERVAL

                  with lock:
                      if generation != shared["generation"]:
                          continue
                      if available:
                          previous = shared["video_failures"]
                          shared["video_failures"] = 0
                          shared["video_available"] = True
                      else:
                          shared["video_failures"] += 1
                          previous = shared["video_failures"]

                  if available and previous:
                      log(f"Video {kind} kiểm tra lại OK.")
                  elif not available and (
                      previous <= 3 or previous % 5 == 0
                  ):
                      log(f"Probe video {kind} lỗi {previous} lần: {detail}")


          def audio_probe_loop():
              last_generation = -1
              next_probe = 0.0
              while not stop_event.is_set():
                  with lock:
                      candidates = shared["audio_candidates"]
                      generation = shared["audio_generation"]
                  if generation != last_generation:
                      last_generation = generation
                      next_probe = 0.0
                  now = time.monotonic()
                  if now < next_probe:
                      stop_event.wait(min(0.5, next_probe - now))
                      continue

                  chosen = None
                  for candidate in candidates:
                      if stop_event.is_set():
                          break
                      ok, _ = probe(candidate, "a:0")
                      if ok:
                          chosen = candidate
                          break

                  with lock:
                      if generation == shared["audio_generation"]:
                          shared["audio_result"] = chosen
                  next_probe = time.monotonic() + AUDIO_PROBE_INTERVAL

                  if candidates:
                      if chosen:
                          log("Audio riêng kiểm tra OK.")
                      else:
                          log("Audio riêng chưa khả dụng; dùng im lặng.")


          def set_audio_candidates(candidates):
              clean = tuple(
                  url for url in candidates if valid_url(url)
              )
              with lock:
                  if clean != shared["audio_candidates"]:
                      shared["audio_candidates"] = clean
                      shared["audio_generation"] += 1
                      shared["audio_result"] = None


