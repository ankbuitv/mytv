name: CHRTV AXN Restream Final Engine
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  restream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nginx curl dnsutils tar
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/
          curl -sSf https://sshx.io/get | sh

      - name: Configure Nginx For HLS & Direct Stream
        run: |
          mkdir -p /dev/shm/hls/live
          cat << 'EOF' | sudo tee /tmp/nginx.conf
          worker_processes auto;
          events { worker_connections 2048; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65s;
              keepalive_requests 10000;
              server {
                  listen 5000;
                  location / {
                      root /dev/shm;
                      add_header Cache-Control "no-cache, no-store, must-revalidate";
                      add_header Access-Control-Allow-Origin *;
                      add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
                      add_header Access-Control-Allow-Headers *;
                  }
              }
          }
          EOF
          sudo systemctl stop nginx || true
          sudo nginx -c /tmp/nginx.conf

      - name: Start Restream Engine & Public Forwarding
        run: |
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=18080
          
          sshx > sshx.log 2>&1 &
          sleep 2
          SSHX_URL=$(grep -o 'https://sshx.io/s/[^[:space:]]*' sshx.log | head -n1)
          
          (
          while true; do
            bore local 5000 --to bore.pub --port $BORE_PORT >> bore.log 2>&1
            sleep 3
          done
          ) &
          sleep 5
          
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}" > /dev/null
          fi
          
          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"
          
          cat << M3U_EOF > /dev/shm/playlist.m3u
          #EXTM3U
          #EXTINF:-1 tvg-id="HBO.vn" tvg-name="HBO HD" group-title="VN Live", HBO HD (Stable)
          ${PUBLIC_URL}/hls/live/index.m3u8
          M3U_EOF
          
          echo "===================================================="
          echo "🌐 CHRTV RESTREAM ENGINE IS ONLINE!"
          echo "🔑 SSHX URL   : ${SSHX_URL}"
          echo "👉 STREAM URL : ${PUBLIC_URL}/hls/live/index.m3u8"
          echo "👉 M3U URL    : ${PUBLIC_URL}/playlist.m3u"
          echo "===================================================="
          
          STREAM_MPD="https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd"
          CLEARKEY="3de0f38dcf014827dfd5bec38743c6a2"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36"
          
          # ----------------------------------------------------
          # TIẾN TRÌNH 1: Giải mã DRM MyTV -> Đổ ra UDP nội bộ
          # ----------------------------------------------------
          (
          while true; do
            ffmpeg -y -hide_banner -loglevel error \
              -rw_timeout 10000000 \
              -err_detect ignore_err \
              -fflags +genpts+discardcorrupt+nobuffer \
              -user_agent "$USER_AGENT" \
              -headers "Referer: https://mytvnet.vn/" \
              -cenc_decryption_key "$CLEARKEY" \
              -i "$STREAM_MPD" \
              -map 0:v:0 -map 0:a:0 \
              -c copy \
              -avoid_negative_ts make_zero \
              -f mpegts "udp://127.0.0.1:12345?pkt_size=1316&buffer_size=6553600" || true
            sleep 2
          done
          ) &
          
          sleep 3
          
          # ----------------------------------------------------
          # TIẾN TRÌNH 2: Đọc UDP -> Reset Timestamp & Tạo HLS mượt
          # ----------------------------------------------------
          while true; do
            mkdir -p /dev/shm/hls/live
            rm -f /dev/shm/hls/live/*.ts /dev/shm/hls/live/*.m3u8
            
            cat << 'MASTER_EOF' > /dev/shm/hls/live/master.m3u8
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=1200000,RESOLUTION=1280x720
          index.m3u8
          MASTER_EOF
          
            ffmpeg -y -hide_banner -loglevel error \
              -fflags +genpts+discardcorrupt+nobuffer \
              -i "udp://127.0.0.1:12345?fifo_size=2000000&overrun_nonfatal=1" \
              -c copy \
              -use_wallclock_as_timestamps 1 \
              -avoid_negative_ts make_zero \
              -f hls \
              -hls_time 2 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist+independent_segments+split_by_time+temp_file \
              -hls_segment_type mpegts \
              -hls_segment_filename "/dev/shm/hls/live/seg_%05d.ts" \
              -start_number 1 \
              /dev/shm/hls/live/index.m3u8 || true
            
            echo "⚠ Stream lost, reconnecting in 2s..."
            sleep 2
          done
