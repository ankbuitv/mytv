name: IPTV Stream Server - Restream YouTube Live (Fixed Port 30208)

on:
  schedule:
    # Tự động trigger lại sau mỗi 5 tiếng 59 phút (Chống mốc timeout 6h)
    - cron: '59 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno (JS Engine for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run Streamer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl dnsutils
          pip install flask flask-cors yt-dlp

          # ====================================================
          # 1. CẤU HÌNH DUCKDNS CỦA BRO
          # ====================================================
          DUCKDNS_DOMAIN="chrtv"
          DUCKDNS_TOKEN="0a7471b5-56fc-4b60-a5d9-5381f66930d9"
          BORE_PORT=30208

          # ====================================================
          # 2. CẤU HÌNH LINK YOUTUBE LIVE
          # (Bro thay link YouTube Live khác tại đây nếu cần)
          # ====================================================
          YOUTUBE_LIVE_URL="https://www.youtube.com/watch?v=jfKfPfyJRdk"

          # 3. Cài đặt Bore Tunnel
          echo "⏬ Đang tải Bore..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          # Tải logo PNG
          echo "⏬ Đang tải logo..."
          curl -s -L "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Twitter_Verified_Badge.svg/512px-Twitter_Verified_Badge.svg.png" -o logo1.png

          # Tạo thư mục lưu HLS
          mkdir -p hls/ytlive

          # 4. Ép mở Bore ở Port Cố Định 30208
          echo "🌐 Đang mở Bore Tunnel tại Port cố định ${BORE_PORT}..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          CONNECTED=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            bore local 5000 --to bore.pub --port $BORE_PORT > bore.log 2>&1 &
            sleep 4
            
            if grep -q "listening at bore.pub:${BORE_PORT}" bore.log; then
              echo "✅ Đã giữ thành công Port ${BORE_PORT}!"
              CONNECTED=true
              break
            else
              echo "⚠️ Port ${BORE_PORT} đang bận... Thử lại ($((RETRY_COUNT+1))/$MAX_RETRIES)"
              pkill bore || true
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 3
            fi
          done

          # 5. Cập nhật IP Bore lên DuckDNS
          BORE_IP=$(dig +short bore.pub | tail -n1)
          if [ -n "$BORE_IP" ]; then
            echo "🌐 Cập nhật IP Bore (${BORE_IP}) lên ${DUCKDNS_DOMAIN}.duckdns.org..."
            curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${BORE_IP}"
            echo ""
          fi

          PUBLIC_URL="http://${DUCKDNS_DOMAIN}.duckdns.org:${BORE_PORT}"

          # 6. Tạo file playlist.m3u
          echo "#EXTM3U" > playlist.m3u
          echo '#EXTINF:-1 tvg-id="YTLive" tvg-name="YouTube Live Restream" group-title="YouTube Live", YouTube Restream 24/7' >> playlist.m3u
          echo "${PUBLIC_URL}/hls/ytlive/1080p.m3u8" >> playlist.m3u

          # 7. Khởi chạy Flask Server
          echo 'from flask import Flask, send_from_directory, abort' > app.py
          echo 'from flask_cors import CORS' >> app.py
          echo 'import os' >> app.py
          echo 'app = Flask(__name__)' >> app.py
          echo 'CORS(app)' >> app.py
          echo '@app.route("/")' >> app.py
          echo 'def index(): return "IPTV YouTube Restreamer is Running!", 200' >> app.py
          echo '@app.route("/playlist.m3u")' >> app.py
          echo 'def playlist(): return send_from_directory(".", "playlist.m3u")' >> app.py
          echo '@app.route("/hls/<path:filename>")' >> app.py
          echo 'def serve_hls(filename):' >> app.py
          echo '    file_path = os.path.join("hls", filename)' >> app.py
          echo '    if not os.path.exists(file_path): return abort(404)' >> app.py
          echo '    return send_from_directory("hls", filename)' >> app.py
          echo 'if __name__ == "__main__": app.run(host="0.0.0.0", port=5000)' >> app.py

          python3 app.py &
          sleep 2

          echo "===================================================="
          echo "🚀 CHRTV RESTREAM YOUTUBE LIVE (FIXED BOT) READY!"
          echo "👉 LINK PLAYLIST TỔNG M3U: ${PUBLIC_URL}/playlist.m3u"
          echo "===================================================="

          # 8. BÓC TÁCH LINK STREAM VỚI DENO ENGINE & CLIENT BYPASS BOT
          echo "🔍 Đang bóc tách luồng Live từ YouTube..."
          
          # Cấu hình yt-dlp giả lập iOS Client để vượt qua Bot Verification của YouTube
          REAL_STREAM_URL=$(yt-dlp -g --extractor-args "youtube:player_client=ios,web" -f "best[ext=mp4]/best" "$YOUTUBE_LIVE_URL")

          if [ -z "$REAL_STREAM_URL" ]; then
            echo "⚠️ Thử lại phương thức bóc tách dự phòng 2..."
            REAL_STREAM_URL=$(yt-dlp -g --extractor-args "youtube:player_client=mweb" -f "best" "$YOUTUBE_LIVE_URL")
          fi

          if [ -z "$REAL_STREAM_URL" ]; then
            echo "❌ Lỗi: YouTube vẫn khoá link video này do bắt xác thực Bot! Bro đổi sang link YouTube Live khác xem thử nhé."
            exit 1
          fi

          echo "✅ Bóc tách thành công! Bắt đầu Restream..."

          ffmpeg -hide_banner -loglevel error \
            -rw_timeout 20000000 \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$REAL_STREAM_URL" \
            -stream_loop -1 -i logo1.png \
            -filter_complex "[0:v]scale=1280:720[main];[1:v]scale=70:-1[logo];[main][logo]overlay=W-w-20:20[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset ultrafast -tune zerolatency -crf 28 -g 50 -b:v 1500k -maxrate 1800k -bufsize 3600k \
            -c:a aac -b:a 128k -ar 44100 \
            -f hls -hls_time 2 -hls_list_size 6 -hls_flags delete_segments+omit_endlist \
            -hls_segment_filename "hls/ytlive/seg_%03d.ts" hls/ytlive/1080p.m3u8
