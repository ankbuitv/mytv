name: HLS Film Channel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: film-channel
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  film-restream:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCHEDULE_API: "https://ads.ankb.qzz.io/api/schedule/current"
      HLS_DIR: "/dev/shm/hls/film"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HLS_LIST_SIZE: "40"

    steps:
      - name: Install Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb
          rm -f /tmp/cf.deb
          rm -rf "${HLS_DIR}"
          mkdir -p "${HLS_DIR}"

      - name: Start HLS Web Server
        run: |
          python3 -c 'from pathlib import Path; Path("/tmp/hls_server.js").write_text(r"""
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const ROOT = "/dev/shm/hls/film";
          const MIME = {".m3u8":"application/vnd.apple.mpegurl",".ts":"video/mp2t"};
          http.createServer((req, res) => {
            res.setHeader("Access-Control-Allow-Origin", "*");
            res.setHeader("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
            if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
            let pathname = decodeURIComponent(new URL(req.url, "http://localhost").pathname);
            if (pathname === "/" || pathname === "/film.m3u8") pathname = "/stream.m3u8";
            const filePath = path.resolve(ROOT, "." + pathname);
            if (!filePath.startsWith(ROOT)) { res.writeHead(403); return res.end(); }
            const ext = path.extname(filePath).toLowerCase();
            if (!MIME[ext]) { res.writeHead(404); return res.end(); }
            fs.stat(filePath, (err, stat) => {
              if (err || !stat.isFile()) { res.writeHead(404); return res.end(); }
              res.setHeader("Content-Type", MIME[ext]);
              res.setHeader("Cache-Control", "no-store");
              res.writeHead(200);
              if (req.method === "HEAD") return res.end();
              fs.createReadStream(filePath).pipe(res);
            });
          }).listen(5000, "127.0.0.1");
          """)'
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 1

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:5000 > /tmp/cf.log 2>&1 &
          echo $! > /tmp/cf.pid
          sleep 5
          # Lấy URL public
          PUBLIC_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
          echo "PUBLIC_URL=$PUBLIC_URL" >> $GITHUB_ENV
          echo "========================================"
          echo "PUBLIC URL: $PUBLIC_URL/film.m3u8"
          echo "========================================"

      - name: Film Engine
        run: |
          set -euo pipefail

          CURRENT_URL=""
          CURRENT_PID=""

          fetch_schedule() {
            curl -fsSL --max-time 8 "$SCHEDULE_API" 2>/dev/null || echo '{"current":null,"next":null}'
          }

          start_play() {
            local url="$1"
            local name="$2"
            local start_minutes="$3"
            local duration="$4"

            local vn_hour=$(TZ=Asia/Ho_Chi_Minh date +%H)
            local vn_min=$(TZ=Asia/Ho_Chi_Minh date +%M)
            local current_minutes=$((10#$vn_hour * 60 + 10#$vn_min))
            local late_minutes=$((current_minutes - start_minutes))
            if [ "$late_minutes" -lt 0 ]; then late_minutes=0; fi
            if [ "$late_minutes" -gt "$duration" ]; then
              echo "Đã quá giờ chiếu → bỏ qua"
              return
            fi
            local seek_seconds=$((late_minutes * 60))

            echo ">>> Chiếu: $name"
            echo "    Seek vào phút $late_minutes (giây $seek_seconds)"

            if [ -n "$CURRENT_PID" ] && kill -0 "$CURRENT_PID" 2>/dev/null; then
              kill -9 "$CURRENT_PID" 2>/dev/null || true
              sleep 1
            fi

            rm -f "${HLS_DIR}"/*.ts "${HLS_DIR}"/stream.m3u8 2>/dev/null || true

            nohup ffmpeg -hide_banner -loglevel warning -nostdin \
              -re \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" \
              -headers "Referer: https://kkphim.com/\r\n" \
              -ss "$seek_seconds" \
              -i "$url" \
              -c:v libx264 -preset veryfast -tune zerolatency -profile:v high \
              -x264-params "keyint=48:min-keyint=48:scenecut=0" \
              -pix_fmt yuv420p -r 25 -g 48 \
              -b:v 4000k -maxrate 4500k -bufsize 6000k \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -f hls -hls_time 4 -hls_list_size "${HLS_LIST_SIZE}" \
              -hls_flags delete_segments+omit_endlist+append_list \
              -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
              "${HLS_DIR}/stream.m3u8" \
              > /tmp/ffmpeg_film.log 2>&1 &

            CURRENT_PID=$!
            CURRENT_URL="$url"
            echo $CURRENT_PID > /tmp/ffmpeg_film.pid
          }

          echo "=========================================================="
          echo "FILM CHANNEL ONLINE"
          echo "Public: $PUBLIC_URL/film.m3u8"
          echo "=========================================================="

          START_TIME=$(date +%s)
          AUTO_TRIGGER=19800
          NEXT_TRIGGERED=0

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$AUTO_TRIGGER" ] && [ "$NEXT_TRIGGERED" -eq 0 ]; then
              gh workflow run "${GITHUB_WORKFLOW}" --ref "${GITHUB_REF_NAME}" && NEXT_TRIGGERED=1 || true
            fi

            # Revive
            kill -0 "$(cat /tmp/server.pid 2>/dev/null)" 2>/dev/null || {
              nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
              echo $! > /tmp/server.pid
            }
            kill -0 "$(cat /tmp/cf.pid 2>/dev/null)" 2>/dev/null || {
              nohup cloudflared tunnel --url http://localhost:5000 > /tmp/cf.log 2>&1 &
              echo $! > /tmp/cf.pid
            }

            SCHED=$(fetch_schedule)
            CUR_URL=$(echo "$SCHED" | jq -r '.current.url // empty')
            CUR_NAME=$(echo "$SCHED" | jq -r '.current.name // "Không có lịch"')
            CUR_START=$(echo "$SCHED" | jq -r '.current.startMinutes // 0')
            CUR_DURATION=$(echo "$SCHED" | jq -r '.current.duration // 120')

            if [ -z "$CUR_URL" ]; then
              echo "[$(date -u '+%H:%M:%S')] Không có lịch → chờ"
              sleep 30
              continue
            fi

            if [ "$CUR_URL" != "$CURRENT_URL" ]; then
              start_play "$CUR_URL" "$CUR_NAME" "$CUR_START" "$CUR_DURATION"
            fi

            if [ -n "$CURRENT_PID" ] && ! kill -0 "$CURRENT_PID" 2>/dev/null; then
              echo "FFmpeg kết thúc"
              tail -n 8 /tmp/ffmpeg_film.log || true
              CURRENT_URL=""
              CURRENT_PID=""
              sleep 5
              continue
            fi

            echo "[$(date -u '+%H:%M:%S')] Đang chiếu: $CUR_NAME | Elapsed: $((ELAPSED/60))m"
            sleep 15
          done
