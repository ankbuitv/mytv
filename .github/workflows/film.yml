name: HLS Film Channel (Bore Public)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: film-channel
  cancel-in-progress: true

jobs:
  film-restream:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCHEDULE_API: "https://ads.ankb.qzz.io/api/schedule/current"
      HLS_DIR: "/tmp/hls/film"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install Tools, Caddy & Bore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl python3-pip caddy
          pip install -q --break-system-packages yt-dlp || pip install -q yt-dlp
          
          # Tải Bore CLI
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/
          
          # Tạo thư mục lưu HLS
          mkdir -p "${HLS_DIR}"

      - name: Start Caddy Web Server
        run: |
          caddy stop 2>/dev/null || true
          pkill -f caddy 2>/dev/null || true

          # Tắt Admin Port 2019 tránh lỗi bind port
          cat << 'EOF' > /tmp/Caddyfile
          {
              admin off
          }

          :5000 {
              root * /tmp/hls/film
              file_server
              header Access-Control-Allow-Origin "*"
              header Cache-Control "no-cache, no-store, must-revalidate"
          }
          EOF

          caddy start --config /tmp/Caddyfile
          echo "✅ Caddy Server đã chạy tại cổng 5000"

      - name: Start Bore Tunnel
        run: |
          nohup bore local 5000 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 5
          
          BORE_PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log | tail -1 || echo "")
          
          if [ -z "$BORE_PORT" ]; then
            echo "❌ Không thể khởi tạo Bore Tunnel!"
            cat /tmp/bore.log
            exit 1
          fi
          
          STREAM_URL="http://bore.pub:${BORE_PORT}/stream.m3u8"
          echo "BORE_PORT=$BORE_PORT" >> $GITHUB_ENV
          
          echo "================================================="
          echo "🎬 STREAM URL CỦA BẠN:"
          echo "$STREAM_URL"
          echo "================================================="

      - name: Main Stream Engine
        run: |
          fetch_schedule() {
            curl -fsSL --max-time 10 "$SCHEDULE_API" 2>/dev/null || echo '{"current":null}'
          }

          calc_seek() {
            local start_min="$1"
            local duration="$2"
            local vn_hour=$(TZ=Asia/Ho_Chi_Minh date +%H)
            local vn_min=$(TZ=Asia/Ho_Chi_Minh date +%M)
            local now_min=$((10#$vn_hour * 60 + 10#$vn_min))
            local late=$((now_min - start_min))
            if [ "$late" -lt 0 ]; then late=0; fi
            if [ "$late" -gt "$duration" ]; then echo "-1"; return; fi
            echo $((late * 60))
          }

          LAST_URL=""

          while true; do
            # 1. Khôi phục Caddy nếu bị dừng
            if ! pgrep -x "caddy" > /dev/null; then
              echo "[REVIVE] Caddy Server dừng, đang bật lại..."
              caddy start --config /tmp/Caddyfile
            fi

            # 2. Khôi phục Bore Tunnel nếu rớt mạng
            if ! pgrep -x "bore" > /dev/null; then
              echo "[REVIVE] Bore Tunnel rớt kết nối, đang kết nối lại..."
              nohup bore local 5000 --to bore.pub --port "${BORE_PORT}" > /tmp/bore.log 2>&1 &
            fi

            SCHED=$(fetch_schedule)
            CUR_URL=$(echo "$SCHED" | jq -r '.current.url // empty')
            CUR_NAME=$(echo "$SCHED" | jq -r '.current.name // "Phim"')
            CUR_START=$(echo "$SCHED" | jq -r '.current.startMinutes // 0')
            CUR_DUR=$(echo "$SCHED" | jq -r '.current.duration // 120')

            if [ -z "$CUR_URL" ]; then
              echo "[$(date '+%H:%M:%S')] ⏳ Chưa có lịch phát, đợi 30s..."
              sleep 30
              continue
            fi

            # Khi đổi phim mới
            if [ "$CUR_URL" != "$LAST_URL" ]; then
              echo "[$(date '+%H:%M:%S')] 🚀 Bắt đầu phát: $CUR_NAME"
              LAST_URL="$CUR_URL"
              
              SEEK_SEC=$(calc_seek "$CUR_START" "$CUR_DUR")
              if [ "$SEEK_SEC" = "-1" ]; then
                echo "[SKIP] Phim $CUR_NAME đã quá thời lượng chiếu!"
                LAST_URL=""
                sleep 15
                continue
              fi

              # Dừng FFmpeg cũ
              if [ -f /tmp/ffmpeg.pid ]; then
                kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              fi

              rm -f ${HLS_DIR}/*

              # Xử lý URL đầu vào
              CLEAN_URL=$(echo "$CUR_URL" | sed 's/\.$//')
              if [[ "$CLEAN_URL" =~ youtu(\.be|be\.com) ]]; then
                INPUT_URL=$(yt-dlp -g -f "best[ext=mp4]/best" "$CLEAN_URL" 2>/dev/null || echo "")
              else
                INPUT_URL="$CLEAN_URL"
              fi

              if [ -z "$INPUT_URL" ]; then
                echo "❌ Không lấy được link stream từ API!"
                LAST_URL=""
                sleep 10
                continue
              fi

              echo "[INFO] Link nguồn OK (Seek: ${SEEK_SEC}s)"

              # Header chuẩn HTTP/1.1 bypass CDN
              FF_HEADERS="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"$'\r\n'"Referer: https://kkphim.com/"$'\r\n'"Origin: https://kkphim.com"$'\r\n'

              # Đặt -ss $SEEK_SEC phía SAU -i "$INPUT_URL"
              nohup ffmpeg -hide_banner -loglevel warning -nostdin \
                -headers "$FF_HEADERS" \
                -rw_timeout 30000000 \
                -re \
                -i "$INPUT_URL" \
                -ss "$SEEK_SEC" \
                -vf "scale=-2:720" \
                -c:v libx264 -preset superfast -profile:v main -level 3.1 \
                -x264-params "keyint=30:scenecut=0" \
                -pix_fmt yuv420p -r 25 -g 30 \
                -b:v 900k -maxrate 1100k -bufsize 2000k \
                -c:a aac -b:a 64k -ar 44100 \
                -f hls -hls_time 3 -hls_list_size 8 \
                -hls_flags delete_segments+omit_endlist \
                -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
                "${HLS_DIR}/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
              
              echo $! > /tmp/ffmpeg.pid
              sleep 3
            fi

            # Kiểm tra tiến trình
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "[$(date '+%H:%M:%S')] ⚠️ FFmpeg đã bị thoát! Báo lỗi:"
              cat /tmp/ffmpeg.log 2>/dev/null || true
              LAST_URL=""
              sleep 10
              continue
            fi

            SEG_COUNT=$(ls -1 ${HLS_DIR}/*.ts 2>/dev/null | wc -l)
            
            if [ "$SEG_COUNT" -eq 0 ]; then
              echo "[WARN] FFmpeg đang chạy nhưng chưa ghi được Segment nào. Log gần nhất:"
              tail -n 5 /tmp/ffmpeg.log 2>/dev/null || true
            else
              echo "[$(date '+%H:%M:%S')] 📡 Đang phát: $CUR_NAME | Segments active: $SEG_COUNT"
            fi

            sleep 15
          done
