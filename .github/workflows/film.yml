name: HLS Film Channel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: film-channel
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  film-restream:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCHEDULE_API: "https://ads.ankb.qzz.io/api/schedule/current"
      HLS_DIR: "/dev/shm/hls/film"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl python3-pip
          pip install -q yt-dlp
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb | sudo dpkg -i /dev/stdin
          rm -rf "$HLS_DIR"
          mkdir -p "$HLS_DIR"

      - name: Start Server
        run: |
          node -e "
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            if (req.method === 'OPTIONS') { res.writeHead(204); return res.end(); }
            let p = decodeURIComponent(new URL(req.url, 'http://localhost').pathname);
            if (p === '/' || p === '/film.m3u8') p = '/stream.m3u8';
            const f = path.resolve('$HLS_DIR', '.' + p);
            if (!f.startsWith('$HLS_DIR')) { res.writeHead(403); return res.end(); }
            fs.stat(f, (e, s) => {
              if (e || !s.isFile()) { res.writeHead(404); return res.end(); }
              res.setHeader('Content-Type', p.endsWith('.m3u8') ? 'application/vnd.apple.mpegurl' : 'video/mp2t');
              res.setHeader('Cache-Control', 'no-store');
              res.writeHead(200);
              if (req.method !== 'HEAD') fs.createReadStream(f).pipe(res);
              else res.end();
            });
          }).listen(5000, '127.0.0.1');
          " > /tmp/server.js &
          sleep 1

      - name: Start Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:5000 > /tmp/cf.log 2>&1 &
          sleep 8
          URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | tail -1)
          echo "STREAM_URL=$URL/film.m3u8" >> $GITHUB_ENV
          echo "Stream: $URL/film.m3u8"

      - name: Stream
        run: |
          fetch_sched() {
            curl -fsSL --max-time 8 "$SCHEDULE_API" 2>/dev/null || echo '{"current":null}'
          }

          is_yt() { [[ "$1" =~ youtu ]]; }

          seek_calc() {
            local s=$1 d=$2
            local h=$(TZ=Asia/Ho_Chi_Minh date +%H)
            local m=$(TZ=Asia/Ho_Chi_Minh date +%M)
            local now=$((10#$h*60+10#$m))
            local late=$((now-s))
            [ $late -lt 0 ] && late=0
            [ $late -gt $d ] && echo -1 && return
            echo $((late*60))
          }

          run_ffmpeg() {
            local url="$1" name="$2" start="$3" dur="$4"
            url=$(echo "$url" | sed 's/\.$//')
            
            local sk=$(seek_calc "$start" "$dur")
            [ "$sk" == "-1" ] && echo "SKIP: $name (quá giờ)" && return
            
            pkill -f ffmpeg 2>/dev/null || true
            rm -f "$HLS_DIR"/*.ts "$HLS_DIR"/stream.m3u8
            
            echo "[$(date '+%H:%M:%S')] START: $name (seek $sk s)"
            
            local cmd="ffmpeg -hide_banner -loglevel info -nostdin -re"
            
            if is_yt "$url"; then
              cmd="$cmd -ss $sk -i pipe:0 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -c:a aac -b:a 96k -f hls -hls_time 4 -hls_list_size 30 -hls_flags delete_segments+omit_endlist -hls_segment_filename '$HLS_DIR/seg_%05d.ts' '$HLS_DIR/stream.m3u8'"
              yt-dlp -f best -o - "$url" 2>/dev/null | eval "$cmd" > /tmp/ff.log 2>&1 &
            else
              cmd="$cmd -timeout 30000000 -user_agent 'Mozilla/5.0' -ss $sk -i '$url' -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -c:a aac -b:a 96k -f hls -hls_time 4 -hls_list_size 30 -hls_flags delete_segments+omit_endlist -hls_segment_filename '$HLS_DIR/seg_%05d.ts' '$HLS_DIR/stream.m3u8'"
              eval "$cmd" > /tmp/ff.log 2>&1 &
            fi
            
            echo $! > /tmp/ff.pid
            sleep 4
          }

          last="" loop=0
          while true; do
            loop=$((loop+1))
            
            SCHED=$(fetch_sched)
            url=$(echo "$SCHED" | jq -r '.current.url // empty')
            name=$(echo "$SCHED" | jq -r '.current.name // ""')
            start=$(echo "$SCHED" | jq -r '.current.startMinutes // 0')
            dur=$(echo "$SCHED" | jq -r '.current.duration // 120')
            
            [ -z "$url" ] && { echo "WAIT"; sleep 30; continue; }
            
            if [ "$url" != "$last" ]; then
              last="$url"
              run_ffmpeg "$url" "$name" "$start" "$dur"
              sleep 5
            fi
            
            if ! kill -0 "$(cat /tmp/ff.pid 2>/dev/null)" 2>/dev/null; then
              echo "DIED: $(head -5 /tmp/ff.log 2>/dev/null)"
              last=""
              sleep 5
              continue
            fi
            
            if [ -f "$HLS_DIR/stream.m3u8" ]; then
              seg=$(grep -c "^seg_" "$HLS_DIR/stream.m3u8" 2>/dev/null || echo 0)
              echo "[$(date '+%H:%M:%S')] $name | seg=$seg"
            else
              echo "[$(date '+%H:%M:%S')] NO M3U8 YET"
            fi
            
            if [ $loop -ge 1380 ]; then
              gh workflow run "$GITHUB_WORKFLOW" --ref "$GITHUB_REF_NAME" 2>/dev/null || true
              loop=0
            fi
            
            sleep 15
          done

      - name: Save Logs
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          cp /tmp/ff.log /tmp/artifacts/ 2>/dev/null || echo "no ffmpeg log"
          cp /tmp/cf.log /tmp/artifacts/ 2>/dev/null || echo "no cf log"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: /tmp/artifacts/
          retention-days: 1
