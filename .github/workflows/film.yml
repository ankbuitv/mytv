name: HLS Film Channel (Bore Public)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: film-channel
  cancel-in-progress: true

jobs:
  film-restream:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SCHEDULE_API: "https://ads.ankb.qzz.io/api/schedule/current"
      HLS_DIR: "/tmp/hls/film"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install Tools, Caddy & Bore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl python3-pip caddy
          pip install -q --break-system-packages yt-dlp || pip install -q yt-dlp
          
          # Tải Bore CLI
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/
          
          # Tạo thư mục lưu HLS
          mkdir -p "${HLS_DIR}"

      - name: Start Caddy Web Server
        run: |
          # Dọn dẹp tiến trình Caddy cũ nếu có
          caddy stop 2>/dev/null || true
          pkill -f caddy 2>/dev/null || true

          # Cấu hình Caddy (Tắt Admin Port 2019 để tránh lỗi Address already in use)
          cat << 'EOF' > /tmp/Caddyfile
          {
              admin off
          }

          :5000 {
              root * /tmp/hls/film
              file_server
              header Access-Control-Allow-Origin "*"
              header Cache-Control "no-cache, no-store, must-revalidate"
          }
          EOF

          caddy start --config /tmp/Caddyfile
          echo "✅ Caddy Server đã chạy tại cổng 5000"

      - name: Start Bore Tunnel
        run: |
          # Chạy bore local port 5000 kết nối ra bore.pub
          nohup bore local 5000 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 5
          
          # Lấy Port do bore.pub cấp ngẫu nhiên
          BORE_PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log | tail -1 || echo "")
          
          if [ -z "$BORE_PORT" ]; then
            echo "❌ Không thể khởi tạo Bore Tunnel!"
            cat /tmp/bore.log
            exit 1
          fi
          
          STREAM_URL="http://bore.pub:${BORE_PORT}/stream.m3u8"
          echo "BORE_PORT=$BORE_PORT" >> $GITHUB_ENV
          
          echo "================================================="
          echo "🎬 STREAM URL CỦA BẠN:"
          echo "$STREAM_URL"
          echo "================================================="

      - name: Main Stream Engine
        run: |
          fetch_url() {
            curl -fsSL --max-time 10 "$SCHEDULE_API" | jq -r '.current.url // empty'
          }

          fetch_name() {
            curl -fsSL --max-time 10 "$SCHEDULE_API" | jq -r '.current.name // "Phim"'
          }

          LAST_URL=""

          while true; do
            # 1. Tự khôi phục Caddy nếu bị dừng
            if ! pgrep -x "caddy" > /dev/null; then
              echo "[REVIVE] Caddy Server dừng, đang bật lại..."
              caddy start --config /tmp/Caddyfile
            fi

            # 2. Tự khôi phục Bore Tunnel nếu rớt mạng
            if ! pgrep -x "bore" > /dev/null; then
              echo "[REVIVE] Bore Tunnel rớt kết nối, đang kết nối lại..."
              nohup bore local 5000 --to bore.pub --port "${BORE_PORT}" > /tmp/bore.log 2>&1 &
            fi

            CUR_URL=$(fetch_url)
            CUR_NAME=$(fetch_name)

            if [ -z "$CUR_URL" ]; then
              echo "[$(date '+%H:%M:%S')] ⏳ Chưa có lịch phát, đợi 30s..."
              sleep 30
              continue
            fi

            # Khi phát hiện URL phim mới
            if [ "$CUR_URL" != "$LAST_URL" ]; then
              echo "[$(date '+%H:%M:%S')] 🚀 Bắt đầu phát: $CUR_NAME"
              LAST_URL="$CUR_URL"
              
              # Dừng FFmpeg cũ
              if [ -f /tmp/ffmpeg.pid ]; then
                kill -9 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null || true
              fi

              # Xóa segments cũ
              rm -f ${HLS_DIR}/*

              # Phân loại nguồn YouTube hay Direct Link
              if [[ "$CUR_URL" =~ youtu(\.be|be\.com) ]]; then
                INPUT_URL=$(yt-dlp -g -f "best[ext=mp4]/best" "$CUR_URL" 2>/dev/null || echo "")
              else
                INPUT_URL="$CUR_URL"
              fi

              if [ -z "$INPUT_URL" ]; then
                echo "❌ Không lấy được link stream từ: $CUR_URL"
                LAST_URL=""
                sleep 10
                continue
              fi

              # Chạy FFmpeg ngầm
              nohup ffmpeg -hide_banner -loglevel warning -nostdin \
                -re \
                -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                -referer "https://kkphim.com/" \
                -i "$INPUT_URL" \
                -c:v libx264 -preset ultrafast -tune zerolatency \
                -pix_fmt yuv420p -g 48 \
                -b:v 2500k -maxrate 3000k -bufsize 4000k \
                -c:a aac -b:a 128k -ar 44100 \
                -f hls -hls_time 4 -hls_list_size 10 \
                -hls_flags delete_segments+omit_endlist \
                -hls_segment_filename "${HLS_DIR}/seg_%05d.ts" \
                "${HLS_DIR}/stream.m3u8" > /tmp/ffmpeg.log 2>&1 &
              
              echo $! > /tmp/ffmpeg.pid
              echo "[$(date '+%H:%M:%S')] 🟢 FFmpeg đã khởi tạo tiến trình"
            fi

            # Kiểm tra xem FFmpeg có bị die không
            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "[$(date '+%H:%M:%S')] ⚠️ FFmpeg bị dừng! Log lỗi gần nhất:"
              tail -n 5 /tmp/ffmpeg.log 2>/dev/null || true
              LAST_URL=""
              sleep 10
              continue
            fi

            # Đếm số segment active trên đĩa
            SEG_COUNT=$(ls -1 ${HLS_DIR}/*.ts 2>/dev/null | wc -l)
            echo "[$(date '+%H:%M:%S')] 📡 Đang phát: $CUR_NAME | Segments active: $SEG_COUNT"

            sleep 15
          done
