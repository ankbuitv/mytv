name: "HLS Restream - Box Hits"

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    env:
      CHANNEL_ID: "boxhit"
      TARGET_PORT: "30119"
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BOXHIT/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      VN_PROXY: "" # Điền Proxy VN vào đây (ví dụ: "http://user:pass@1.2.3.4:8080")

    steps:
      - name: "Cài đặt gói phụ thuộc hệ thống - Box Hits"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg netcat-openbsd

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          mkdir -p /dev/shm/hls/${CHANNEL_ID}

      - name: "Tạo HLS Server - Box Hits"
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const channelId = process.env.CHANNEL_ID;
          const HLS_DIR = `/dev/shm/hls/${channelId}`;

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let fileName = req.url.split('?')[0].replace('/', '');
            if (!fileName || fileName === '') fileName = 'index.m3u8';
            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            if (fileName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (fileName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            const stream = fs.createReadStream(filePath);
            stream.pipe(res);
            stream.on('error', () => {
              if (!res.headersSent) res.writeHead(500);
              res.end();
            });
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 Server started on port 5000...');
          });
          EOF

      - name: "Kiểm tra kết nối MPD cho Box Hits (Tối đa 2 phút)"
        shell: bash
        run: |
          set -euo pipefail
          echo "⏳ Đang kiểm tra kết nối tới manifest MPD (Tối đa 2 phút)..."
          
          TIMEOUT=120
          INTERVAL=5
          ELAPSED=0
          CONNECTED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if [ -n "${VN_PROXY:-}" ]; then
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -x "${VN_PROXY}" \
                -A "${USER_AGENT}" \
                -H "Referer: ${REFERER}" \
                -H "Origin: https://vtvprime.vn/" \
                --connect-timeout 5 \
                "${MPD_URL}" || echo "000")
            else
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -A "${USER_AGENT}" \
                -H "Referer: ${REFERER}" \
                -H "Origin: https://vtvprime.vn/" \
                --connect-timeout 5 \
                "${MPD_URL}" || echo "000")
            fi

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Kết nối thành công tới MPD trong ${ELAPSED}s! Bắt đầu chạy FFmpeg..."
              CONNECTED=1
              break
            fi

            echo "⚠️ Chưa kết nối được (Mã HTTP: $HTTP_STATUS). Thử lại sau ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $CONNECTED -ne 1 ]; then
            echo "❌ Lỗi: Không thể kết nối tới MPD sau 2 phút! Kiểm tra lại Proxy VN hoặc Server VTVPrime."
            exit 1
          fi

      - name: "Khởi chạy Bore & FFmpeg cho Box Hits"
        shell: bash
        run: |
          set -euo pipefail

          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in {1..10}; do
            if nc -z localhost 5000; then break; fi
            sleep 1
          done

          cat << 'EOF' > /tmp/run_ffmpeg.sh
          #!/usr/bin/env bash
          set -euo pipefail

          HEADERS=$'Referer: https://vtvprime.vn/\r\nOrigin: https://vtvprime.vn/\r\n'

          while true; do
            echo "🚀 Starting FFmpeg stream (${CHANNEL_ID})..."
            if [ -n "${VN_PROXY:-}" ]; then
              ffmpeg -hide_banner -loglevel warning \
                -http_proxy "${VN_PROXY}" \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
                -user_agent "${USER_AGENT}" \
                -headers "${HEADERS}" \
                -cenc_decryption_key "${CLEARKEY_KEY}" \
                -i "${MPD_URL}" \
                -c copy \
                -f hls \
                -hls_time 4 \
                -hls_list_size 5 \
                -hls_flags delete_segments+omit_endlist+temp_file \
                -hls_segment_filename "/dev/shm/hls/${CHANNEL_ID}/segment_%03d.ts" \
                "/dev/shm/hls/${CHANNEL_ID}/index.m3u8" || true
            else
              ffmpeg -hide_banner -loglevel warning \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
                -user_agent "${USER_AGENT}" \
                -headers "${HEADERS}" \
                -cenc_decryption_key "${CLEARKEY_KEY}" \
                -i "${MPD_URL}" \
                -c copy \
                -f hls \
                -hls_time 4 \
                -hls_list_size 5 \
                -hls_flags delete_segments+omit_endlist+temp_file \
                -hls_segment_filename "/dev/shm/hls/${CHANNEL_ID}/segment_%03d.ts" \
                "/dev/shm/hls/${CHANNEL_ID}/index.m3u8" || true
            fi

            echo "⚠️ FFmpeg exited. Retrying in 3 seconds..."
            sleep 3
          done
          EOF

          chmod +x /tmp/run_ffmpeg.sh
          nohup /tmp/run_ffmpeg.sh > /tmp/ffmpeg.log 2>&1 &

          bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          echo $BORE_PID > /tmp/bore.pid

          SUCCESS=0
          for i in {1..60}; do
            sleep 2
            if grep -q -e "bound to remote port" -e "bore.pub:${TARGET_PORT}" /tmp/bore.log 2>/dev/null; then
              SUCCESS=1
              break
            fi
            if ! kill -0 $BORE_PID 2>/dev/null || grep -q "address already in use" /tmp/bore.log 2>/dev/null; then
              kill -9 $BORE_PID 2>/dev/null || true
              > /tmp/bore.log
              bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
              BORE_PID=$!
              echo $BORE_PID > /tmp/bore.pid
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            cat /tmp/bore.log
            exit 1
          fi

          STREAM_READY=0
          for i in {1..40}; do
            if [ -f "/dev/shm/hls/${CHANNEL_ID}/index.m3u8" ]; then
              STREAM_READY=1
              break
            fi
            sleep 1
          done

          if [ $STREAM_READY -ne 1 ]; then
            cat /tmp/ffmpeg.log
            exit 1
          fi

          echo "=================================================="
          echo "✅ LINK STREAM SẴN SÀNG: http://bore.pub:${TARGET_PORT}/index.m3u8"
          echo "=================================================="

          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            if [ $(( NOW - START_TIME )) -ge 21540 ]; then
              exit 0
            fi
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then
              bore local 5000 --to bore.pub --port "${TARGET_PORT}" > /tmp/bore.log 2>&1 &
              echo $! > /tmp/bore.pid
            fi
            sleep 10
          done
