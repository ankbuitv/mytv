name: HLS Restream - BOX HITS (Optimized)

on:
  workflow_dispatch:
  schedule:
    - cron: '59 5,11,17,23 * * *'

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BOXHIT/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      HLS_DIR: "/dev/shm/hls/boxhits"

    steps:
      - name: Install System Dependencies & Cloudflared
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg
          
          # Cài đặt Cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          mkdir -p "${HLS_DIR}"

      - name: Create HLS Server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/boxhits';

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Cache-Control', 'no-cache, no-store, must-revalidate');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let fileName = req.url.split('?')[0].replace('/', '');
            if (!fileName || fileName === '') fileName = 'index.m3u8';

            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            if (fileName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (fileName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            const stream = fs.createReadStream(filePath);
            stream.pipe(res);
            stream.on('error', () => {
              if (!res.headersSent) res.writeHead(500);
              res.end();
            });
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 Server HTTP đã bật cổng 5000...');
          });
          EOF

      - name: Start Services, FFmpeg & Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          # 1. Chạy Node.js Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # 2. FFmpeg: COPY LUỒNG (Không Mã Hóa Lại -> Giảm 95% CPU, hết lag)
          CUSTOM_HEADERS="Referer: ${REFERER}"$'\r\n'"Origin: https://vtvprime.vn"$'\r\n'
          
          nohup ffmpeg -hide_banner -loglevel warning \
            -user_agent "$USER_AGENT" \
            -headers "$CUSTOM_HEADERS" \
            -reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 \
            -reconnect_delay_max 5 \
            -cenc_decryption_key "$CLEARKEY_KEY" \
            -i "$MPD_URL" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy -c:a copy \
            -f hls \
            -hls_time 4 \
            -hls_list_size 6 \
            -hls_flags delete_segments+omit_endlist \
            -hls_segment_filename "${HLS_DIR}/segment_%03d.ts" \
            "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # 3. Chạy Cloudflare Tunnel (Miễn phí, Tốc độ cao)
          nohup cloudflared tunnel --url http://localhost:5000 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cf.pid

          echo "⏳ Đang chờ Cloudflare Tunnel lấy URL public..."
          CF_URL=""
          for i in {1..30}; do
            sleep 2
            CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then break; fi
          done

          echo "=================================================="
          echo "👉 LINK XEM MỚI CỦA BẠN:"
          echo "${CF_URL}/index.m3u8"
          echo "=================================================="

          # 4. Kiểm tra luồng video sẵn sàng
          for i in {1..60}; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              echo "✅ HLS Stream Ready!"
              break
            fi
            sleep 1
          done

          # 5. Vòng lặp duy trì Workflow 5h 59m
          START_TIME=$(date +%s)
          LIMIT_SECONDS=21540

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            if [ "$ELAPSED" -ge "$LIMIT_SECONDS" ]; then
              echo "⏰ Hoàn thành 5h59m, thoát để nhường Cron mới..."
              exit 0
            fi

            # Tự xoá segment cũ tránh đầy đĩa RAM
            find "${HLS_DIR}" -maxdepth 1 -name 'segment_*.ts' -mmin +3 -delete 2>/dev/null || true

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "❌ FFmpeg lỗi/chết! Log:"
              cat /tmp/ffmpeg.log
              exit 1
            fi

            sleep 10
          done
