name: Restream Box Hits HLS (Nginx) - Bore 30118

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BOXHIT/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nginx ffmpeg

          ffmpeg -version | head -n 1

          # Cài đặt Bore Tunnel
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

      - name: Configure Nginx & Setup HLS Directory
        shell: bash
        run: |
          # Tạo thư mục chứa HLS segment trong RAM (tmpfs) để tối ưu IO / không ghi đĩa
          sudo mkdir -p /dev/shm/hls
          sudo chmod 777 /dev/shm/hls

          # Cấu hình Nginx Web Server tối ưu cho HLS Stream
          cat << 'EOF' | sudo tee /etc/nginx/sites-available/default
          server {
              listen 5000 default_server;
              listen [::]:5000 default_server;

              root /dev/shm/hls;

              location / {
                  # Bật CORS cho phép mọi Player (Web, Mobile, SmartTV) play stream
                  add_header Access-Control-Allow-Origin *;
                  add_header Access-Control-Allow-Methods 'GET, OPTIONS';
                  add_header Cache-Control no-cache;

                  # Mime types chuẩn HLS
                  types {
                      application/vnd.apple.mpegurl m3u8;
                      video/mp2t ts;
                  }
              }
          }
          EOF

          sudo systemctl restart nginx

      - name: Start HLS Transcoder & Tunnel
        shell: bash
        run: |
          set -euo pipefail

          CUSTOM_HEADERS="Referer: ${REFERER}\r\nOrigin: https://vtvprime.vn\r\n"

          # Tiến trình FFmpeg tự động chuyển DASH sang HLS Segments (0% CPU Re-encode)
          nohup ffmpeg \
            -hide_banner -loglevel warning \
            -user_agent "${USER_AGENT}" \
            -headers "${CUSTOM_HEADERS}" \
            -cenc_decryption_key "${CLEARKEY_KEY}" \
            -fflags +genpts+discardcorrupt+nobuffer \
            -i "${MPD_URL}" \
            -map 0:v:0? -map 0:a:0? \
            -c:v copy \
            -bsf:v h264_mp4toannexb,setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS \
            -c:a copy \
            -bsf:a setts=pts=PTS-STARTPTS:dts=DTS-STARTDTS \
            -f hls \
            -hls_time 2 \
            -hls_list_size 5 \
            -hls_flags delete_segments+append_list+omit_endlist \
            -hls_segment_filename /dev/shm/hls/segment_%03d.ts \
            /dev/shm/hls/live.m3u8 > /tmp/ffmpeg.log 2>&1 &

          echo $! > /tmp/ffmpeg.pid
          echo "Waiting for HLS playlist generator..."
          
          # Đợi FFmpeg tạo file live.m3u8 đầu tiên
          for i in {1..30}; do
            if [ -f /dev/shm/hls/live.m3u8 ]; then
              echo "✅ HLS Playlist created successfully!"
              break
            fi
            sleep 1
          done

          # Chạy Bore Tunnel forward Port 5000 ra ngoài
          nohup bore local 5000 --to bore.pub --port 30118 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          PORT_BOUND=0
          for i in {1..20}; do
            sleep 1
            if grep -q "listening at bore.pub:30118" /tmp/bore.log; then
              PORT_BOUND=1
              break
            fi
          done

          if [ "$PORT_BOUND" -eq 0 ]; then
            echo "❌ ERROR: Bore tunnel failed to connect on port 30118."
            cat /tmp/bore.log
            exit 1
          fi

          echo "=================================================="
          echo "🚀 LINK STREAM HLS (M3U8) PRODUCTION READY:"
          echo "👉 http://bore.pub:30118/live.m3u8"
          echo "=================================================="

          # Giám sát sức khỏe tiến trình
          while true; do
            if ! kill -0 $(cat /tmp/ffmpeg.pid) 2>/dev/null; then 
              echo "FFmpeg process died!"
              cat /tmp/ffmpeg.log
              exit 1
            fi
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then 
              echo "Bore process died!"
              cat /tmp/bore.log
              exit 1
            fi
            sleep 10
          done
