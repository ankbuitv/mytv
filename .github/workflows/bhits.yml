name: HLS Restream - BOX HITS

on:
  workflow_dispatch: {}
  schedule:
    - cron: "59 5,11,17,23 * * *"

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BOXHIT/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      REFERER: "https://vtvprime.vn/"
      BORE_PORT: "30119"
      HLS_DIR: "/dev/shm/hls/boxhits"

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg

          # Cài đặt Bore Tunnel
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          # Tạo thư mục chứa HLS
          mkdir -p "${HLS_DIR}"

      - name: Create Robust HLS Server
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const HLS_DIR = process.env.HLS_DIR || '/dev/shm/hls/boxhits';

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Access-Control-Allow-Headers', '*');
            res.setHeader('Cache-Control', 'no-cache, no-store, must-revalidate');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let reqPath = req.url.split('?')[0];
            if (reqPath === '/' || reqPath === '') reqPath = '/index.m3u8';

            const safePath = path.normalize(reqPath).replace(/^(\.\.[\/\\])+/, '');
            const filePath = path.join(HLS_DIR, safePath);

            if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              res.writeHead(404, { 'Content-Type': 'text/plain' });
              return res.end('404 Not Found');
            }

            if (filePath.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (filePath.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            } else if (filePath.endsWith('.m4s') || filePath.endsWith('.mp4')) {
              res.setHeader('Content-Type', 'video/iso.segment');
            }

            fs.createReadStream(filePath).pipe(res);
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 HTTP Server listening on port 5000');
          });
          EOF

      - name: Start Services & Run FFmpeg
        run: |
          # 1. Chạy Node Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # 2. Khởi chạy FFmpeg (Xử lý luồng tránh sập map)
          start_ffmpeg() {
            echo "🎬 [FFmpeg] Khởi chạy Stream Copy..."
            CUSTOM_HEADERS="Referer: ${REFERER}"$'\r\n'"Origin: https://vtvprime.vn"$'\r\n'

            nohup ffmpeg -hide_banner -loglevel warning \
              -user_agent "$USER_AGENT" \
              -headers "$CUSTOM_HEADERS" \
              -cenc_decryption_key "$CLEARKEY_KEY" \
              -fflags +genpts+discardcorrupt+igndts \
              -i "$MPD_URL" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy -bsf:v h264_mp4toannexb \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -f hls \
              -hls_time 2 \
              -hls_list_size 6 \
              -hls_flags delete_segments+omit_endlist \
              -hls_segment_filename "${HLS_DIR}/segment_%03d.ts" \
              "${HLS_DIR}/index.m3u8" > /tmp/ffmpeg.log 2>&1 &
            
            echo $! > /tmp/ffmpeg.pid
          }

          start_ffmpeg

          # 3. Khởi chạy Bore Tunnel & Tự bắt Port
          start_bore() {
            echo "🌐 Đang kết nối Bore Tunnel..."
            rm -f /tmp/bore.log
            nohup bore local 5000 --to bore.pub --port "${BORE_PORT}" > /tmp/bore.log 2>&1 &
            echo $! > /tmp/bore.pid
          }

          start_bore

          sleep 3
          ACTUAL_PORT=$(grep -oE "bore.pub:[0-9]+" /tmp/bore.log | cut -d':' -f2 | head -n 1 || echo "${BORE_PORT}")

          echo "=================================================="
          echo "👉 STREAM LINK: http://bore.pub:${ACTUAL_PORT}/index.m3u8"
          echo "=================================================="

          # 4. Kiểm tra Stream Sẵn Sàng
          STREAM_READY=0
          for i in {1..60}; do
            if [ -f "${HLS_DIR}/index.m3u8" ]; then
              STREAM_READY=1
              echo "✅ HLS Stream đã tạo thành công!"
              break
            fi

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "❌ FFmpeg bị lỗi sập! Log chi tiết:"
              echo "---------------- FFMEPG LOG ----------------"
              cat /tmp/ffmpeg.log || true
              echo "--------------------------------------------"
              exit 1
            fi

            sleep 1
          done

          # 5. Vòng lặp giám sát (5h50m)
          START_TIME=$(date +%s)
          LIMIT_SECONDS=21000

          while true; do
            NOW=$(date +%s)
            if [ $(( NOW - START_TIME )) -ge "$LIMIT_SECONDS" ]; then
              echo "⏰ Hết phiên, nhường chỗ cho Cron tiếp theo..."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ffmpeg.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] FFmpeg bị ngắt! Đang bật lại..."
              start_ffmpeg
              sleep 5
            fi

            if ! kill -0 "$(cat /tmp/bore.pid 2>/dev/null)" 2>/dev/null; then
              echo "🔄 [Auto-Heal] Bore Tunnel bị rớt! Đang kết nối lại..."
              start_bore
              sleep 5
            fi

            find "${HLS_DIR}" -type f -name 'segment_*.ts' -mmin +3 -delete 2>/dev/null || true
            sleep 10
          done
