name: HLS Restream - Full HD 1080p Perfect Sync (Port 30119)

on:
  workflow_dispatch:

jobs:
  hls-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MPD_URL: "https://livebytsctbu.vtvprime.vn/mean/BOXHIT/manifest.mpd"
      CLEARKEY_KEY: "6d54358306571658ffdb952c6560688b"
      USER_AGENT: "Mozilla/5.0 (Linux; Android 14; Google TV Streamer Build/UTT3.240625.001.K5; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0.6723.60 Mobile Safari/537.36"
      REFERER: "https://vtvprime.vn/"

    steps:
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl nodejs ffmpeg

          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo install -m 755 /tmp/bore /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz /tmp/bore

          mkdir -p /dev/shm/hls/boxhits

      - name: Create Static HLS Web Server
        shell: bash
        run: |
          cat << 'EOF' > /tmp/hls_server.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const HLS_DIR = '/dev/shm/hls/boxhits';

          const server = http.createServer((req, res) => {
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Access-Control-Allow-Methods', 'GET, HEAD, OPTIONS');
            res.setHeader('Cache-Control', 'no-cache, no-store, must-revalidate');

            if (req.method === 'OPTIONS') {
              res.writeHead(204);
              return res.end();
            }

            let fileName = req.url.split('?')[0].replace('/', '');
            if (!fileName || fileName === '') fileName = 'index.m3u8';

            const filePath = path.join(HLS_DIR, fileName);

            if (!fs.existsSync(filePath)) {
              res.writeHead(404);
              return res.end('404 Not Found');
            }

            if (fileName.endsWith('.m3u8')) {
              res.setHeader('Content-Type', 'application/vnd.apple.mpegurl');
            } else if (fileName.endsWith('.ts')) {
              res.setHeader('Content-Type', 'video/mp2t');
            }

            fs.createReadStream(filePath).pipe(res);
          });

          server.listen(5000, '0.0.0.0', () => {
            console.log('🚀 HLS 1080p Web Server running on port 5000...');
          });
          EOF

      - name: Start Services & FFmpeg HLS 1080p Transcoder
        shell: bash
        run: |
          set -euo pipefail

          # 1. Start Web Server
          nohup node /tmp/hls_server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # 2. Start FFmpeg Full Transcode 1080p (Scale 1080 + CRF 22 cho độ nét cao)
          CUSTOM_HEADERS="Referer: ${REFERER}\r\nOrigin: https://vtvprime.vn\r\n"
          
          nohup ffmpeg -hide_banner -loglevel warning \
            -user_agent "$USER_AGENT" \
            -headers "$CUSTOM_HEADERS" \
            -cenc_decryption_key "$CLEARKEY_KEY" \
            -fflags +genpts+discardcorrupt+nobuffer \
            -i "$MPD_URL" \
            -map 0:v:0? -map 0:a:0? \
            -vf "scale=-2:1080" \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -crf 22 -maxrate 4000k -bufsize 8000k \
            -g 50 -r 25 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 -af "aresample=async=1000" \
            -f hls \
            -hls_time 2 \
            -hls_list_size 5 \
            -hls_flags delete_segments+omit_endlist+append_list \
            -hls_segment_filename "/dev/shm/hls/boxhits/segment_%03d.ts" \
            /dev/shm/hls/boxhits/index.m3u8 > /tmp/ffmpeg.log 2>&1 &
          echo $! > /tmp/ffmpeg.pid

          # 3. Start Tunnel (Port 30119)
          nohup bore local 5000 --to bore.pub --port 30119 > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid

          echo "Waiting for HLS 1080p Playlist generation..."
          for i in {1..30}; do
            if [ -f /dev/shm/hls/boxhits/index.m3u8 ]; then
              echo "✅ HLS 1080p Playlist Created!"
              break
            fi
            sleep 1
          done

          echo "=================================================="
          echo "✅ LINK HLS PLAYLIST FULL HD 1080p:"
          echo "👉 http://bore.pub:30119/index.m3u8"
          echo "=================================================="

          while true; do
            if ! kill -0 $(cat /tmp/server.pid) 2>/dev/null; then exit 1; fi
            if ! kill -0 $(cat /tmp/ffmpeg.pid) 2>/dev/null; then exit 1; fi
            if ! kill -0 $(cat /tmp/bore.pid) 2>/dev/null; then exit 1; fi
            sleep 10
          done
